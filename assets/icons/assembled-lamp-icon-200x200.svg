  <circle cx="100" cy="58" r="36" fill="#FDE047" opacity="0.3" />
  
  <!-- Glow Rays -->
  <g stroke="#F1C40F" stroke-width="4.5" stroke-linecap="round">
    <line x1="100" y1="8" x2="100" y2="20" />
    <line x1="138" y1="22" x2="128" y2="32" />
    <line x1="62" y1="22" x2="72" y2="32" />
    <line x1="150" y1="58" x2="136" y2="58" />
    <line x1="50" y1="58" x2="64" y2="58" />
  </g>
  
  <!-- Lightbulb Element -->
