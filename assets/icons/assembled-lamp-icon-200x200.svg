    <path d="M-20 -20 C-20 -45, 20 -45, 20 -20 C20 -5, 10 0, 10 10 L-10 10 C-10 0, -20 -5, -20 -20" fill="#F1C40F" stroke="#2D3436" stroke-width="5" stroke-linejoin="round"/>
    <rect x="-9" y="10" width="18" height="5" rx="2" fill="#8E97A4" stroke="#2D3436" stroke-width="4"/>
    <rect x="-9" y="16" width="18" height="5" rx="2" fill="#8E97A4" stroke="#2D3436" stroke-width="4"/>
