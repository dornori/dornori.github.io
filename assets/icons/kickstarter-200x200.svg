<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
  <title id="title">Kickstarter Icon</title>
  <desc id="desc">Kickstarter project crowdfunding icon</desc>
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05CE78"/>
      <stop offset="100%" stop-color="#00A85E"/>
    </linearGradient>
    <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
  </defs>

  <!-- Decorative floating elements -->
  <circle cx="35" cy="50" r="4" fill="#05CE78" opacity="0.3"/>
  <circle cx="165" cy="55" r="5" fill="#FFD700" opacity="0.3"/>
  <circle cx="50" cy="38" r="2.5" fill="#FFD700" opacity="0.3"/>
  <circle cx="155" cy="42" r="3" fill="#05CE78" opacity="0.25"/>

  <!-- Star decorations -->
  <g fill="#FFD700" opacity="0.4">
    <path d="M70,32 L72,38 L78,38 L73,42 L75,48 L70,44 L65,48 L67,42 L62,38 L68,38 Z"/>
    <path d="M135,30 L136.5,34 L140.5,34 L137.5,36.5 L139,40.5 L135,38 L131,40.5 L132.5,36.5 L129.5,34 L133.5,34 Z"/>
  </g>

  <!-- Big "K" in Kickstarter style - larger and centered -->
  <g transform="translate(100, 85) scale(1.3)">
    <!-- Main K shape -->
    <path d="M-35,-40 L-35,40 L-15,40 L-15,-10 L10,40 L35,40 L5,5 L35,-40 L10,-40 L-15,-10 L-15,-40 Z" 
          fill="url(#greenGradient)" stroke="#2C3E50" stroke-width="3.5" stroke-linejoin="round"/>
  </g>

  <!-- Progress bar - moved down -->
  <rect x="40" y="150" width="120" height="18" rx="9" fill="#E8F5E9" stroke="#2C3E50" stroke-width="4"/>
  <rect x="44" y="154" width="84" height="10" rx="5" fill="url(#progressGradient)"/>

  <!-- Percentage text -->
  <text x="100" y="163" font-family="Arial Black, sans-serif" font-size="9" font-weight="900" fill="#2C3E50" text-anchor="middle">70%</text>

  <!-- Small checkmark badge -->
  <g transform="translate(158, 135)">
    <circle cx="0" cy="0" r="14" fill="#FFD700" stroke="#2C3E50" stroke-width="4"/>
    <path d="M-6,-2 L-2,4 L8,-6" stroke="#2C3E50" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>