<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
  <title id="title">Kickstarter Icon</title>
  <desc id="desc">Kickstarter project crowdfunding launch icon</desc>
  <defs>
    <linearGradient id="rocketGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05CE78"/>
      <stop offset="100%" stop-color="#00A85E"/>
    </linearGradient>
    <linearGradient id="flameGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
  </defs>

  <!-- Bottom base/ground line like in example icons -->
  <rect x="15" y="176" width="170" height="12" rx="3" fill="#2C3E50" stroke="#2C3E50" stroke-width="4"/>

  <!-- Decorative floating elements -->
  <circle cx="35" cy="55" r="4" fill="#05CE78" opacity="0.3"/>
  <circle cx="165" cy="65" r="5" fill="#FFD700" opacity="0.3"/>
  <circle cx="50" cy="43" r="2.5" fill="#FFD700" opacity="0.3"/>
  <circle cx="155" cy="47" r="3" fill="#05CE78" opacity="0.25"/>

  <!-- Star decorations -->
  <g fill="#FFD700" opacity="0.4">
    <path d="M70,37 L72,43 L78,43 L73,47 L75,53 L70,49 L65,53 L67,47 L62,43 L68,43 Z"/>
    <path d="M135,35 L136.5,39 L140.5,39 L137.5,41.5 L139,45.5 L135,43 L131,45.5 L132.5,41.5 L129.5,39 L133.5,39 Z"/>
  </g>

  <!-- Rocket group - scaled to fit in 200x200 -->
  <g transform="translate(100, 60) scale(0.75)">
    <!-- Rocket flame -->
    <ellipse cx="0" cy="58" rx="16" ry="20" fill="url(#flameGradient)" stroke="#2C3E50" stroke-width="4"/>
    <ellipse cx="0" cy="62" rx="9" ry="14" fill="#FFD700" stroke="#2C3E50" stroke-width="3"/>
    <ellipse cx="0" cy="67" rx="4" ry="8" fill="#FFFFFF" opacity="0.7"/>

    <!-- Rocket fins - left -->
    <path d="M-30,35 L-48,58 L-28,50 Z" fill="#FFFFFF" stroke="#2C3E50" stroke-width="4" stroke-linejoin="round"/>

    <!-- Rocket fins - right -->
    <path d="M30,35 L48,58 L28,50 Z" fill="#FFFFFF" stroke="#2C3E50" stroke-width="4" stroke-linejoin="round"/>

    <!-- Rocket main body -->
    <ellipse cx="0" cy="5" rx="32" ry="45" fill="#FFFFFF" stroke="#2C3E50" stroke-width="4"/>

    <!-- Rocket body stripe details -->
    <rect x="-32" y="20" width="64" height="5" rx="2.5" fill="url(#rocketGradient)" stroke="#2C3E50" stroke-width="2"/>
    <rect x="-30" y="32" width="60" height="4" rx="2" fill="url(#rocketGradient)" opacity="0.5" stroke="#2C3E50" stroke-width="2"/>

    <!-- Rocket nose cone -->
    <path d="M-28,-5 Q-28,-35 0,-65 Q28,-35 28,-5" fill="#FFFFFF" stroke="#2C3E50" stroke-width="4" stroke-linejoin="round"/>

    <!-- Rocket window -->
    <circle cx="0" cy="-18" r="12" fill="#1A1A2E" stroke="#2C3E50" stroke-width="4"/>
    <circle cx="0" cy="-18" r="8" fill="#00D4FF" opacity="0.8"/>
    <circle cx="-3" cy="-21" r="3.5" fill="#FFFFFF" opacity="0.5"/>

    <!-- Small window reflection -->
    <circle cx="4" cy="-15" r="1.5" fill="#FFFFFF" opacity="0.3"/>
  </g>

  <!-- Progress bar at bottom like platform -->
  <rect x="40" y="116" width="120" height="18" rx="9" fill="#E8F5E9" stroke="#2C3E50" stroke-width="4"/>
  <rect x="44" y="120" width="84" height="10" rx="5" fill="url(#rocketGradient)"/>

  <!-- Percentage text on progress bar -->
  <text x="100" y="129" font-family="Arial Black, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">70%</text>

  <!-- "Kickstarter" text label -->
  <text x="100" y="168" font-family="Arial Black, sans-serif" font-size="14" font-weight="900" fill="#2C3E50" text-anchor="middle" letter-spacing="1.5">Kickstarter</text>

  <!-- Small checkmark badge -->
  <g transform="translate(158, 99)">
    <circle cx="0" cy="0" r="14" fill="#FFD700" stroke="#2C3E50" stroke-width="4"/>
    <path d="M-6,-2 L-2,4 L8,-6" stroke="#2C3E50" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>