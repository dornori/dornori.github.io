<!DOCTYPE html>
<html>
<head>
  <title>Worker API Test</title>
  <style>
    body { font-family: monospace; margin: 20px; }
    .section { margin: 20px 0; border: 1px solid #ccc; padding: 10px; }
    button { padding: 8px 12px; cursor: pointer; }
    textarea { width: 100%; height: 120px; font-family: monospace; font-size: 11px; }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>
  <h2>Worker API Test</h2>
  
  <div class="section">
    <h3>Validate Cart</h3>
    <textarea id="validateInput"></textarea>
    <button onclick="testValidate()">Test Validate Cart</button>
    <div id="validateOutput"></div>
  </div>

  <div class="section">
    <h3>Create Order</h3>
    <textarea id="createInput"></textarea>
    <button onclick="testCreateOrder()">Test Create Order</button>
    <div id="createOutput"></div>
  </div>

  <div class="section">
    <h3>Capture Order</h3>
    <input type="text" id="orderId" placeholder="PayPal Order ID" style="width: 100%; padding: 8px;">
    <button onclick="testCaptureOrder()">Test Capture Order</button>
    <div id="captureOutput"></div>
  </div>

  <script>
    const WORKER_URL = 'https://pay.dornori-info.workers.dev';

    async function loadProducts() {
      try {
        const res = await fetch('https://dornori.com/data/products.json');
        return await res.json();
      } catch (err) {
        console.error('Failed to load products:', err);
        return [];
      }
    }

    async function prepopulate() {
      const products = await loadProducts();
      if (products.length === 0) return;

      const sampleItem = products[0];
      const validateData = {
        items: [
          { name: sampleItem.name, price: sampleItem.price, qty: 1, sku: sampleItem.id }
        ],
        countryCode: 'CZ',
        currency: 'CZK'
      };

      const createData = {
        ...validateData,
        formData: {
          email: 'test@example.com',
          first_name: 'John',
          last_name: 'Doe'
        }
      };

      document.getElementById('validateInput').value = JSON.stringify(validateData, null, 2);
      document.getElementById('createInput').value = JSON.stringify(createData, null, 2);
    }

    async function testValidate() {
      try {
        const data = JSON.parse(document.getElementById('validateInput').value);
        const res = await fetch(`${WORKER_URL}/api/validate-cart`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        document.getElementById('validateOutput').innerHTML = `<pre class="${res.ok ? 'success' : 'error'}">${JSON.stringify(result, null, 2)}</pre>`;
      } catch (err) {
        document.getElementById('validateOutput').innerHTML = `<pre class="error">${err.message}</pre>`;
      }
    }

    async function testCreateOrder() {
      try {
        const data = JSON.parse(document.getElementById('createInput').value);
        const res = await fetch(`${WORKER_URL}/api/create-order`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        document.getElementById('createOutput').innerHTML = `<pre class="${res.ok ? 'success' : 'error'}">${JSON.stringify(result, null, 2)}</pre>`;
        if (result.orderId) {
          document.getElementById('orderId').value = result.orderId;
        }
      } catch (err) {
        document.getElementById('createOutput').innerHTML = `<pre class="error">${err.message}</pre>`;
      }
    }

    async function testCaptureOrder() {
      const orderId = document.getElementById('orderId').value;
      if (!orderId) {
        alert('Enter Order ID');
        return;
      }

      try {
        const res = await fetch(`${WORKER_URL}/api/capture-order`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId })
        });
        const result = await res.json();
        document.getElementById('captureOutput').innerHTML = `<pre class="${res.ok ? 'success' : 'error'}">${JSON.stringify(result, null, 2)}</pre>`;
      } catch (err) {
        document.getElementById('captureOutput').innerHTML = `<pre class="error">${err.message}</pre>`;
      }
    }

    prepopulate();
  </script>
</body>
</html>
