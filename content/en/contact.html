<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
    <style>
        body { font-family: monospace; background: #0a0e1a; color: #e0e0e0; padding: 40px; }
        button { padding: 20px 40px; font-size: 20px; background: #00ff9d; color: #0a0e1a; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; }
        button:hover { transform: scale(1.02); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #log { margin-top: 30px; background: #11161f; padding: 20px; border-radius: 12px; border: 1px solid #1a2a3a; white-space: pre-wrap; font-size: 13px; max-height: 500px; overflow: auto; }
        .success { color: #00ff9d; }
        .error { color: #ff4444; }
        .info { color: #ffb347; }
    </style>
</head>
<body>

    <h1>🧪 API Test</h1>
    <p>Worker URL: <span id="worker-url" style="color:#ffb347;"></span></p>

    <button id="testBtn">🚀 Send Test Message</button>
    <div id="log">Click the button to test...</div>

    <script>
        // ============================================================
        // SIMPLE TEST - NO DEPENDENCIES
        // ============================================================

        var WORKER_URL = 'https://dornori-ticketing.dornori-info.workers.dev/api/message';

        document.getElementById('worker-url').textContent = WORKER_URL;

        var logDiv = document.getElementById('log');
        var btn = document.getElementById('testBtn');

        function log(msg, type) {
            var prefix = '';
            if (type === 'success') prefix = '✅ ';
            else if (type === 'error') prefix = '❌ ';
            else if (type === 'info') prefix = '📌 ';
            var line = prefix + msg;
            logDiv.innerHTML += '\n' + line;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(line);
        }

        function clearLog() {
            logDiv.innerHTML = '';
        }

        btn.addEventListener('click', function() {
            btn.disabled = true;
            btn.textContent = '⏳ Sending...';
            clearLog();
            log('🚀 Starting test...', 'info');

            var payload = {
                category: 'test',
                name: 'Test User',
                email: 'test@example.com',
                subject: 'Test Message',
                message: 'This is a test message from the debug form.',
                metadata: { source: 'test' }
            };

            log('📦 Payload: ' + JSON.stringify(payload, null, 2), 'info');

            log('📡 Sending to: ' + WORKER_URL, 'info');

            fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(function(response) {
                log('📥 Response status: ' + response.status + ' ' + response.statusText, 'info');
                return response.text();
            })
            .then(function(text) {
                log('📄 Response body: ' + text, 'info');
                try {
                    var data = JSON.parse(text);
                    if (data.success) {
                        log('✅ SUCCESS! Ticket: ' + data.ticketNumber, 'success');
                        log('✅ Ticket ID: ' + data.ticketId, 'success');
                    } else {
                        log('❌ Server returned error: ' + JSON.stringify(data), 'error');
                    }
                } catch (e) {
                    log('❌ Failed to parse response: ' + e.message, 'error');
                    log('📄 Raw: ' + text, 'error');
                }
            })
            .catch(function(err) {
                log('❌ FETCH ERROR: ' + err.message, 'error');
                log('❌ Check: 1) Worker URL correct? 2) Worker deployed? 3) CORS?', 'error');
            })
            .finally(function() {
                btn.disabled = false;
                btn.textContent = '🚀 Send Test Message';
                log('🏁 Test complete', 'info');
            });
        });

        // Auto-run on load
        setTimeout(function() {
            btn.click();
        }, 500);
    </script>

</body>
</html>
