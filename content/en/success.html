<div class="container">
<style>
  .success-wrap { min-height:60vh; display:flex; align-items:center; justify-content:center; padding:3rem 1rem; }
  .webshop-confetti { position:fixed; top:0; left:0; right:0; pointer-events:none; z-index:9999; }
  @keyframes fall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(100vh) rotate(720deg);opacity:0} }
  .confetti-piece { position:absolute; border-radius:2px; animation:fall linear forwards; }
  .webshop-ref-badge { background:var(--c-surface,#f5f5f5); border:1px solid var(--c-border,#ddd); border-radius:8px; padding:12px 24px; font-family:monospace; font-size:1.1rem; display:inline-block; margin:8px 0; }
  .webshop-order-details { margin:20px 0; text-align:left; max-width:500px; margin-left:auto; margin-right:auto; }
  .webshop-order-details .detail-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--c-border,#eee); }
  .webshop-order-details .detail-row .label { font-weight:600; color:var(--c-text-2,#666); }
  .webshop-order-details .detail-row .value { font-family:monospace; }
  .webshop-result-icon--success { background:#4a7c59; color:white; width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto 20px; }
  
  /* New styles for improved UI */
  .order-summary-card { background:#f9f7f3; border-radius:16px; padding:1.5rem; margin:1.5rem 0; border:1px solid #e8e2d8; }
  .order-summary-card h3 { font-size:1.1rem; font-weight:600; margin-bottom:1rem; color:#2c2a27; }
  .order-table { width:100%; border-collapse:collapse; font-size:0.9rem; }
  .order-table th { text-align:left; font-weight:600; color:#4a453e; padding:0.5rem 0.3rem; border-bottom:2px solid #ddd6cb; }
  .order-table td { padding:0.6rem 0.3rem; border-bottom:1px solid #ede8df; }
  .order-table .text-right { text-align:right; }
  .order-table .font-mono { font-family:monospace; }
  .order-table .totals-row td { border-bottom:none; padding-top:0.7rem; font-weight:600; }
  .order-table .grand-total td { border-top:2px solid #c6bdb0; padding-top:0.9rem; font-weight:700; font-size:1.05rem; }
  .customer-info-card { background:#fcfaf7; border-radius:16px; padding:1.2rem 1.5rem; margin:1rem 0; border:1px solid #e8e2d8; }
  .customer-info-card .info-row { display:flex; padding:0.3rem 0; gap:0.5rem; }
  .customer-info-card .info-label { font-weight:600; color:#4a453e; min-width:80px; }
  .ref-block { background:#f3f0ea; border-radius:12px; padding:0.8rem 1.2rem; margin:1.2rem 0; display:flex; flex-wrap:wrap; gap:1rem; justify-content:space-between; border:1px solid #e2dad0; }
  .ref-block .ref-item { display:flex; align-items:center; gap:0.4rem; font-size:0.9rem; }
  .ref-block .ref-value { font-family:monospace; background:white; padding:0.1rem 0.7rem; border-radius:20px; }
  .btn-continue { display:inline-block; background:#1a1714; color:white; text-decoration:none; padding:0.8rem 2.5rem; border-radius:60px; font-weight:500; transition:background 0.15s; border:none; font-size:1rem; cursor:pointer; }
  .btn-continue:hover { background:#2f2a26; }
  .btn-wrap { text-align:center; margin-top:1.5rem; }
</style>

<div class="webshop-confetti" id="confetti-container"></div>
<div class="success-wrap">
  <div class="webshop-result-page webshop-fade-in" id="result-page"></div>
</div>

<script>
(function () {
  'use strict';
  
  const TICKETING_URL = 'https://dornori-ticketing.dornori-info.workers.dev/api/message';
  
  const params = new URLSearchParams(window.location.search);
  const ref = params.get('ref') || '';
  const status = params.get('status') || 'success';
  const lang = window.LANG || localStorage.getItem('dornori-lang') || 'en';

  function T(key, fallback) {
    if (window.T && window.T[key]) return window.T[key];
    if (typeof Shop !== 'undefined' && Shop.t) return Shop.t(key, fallback);
    return fallback || key;
  }

  function fmt(n) { 
    if (n === undefined || n === null) return '0.00';
    return (Math.round((Number(n) || 0) * 100) / 100).toFixed(2); 
  }

  // ============================================================
  // READ DATA FROM LOCALSTORAGE
  // ============================================================
  function getPayPalData() {
    try {
      const customerRaw = localStorage.getItem('webshop_paypal_customer');
      const snapshotRaw = localStorage.getItem('webshop_order_snapshot');
      const orderId = localStorage.getItem('webshop_paypal_order_id');
      const txId = localStorage.getItem('webshop_paypal_transaction_id');
      const dorRef = localStorage.getItem('webshop_dor_reference');

      const customer = customerRaw ? JSON.parse(customerRaw) : {};
      const snapshot = snapshotRaw ? JSON.parse(snapshotRaw) : {};
      const fd = snapshot.formData || {};
      const totals = snapshot.totals || {};

      if (!customer.email && fd.email) customer.email = fd.email;
      if (!customer.phone && fd.phone) customer.phone = fd.phone;
      if (!customer.first_name && fd.first_name) customer.first_name = fd.first_name;
      if (!customer.last_name && fd.last_name) customer.last_name = fd.last_name;
      if (!customer.full_name && (fd.first_name || fd.last_name))
        customer.full_name = [fd.first_name, fd.last_name].filter(Boolean).join(' ');
      if (!customer.shipping_address_line1 && fd.address) customer.shipping_address_line1 = fd.address;
      if (!customer.shipping_city && fd.city) customer.shipping_city = fd.city;
      if (!customer.shipping_postal && fd.postal) customer.shipping_postal = fd.postal;
      if (!customer.shipping_country && fd.country) customer.shipping_country = fd.country;
      
      customer.currency = customer.currency || snapshot.currency || 'EUR';

      // Get items - try multiple sources
      let items = [];
      if (snapshot.items && Array.isArray(snapshot.items) && snapshot.items.length) {
        items = snapshot.items;
      } else if (customer._items && Array.isArray(customer._items) && customer._items.length) {
        items = customer._items;
      } else if (fd.items && Array.isArray(fd.items) && fd.items.length) {
        items = fd.items;
      } else if (customer.items && Array.isArray(customer.items) && customer.items.length) {
        items = customer.items;
      }

      // Normalize items
      items = items.map(it => ({
        name: it.name || it.product_name || it.title || it.product || 'Product',
        id: it.sku || it.id || it.productId || it.variantId || it.item_id || it.code || 'N/A',
        qty: Number(it.qty || it.quantity || 1),
        price: Number(it.price || it.unit_price || it.amount || 0)
      }));

      // RECALCULATE TOTALS FROM ITEMS (FIXES THE 0 ISSUE)
      const subtotal = items.reduce((sum, it) => sum + (it.price * it.qty), 0);
      
      // Get shipping from various sources
      let shipping = 0;
      if (totals.shipping !== undefined && totals.shipping !== null) {
        shipping = Number(totals.shipping);
      } else if (customer._shipping !== undefined && customer._shipping !== null) {
        shipping = Number(customer._shipping);
      } else if (customer.shipping_cost !== undefined && customer.shipping_cost !== null) {
        shipping = Number(customer.shipping_cost);
      } else if (fd.shipping !== undefined && fd.shipping !== null) {
        shipping = Number(fd.shipping);
      } else if (customer.shipping !== undefined && customer.shipping !== null) {
        shipping = Number(customer.shipping);
      }
      
      // Get tax from various sources
      let tax = 0;
      if (totals.tax !== undefined && totals.tax !== null) {
        tax = Number(totals.tax);
      } else if (customer._tax !== undefined && customer._tax !== null) {
        tax = Number(customer._tax);
      } else if (fd.tax !== undefined && fd.tax !== null) {
        tax = Number(fd.tax);
      } else if (customer.tax !== undefined && customer.tax !== null) {
        tax = Number(customer.tax);
      }
      
      const total = subtotal + shipping + tax;

      // Update customer with recalculated values
      customer._totals = { subtotal, shipping, tax, total };
      customer._items = items;
      customer.amount = total.toFixed(2);

      // Build shipping display
      const shippingLines = [];
      if (customer.shipping_name) shippingLines.push(`name: ${customer.shipping_name}`);
      if (customer.shipping_address_line1) shippingLines.push(`Address: ${customer.shipping_address_line1}`);
      if (customer.shipping_address_line2) shippingLines.push(customer.shipping_address_line2);
      if (customer.shipping_city) shippingLines.push(`City: ${customer.shipping_city}`);
      if (customer.shipping_postal) shippingLines.push(`Postcode: ${customer.shipping_postal}`);
      if (customer.shipping_country) shippingLines.push(`Country: ${customer.shipping_country}`);
      customer._shippingDisplay = shippingLines.length ? shippingLines.join(', ') : 'Not provided';

      return {
        customer,
        orderId: orderId || 'N/A',
        transactionId: txId || 'N/A',
        dorReference: dorRef || ref || 'N/A'
      };
    } catch (e) {
      console.error('Error reading localStorage:', e);
      return { customer: {}, orderId: 'N/A', transactionId: 'N/A', dorReference: ref || 'N/A' };
    }
  }

  // ============================================================
  // SEND TICKET TO TICKETING SYSTEM (EXACT FORMAT)
  // ============================================================
  async function sendToTicketing(data) {
    if (status !== 'success') {
      console.log('Skipping ticketing - not success status');
      return null;
    }

    try {
      const { customer, orderId, transactionId, dorReference } = data;
      
      const fullName = customer.full_name || 
                       [customer.first_name, customer.last_name].filter(Boolean).join(' ') || 
                       customer.shipping_name ||
                       'Customer';
      
      const email = customer.email || '';
      const phone = customer.phone || '';
      const currency = customer.currency || 'EUR';
      
      const items = customer._items || [];
      const totals = customer._totals || { subtotal: 0, shipping: 0, tax: 0, total: 0 };

      // Build order table with proper formatting (EXACT format from example)
      const maxNameLen = Math.max(20, ...items.map(i => (i.name || '').length), 0);
      const maxIdLen = Math.max(18, ...items.map(i => (i.id || '').length), 0);
      
      let orderLines = [];
      
      // Header
      orderLines.push('Product' + ' '.repeat(Math.max(0, maxNameLen - 7)) + '  ID' + ' '.repeat(Math.max(0, maxIdLen - 2)) + '  Qty  Unit Price  Total');
      orderLines.push('-'.repeat(maxNameLen+2) + '  ' + '-'.repeat(maxIdLen+2) + '  ---  ----------  -------');
      
      // Items
      items.forEach(it => {
        const name = (it.name || 'Product').padEnd(maxNameLen);
        const id = (it.id || 'N/A').padEnd(maxIdLen);
        const qty = String(it.qty || 1).padStart(3);
        const unitPrice = fmt(it.price || 0);
        const lineTotal = fmt((it.price || 0) * (it.qty || 1));
        orderLines.push(`${name}  ${id}  ${qty}  ${currency}${unitPrice.padStart(9)}  ${currency}${lineTotal.padStart(7)}`);
      });
      
      // Separator
      orderLines.push('-'.repeat(maxNameLen+2) + '  ' + '-'.repeat(maxIdLen+2) + '  ---  ----------  -------');
      
      // Totals with proper alignment
      const subtotalStr = fmt(totals.subtotal);
      const shippingStr = fmt(totals.shipping);
      const taxStr = fmt(totals.tax);
      const totalStr = fmt(totals.total);
      const labelWidth = maxNameLen + maxIdLen + 8;
      
      orderLines.push(`Subtotal${' '.repeat(Math.max(1, labelWidth - 8))}${currency}${subtotalStr.padStart(10)}`);
      orderLines.push(`Shipping${' '.repeat(Math.max(1, labelWidth - 8))}${currency}${shippingStr.padStart(10)}`);
      orderLines.push(`Tax${' '.repeat(Math.max(1, labelWidth - 3))}${currency}${taxStr.padStart(10)}`);
      orderLines.push(`TOTAL${' '.repeat(Math.max(1, labelWidth - 5))}${currency}${totalStr.padStart(10)}`);

      // Shipping address
      const shippingLines = [];
      if (customer.shipping_name) shippingLines.push(`name: ${customer.shipping_name}`);
      if (customer.shipping_address_line1) shippingLines.push(`Address: ${customer.shipping_address_line1}`);
      if (customer.shipping_city) shippingLines.push(`City: ${customer.shipping_city}`);
      if (customer.shipping_postal) shippingLines.push(`Postcode: ${customer.shipping_postal}`);
      if (customer.shipping_country) shippingLines.push(`Country: ${customer.shipping_country}`);
      const shippingDisplay = shippingLines.length ? shippingLines.join('\n') : 'Not provided';

      const message = [
        `Date: ${new Date().toISOString()}`,
        `Order Reference: ${dorReference}`,
        `PayPal Transaction ID: ${transactionId}`,
        `Status: COMPLETED`,
        '',
        '--- ORDER ---',
        ...orderLines,
        '',
        '--- CUSTOMER INFORMATION ---',
        `Name: ${fullName}`,
        `Email: ${email}`,
        `Phone: ${phone}`,
        '',
        '--- SHIPPING ADDRESS ---',
        shippingDisplay
      ].join('\n');

      console.log('📝 TICKET CONTENT:');
      console.log(message);

      const payload = {
        name: fullName,
        email: email,
        phone: phone,
        subject: `Order Confirmation - ${dorReference}`,
        message: message,
        category: 'payment',
        language: lang,
        orderNumber: dorReference,
        metadata: {
          source: 'webshop-success',
          orderId: orderId,
          orderRef: dorReference,
          transactionId: transactionId,
          currency: currency,
          amount: totals.total,
          status: 'COMPLETED',
          customer: {
            name: fullName,
            email: email,
            phone: phone,
            shipping_name: customer.shipping_name,
            shipping_address: shippingDisplay,
          },
          items: items,
          totals: totals,
          paypalData: customer
        }
      };

      const res = await fetch(TICKETING_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errorText = await res.text();
        console.error('❌ Ticket creation failed:', res.status, errorText);
        return null;
      }

      const result = await res.json();
      console.log('✅ Ticket created:', result);
      return result.ticketNumber;
    } catch (err) {
      console.error('❌ Ticketing failed:', err.message);
      return null;
    }
  }

  // ============================================================
  // RENDER THE SUCCESS PAGE
  // ============================================================
  function render(data, ticketNumber) {
    const page = document.getElementById('result-page');
    if (!page) return;
    
    const { customer, orderId, transactionId, dorReference } = data;
    const totals = customer._totals || { subtotal: 0, shipping: 0, tax: 0, total: 0 };
    const items = customer._items || [];
    const currency = customer.currency || 'EUR';
    const fullName = customer.full_name || 'Customer';
    const email = customer.email || '';
    const phone = customer.phone || '';
    const shippingDisplay = customer._shippingDisplay || 'Not provided';
    
    if (status === 'success') {
      // Build order table HTML
      let rows = '';
      items.forEach(it => {
        const name = it.name || 'Product';
        const id = it.id || 'N/A';
        const qty = it.qty || 1;
        const price = Number(it.price) || 0;
        const total = price * qty;
        rows += `<tr>
          <td>${name}</td>
          <td class="font-mono">${id}</td>
          <td class="text-right">${qty}</td>
          <td class="text-right font-mono">${currency} ${fmt(price)}</td>
          <td class="text-right font-mono">${currency} ${fmt(total)}</td>
        </tr>`;
      });

      page.innerHTML = `
        <div class="webshop-result-icon webshop-result-icon--success">✓</div>
        <h1>${T('success_title', 'Order Confirmed!')}</h1>
        <p style="text-align:center;color:#4a4a4a;">${T('success_message', 'Thank you for your purchase.')}</p>
        
        <div class="ref-block">
          <span class="ref-item">📦 Order <span class="ref-value">${dorReference}</span></span>
          <span class="ref-item">🆔 Transaction <span class="ref-value">${transactionId}</span></span>
          ${ticketNumber ? `<span class="ref-item">🎫 Ticket #<span class="ref-value">${ticketNumber}</span></span>` : ''}
        </div>
        
        <div class="order-summary-card">
          <h3>📋 Order Summary</h3>
          <table class="order-table">
            <thead>
              <tr>
                <th>Product</th>
                <th>ID</th>
                <th class="text-right">Qty</th>
                <th class="text-right">Unit Price</th>
                <th class="text-right">Total</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
              <tr class="totals-row">
                <td colspan="3"></td>
                <td class="text-right">Subtotal</td>
                <td class="text-right font-mono">${currency} ${fmt(totals.subtotal)}</td>
              </tr>
              <tr class="totals-row">
                <td colspan="3"></td>
                <td class="text-right">Shipping</td>
                <td class="text-right font-mono">${currency} ${fmt(totals.shipping)}</td>
              </tr>
              <tr class="totals-row">
                <td colspan="3"></td>
                <td class="text-right">Tax</td>
                <td class="text-right font-mono">${currency} ${fmt(totals.tax)}</td>
              </tr>
              <tr class="grand-total">
                <td colspan="3"></td>
                <td class="text-right">TOTAL</td>
                <td class="text-right font-mono">${currency} ${fmt(totals.total)}</td>
              </tr>
            </tbody>
          </table>
        </div>
        
        <div class="customer-info-card">
          <div class="info-row"><span class="info-label">👤 Name</span> <span>${fullName}</span></div>
          <div class="info-row"><span class="info-label">📧 Email</span> <span>${email}</span></div>
          <div class="info-row"><span class="info-label">📞 Phone</span> <span>${phone}</span></div>
          <div class="info-row"><span class="info-label">📍 Shipping</span> <span>${shippingDisplay}</span></div>
        </div>
        
        <div class="btn-wrap">
          <a href="/${lang}/" class="btn-continue">${T('continue_shopping', 'Continue Shopping')}</a>
        </div>
      `;
      
      launchConfetti();
      
      // Clean up localStorage after showing the page
      setTimeout(() => {
        localStorage.removeItem('webshop_paypal_customer');
        localStorage.removeItem('webshop_paypal_order_id');
        localStorage.removeItem('webshop_paypal_transaction_id');
        localStorage.removeItem('webshop_dor_reference');
        localStorage.removeItem('webshop_paypal_result');
        localStorage.removeItem('webshop_order_snapshot');
        localStorage.removeItem('webshop_order_ref');
      }, 5000);
    } else {
      page.innerHTML = `
        <div class="webshop-result-icon webshop-result-icon--cancel" style="background:#c0392b;">⚠</div>
        <h1>${T('cancel_title', 'Payment Cancelled')}</h1>
        <p>${T('cancel_message', 'Your order has not been processed.')}</p>
        <a href="/${lang}/cart/" class="btn-continue" style="margin-top:20px;">${T('return_to_cart', 'Return to Cart')}</a>
      `;
    }
  }

  function launchConfetti() {
    const container = document.getElementById('confetti-container');
    if (!container) return;
    const colors = ['#c8a96e','#1a1714','#f0e4cc','#4a7c59','#9b3a3a','#ede9e3'];
    for (let i = 0; i < 80; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText =
        'left:' + (Math.random()*100) + '%;' +
        'top:' + (-Math.random()*20) + 'px;' +
        'background:' + colors[Math.floor(Math.random()*colors.length)] + ';' +
        'width:' + (4+Math.random()*8) + 'px;' +
        'height:' + (4+Math.random()*8) + 'px;' +
        'animation-duration:' + (2+Math.random()*3) + 's;' +
        'animation-delay:' + (Math.random()*1.5) + 's;';
      container.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }
  }

  // ============================================================
  // INIT
  // ============================================================
  async function init() {
    if (typeof Shop !== 'undefined' && Shop.loadLang) {
      await Shop.loadLang().catch(() => {});
    }
    
    // Read data from localStorage
    const data = getPayPalData();
    console.log('📦 Data from localStorage:', data);
    
    // Send ticket to ticketing
    const ticketNumber = await sendToTicketing(data);
    
    // Render the page
    render(data, ticketNumber);
  }

  // Handle case where DOM might not be fully loaded
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
