<div class="container">
<style>
  .success-wrap { min-height:60vh; display:flex; align-items:center; justify-content:center; padding:3rem 1rem; }
  .webshop-confetti { position:fixed; top:0; left:0; right:0; pointer-events:none; z-index:9999; }
  @keyframes fall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(100vh) rotate(720deg);opacity:0} }
  .confetti-piece { position:absolute; border-radius:2px; animation:fall linear forwards; }
</style>

<div class="webshop-confetti" id="confetti-container"></div>
<div class="success-wrap">
  <div class="webshop-result-page webshop-fade-in" id="result-page"></div>
</div>

<script>
(function () {
  'use strict';
  
  const WORKER_URL = 'https://pay.dornori-info.workers.dev';
  const TICKETING_URL = 'https://dornori-ticketing.dornori-info.workers.dev/api/message';
  
  const params = new URLSearchParams(window.location.search);
  const ref = params.get('ref') || '';
  const status = params.get('status') || 'success';
  const lang = window.LANG || localStorage.getItem('dornori-lang') || 'en';
  
  let paypalOrderID = null;
  let paypalData = null;
  let orderSnapshot = null;

  function T(key, fallback) {
    if (window.T && window.T[key]) return window.T[key];
    if (typeof Shop !== 'undefined' && Shop.t) return Shop.t(key, fallback);
    return fallback || key;
  }

  function fmt(n) { return (Math.round((n||0)*100)/100).toFixed(2); }

  async function sendToTicketing() {
    if (status !== 'success' || !ref) {
      console.log('Skipping ticketing notification');
      return;
    }

    try {
      orderSnapshot = JSON.parse(localStorage.getItem('webshop_order_snapshot') || '{}');
      const paypalRaw = localStorage.getItem('webshop_paypal_result');
      paypalData = paypalRaw ? JSON.parse(paypalRaw) : null;
      paypalOrderID = localStorage.getItem('webshop_paypal_order_id');

      const fd = orderSnapshot.formData || {};
      const currency = (orderSnapshot.totals && orderSnapshot.totals.currency) || 'EUR';
      
      const addressLines = [
        fd.address, fd.city, fd.postal, fd.country
      ].filter(Boolean).join(', ');

      const productLines = (orderSnapshot.items || []).map(i => {
        return i.qty + '\t' + i.name + ' (' + i.sku + ')\t' + fmt(i.price) + ' ' + currency + '\t' + fmt(i.qty * i.price) + ' ' + currency;
      }).join('\n');

      const t = orderSnapshot.totals || {};
      const messageBody =
        'Order: ' + ref + '\n' +
        (paypalOrderID ? 'PayPal Order ID: ' + paypalOrderID + '\n' : '') +
        (paypalData?.status ? 'PayPal Status: ' + paypalData.status + '\n' : '') +
        '\n' +
        'SHIPPING ADDRESS\n' + addressLines + '\n' +
        '\nPRODUCTS\n' +
        'Qty\tProduct\tPrice\tTotal\n' +
        productLines + '\n' +
        '\nTOTALS\n' +
        'Subtotal:\t' + fmt(t.subtotal) + ' ' + currency + '\n' +
        'Shipping:\t' + fmt(t.shipping) + ' ' + currency + '\n' +
        'Tax:\t' + fmt(t.tax) + ' ' + currency + '\n' +
        'TOTAL:\t' + fmt(t.total) + ' ' + currency;

      const payload = {
        category: 'payment',
        name: ((fd.first_name || '') + ' ' + (fd.last_name || '')).trim(),
        email: fd.email || '',
        phone: fd.phone || '',
        subject: 'Order ' + ref,
        language: lang,
        message: messageBody,
        orderNumber: ref,
        metadata: {
          source: 'checkout-success',
          orderRef: ref,
          paypalOrderId: paypalOrderID || '',
          paypalStatus: paypalData?.status || '',
          currency: currency,
          subtotal: t.subtotal,
          shipping: t.shipping,
          tax: t.tax,
          total: t.total
        }
      };

      console.log('📤 Sending to ticketing with cross-reference:');
      console.log('  Order Ref:', ref);
      console.log('  PayPal Order ID:', paypalOrderID);
      console.log('  PayPal Status:', paypalData?.status);

      const res = await fetch(TICKETING_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }

      const result = await res.json();
      console.log('✅ Ticketing created:', result.ticketNumber);
      
      localStorage.removeItem('webshop_order_snapshot');
      localStorage.removeItem('webshop_paypal_order_id');
      localStorage.removeItem('webshop_paypal_result');
      
      return result.ticketNumber;
    } catch (err) {
      console.error('❌ Ticketing failed:', err.message);
    }
  }

  function render(ticketNumber) {
    const page = document.getElementById('result-page');
    if (!page) return;
    
    if (status === 'success') {
      page.innerHTML =
      '<div class="webshop-result-icon webshop-result-icon--success">✓</div>' +
		'<h1>' + T('success_title', 'Order Confirmed!') + '</h1>' +
		'<p>' + T('success_message', 'Thank you for your purchase.') + '</p>' +
		'<p>' + T('success_ref', 'Your order reference is') + ':</p>' +
		'<div class="webshop-ref-badge">' + ref + '</div>' +
		(paypalOrderID ? '<p style="margin-top:20px;font-size:0.9rem;color:var(--c-text-muted);">Payment reference:</p><div class="webshop-ref-badge">' + paypalOrderID + '</div>' : '') +
		'<div style="height:2.5rem;"></div>' + // Adds 2-3 lines of spacing (40px)
		'<a href="/' + lang + '/" class="webshop-btn webshop-btn--primary">' + T('continue_shopping', 'Continue Shopping') + '</a>';
      launchConfetti();
    } else {
      page.innerHTML =
        '<div class="webshop-result-icon webshop-result-icon--cancel">⚠</div>' +
        '<h1>' + T('cancel_title', 'Payment Cancelled') + '</h1>' +
        '<p>' + T('cancel_message', 'Your order has not been processed.') + '</p>' +
        '<a href="/' + lang + '/cart/" class="webshop-btn webshop-btn--primary" style="margin-top:20px;">' + T('return_to_cart', 'Return to Cart') + '</a>';
    }
  }

  function launchConfetti() {
    const container = document.getElementById('confetti-container');
    if (!container) return;
    const colors = ['#c8a96e','#1a1714','#f0e4cc','#4a7c59','#9b3a3a','#ede9e3'];
    for (let i = 0; i < 80; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText =
        'left:' + (Math.random()*100) + '%;' +
        'top:' + (-Math.random()*20) + 'px;' +
        'background:' + colors[Math.floor(Math.random()*colors.length)] + ';' +
        'width:' + (4+Math.random()*8) + 'px;' +
        'height:' + (4+Math.random()*8) + 'px;' +
        'animation-duration:' + (2+Math.random()*3) + 's;' +
        'animation-delay:' + (Math.random()*1.5) + 's;';
      container.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }
  }

  async function init() {
    if (typeof Shop !== 'undefined' && Shop.loadLang) {
      await Shop.loadLang().catch(() => {});
    }
    const ticketNumber = await sendToTicketing();
    render(ticketNumber);
  }

  init();
})();
</script>
</div>
