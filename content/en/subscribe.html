<!-- subscribe.html v1.0 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Subscribe – Dornori Newsletter</title>
<style>
    :root {
        --bg: #f0f4f8;
        --card: #ffffff;
        --border: #cbd5e0;
        --text: #1a202c;
        --text-muted: #4a5568;
        --accent: #0a8f5c;
        --accent-hover: #087a4e;
        --error: #ef4444;
        --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 36px 32px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 4px 24px rgba(0,0,0,.08);
        text-align: center;
    }
    .card h1 { font-size: 22px; color: var(--accent); margin-bottom: 6px; }
    .card p.sub { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }
    .field { text-align: left; margin-bottom: 14px; }
    .field label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); margin-bottom: 6px; }
    .field input {
        width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px;
        font-size: 14px; color: var(--text); background: #fff;
    }
    .field input:focus { outline: none; border-color: var(--accent); }
    button.submit {
        width: 100%; padding: 12px; margin-top: 8px; background: var(--accent); color: #fff;
        border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; transition: background .15s;
    }
    button.submit:hover { background: var(--accent-hover); }
    button.submit:disabled { opacity: .6; cursor: not-allowed; }
    .msg { margin-top: 16px; font-size: 13px; padding: 10px 14px; border-radius: 8px; display: none; }
    .msg.show { display: block; }
    .msg.success { background: #e6fffa; color: #276749; }
    .msg.error { background: #fff5f5; color: #c53030; }
</style>
</head>
<body>
<div class="card">
    <h1>📧 Dornori Newsletter</h1>
    <p class="sub">Get news on new colourways, restocks and Star-A updates. No spam, unsubscribe anytime.</p>

    <form id="subscribeForm">
        <div class="field">
            <label for="name">Name <span style="text-transform:none;">(optional)</span></label>
            <input type="text" id="name" name="name" placeholder="Your name" />
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <button type="submit" class="submit" id="submitBtn">Subscribe</button>
    </form>

    <div id="msg" class="msg"></div>
</div>

<script>
const API_BASE = 'https://dornori-ticketing.dornori-info.workers.dev';

document.getElementById('subscribeForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var msg = document.getElementById('msg');
    var email = document.getElementById('email').value.trim();
    var name = document.getElementById('name').value.trim();

    if (!email) return;

    btn.disabled = true;
    btn.textContent = 'Subscribing…';
    msg.className = 'msg';

    try {
        var res = await fetch(API_BASE + '/api/subscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, name: name })
        });
        var data = await res.json();
        if (res.ok && data.success) {
            msg.textContent = '✅ Subscribed! Check your inbox for a confirmation email.';
            msg.className = 'msg show success';
            document.getElementById('subscribeForm').reset();
        } else {
            msg.textContent = '❌ ' + (data.error || 'Something went wrong. Please try again.');
            msg.className = 'msg show error';
        }
    } catch (err) {
        msg.textContent = '❌ Network error: ' + err.message;
        msg.className = 'msg show error';
    } finally {
        btn.disabled = false;
        btn.textContent = 'Subscribe';
    }
});
</script>
</body>
</html>
