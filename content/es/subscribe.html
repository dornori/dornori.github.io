<div class="container">
    <style>
        .subscribe-card{background:#fff;border:1px solid #cbd5e0;border-radius:14px;padding:36px 32px;max-width:420px;width:100%;margin:20px auto;box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center}
        .subscribe-card h1{font-size:22px;color:#0a8f5c;margin-bottom:6px}
        .subscribe-card .sub{font-size:14px;color:#4a5568;margin-bottom:24px;line-height:1.5}
        .sub-field{text-align:left;margin-bottom:14px}
        .sub-field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#4a5568;margin-bottom:6px}
        .sub-field input{width:100%;padding:11px 14px;border:1px solid #cbd5e0;border-radius:8px;font-size:14px;color:#1a202c;background:#fff;transition:border-color .15s;box-sizing:border-box}
        .sub-field input:focus{outline:none;border-color:#0a8f5c}
        .btn-subscribe{width:100%;padding:.875rem;background:linear-gradient(135deg,#0a8f5c,color-mix(in srgb,#0a8f5c 70%,#000 30%));color:#fff;font-weight:700;border:none;border-radius:.875rem;font-size:1rem;font-family:system-ui,-apple-system,sans-serif;cursor:pointer;transition:all .2s ease;margin-top:.5rem}
        .btn-subscribe:hover{transform:translateY(-2px);filter:brightness(1.05);box-shadow:0 4px 12px rgba(0,0,0,.2)}
        .btn-subscribe:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none;box-shadow:none}
        .sub-msg{margin-top:16px;font-size:13px;padding:10px 14px;border-radius:8px;display:none}
        .sub-msg.show{display:block}
        .sub-msg.success{background:#e6fffa;color:#276749}
        .sub-msg.error{background:#fff5f5;color:#c53030}
        .success-state{display:none;padding:12px 0 4px}
        .success-state .check-icon{font-size:48px;color:#10b981;margin-bottom:8px;display:block}
        .success-state h2{font-size:24px;color:#0a8f5c;margin-bottom:8px}
        .success-state p{font-size:14px;color:#4a5568;line-height:1.6;margin-bottom:0}
    </style>

    <div class="subscribe-card">
        <h1 id="nl-heading"></h1>
        <div id="subscribeFormWrapper">
            <p class="sub" id="nl-sub"></p>
            <form id="subscribeForm" novalidate>
                <div class="sub-field">
                    <label for="sub-name" id="label-sub-name"></label>
                    <input type="text" id="sub-name" name="name" />
                </div>
                <div class="sub-field">
                    <label for="sub-email" id="label-sub-email"></label>
                    <input type="email" id="sub-email" name="email" required />
                </div>
                <button type="submit" class="btn-subscribe" id="submitBtn"></button>
            </form>
            <div id="sub-msg" class="sub-msg"></div>
        </div>
        <div id="successState" class="success-state">
            <span class="check-icon">✅</span>
            <h2 id="nl-success-heading"></h2>
            <p id="nl-success-message"></p>
        </div>
    </div>

    <script>
    (function() {
        'use strict';
        var API_BASE = (window.CONFIG && window.CONFIG.endpoints && window.CONFIG.endpoints.ticketingWorker) || '';
        var lang = document.documentElement.lang || 'en';
        var jsonPath = (window.__BASE_PATH__ || '/') + 'lang/' + lang + '/newsletter.json';

        var t = {};
        var form = document.getElementById('subscribeForm');
        var emailInput = document.getElementById('sub-email');
        var nameInput = document.getElementById('sub-name');
        var submitBtn = document.getElementById('submitBtn');
        var msg = document.getElementById('sub-msg');
        var formWrapper = document.getElementById('subscribeFormWrapper');
        var successState = document.getElementById('successState');

        function showMsg(text, ok) {
            msg.textContent = text;
            msg.className = 'sub-msg show ' + (ok ? 'success' : 'error');
        }

        function populateUI(s) {
            document.getElementById('nl-heading').textContent = s.heading || '';
            document.getElementById('nl-sub').textContent = s.sub || '';
            var nameLabel = document.getElementById('label-sub-name');
            if (nameLabel) nameLabel.innerHTML = (s.nameLabel || 'Name') + ' <span style="text-transform:none;font-weight:400;">' + (s.nameOptional || '(optional)') + '</span>';
            document.getElementById('label-sub-email').textContent = s.emailLabel || 'Email address';
            emailInput.placeholder = s.emailPlaceholder || '';
            nameInput.placeholder = s.namePlaceholder || '';
            submitBtn.textContent = s.submitButton || 'Subscribe';
            document.getElementById('nl-success-heading').textContent = s.successHeading || '';
            document.getElementById('nl-success-message').textContent = s.successMessage || '';
        }

        fetch(jsonPath, { cache: 'no-store' })
            .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(function(data) { t = data; populateUI(data.subscribe || {}); })
            .catch(function(err) { console.error('Failed to load newsletter.json:', err); });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            var email = emailInput.value.trim();
            var name = nameInput.value.trim();
            if (!email) return;
            submitBtn.disabled = true;
            submitBtn.textContent = (t.subscribe && t.subscribe.subscribingText) || 'Subscribing…';
            try {
                var res = await fetch(API_BASE + '/api/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, name: name || 'NA', language: lang })
                });
                var data = await res.json();
                if (res.ok && data.success) {
                    formWrapper.style.display = 'none';
                    successState.style.display = 'block';
                } else {
                    showMsg('❌ ' + (data.error || (t.subscribe && t.subscribe.errorFallback) || 'Something went wrong.'), false);
                    submitBtn.disabled = false;
                    submitBtn.textContent = (t.subscribe && t.subscribe.submitButton) || 'Subscribe';
                }
            } catch (err) {
                showMsg('❌ ' + ((t.subscribe && t.subscribe.networkError) || 'Network error') + ': ' + err.message, false);
                submitBtn.disabled = false;
                submitBtn.textContent = (t.subscribe && t.subscribe.submitButton) || 'Subscribe';
            }
        });
    })();
    </script>
</div>
