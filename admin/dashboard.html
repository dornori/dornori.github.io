<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dornori Ticketing</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .load-more-wrap { text-align: center; padding: 20px; }
        .load-more-wrap button { padding: 10px 30px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-weight: 600; cursor: pointer; transition: background .15s; }
        .load-more-wrap button:hover { background: var(--accent); color: var(--text-inverse); }
        .load-more-wrap .loading-more { color: var(--text-muted); font-size: 14px; padding: 10px; }
        .header-right button#pushButton { background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
        .header-right button#pushButton.enabled { background: #22c55e; color: #fff; border-color: #22c55e; }
        .header-right button#testPushBtn { background: #3b82f6; color: #fff; border: 1px solid #3b82f6; border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px; display: none; }
        .header-right button#testPushBtn:hover { background: #2563eb; }
        #pushStatus { font-size: 12px; color: var(--text-muted); margin-left: 6px; }
    </style>
</head>
<body>
<div class="container">
    <div id="login">
        <h1>🔐 Dornori Ticketing</h1>
        <input type="email" id="loginEmail" placeholder="Email" value="admin@dornori.com" />
        <input type="password" id="loginPassword" placeholder="Password" value="password" />
        <button onclick="login()">Login</button>
        <div id="loginError" class="error"></div>
        <div id="loginLoading" class="loading">⏳ Logging in...</div>
    </div>

    <div id="dashboard">
        <div class="header">
            <h1>🎫 Dornori Ticketing</h1>
            <div class="header-right">
                <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
                <a href="reports.html">📊 Reports</a>
                <a href="newsletter.html">📧 Newsletter</a>
                <a href="settings.html">⚙️ Settings</a>
                <button id="pushButton" onclick="togglePush()">🔔 Enable Live Updates</button>
                <button id="testPushBtn" onclick="testPush()">📨 Test Push</button>
                <span id="pushStatus"></span>
                <button onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="stats" id="stats"></div>

        <div class="ticket-tabs">
            <button class="ticket-tab active" data-tab="active" onclick="switchTab('active')">Active</button>
            <button class="ticket-tab" data-tab="resolved" onclick="switchTab('resolved')">Resolved</button>
            <button class="ticket-tab" data-tab="closed" onclick="switchTab('closed')">Closed</button>
        </div>

        <div class="filters">
            <select id="filterLanguage" onchange="resetAndLoad()">
                <option value="">All Languages</option>
            </select>
            <select id="filterCategory" onchange="resetAndLoad()">
                <option value="">All Categories</option>
            </select>
            <select id="filterSort" onchange="resetAndLoad()">
                <option value="last_updated">Sort: Last Updated</option>
                <option value="created">Sort: Created Date</option>
                <option value="sla">Sort: SLA Status</option>
            </select>
            <button class="btn-refresh" onclick="resetAndLoad()">⟳ Refresh</button>
        </div>

        <div id="ticketList" class="ticket-list"><div class="loading">Loading tickets...</div></div>
        <div id="loadMoreWrap" class="load-more-wrap"></div>
    </div>

    <div id="ticketModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div id="modalContent"></div>
        </div>
    </div>
</div>

<script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  CONFIG
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const API_BASE = 'https://dornori-ticketing.dornori-info.workers.dev';

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  THEME TOGGLE
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        const toggles = document.querySelectorAll('.theme-toggle');
        toggles.forEach(t => t.textContent = theme === 'dark' ? '☀️' : '🌙');
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        setTheme(current === 'light' ? 'dark' : 'light');
    }

    const savedTheme = localStorage.getItem('theme') || 'light';
    setTheme(savedTheme);

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  GLOBALS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    var token = null;
    var userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    var emailSenders = [];
    var currentTab = 'active';
    var currentOffset = 0;
    var currentLimit = 50;
    var currentTotal = 0;
    var loadedTickets = [];
    let pushSubscription = null;
    let isPushEnabled = false;

    function getStatusesForTab(tab) {
        if (tab === 'active') return ['new', 'open', 'in_progress', 'pending'];
        if (tab === 'resolved') return ['resolved'];
        if (tab === 'closed') return ['closed'];
        return [];
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.ticket-tab').forEach(function(btn) {
            btn.classList.toggle('active', btn.dataset.tab === tab);
        });
        resetAndLoad();
    }

    function resetAndLoad() {
        currentOffset = 0;
        loadedTickets = [];
        document.getElementById('loadMoreWrap').innerHTML = '';
        loadTickets();
    }

    function formatDate(dateStr) {
        if (!dateStr) return "Invalid Date";
        try {
            var cleaned = dateStr.replace(" ", "T");
            if (!cleaned.includes("Z") && !cleaned.includes("+")) { cleaned += "Z"; }
            var d = new Date(cleaned);
            if (isNaN(d.getTime())) { return dateStr; }
            return d.toLocaleString(undefined, {
                year: "numeric", month: "short", day: "numeric",
                hour: "2-digit", minute: "2-digit",
                timeZone: userTimezone || "UTC"
            });
        } catch (e) { return dateStr; }
    }

    function getSlaDisplay(slaStatus) {
        const map = {
            'on_track': { label: 'On track', cls: 'sla-on-track' },
            'at_risk':  { label: 'At risk',  cls: 'sla-at-risk' },
            'breached': { label: 'Breached', cls: 'sla-breached' },
            'paused':   { label: 'Paused',   cls: 'sla-paused' }
        };
        return map[slaStatus] || { label: 'Unknown', cls: '' };
    }

    function getCatColor(cat) {
        const colors = {
            'support': '#ef4444', 'billing': '#f59e0b', 'technical': '#3b82f6',
            'feature-request': '#8b5cf6', 'bug': '#ec4899', 'general': '#6b7280'
        };
        return colors[cat] || '#9ca3af';
    }

    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, m => map[m]);
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  PUSH NOTIFICATIONS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function registerServiceWorker() {
        if (!('serviceWorker' in navigator)) {
            console.log('❌ Service Worker not supported');
            return false;
        }
        try {
            const reg = await navigator.serviceWorker.register('./sw.js');
            console.log('✅ Service Worker registered');
            return reg;
        } catch (err) {
            console.log('❌ Service Worker registration failed:', err);
            return false;
        }
    }

    async function checkPushSupport() {
        if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
            console.log('❌ Push notifications not supported');
            return false;
        }
        if (Notification.permission === 'denied') {
            console.log('❌ Notifications denied by user');
            return false;
        }
        return true;
    }

    async function checkPushStatus() {
        const isSupported = await checkPushSupport();
        if (!isSupported) {
            document.getElementById('pushButton').style.display = 'none';
            return;
        }

        try {
            const reg = await navigator.serviceWorker.ready;
            pushSubscription = await reg.pushManager.getSubscription();
            
            if (pushSubscription) {
                isPushEnabled = true;
                document.getElementById('pushButton').classList.add('enabled');
                document.getElementById('pushButton').textContent = '✅ Live Updates ON';
                document.getElementById('testPushBtn').style.display = 'inline-block';
            } else {
                isPushEnabled = false;
                document.getElementById('pushButton').classList.remove('enabled');
                document.getElementById('pushButton').textContent = '🔔 Enable Live Updates';
                document.getElementById('testPushBtn').style.display = 'none';
            }
        } catch (err) {
            console.log('❌ Error checking push status:', err);
        }
    }

    async function togglePush() {
        const isSupported = await checkPushSupport();
        if (!isSupported) {
            alert('Push notifications are not supported in your browser');
            return;
        }

        if (isPushEnabled) {
            await disablePush();
        } else {
            await enablePush();
        }
    }

    async function enablePush() {
        try {
            document.getElementById('pushStatus').textContent = 'Requesting permission...';
            
            if (Notification.permission === 'default') {
                const perm = await Notification.requestPermission();
                if (perm !== 'granted') {
                    document.getElementById('pushStatus').textContent = 'Permission denied';
                    return;
                }
            }

            const reg = await navigator.serviceWorker.ready;
            
            const pubKeyRes = await fetch(API_BASE + '/api/push/public-key');
            const pubKeyData = await pubKeyRes.json();
            
            if (!pubKeyData.publicKey) {
                throw new Error('Failed to fetch VAPID public key');
            }

            document.getElementById('pushStatus').textContent = 'Subscribing...';

            const subscription = await reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: pubKeyData.publicKey
            });

            const response = await fetch(API_BASE + '/api/push/subscribe', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ subscription })
            });

            if (response.ok) {
                isPushEnabled = true;
                pushSubscription = subscription;
                document.getElementById('pushButton').classList.add('enabled');
                document.getElementById('pushButton').textContent = '✅ Live Updates ON';
                document.getElementById('testPushBtn').style.display = 'inline-block';
                document.getElementById('pushStatus').textContent = 'Connected';
                setTimeout(() => { document.getElementById('pushStatus').textContent = ''; }, 3000);
            } else {
                throw new Error('Subscription failed: ' + response.statusText);
            }
        } catch (err) {
            console.error('❌ Push enable error:', err);
            document.getElementById('pushStatus').textContent = 'Failed: ' + err.message;
        }
    }

    async function disablePush() {
        try {
            document.getElementById('pushStatus').textContent = 'Unsubscribing...';
            
            if (pushSubscription) {
                const response = await fetch(API_BASE + '/api/push/subscribe', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ endpoint: pushSubscription.endpoint })
                });

                if (response.ok) {
                    await pushSubscription.unsubscribe();
                }
            }

            isPushEnabled = false;
            pushSubscription = null;
            document.getElementById('pushButton').classList.remove('enabled');
            document.getElementById('pushButton').textContent = '🔔 Enable Live Updates';
            document.getElementById('testPushBtn').style.display = 'none';
            document.getElementById('pushStatus').textContent = 'Disconnected';
            setTimeout(() => { document.getElementById('pushStatus').textContent = ''; }, 3000);
        } catch (err) {
            console.error('❌ Push disable error:', err);
            document.getElementById('pushStatus').textContent = 'Error: ' + err.message;
        }
    }

    async function testPush() {
        try {
            document.getElementById('pushStatus').textContent = 'Sending test...';
            
            const response = await fetch(API_BASE + '/api/test-push', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                }
            });

            const data = await response.json();

            if (data.success && data.sent > 0) {
                document.getElementById('pushStatus').textContent = 'Test sent!';
            } else if (data.success && data.sent === 0) {
                document.getElementById('pushStatus').textContent = 'No active subscriptions';
            } else {
                document.getElementById('pushStatus').textContent = 'Test failed';
            }

            setTimeout(() => { document.getElementById('pushStatus').textContent = ''; }, 3000);
        } catch (err) {
            console.error('❌ Test push error:', err);
            document.getElementById('pushStatus').textContent = 'Error: ' + err.message;
        }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  AUTH
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function login() {
        var email = document.getElementById("loginEmail").value;
        var password = document.getElementById("loginPassword").value;
        document.getElementById("loginError").textContent = "";
        document.getElementById("loginLoading").style.display = "none";
        if (!email || !password) return alert("Email and password required");
        document.getElementById("loginLoading").style.display = "block";
        try {
            var res = await fetch(API_BASE + "/api/admin/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email, password: password })
            });
            var data = await res.json();
            document.getElementById("loginLoading").style.display = "none";
            if (data.success) {
                token = data.token;
                localStorage.setItem("token", token);
                document.getElementById("login").style.display = "none";
                document.getElementById("dashboard").style.display = "block";
                loadEmailSenders();
                loadCategories();
                loadLanguages();
                loadStats();
                resetAndLoad();
                await registerServiceWorker();
                checkPushStatus();
            } else {
                document.getElementById("loginError").textContent = data.error || "Login failed";
            }
        } catch (e) {
            document.getElementById("loginLoading").style.display = "none";
            document.getElementById("loginError").textContent = "Error: " + e.message;
        }
    }

    function logout() {
        token = null;
        localStorage.removeItem("token");
        document.getElementById("login").style.display = "block";
        document.getElementById("dashboard").style.display = "none";
        document.getElementById("loginEmail").value = "";
        document.getElementById("loginPassword").value = "";
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  DATA LOADING
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function loadStats() {
        try {
            var res = await fetch(API_BASE + "/api/admin/stats", {
                headers: { "Authorization": "Bearer " + token }
            });
            var data = await res.json();
            if (data.success) {
                var stats = data.stats;
                var total = Object.values(stats).reduce((a,b) => a+b, 0);
                var html = `
                    <div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">Total</div></div>
                    <div class="stat-card"><div class="stat-value">${stats.new || 0}</div><div class="stat-label">New</div></div>
                    <div class="stat-card"><div class="stat-value">${stats.open || 0}</div><div class="stat-label">Open</div></div>
                    <div class="stat-card"><div class="stat-value">${stats.in_progress || 0}</div><div class="stat-label">In Progress</div></div>
                    <div class="stat-card"><div class="stat-value">${stats.pending || 0}</div><div class="stat-label">Pending</div></div>
                    <div class="stat-card"><div class="stat-value">${stats.resolved || 0}</div><div class="stat-label">Resolved</div></div>
                    <div class="stat-card"><div class="stat-value">${stats.closed || 0}</div><div class="stat-label">Closed</div></div>
                `;
                document.getElementById("stats").innerHTML = html;
            }
        } catch(e) { console.log("Error loading stats"); }
    }

    async function loadCategories() {
        try {
            var res = await fetch(API_BASE + "/api/admin/settings", {
                headers: { "Authorization": "Bearer " + token }
            });
            var data = await res.json();
            if (data.success) {
                var categories = [];
                for (const s of data.settings || []) {
                    if (s.category === 'category' && s.key.endsWith('_description')) {
                        var slug = s.key.replace(/_description$/, '');
                        if (s.value !== '__deleted__') categories.push(slug);
                    }
                }
                var select = document.getElementById('filterCategory');
                for (var cat of categories) {
                    var opt = document.createElement('option');
                    opt.value = cat;
                    opt.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
                    select.appendChild(opt);
                }
            }
        } catch(e) { console.log("Error loading categories"); }
    }

    async function loadLanguages() {
        try {
            var res = await fetch(API_BASE + "/api/admin/settings", {
                headers: { "Authorization": "Bearer " + token }
            });
            var data = await res.json();
            if (data.success) {
                var langList = null;
                for (const s of data.settings || []) {
                    if (s.category === 'languages' && s.key === 'list') {
                        try { langList = JSON.parse(s.value); } catch(e) {}
                    }
                }
                if (langList && Array.isArray(langList)) {
                    var select = document.getElementById('filterLanguage');
                    for (var lang of langList) {
                        var opt = document.createElement('option');
                        opt.value = lang.code;
                        opt.textContent = lang.name;
                        select.appendChild(opt);
                    }
                }
            }
        } catch(e) { console.log("Error loading languages"); }
    }

    async function loadEmailSenders() {
        try {
            var res = await fetch(API_BASE + "/api/admin/email-addresses?active_only=true", {
                headers: { "Authorization": "Bearer " + token }
            });
            var data = await res.json();
            if (data.success) emailSenders = data.addresses || [];
        } catch(e) { console.log("Error loading email senders"); }
    }

    async function loadTickets() {
        var category = document.getElementById("filterCategory").value || null;
        var language = document.getElementById("filterLanguage").value || null;
        var sort = document.getElementById("filterSort").value || "last_updated";
        var statuses = getStatusesForTab(currentTab);
        try {
            var url = API_BASE + "/api/admin/tickets?limit=" + currentLimit + "&offset=" + currentOffset;
            if (category) url += "&category=" + encodeURIComponent(category);
            if (language) url += "&language=" + encodeURIComponent(language);
            if (sort) url += "&sort=" + encodeURIComponent(sort);
            url += "&statuses=" + statuses.join(",");
            var res = await fetch(url, { headers: { "Authorization": "Bearer " + token } });
            if (res.status === 401) { logout(); return; }
            var data = await res.json();
            if (data.success) {
                currentTotal = data.pagination.total;
                for (var ticket of data.tickets) { loadedTickets.push(ticket); }
                renderTickets();
                renderLoadMore();
            }
        } catch(e) { console.log("Error loading tickets"); }
    }

    function renderTickets() {
        var html = '';
        for (var ticket of loadedTickets) {
            var catColor = getCatColor(ticket.category);
            var slaLabel = getSlaDisplay(ticket.sla_status || 'on_track').label;
            var slaClass = getSlaDisplay(ticket.sla_status || 'on_track').cls;
            html += `
                <div class="ticket-item" onclick="openTicketModal(${ticket.id})">
                    <div class="ticket-number">#${ticket.ticket_number}</div>
                    <div class="ticket-info">
                        <div class="ticket-subject">${escapeHtml(ticket.subject || 'No subject')}</div>
                        <div class="ticket-meta">
                            <span class="cat-dot" style="background:${catColor};"></span>
                            <span>${ticket.category}</span> • ${ticket.sender_name || ticket.sender_email || 'Unknown'} • ${formatDate(ticket.created_at)}
                        </div>
                    </div>
                    <div class="ticket-status">${ticket.status.toUpperCase()}</div>
                    <div class="sla-badge ${slaClass}">${slaLabel}</div>
                </div>
            `;
        }
        document.getElementById("ticketList").innerHTML = html || '<div class="loading">No tickets</div>';
    }

    function renderLoadMore() {
        var loaded = loadedTickets.length;
        var html = '';
        if (loaded < currentTotal) {
            html = `
                <div class="loading-more">Showing ${loaded} of ${currentTotal}</div>
                <button onclick="loadMore()">Load More</button>
            `;
        } else {
            html = `<div class="loading-more">All ${currentTotal} tickets loaded</div>`;
        }
        document.getElementById("loadMoreWrap").innerHTML = html;
    }

    function loadMore() {
        currentOffset += currentLimit;
        loadTickets();
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  MODAL
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function openTicketModal(id) {
        document.getElementById("ticketModal").style.display = "flex";
        var content = document.getElementById("modalContent");
        content.innerHTML = '<div class="loading">Loading...</div>';
        try {
            var res = await fetch(API_BASE + "/api/admin/ticket/" + id, {
                headers: { "Authorization": "Bearer " + token }
            });
            if (res.status === 401) { logout(); closeModal(); return; }
            var data = await res.json();
            if (data.success) renderTicketModal(data.data);
            else content.innerHTML = '<p>Failed to load ticket</p>';
        } catch(e) { content.innerHTML = '<p>Error: ' + e.message + '</p>'; }
    }

    function closeModal() {
        document.getElementById("ticketModal").style.display = "none";
    }

    function renderTicketModal(ticket) {
        var content = document.getElementById("modalContent");
        var commentsHtml = '';
        if (ticket.comments && ticket.comments.length > 0) {
            for (var i = 0; i < ticket.comments.length; i++) {
                var comment = ticket.comments[i];
                var style = comment.comment_type === 'internal' ? 'background: var(--bg-info); border-left: 3px solid var(--accent);' : '';
                commentsHtml += `
                    <div class="comment" style="${style}">
                        <div class="comment-header">${escapeHtml(comment.author_email || 'System')} <span class="comment-time">${formatDate(comment.created_at)}</span></div>
                        <div class="comment-body">${escapeHtml(comment.content)}</div>
                    </div>
                `;
            }
        }

        var statusOptions = ["new", "open", "in_progress", "pending", "resolved", "closed"];
        var statusDropdown = '<select id="detailStatus">';
        for (var i = 0; i < statusOptions.length; i++) {
            var s = statusOptions[i];
            statusDropdown += '<option value="' + s + '" ' + (s === ticket.status ? "selected" : "") + '>' + s + '</option>';
        }
        statusDropdown += '</select>';

        var senderDropdown = '<select id="detailReplyFrom">';
        var hasDefault = false;
        if (emailSenders && emailSenders.length > 0) {
            for (var i = 0; i < emailSenders.length; i++) {
                var sender = emailSenders[i];
                var label = sender.label || sender.email;
                var selected = (sender.action === "support") ? "selected" : "";
                senderDropdown += '<option value="' + sender.email + '" ' + selected + '>' + label + ' (' + sender.email + ')</option>';
                if (sender.action === "support") hasDefault = true;
            }
        }
        if (!hasDefault) {
            senderDropdown += '<option value="support@dornori.com" selected>Support (support@dornori.com)</option>';
        }
        senderDropdown += '</select>';

        var slaLabel = getSlaDisplay(ticket.sla_status || 'on_track').label;
        var slaClass = getSlaDisplay(ticket.sla_status || 'on_track').cls;
        var catColor = getCatColor(ticket.category);
        var isClosed = ticket.status === 'closed';

        var actionsHtml = '';
        if (!isClosed) {
            actionsHtml = `
            <div class="detail-section action-section">
                <h4>✏️ Update Status</h4>
                ${statusDropdown}
                <div class="actions"><button class="btn-primary" onclick="updateStatus(${ticket.id})">Save Status</button></div>
            </div>
            <div class="detail-section action-section comment-input">
                <h4>📝 Add Comment</h4>
                <textarea id="detailComment" placeholder="Write an internal comment..."></textarea>
                <div class="actions"><button class="btn-primary" onclick="addComment(${ticket.id})">Add Comment</button></div>
            </div>
            <div class="detail-section action-section">
                <h4>✉️ Reply to Customer</h4>
                <label>From:</label>
                ${senderDropdown}
                <textarea id="detailReplyBody" placeholder="Write your reply to the customer..."></textarea>
                <div class="actions"><button class="btn-primary" onclick="sendReply(${ticket.id})">Send Reply</button></div>
            </div>`;
        } else {
            actionsHtml = `
            <div class="detail-section action-section">
                <h4>✏️ Reopen Ticket</h4>
                ${statusDropdown}
                <div class="actions"><button class="btn-primary" onclick="updateStatus(${ticket.id})">Update Status</button></div>
            </div>`;
        }

        var fullName = [ticket.sender_name, ticket.sender_last_name].filter(Boolean).join(' ') || 'Unknown';
        var orderNum = ticket.order_number ? escapeHtml(ticket.order_number) : '—';

        content.innerHTML = `
            <div class="detail-section">
                <h3>📋 Ticket Details</h3>
                <div class="modal-subject-row"><span class="meta-label" style="font-size:11px;color:var(--text-muted);margin-right:6px;">Subject:</span><span class="modal-subject-text">${escapeHtml(ticket.subject || 'No subject')}</span></div>
                <div class="ticket-meta-grid">
                    <div class="meta-item"><span class="meta-label">Ticket Number</span><span class="meta-value" style="font-family:monospace;color:var(--accent);">#${ticket.ticket_number}</span></div>
                    <div class="meta-item"><span class="meta-label">Status</span><span class="meta-value">${ticket.status.toUpperCase()}</span></div>
                    <div class="meta-item"><span class="meta-label">SLA</span><span class="meta-value ${slaClass} sla-badge-inline">${slaLabel}</span></div>
                    <div class="meta-item"><span class="meta-label">Category</span><span class="meta-value"><span class="cat-dot" style="background:${catColor};margin-right:6px;"></span>${ticket.category || "Other"}</span></div>
                    <div class="meta-item"><span class="meta-label">Name</span><span class="meta-value">${escapeHtml(fullName)}</span></div>
                    <div class="meta-item"><span class="meta-label">Email</span><span class="meta-value">${ticket.sender_email || "Unknown"}</span></div>
                    <div class="meta-item"><span class="meta-label">Order Number</span><span class="meta-value">${orderNum}</span></div>
                    <div class="meta-item"><span class="meta-label">Created</span><span class="meta-value">${formatDate(ticket.created_at)}</span></div>
                </div>
            </div>
            <div class="detail-section">
                <h3>💬 Message</h3>
                <div class="ticket-body">${ticket.message || "No message"}</div>
            </div>
            <div class="detail-section comments-section">
                <h3>💭 Comments (${ticket.comments ? ticket.comments.length : 0})</h3>
                ${commentsHtml || '<div style="color:var(--text-muted);font-size:13px;">No comments yet</div>'}
            </div>
            ${actionsHtml}
        `;
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  ACTIONS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function updateStatus(id) {
        var status = document.getElementById("detailStatus").value;
        try {
            var res = await fetch(API_BASE + "/api/admin/ticket/" + id + "/status", {
                method: "PUT",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
                body: JSON.stringify({ status: status })
            });
            if (res.status === 401) { logout(); closeModal(); return; }
            var data = await res.json();
            if (data.success) { openTicketModal(id); loadStats(); resetAndLoad(); }
            else { alert("Update failed"); }
        } catch (e) { alert("Error: " + e.message); }
    }

    async function addComment(id) {
        var content = document.getElementById("detailComment").value;
        if (!content) return alert("Please enter a comment");
        try {
            var res = await fetch(API_BASE + "/api/admin/ticket/" + id + "/comment", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
                body: JSON.stringify({ content: content, type: "internal" })
            });
            if (res.status === 401) { logout(); closeModal(); return; }
            var data = await res.json();
            if (data.success) { document.getElementById("detailComment").value = ""; openTicketModal(id); loadStats(); resetAndLoad(); }
            else { alert("Failed to add comment"); }
        } catch (e) { alert("Error: " + e.message); }
    }

    async function sendReply(id) {
        var from = document.getElementById("detailReplyFrom").value;
        var rawBody = document.getElementById("detailReplyBody").value;
        if (!rawBody) return alert("Please enter a reply");
        var body = '<p>' + rawBody
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/\r\n|\r|\n/g, '</p><p>') + '</p>';
        body = body.replace(/<p>\s*<\/p>/g, '');
        try {
            var res = await fetch(API_BASE + "/api/admin/ticket/" + id + "/reply", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
                body: JSON.stringify({ from: from, body: body })
            });
            if (res.status === 401) { logout(); closeModal(); return; }
            var data = await res.json();
            if (data.success) { document.getElementById("detailReplyBody").value = ""; alert("Reply sent!"); openTicketModal(id); loadStats(); resetAndLoad(); }
            else { alert("Failed to send reply"); }
        } catch (e) { alert("Error: " + e.message); }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  INIT
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    if (localStorage.getItem("token")) {
        token = localStorage.getItem("token");
        document.getElementById("login").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        loadEmailSenders();
        loadCategories();
        loadLanguages();
        loadStats();
        resetAndLoad();
        registerServiceWorker().then(() => checkPushStatus());
    }
</script>
</body>
</html>
