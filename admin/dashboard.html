<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dornori Ticketing</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
    <div id="login">
        <h1>🔐 Dornori Ticketing</h1>
        <input type="email" id="loginEmail" placeholder="Email" value="admin@dornori.com" />
        <input type="password" id="loginPassword" placeholder="Password" value="password" />
        <button onclick="login()">Login</button>
        <div id="loginError" class="error"></div>
        <div id="loginLoading" class="loading">⏳ Logging in...</div>
    </div>

    <div id="dashboard">
        <div class="header">
            <h1>🎫 Dornori Ticketing</h1>
            <div class="header-right">
                <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
                <a href="reports.html">📊 Reports</a>
                <a href="settings.html">⚙️ Settings</a>
                <button onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="stats" id="stats"></div>

        <div class="filters">
            <select id="filterCategory" onchange="loadTickets()">
                <option value="">All Categories</option>
                <option value="support">Support</option>
                <option value="newsletter">Newsletter</option>
                <option value="payment">Payment</option>
                <option value="other">Other</option>
            </select>
            <select id="filterStatus" onchange="loadTickets()">
                <option value="">All Status</option>
                <option value="new">New</option>
                <option value="open">Open</option>
                <option value="in_progress">In Progress</option>
                <option value="pending">Pending</option>
                <option value="resolved">Resolved</option>
                <option value="closed">Closed</option>
            </select>
            <select id="filterSort" onchange="loadTickets()">
                <option value="sla">Sort: SLA Status</option>
                <option value="last_updated">Sort: Last Updated</option>
                <option value="created">Sort: Created Date</option>
                <option value="ticket_number">Sort: Ticket #</option>
            </select>
            <button class="btn-refresh" onclick="loadTickets()">⟳ Refresh</button>
        </div>

        <div id="ticketList" class="ticket-list"><div class="loading">Loading tickets...</div></div>
    </div>

    <div id="ticketModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div id="modalContent"></div>
        </div>
    </div>
</div>

<script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  CONFIG – adjust to your worker URL
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const API_BASE = 'https://dornori-ticketing.dornori-info.workers.dev'; // <-- change to your worker URL

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  THEME TOGGLE
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        const toggles = document.querySelectorAll('.theme-toggle');
        toggles.forEach(t => t.textContent = theme === 'dark' ? '☀️' : '🌙');
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        setTheme(current === 'light' ? 'dark' : 'light');
    }

    // Load saved theme or default to 'light'
    const savedTheme = localStorage.getItem('theme') || 'light';
    setTheme(savedTheme);

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  GLOBALS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    var token = null;
    var userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    var emailSenders = [];

    console.log("Dashboard script loaded");

    function formatDate(dateStr) {
        if (!dateStr) return "Invalid Date";
        try {
            var cleaned = dateStr.replace(" ", "T");
            if (!cleaned.includes("Z") && !cleaned.includes("+")) { cleaned += "Z"; }
            var d = new Date(cleaned);
            if (isNaN(d.getTime())) { return dateStr; }
            return d.toLocaleString(undefined, {
                year: "numeric",
                month: "short",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                timeZone: userTimezone || "UTC"
            });
        } catch (e) { return dateStr; }
    }

    function getSlaLabel(ticket) {
        if (ticket.status === "resolved" || ticket.status === "closed") {
            return ticket.status.charAt(0).toUpperCase() + ticket.status.slice(1);
        }
        var now = new Date();
        var due = new Date(ticket.sla_response_due);
        var diffMs = due - now;
        var diffMin = Math.floor(diffMs / 60000);
        var hours = Math.floor(Math.abs(diffMin) / 60);
        var mins = Math.abs(diffMin) % 60;
        var label = "";
        if (diffMin > 0) {
            if (hours > 0) { label = hours + "h" + (mins > 0 ? " " + mins + "m" : ""); }
            else { label = mins + "m"; }
            return "Due in " + label;
        } else if (diffMin < 0) {
            if (hours > 0) { label = hours + "h" + (mins > 0 ? " " + mins + "m" : ""); }
            else { label = mins + "m"; }
            return "Overdue by " + label;
        }
        return "Due now";
    }

    function getSlaClass(ticket) {
        if (ticket.status === "resolved" || ticket.status === "closed") return "sla-on_track";
        var now = new Date();
        var due = new Date(ticket.sla_response_due);
        if (now > due) return "sla-breached";
        if (now > new Date(new Date(due).getTime() - 3600000)) return "sla-at_risk";
        return "sla-on_track";
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  LOGIN / LOGOUT
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function login() {
        var email = document.getElementById("loginEmail").value;
        var password = document.getElementById("loginPassword").value;
        var errorEl = document.getElementById("loginError");
        var loadingEl = document.getElementById("loginLoading");
        var btn = document.querySelector("#login button");
        errorEl.textContent = "";
        loadingEl.classList.add("active");
        btn.disabled = true;
        btn.textContent = "Logging in...";
        try {
            var res = await fetch(API_BASE + "/api/admin/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email, password: password })
            });
            var data = await res.json();
            if (data.success) {
                token = data.token;
                localStorage.setItem("token", token);
                document.getElementById("login").style.display = "none";
                document.getElementById("dashboard").style.display = "block";
                await loadEmailSenders();
                loadStats();
                loadTickets();
            } else {
                errorEl.textContent = data.message || "Invalid credentials";
            }
        } catch (e) {
            errorEl.textContent = "Network error – please try again.";
        } finally {
            loadingEl.classList.remove("active");
            btn.disabled = false;
            btn.textContent = "Login";
        }
    }

    function logout() {
        token = null;
        localStorage.removeItem("token");
        document.getElementById("login").style.display = "block";
        document.getElementById("dashboard").style.display = "none";
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  LOAD EMAIL SENDERS (for reply from dropdown)
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function loadEmailSenders() {
        try {
            var res = await fetch(API_BASE + "/api/admin/email-addresses?active_only=true", {
                headers: { "Authorization": "Bearer " + token }
            });
            var data = await res.json();
            if (data.success) {
                emailSenders = data.addresses || [];
            }
        } catch (e) {
            console.error("Failed to load senders:", e);
        }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  LOAD STATS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function loadStats() {
        try {
            var res = await fetch(API_BASE + "/api/admin/stats", {
                headers: { "Authorization": "Bearer " + token }
            });
            if (res.status === 401) { logout(); return; }
            var data = await res.json();
            if (data.success) {
                var stats = data.stats;
                var html = "";
                var labels = { new: "New", open: "Open", in_progress: "In Progress", pending: "Pending", resolved: "Resolved", closed: "Closed" };
                for (var key in labels) {
                    if (stats.hasOwnProperty(key)) {
                        html += '<div class="stat-card"><div class="number">' + stats[key] + '</div><div class="label">' + labels[key] + '</div></div>';
                    }
                }
                document.getElementById("stats").innerHTML = html;
            }
        } catch (e) { console.error("Failed to load stats", e); }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  LOAD TICKETS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function loadTickets() {
        console.log("loadTickets called");
        var list = document.getElementById("ticketList");
        list.innerHTML = '<div class="loading">Loading...</div>';
        var category = document.getElementById("filterCategory").value;
        var status = document.getElementById("filterStatus").value;
        var sort = document.getElementById("filterSort").value;
        var url = API_BASE + "/api/admin/tickets";
        var params = [];
        if (category) params.push("category=" + encodeURIComponent(category));
        if (status) params.push("status=" + encodeURIComponent(status));
        if (sort) params.push("sort=" + encodeURIComponent(sort));
        if (params.length) url += "?" + params.join("&");
        try {
            var res = await fetch(url, {
                headers: { "Authorization": "Bearer " + token }
            });
            if (res.status === 401) { logout(); return; }
            var data = await res.json();
            if (data.success) {
                renderTickets(data.tickets);
            } else {
                list.innerHTML = '<div class="loading">Error loading tickets</div>';
            }
        } catch (e) {
            list.innerHTML = '<div class="loading">Error: ' + e.message + '</div>';
        }
    }

    function renderTickets(tickets) {
        var list = document.getElementById("ticketList");
        if (!tickets || tickets.length === 0) {
            list.innerHTML = '<div class="loading">No tickets found</div>';
            return;
        }
        var html = '<div class="ticket-header-row">' +
            '<span>SLA Status</span>' +
            '<span>Ticket #</span>' +
            '<span>Status</span>' +
            '<span>Subject</span>' +
            '<span>Requester Email</span>' +
            '<span>Last Updated</span>' +
            '</div>';
        for (var i = 0; i < tickets.length; i++) {
            var t = tickets[i];
            var statusClass = "status-" + t.status;
            var slaClass = getSlaClass(t);
            var slaLabel = getSlaLabel(t);
            var actionDate = t.last_action || t.created_at;
            var subjectText = t.subject || "No subject";
            var truncatedSubject = subjectText.length > 50 ? subjectText.substring(0, 50) + "…" : subjectText;
            html += '<div class="ticket-item" onclick="openTicketModal(' + t.id + ')">' +
                '<span class="sla-' + slaClass + '">' + slaLabel + '</span>' +
                '<span class="ticket-num">' + t.ticket_number + '</span>' +
                '<span class="status ' + statusClass + '">' + t.status + '</span>' +
                '<span class="subject" title="' + escapeHtml(subjectText) + '">' + escapeHtml(truncatedSubject) + '</span>' +
                '<span class="email">' + (t.sender_email || "") + '</span>' +
                '<span style="font-size:12px;color:var(--text-muted);">' + formatDate(actionDate) + '</span>' +
                '</div>';
        }
        list.innerHTML = html;
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  MODAL
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function openModal() {
        document.getElementById("ticketModal").classList.add("active");
        document.body.style.overflow = "hidden";
    }

    function closeModal() {
        document.getElementById("ticketModal").classList.remove("active");
        document.body.style.overflow = "";
    }

    document.getElementById("ticketModal").addEventListener("click", function(e) {
        if (e.target === this) { closeModal(); }
    });
    document.addEventListener("keydown", function(e) {
        if (e.key === "Escape") { closeModal(); }
    });

    async function openTicketModal(id) {
        openModal();
        var content = document.getElementById("modalContent");
        content.innerHTML = '<div class="loading">Loading...</div>';
        try {
            var res = await fetch(API_BASE + "/api/admin/ticket/" + id, {
                headers: { "Authorization": "Bearer " + token }
            });
            if (res.status === 401) { logout(); closeModal(); return; }
            var data = await res.json();
            if (data.success) {
                renderTicketDetailModal(data.ticket);
            } else {
                content.innerHTML = '<div class="loading">Error loading ticket</div>';
            }
        } catch (e) {
            content.innerHTML = '<div class="loading">Error: ' + e.message + '</div>';
        }
    }

    function renderTicketDetailModal(ticket) {
        var content = document.getElementById("modalContent");
        var commentsHtml = "";
        if (ticket.comments && ticket.comments.length > 0) {
            for (var i = 0; i < ticket.comments.length; i++) {
                var c = ticket.comments[i];
                commentsHtml += '<div class="comment"><div class="meta"><span>' + (c.author_email || "System") + '</span><span>' + formatDate(c.created_at) + '</span></div><div class="comment-content">' + c.content + '</div></div>';
            }
        }

        var statusOptions = ["new", "open", "in_progress", "pending", "resolved", "closed"];
        var statusDropdown = '<select id="detailStatus">';
        for (var i = 0; i < statusOptions.length; i++) {
            var s = statusOptions[i];
            statusDropdown += '<option value="' + s + '" ' + (s === ticket.status ? "selected" : "") + '>' + s + '</option>';
        }
        statusDropdown += '</select>';

        // Build sender dropdown from emailSenders
        var senderDropdown = '<select id="detailReplyFrom">';
        var hasDefault = false;
        if (emailSenders && emailSenders.length > 0) {
            for (var i = 0; i < emailSenders.length; i++) {
                var sender = emailSenders[i];
                var label = sender.label || sender.email;
                var selected = (sender.action === "support") ? "selected" : "";
                senderDropdown += '<option value="' + sender.email + '" ' + selected + '>' + label + ' (' + sender.email + ')</option>';
                if (sender.action === "support") hasDefault = true;
            }
        }
        if (!hasDefault) {
            senderDropdown += '<option value="support@dornori.com" selected>Support (support@dornori.com)</option>';
        }
        senderDropdown += '</select>';

        var actionDate = ticket.last_action || ticket.created_at;
        var slaStatusClass = "sla-" + (ticket.sla_status || "on_track");

        content.innerHTML = `
            <div class="detail-section">
                <h3>📋 Ticket Details</h3>
                <div class="ticket-meta-grid">
                    <div class="meta-item"><span class="meta-label">Ticket Number</span><span class="meta-value" style="font-family: monospace; color: var(--accent);">#${ticket.ticket_number}</span></div>
                    <div class="meta-item"><span class="meta-label">Status</span><span class="meta-value">${ticket.status.toUpperCase()}</span></div>
                    <div class="meta-item"><span class="meta-label">SLA Status</span><span class="meta-value ${slaStatusClass}">${(ticket.sla_status || "on_track").toUpperCase().replace("_", " ")}</span></div>
                    <div class="meta-item"><span class="meta-label">Category</span><span class="meta-value">${ticket.category || "Other"}</span></div>
                    <div class="meta-item"><span class="meta-label">From</span><span class="meta-value">${ticket.sender_email || "Unknown"}</span></div>
                    <div class="meta-item"><span class="meta-label">Created</span><span class="meta-value">${formatDate(ticket.created_at)}</span></div>
                </div>
            </div>
            <div class="detail-section">
                <h3>💬 Message</h3>
                <div class="ticket-body">${ticket.message || "No message"}</div>
            </div>
            <div class="detail-section comments-section">
                <h3>💭 Comments (${ticket.comments ? ticket.comments.length : 0})</h3>
                ${commentsHtml || '<div style="color:var(--text-muted);font-size:13px;">No comments yet</div>'}
            </div>
            <div class="detail-section action-section">
                <h4>✏️ Update Status</h4>
                ${statusDropdown}
                <div class="actions"><button class="btn-primary" onclick="updateStatus(${ticket.id})">Save Status</button></div>
            </div>
            <div class="detail-section action-section comment-input">
                <h4>📝 Add Comment</h4>
                <textarea id="detailComment" placeholder="Write an internal comment..."></textarea>
                <div class="actions"><button class="btn-primary" onclick="addComment(${ticket.id})">Add Comment</button></div>
            </div>
            <div class="detail-section action-section">
                <h4>✉️ Reply to Customer</h4>
                <label>From:</label>
                ${senderDropdown}
                <textarea id="detailReplyBody" placeholder="Write your reply to the customer..."></textarea>
                <div class="actions"><button class="btn-primary" onclick="sendReply(${ticket.id})">Send Reply</button></div>
            </div>
        `;
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  ACTIONS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function updateStatus(id) {
        var status = document.getElementById("detailStatus").value;
        try {
            var res = await fetch(API_BASE + "/api/admin/ticket/" + id + "/status", {
                method: "PUT",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
                body: JSON.stringify({ status: status })
            });
            if (res.status === 401) { logout(); closeModal(); return; }
            var data = await res.json();
            if (data.success) {
                openTicketModal(id);
                loadStats();
                loadTickets();
            } else {
                alert("Update failed");
            }
        } catch (e) {
            alert("Error: " + e.message);
        }
    }

    async function addComment(id) {
        var content = document.getElementById("detailComment").value;
        if (!content) return alert("Please enter a comment");
        try {
            var res = await fetch(API_BASE + "/api/admin/ticket/" + id + "/comment", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
                body: JSON.stringify({ content: content, type: "internal" })
            });
            if (res.status === 401) { logout(); closeModal(); return; }
            var data = await res.json();
            if (data.success) {
                document.getElementById("detailComment").value = "";
                openTicketModal(id);
                loadStats();
                loadTickets();
            } else {
                alert("Failed to add comment");
            }
        } catch (e) {
            alert("Error: " + e.message);
        }
    }

    async function sendReply(id) {
        var from = document.getElementById("detailReplyFrom").value;
        var body = document.getElementById("detailReplyBody").value;
        if (!body) return alert("Please enter a reply");
        try {
            var res = await fetch(API_BASE + "/api/admin/ticket/" + id + "/reply", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
                body: JSON.stringify({ from: from, body: body })
            });
            if (res.status === 401) { logout(); closeModal(); return; }
            var data = await res.json();
            if (data.success) {
                document.getElementById("detailReplyBody").value = "";
                alert("Reply sent!");
                openTicketModal(id);
                loadStats();
                loadTickets();
            } else {
                alert("Failed to send reply");
            }
        } catch (e) {
            alert("Error: " + e.message);
        }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  INIT – auto login if token exists
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    if (localStorage.getItem("token")) {
        token = localStorage.getItem("token");
        document.getElementById("login").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        loadEmailSenders();
        loadStats();
        loadTickets();
    }
</script>
</body>
</html>
