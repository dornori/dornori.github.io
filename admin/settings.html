<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings – Dornori</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
    <div class="header">
        <h1>⚙️ Settings</h1>
        <div class="header-right">
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
            <a href="dashboard.html">← Dashboard</a>
            <a href="reports.html">📊 Reports</a>
        </div>
    </div>

    <div class="tabs-container" id="tabsContainer"></div>
    <div id="settingsContent"><div class="loading">Loading...</div></div>

    <div id="saveMessage" class="saved">✅ Saved!</div>
    <div id="errorMessage" class="error">❌ Failed</div>
</div>

<script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // CONFIG
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const API_BASE = 'https://dornori-ticketing.dornori-info.workers.dev';

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // THEME
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        document.querySelectorAll('.theme-toggle').forEach(t => t.textContent = theme === 'dark' ? '☀️' : '🌙');
    }
    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        setTheme(current === 'light' ? 'dark' : 'light');
    }
    setTheme(localStorage.getItem('theme') || 'light');

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // AUTH
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = '/admin'; }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // HELPERS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function apiFetch(url, opts = {}) {
        opts.headers = opts.headers || {};
        opts.headers['Authorization'] = 'Bearer ' + token;
        opts.headers['Content-Type'] = 'application/json';
        const res = await fetch(API_BASE + url, opts);
        if (res.status === 401) {
            localStorage.removeItem('token');
            window.location.href = '/admin';
            throw new Error('Unauthorized');
        }
        return res;
    }

    function showSaveMessage(msg, isError = false) {
        const saveMsg = document.getElementById('saveMessage');
        const errMsg = document.getElementById('errorMessage');
        saveMsg.classList.remove('show');
        errMsg.classList.remove('show');
        if (isError) {
            errMsg.textContent = msg;
            errMsg.classList.add('show');
        } else {
            saveMsg.textContent = msg;
            saveMsg.classList.add('show');
        }
        setTimeout(() => {
            saveMsg.classList.remove('show');
            errMsg.classList.remove('show');
        }, 4000);
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // LOAD DATA
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    let settings = [];
    let emailAddresses = [];
    let allCategories = ['support', 'newsletter', 'payment', 'other'];

    async function loadAllData() {
        const content = document.getElementById('settingsContent');
        content.innerHTML = '<div class="loading">Loading...</div>';

        try {
            const [settingsRes, emailsRes] = await Promise.all([
                apiFetch('/api/admin/settings'),
                apiFetch('/api/admin/email-addresses')
            ]);

            const settingsData = await settingsRes.json();
            const emailsData = await emailsRes.json();

            if (!settingsData.success || !emailsData.success) {
                content.innerHTML = '<div class="loading">Error loading data</div>';
                return;
            }

            settings = settingsData.settings || [];
            emailAddresses = emailsData.addresses || [];

            // Build category list
            const catSet = new Set(['support', 'newsletter', 'payment', 'other']);
            settings.forEach(s => {
                if (s.category === 'category' && s.key.endsWith('_description')) {
                    catSet.add(s.key.replace('_description', ''));
                }
            });
            allCategories = Array.from(catSet);

            render();
        } catch (e) {
            content.innerHTML = '<div class="loading">Error: ' + e.message + '</div>';
            console.error('Load error:', e);
        }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // GET SETTING HELPER
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function getSetting(cat, key, def) {
        const found = settings.find(s => s.category === cat && s.key === key);
        return found ? found.value : def;
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // RENDER
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function render() {
        const content = document.getElementById('settingsContent');
        const tabsContainer = document.getElementById('tabsContainer');

        const tabs = [
            { id: 'general', label: '⚙️ General' },
            { id: 'sla', label: '⏱️ SLA' },
            { id: 'email_routing', label: '📤 Email Routing' },
            { id: 'auto_reply', label: '🤖 Auto-Reply' },
            { id: 'categories', label: '📂 Categories' }
        ];

        // ── Tabs ──
        let tabsHtml = '';
        tabs.forEach((tab, i) => {
            tabsHtml += `<button class="tab-button ${i === 0 ? 'active' : ''}" data-tab="${tab.id}">${tab.label}</button>`;
        });
        tabsContainer.innerHTML = tabsHtml;

        tabsContainer.querySelectorAll('.tab-button').forEach(btn => {
            btn.addEventListener('click', function() {
                switchTab(this.getAttribute('data-tab'));
            });
        });

        // ── General ──
        const timezone = getSetting('general', 'timezone', 'UTC');
        let sectionsHtml = `<div class="settings-section active" id="tab-general">
            <h2>⚙️ General</h2>
            <div class="setting-row">
                <label>Timezone</label>
                <select id="timezoneInput" data-category="general" data-key="timezone">
                    ${['UTC','Europe/Vienna','Europe/London','Europe/Paris','Europe/Berlin','America/New_York','America/Los_Angeles','America/Chicago','Asia/Dubai','Asia/Singapore','Asia/Tokyo','Australia/Sydney','Pacific/Auckland'].map(t => `<option value="${t}" ${t === timezone ? 'selected' : ''}>${t}</option>`).join('')}
                </select>
            </div>
            <div class="actions"><button class="btn-primary" onclick="saveTab('general')">💾 Save</button></div>
        </div>`;

        // ── SLA ──
        let slaHtml = `<div class="settings-section" id="tab-sla"><h2>⏱️ SLA Rules</h2>`;
        allCategories.forEach(cat => {
            const resp = getSetting('sla', cat + '_response', '24');
            const res = getSetting('sla', cat + '_resolution', '72');
            slaHtml += `<div class="card"><h4>${cat.charAt(0).toUpperCase() + cat.slice(1)}</h4>
                <div class="setting-row"><label>Response (hours)</label><input type="number" id="sla_${cat}_response" value="${resp}" data-category="sla" data-key="${cat}_response" /></div>
                <div class="setting-row"><label>Resolution (hours)</label><input type="number" id="sla_${cat}_resolution" value="${res}" data-category="sla" data-key="${cat}_resolution" /></div>
            </div>`;
        });
        slaHtml += `<div class="actions"><button class="btn-primary" onclick="saveTab('sla')">💾 Save</button></div></div>`;
        sectionsHtml += slaHtml;

        // ── Email Routing ──
        let emailHtml = `<div class="settings-section" id="tab-email_routing"><h2>📤 Email Routing</h2>
            <div id="emailRoutingList">`;
        if (emailAddresses.length === 0) {
            emailHtml += '<div class="loading">No addresses.</div>';
        } else {
            emailAddresses.forEach(addr => {
                emailHtml += `<div class="email-row" data-id="${addr.id}">
                    <span class="email">${addr.email}</span>
                    <select class="category-select" data-id="${addr.id}" onchange="updateEmailCategory(${addr.id}, this.value)">
                        ${allCategories.map(c => `<option value="${c}" ${c === addr.action ? 'selected' : ''}>${c}</option>`).join('')}
                        <option value="custom" ${!allCategories.includes(addr.action) ? 'selected' : ''}>Custom</option>
                    </select>
                    <div class="actions"><button class="btn-edit-sm" onclick="editEmail(${addr.id})">✏️</button><button class="btn-danger-sm" onclick="deleteEmail(${addr.id})">🗑️</button></div>
                </div>`;
            });
        }
        emailHtml += `</div>
            <div class="row" style="margin-top:16px;">
                <input type="email" id="newEmailInput" placeholder="new@domain.com" style="flex:2;" />
                <select id="newEmailCategory">${allCategories.map(c => `<option value="${c}">${c}</option>`).join('')}<option value="custom">Custom</option></select>
                <button class="btn-add" onclick="addEmail()">➕ Add</button>
            </div>
            <div class="actions" style="margin-top:20px;"><button class="btn-primary" onclick="saveTab('email_routing')">💾 Save Email Routing</button></div>
        </div>`;
        sectionsHtml += emailHtml;

        // ── Auto-Reply ──
        let autoHtml = `<div class="settings-section" id="tab-auto_reply"><h2>🤖 Auto-Reply</h2>`;
        allCategories.forEach(cat => {
            const enabled = getSetting('auto_reply', cat + '_enabled', '0') === '1';
            const delay = getSetting('auto_reply', cat + '_delay', '5');
            const subject = getSetting('auto_reply', cat + '_subject', `[Ticket {{ticket_id}}] Your ${cat} inquiry`);
            const body = getSetting('auto_reply', cat + '_body', `Thank you for your ${cat} inquiry. We will respond shortly.`);
            autoHtml += `<div class="category-card">
                <div class="header">
                    <h3>${cat.charAt(0).toUpperCase() + cat.slice(1)}</h3>
                    <div class="toggle-wrap">
                        <input type="checkbox" id="auto_${cat}_enabled" ${enabled ? 'checked' : ''} data-category="auto_reply" data-key="${cat}_enabled" />
                        <label for="auto_${cat}_enabled">Enable</label>
                    </div>
                </div>
                <div class="body">
                    <div class="field"><label>Delay (min)</label><input type="number" id="auto_${cat}_delay" value="${delay}" data-category="auto_reply" data-key="${cat}_delay" /></div>
                    <div class="field"><label>Subject</label><input type="text" id="auto_${cat}_subject" value="${subject}" data-category="auto_reply" data-key="${cat}_subject" /></div>
                </div>
                <div class="auto-reply-fields">
                    <div class="field" style="grid-column:1/-1;"><label>Body</label><textarea id="auto_${cat}_body" rows="3" data-category="auto_reply" data-key="${cat}_body">${body}</textarea></div>
                </div>
            </div>`;
        });
        autoHtml += `<div class="actions"><button class="btn-primary" onclick="saveTab('auto_reply')">💾 Save</button></div></div>`;
        sectionsHtml += autoHtml;

        // ── Categories ──
        let catHtml = `<div class="settings-section" id="tab-categories"><h2>📂 Categories</h2>
            <div class="table-wrap"><table><thead><tr><th>Category</th><th>Description</th><th>Assigned Email</th><th>Color</th></tr></thead><tbody>`;
        allCategories.forEach(cat => {
            const desc = getSetting('category', cat + '_description', cat + ' inquiries');
            const color = getSetting('category', cat + '_color', '#00ff9d');
            const assigned = getSetting('category', cat + '_assigned_email', '');
            catHtml += `<tr>
                <td><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${color};margin-right:8px;"></span>${cat}</td>
                <td><input type="text" class="cat-desc" data-category="${cat}" value="${desc}" style="width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:4px;padding:4px 8px;color:var(--text);" /></td>
                <td><select class="cat-assigned" data-category="${cat}" style="width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:4px;padding:4px 8px;color:var(--text);">
                    <option value="">None</option>
                    ${emailAddresses.map(a => `<option value="${a.email}" ${a.email === assigned ? 'selected' : ''}>${a.email}</option>`).join('')}
                </select></td>
                <td><input type="color" class="cat-color" data-category="${cat}" value="${color}" style="width:50px;height:30px;padding:0;border:none;background:transparent;cursor:pointer;" /></td>
            </tr>`;
        });
        catHtml += `</tbody></table></div>
            <div style="margin-top:20px;">
                <button class="btn-primary" onclick="addCategory()">➕ Add Category</button>
                <button class="btn-primary" onclick="saveTab('categories')" style="margin-left:10px;">💾 Save</button>
            </div>
        </div>`;
        sectionsHtml += catHtml;

        content.innerHTML = sectionsHtml;
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // TAB SWITCH
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function switchTab(tabId) {
        document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.settings-section').forEach(s => s.classList.remove('active'));
        const btn = document.querySelector(`.tab-button[data-tab="${tabId}"]`);
        if (btn) btn.classList.add('active');
        const sec = document.getElementById('tab-' + tabId);
        if (sec) sec.classList.add('active');
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // SAVE TAB
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function saveTab(tabId) {
        const updates = [];
        const section = document.getElementById('tab-' + tabId);
        if (!section) return;

        // Collect all inputs with data-category and data-key
        section.querySelectorAll('[data-category][data-key]').forEach(el => {
            let value = el.value;
            if (el.type === 'checkbox') value = el.checked ? '1' : '0';
            updates.push({ category: el.dataset.category, key: el.dataset.key, value });
        });

        // For categories tab, also include description, assigned, color
        if (tabId === 'categories') {
            section.querySelectorAll('.cat-desc').forEach(el => {
                updates.push({ category: 'category', key: el.dataset.category + '_description', value: el.value });
            });
            section.querySelectorAll('.cat-assigned').forEach(el => {
                updates.push({ category: 'category', key: el.dataset.category + '_assigned_email', value: el.value });
            });
            section.querySelectorAll('.cat-color').forEach(el => {
                updates.push({ category: 'category', key: el.dataset.category + '_color', value: el.value });
            });
        }

        if (updates.length === 0) {
            showSaveMessage('No settings to save', true);
            return;
        }

        console.log('📤 Saving:', updates);

        try {
            const res = await apiFetch('/api/admin/settings', {
                method: 'PUT',
                body: JSON.stringify({ settings: updates })
            });
            const data = await res.json();
            console.log('📥 Response:', data);

            if (data.success) {
                showSaveMessage(`✅ ${tabId} saved! (${updates.length} items)`);
                // Reload to refresh data
                await loadAllData();
            } else {
                showSaveMessage('❌ ' + (data.error || 'Unknown error'), true);
            }
        } catch (e) {
            showSaveMessage('❌ ' + e.message, true);
        }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // EMAIL ROUTING ACTIONS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function updateEmailCategory(id, category) {
        const addr = emailAddresses.find(a => a.id === id);
        if (!addr) return;
        try {
            const res = await apiFetch('/api/admin/email-addresses/' + id, {
                method: 'PUT',
                body: JSON.stringify({ email: addr.email, label: category, action: category, is_active: 1 })
            });
            const data = await res.json();
            if (data.success) {
                showSaveMessage('✅ Email category updated');
                addr.action = category;
            } else {
                showSaveMessage('❌ Failed to update', true);
            }
        } catch (e) { showSaveMessage('❌ ' + e.message, true); }
    }

    async function addEmail() {
        const email = document.getElementById('newEmailInput').value.trim();
        const category = document.getElementById('newEmailCategory').value;
        if (!email) { alert('Enter email'); return; }
        try {
            const res = await apiFetch('/api/admin/email-addresses', {
                method: 'POST',
                body: JSON.stringify({ email, label: category, action: category })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('newEmailInput').value = '';
                loadAllData();
                showSaveMessage('✅ Email added');
            } else {
                alert('Failed: ' + (data.error || ''));
            }
        } catch (e) { alert('Error: ' + e.message); }
    }

    async function editEmail(id) {
        const addr = emailAddresses.find(a => a.id === id);
        if (!addr) return;
        const newEmail = prompt('Edit email:', addr.email);
        if (newEmail === null) return;
        const newAction = prompt('Category:', addr.action);
        if (newAction === null) return;
        try {
            const res = await apiFetch('/api/admin/email-addresses/' + id, {
                method: 'PUT',
                body: JSON.stringify({ email: newEmail, label: newAction, action: newAction, is_active: 1 })
            });
            const data = await res.json();
            if (data.success) { loadAllData(); showSaveMessage('✅ Updated'); }
            else { alert('Failed'); }
        } catch (e) { alert('Error: ' + e.message); }
    }

    async function deleteEmail(id) {
        if (!confirm('Delete?')) return;
        try {
            const res = await apiFetch('/api/admin/email-addresses/' + id, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) { loadAllData(); showSaveMessage('✅ Deleted'); }
            else { alert('Failed'); }
        } catch (e) { alert('Error: ' + e.message); }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // CATEGORY ACTIONS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function addCategory() {
        const name = prompt('New category name:');
        if (!name) return;
        const desc = prompt('Description:', name + ' inquiries');
        const color = prompt('Color (hex):', '#00ff9d');
        const updates = [
            { category: 'category', key: name + '_description', value: desc || name + ' inquiries' },
            { category: 'category', key: name + '_color', value: color || '#00ff9d' },
            { category: 'category', key: name + '_assigned_email', value: '' },
            { category: 'sla', key: name + '_response', value: '24' },
            { category: 'sla', key: name + '_resolution', value: '72' },
            { category: 'auto_reply', key: name + '_enabled', value: '0' },
            { category: 'auto_reply', key: name + '_delay', value: '5' },
            { category: 'auto_reply', key: name + '_subject', value: `[Ticket {{ticket_id}}] Your ${name} inquiry` },
            { category: 'auto_reply', key: name + '_body', value: `Thank you for your ${name} inquiry.` }
        ];
        apiFetch('/api/admin/settings', {
            method: 'PUT',
            body: JSON.stringify({ settings: updates })
        }).then(r => r.json()).then(data => {
            if (data.success) { loadAllData(); showSaveMessage(`✅ "${name}" added`); }
            else { alert('Failed'); }
        }).catch(e => alert('Error: ' + e.message));
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // INIT
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    loadAllData();

    // ── Add a "Save All" button ──
    window.addEventListener('load', function() {
        const container = document.querySelector('.container');
        const btn = document.createElement('div');
        btn.style.margin = '20px 0';
        btn.innerHTML = `<button class="btn-primary" onclick="saveAll()" style="width:100%;padding:14px;font-size:16px;">💾 Save All Settings</button>`;
        const content = document.getElementById('settingsContent');
        if (content && content.parentNode) {
            content.parentNode.insertBefore(btn, content.nextSibling);
        }
    });

    // ── Save All ──
    async function saveAll() {
        const updates = [];
        document.querySelectorAll('[data-category][data-key]').forEach(el => {
            let value = el.value;
            if (el.type === 'checkbox') value = el.checked ? '1' : '0';
            updates.push({ category: el.dataset.category, key: el.dataset.key, value });
        });
        document.querySelectorAll('.cat-desc').forEach(el => {
            updates.push({ category: 'category', key: el.dataset.category + '_description', value: el.value });
        });
        document.querySelectorAll('.cat-assigned').forEach(el => {
            updates.push({ category: 'category', key: el.dataset.category + '_assigned_email', value: el.value });
        });
        document.querySelectorAll('.cat-color').forEach(el => {
            updates.push({ category: 'category', key: el.dataset.category + '_color', value: el.value });
        });

        if (updates.length === 0) { showSaveMessage('No settings to save', true); return; }

        try {
            const res = await apiFetch('/api/admin/settings', {
                method: 'PUT',
                body: JSON.stringify({ settings: updates })
            });
            const data = await res.json();
            if (data.success) {
                showSaveMessage(`✅ All settings saved! (${updates.length} items)`);
                await loadAllData();
            } else {
                showSaveMessage('❌ ' + (data.error || 'Unknown error'), true);
            }
        } catch (e) {
            showSaveMessage('❌ ' + e.message, true);
        }
    }
</script>
</body>
</html>
