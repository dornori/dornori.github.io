<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings – Dornori</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
    <div class="header">
        <h1>⚙️ Settings</h1>
        <div class="header-right">
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
            <a href="dashboard.html">← Dashboard</a>
            <a href="reports.html">📊 Reports</a>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs-container" id="tabsContainer"></div>

    <!-- Settings content -->
    <div id="settingsContent"><div class="loading">Loading configuration...</div></div>

    <!-- Messages -->
    <div id="saveMessage" class="saved">✅ Settings saved successfully!</div>
    <div id="errorMessage" class="error">❌ Failed to save settings</div>
</div>

<script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  CONFIG
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const API_BASE = 'https://dornori-ticketing.dornori-info.workers.dev';

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  THEME TOGGLE
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        const toggles = document.querySelectorAll('.theme-toggle');
        toggles.forEach(t => t.textContent = theme === 'dark' ? '☀️' : '🌙');
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        setTheme(current === 'light' ? 'dark' : 'light');
    }

    const savedTheme = localStorage.getItem('theme') || 'light';
    setTheme(savedTheme);

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  AUTH CHECK
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    var token = localStorage.getItem("token");
    if (!token) { window.location.href = "/admin"; }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  HELPERS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    async function apiFetch(url, opts) {
        opts = opts || {};
        opts.headers = opts.headers || {};
        opts.headers["Authorization"] = "Bearer " + token;
        opts.headers["Content-Type"] = "application/json";
        var res = await fetch(API_BASE + url, opts);
        if (res.status === 401) {
            localStorage.removeItem("token");
            window.location.href = "/admin";
            throw new Error("Unauthorized");
        }
        return res;
    }

    function showSaveMessage(msg, isError) {
        const saveMsg = document.getElementById('saveMessage');
        const errMsg = document.getElementById('errorMessage');
        saveMsg.classList.remove('show');
        errMsg.classList.remove('show');
        if (isError) {
            errMsg.textContent = msg || '❌ Failed to save settings';
            errMsg.classList.add('show');
        } else {
            saveMsg.textContent = msg || '✅ Settings saved successfully!';
            saveMsg.classList.add('show');
        }
        setTimeout(() => {
            saveMsg.classList.remove('show');
            errMsg.classList.remove('show');
        }, 4000);
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  CATEGORY DEFINITIONS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const DEFAULT_CATEGORIES = ['support', 'newsletter', 'payment', 'other'];
    let allCategories = [];

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  LOAD ALL DATA
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    let emailAddresses = [];
    let settings = [];

    async function loadAllData() {
        const content = document.getElementById('settingsContent');
        content.innerHTML = '<div class="loading">Loading configuration...</div>';

        try {
            const [settingsRes, emailsRes] = await Promise.all([
                apiFetch('/api/admin/settings'),
                apiFetch('/api/admin/email-addresses')
            ]);

            const settingsData = await settingsRes.json();
            const emailsData = await emailsRes.json();

            if (!settingsData.success || !emailsData.success) {
                content.innerHTML = '<div class="loading">Error loading data</div>';
                return;
            }

            settings = settingsData.settings || [];
            emailAddresses = emailsData.addresses || [];

            // Build category list from settings (including custom ones)
            const catSet = new Set(DEFAULT_CATEGORIES);
            settings.forEach(s => {
                if (s.category === 'category' && s.key.endsWith('_description')) {
                    const catName = s.key.replace('_description', '');
                    catSet.add(catName);
                }
            });
            allCategories = Array.from(catSet);

            renderConfiguration();
        } catch (e) {
            document.getElementById('settingsContent').innerHTML = '<div class="loading">Error: ' + e.message + '</div>';
        }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  GET SETTING HELPER
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function getSetting(category, key, def) {
        const found = settings.find(s => s.category === category && s.key === key);
        return found ? found.value : def;
    }

    function getCategoryDescription(cat) {
        return getSetting('category', cat + '_description', cat.charAt(0).toUpperCase() + cat.slice(1) + ' inquiries');
    }

    function getCategoryColor(cat) {
        return getSetting('category', cat + '_color', '#00ff9d');
    }

    function getCategoryAssignedEmail(cat) {
        return getSetting('category', cat + '_assigned_email', '');
    }

    function getAutoReplyEnabled(cat) {
        return getSetting('auto_reply', cat + '_enabled', '0') === '1';
    }

    function getAutoReplyDelay(cat) {
        return getSetting('auto_reply', cat + '_delay', '5');
    }

    function getAutoReplySubject(cat) {
        return getSetting('auto_reply', cat + '_subject', `[Ticket {{ticket_id}}] Your ${cat} inquiry`);
    }

    function getAutoReplyBody(cat) {
        return getSetting('auto_reply', cat + '_body', `Dear customer,\n\nThank you for your ${cat} inquiry. We have created ticket {{ticket_id}} and will respond within {{response_time}} hours.\n\nBest regards,\nDornori Support`);
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  RENDER TABS & SECTIONS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function renderConfiguration() {
        const content = document.getElementById('settingsContent');
        const tabsContainer = document.getElementById('tabsContainer');

        // ── Define tabs ──
        const tabs = [
            { id: 'general', label: '⚙️ General' },
            { id: 'sla', label: '⏱️ SLA Rules' },
            { id: 'color', label: '🎨 Color Profile' },
            { id: 'email_routing', label: '📤 Email Routing' },
            { id: 'auto_reply', label: '🤖 Auto-Reply' },
            { id: 'category_mgmt', label: '📂 Category Management' }
        ];

        // ── Build tabs ──
        let tabsHtml = '';
        tabs.forEach((tab, index) => {
            const active = index === 0 ? 'active' : '';
            tabsHtml += `<button class="tab-button ${active}" data-tab="${tab.id}">${tab.label}</button>`;
        });
        tabsContainer.innerHTML = tabsHtml;

        // ── Tab click handler ──
        tabsContainer.querySelectorAll('.tab-button').forEach(btn => {
            btn.addEventListener('click', function() {
                const tabId = this.getAttribute('data-tab');
                switchTab(tabId);
            });
        });

        // ── Build sections ──
        let sectionsHtml = '';

        // 1. GENERAL
        const timezones = ["UTC", "Europe/Vienna", "Europe/London", "Europe/Paris", "Europe/Berlin",
            "America/New_York", "America/Los_Angeles", "America/Chicago", "Asia/Dubai", "Asia/Singapore",
            "Asia/Tokyo", "Australia/Sydney", "Pacific/Auckland"];
        let generalHtml = `<div class="settings-section active" id="tab-general">
            <h2>⚙️ General Settings</h2>
            <p class="intro-text">Configure basic system settings.</p>`;
        const tzVal = getSetting('general', 'timezone', 'UTC');
        const tzOptions = timezones.map(t => `<option value="${t}" ${t === tzVal ? 'selected' : ''}>${t}</option>`).join('');
        generalHtml += `<div class="setting-row">
            <label for="timezoneInput">Timezone</label>
            <select id="timezoneInput" data-category="general" data-key="timezone">${tzOptions}</select>
            <span class="description">System timezone for all date displays.</span>
        </div>`;
        generalHtml += `<div class="actions" style="margin-top:20px;">
            <button class="btn-primary" onclick="saveGeneralSettings()">💾 Save General Settings</button>
        </div>`;
        generalHtml += `</div>`;
        sectionsHtml += generalHtml;

        // 2. SLA RULES
        let slaHtml = `<div class="settings-section" id="tab-sla">
            <h2>⏱️ SLA Rules</h2>
            <p class="intro-text">Set response and resolution times (in hours) for each ticket category.</p>`;
        allCategories.forEach(cat => {
            const respVal = getSetting('sla', cat + '_response', '24');
            const resVal = getSetting('sla', cat + '_resolution', '72');
            slaHtml += `<div class="card">
                <h4>${cat.charAt(0).toUpperCase() + cat.slice(1)}</h4>
                <div class="setting-row">
                    <label for="sla_${cat}_response">Response Time (hours)</label>
                    <input type="number" id="sla_${cat}_response" value="${respVal}" data-category="sla" data-key="${cat}_response" />
                </div>
                <div class="setting-row">
                    <label for="sla_${cat}_resolution">Resolution Time (hours)</label>
                    <input type="number" id="sla_${cat}_resolution" value="${resVal}" data-category="sla" data-key="${cat}_resolution" />
                </div>
            </div>`;
        });
        slaHtml += `<div class="actions" style="margin-top:20px;">
            <button class="btn-primary" onclick="saveSlaSettings()">💾 Save SLA Settings</button>
        </div>`;
        slaHtml += `</div>`;
        sectionsHtml += slaHtml;

        // 3. COLOR PROFILE
        const modeVal = getSetting('theme', 'mode', 'dark');
        const accentVal = getSetting('theme', 'accent', '#00ff9d');
        let colorHtml = `<div class="settings-section" id="tab-color">
            <h2>🎨 Color Profile</h2>
            <p class="intro-text">Customise the look and feel of the dashboard.</p>
            <div class="setting-row">
                <label>Theme Mode</label>
                <select id="themeMode" data-category="theme" data-key="mode">
                    <option value="dark" ${modeVal === 'dark' ? 'selected' : ''}>Dark</option>
                    <option value="light" ${modeVal === 'light' ? 'selected' : ''}>Light</option>
                </select>
            </div>
            <div class="setting-row">
                <label>Accent Color</label>
                <input type="color" id="themeAccent" data-category="theme" data-key="accent" value="${accentVal}" />
            </div>
            <div class="card">
                <h4>Preview</h4>
                <div style="display:flex;gap:10px;flex-wrap:wrap;">
                    <button class="btn-primary" style="background:var(--accent);color:var(--text-inverse);">Primary</button>
                    <button class="btn-secondary">Secondary</button>
                    <span style="background:var(--accent);color:var(--text-inverse);padding:4px 12px;border-radius:4px;">Badge</span>
                </div>
            </div>
            <div class="actions" style="margin-top:20px;">
                <button class="btn-primary" onclick="saveColorSettings()">💾 Save Color Settings</button>
            </div>
        </div>`;
        sectionsHtml += colorHtml;

        // 4. EMAIL ROUTING
        let emailRoutingHtml = `<div class="settings-section" id="tab-email_routing">
            <h2>📤 Email Routing</h2>
            <p class="intro-text">Map email addresses to ticket categories. Changes are saved automatically when you change the category dropdown.</p>
            <div id="emailRoutingList">`;
        if (emailAddresses.length === 0) {
            emailRoutingHtml += '<div class="loading" style="padding:10px;">No email addresses configured.</div>';
        } else {
            emailAddresses.forEach(addr => {
                const action = addr.action || 'support';
                const selectedCat = allCategories.includes(action) ? action : 'custom';
                emailRoutingHtml += `<div class="email-row" data-id="${addr.id}">
                    <span class="email">${escapeHtml(addr.email)}</span>
                    <select class="category-select" data-id="${addr.id}" onchange="saveEmailCategory(${addr.id}, this.value)">
                        ${allCategories.map(c => `<option value="${c}" ${c === selectedCat ? 'selected' : ''}>${c.charAt(0).toUpperCase() + c.slice(1)}</option>`).join('')}
                        <option value="custom" ${!allCategories.includes(selectedCat) ? 'selected' : ''}>Custom</option>
                    </select>
                    <div class="actions">
                        <button class="btn-edit-sm" onclick="editEmailAddress(${addr.id})">✏️</button>
                        <button class="btn-danger-sm" onclick="deleteEmailAddress(${addr.id})">🗑️</button>
                    </div>
                </div>`;
            });
        }
        emailRoutingHtml += `</div>
            <div class="row" style="margin-top:16px;">
                <input type="email" id="newEmailInput" placeholder="new@domain.com" style="flex:2; min-width:200px;" />
                <select id="newEmailCategory" style="flex:1; min-width:120px;">
                    ${allCategories.map(c => `<option value="${c}">${c.charAt(0).toUpperCase() + c.slice(1)}</option>`).join('')}
                    <option value="custom">Custom</option>
                </select>
                <button class="btn-add" onclick="addEmailAddress()">➕ Add</button>
            </div>
        </div>`;
        sectionsHtml += emailRoutingHtml;

        // 5. AUTO-REPLY TEMPLATES
        let autoReplyHtml = `<div class="settings-section" id="tab-auto_reply">
            <h2>🤖 Auto-Reply Templates</h2>
            <p class="intro-text">Configure automatic replies per category. Placeholders: <code>{ticket_id}</code>, <code>{category}</code>, <code>{customer_email}</code>, <code>{response_time}</code>.</p>`;
        allCategories.forEach(cat => {
            const enabled = getAutoReplyEnabled(cat);
            const delay = getAutoReplyDelay(cat);
            const subject = getAutoReplySubject(cat);
            const body = getAutoReplyBody(cat);
            autoReplyHtml += `<div class="category-card" data-category="${cat}">
                <div class="header">
                    <h3><span class="color-dot" style="background:${getCategoryColor(cat)};"></span> ${cat.charAt(0).toUpperCase() + cat.slice(1)}</h3>
                    <div class="toggle-wrap">
                        <input type="checkbox" id="auto_${cat}_enabled" ${enabled ? 'checked' : ''} data-category="auto_reply" data-key="${cat}_enabled" />
                        <label for="auto_${cat}_enabled">Enable auto-reply</label>
                    </div>
                </div>
                <div class="body">
                    <div class="field">
                        <label>Delay (minutes)</label>
                        <input type="number" id="auto_${cat}_delay" value="${delay}" min="0" step="1" data-category="auto_reply" data-key="${cat}_delay" />
                    </div>
                    <div class="field">
                        <label>Subject line</label>
                        <input type="text" id="auto_${cat}_subject" value="${escapeHtml(subject)}" data-category="auto_reply" data-key="${cat}_subject" />
                    </div>
                </div>
                <div class="auto-reply-fields">
                    <div class="field" style="grid-column: 1 / -1;">
                        <label>Message body</label>
                        <textarea id="auto_${cat}_body" rows="4" data-category="auto_reply" data-key="${cat}_body">${escapeHtml(body)}</textarea>
                        <span class="description">Placeholders: {ticket_id}, {category}, {customer_email}, {response_time}</span>
                    </div>
                </div>
            </div>`;
        });
        autoReplyHtml += `<div class="actions" style="margin-top:20px;">
            <button class="btn-primary" onclick="saveAutoReplyTemplates()">💾 Save Auto-Reply Settings</button>
        </div></div>`;
        sectionsHtml += autoReplyHtml;

        // 6. CATEGORY MANAGEMENT
        let categoryMgmtHtml = `<div class="settings-section" id="tab-category_mgmt">
            <h2>📂 Category Management</h2>
            <p class="intro-text">Configure display names, colours, and assigned email addresses for each category.</p>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Category</th><th>Description</th><th>Assigned Email(s)</th><th>Color</th><th>Actions</th></tr></thead>
                    <tbody>`;
        allCategories.forEach(cat => {
            const desc = getCategoryDescription(cat);
            const color = getCategoryColor(cat);
            const assigned = getCategoryAssignedEmail(cat);
            categoryMgmtHtml += `<tr data-category="${cat}">
                <td><span class="color-dot" style="background:${color};display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;"></span>${cat.charAt(0).toUpperCase() + cat.slice(1)}</td>
                <td><input type="text" class="cat-desc" data-category="${cat}" value="${escapeHtml(desc)}" style="width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:4px;padding:4px 8px;color:var(--text);" /></td>
                <td>
                    <select class="cat-assigned" data-category="${cat}" style="width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:4px;padding:4px 8px;color:var(--text);">
                        <option value="">None</option>
                        ${emailAddresses.map(addr => `<option value="${escapeHtml(addr.email)}" ${addr.email === assigned ? 'selected' : ''}>${escapeHtml(addr.email)}</option>`).join('')}
                    </select>
                </td>
                <td><input type="color" class="cat-color" data-category="${cat}" value="${color}" style="width:60px;height:32px;padding:0;border:none;background:transparent;cursor:pointer;" /></td>
                <td>
                    <button class="btn-danger-sm" onclick="deleteCategory('${cat}')">🗑️</button>
                </td>
            </tr>`;
        });
        categoryMgmtHtml += `</tbody></table></div>
            <div style="margin-top:20px;">
                <button class="btn-primary" onclick="openAddCategoryModal()">➕ Add New Category</button>
                <button class="btn-primary" onclick="saveCategorySettings()" style="margin-left:10px;">💾 Save Category Settings</button>
            </div>
        </div>`;
        sectionsHtml += categoryMgmtHtml;

        // ── Inject sections ──
        content.innerHTML = sectionsHtml;
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  SWITCH TAB
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function switchTab(tabId) {
        const buttons = document.querySelectorAll('.tab-button');
        const sections = document.querySelectorAll('.settings-section');
        buttons.forEach(btn => btn.classList.remove('active'));
        sections.forEach(sec => sec.classList.remove('active'));
        const targetBtn = document.querySelector(`.tab-button[data-tab="${tabId}"]`);
        if (targetBtn) targetBtn.classList.add('active');
        const targetSection = document.getElementById('tab-' + tabId);
        if (targetSection) targetSection.classList.add('active');
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  EMAIL ROUTING ACTIONS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function saveEmailCategory(id, category) {
        try {
            const addr = emailAddresses.find(a => a.id === id);
            if (!addr) return;
            const res = await apiFetch('/api/admin/email-addresses/' + id, {
                method: 'PUT',
                body: JSON.stringify({
                    email: addr.email,
                    label: category,
                    action: category,
                    is_active: 1
                })
            });
            const data = await res.json();
            if (data.success) {
                showSaveMessage('✅ Email category updated!', false);
                // Update local data
                addr.action = category;
            } else {
                showSaveMessage('❌ Failed to update email category', true);
            }
        } catch (e) {
            showSaveMessage('❌ Error: ' + e.message, true);
        }
    }

    async function addEmailAddress() {
        const email = document.getElementById('newEmailInput').value.trim();
        const category = document.getElementById('newEmailCategory').value;
        if (!email) { alert('Please enter an email address.'); return; }
        try {
            const res = await apiFetch('/api/admin/email-addresses', {
                method: 'POST',
                body: JSON.stringify({ email, label: category, action: category })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('newEmailInput').value = '';
                loadAllData();
                showSaveMessage('✅ Email address added!', false);
            } else {
                alert('Failed to add: ' + (data.error || 'Unknown'));
            }
        } catch (e) { alert('Error: ' + e.message); }
    }

    async function editEmailAddress(id) {
        const addr = emailAddresses.find(a => a.id === id);
        if (!addr) return;
        const newEmail = prompt('Edit email address:', addr.email);
        if (newEmail === null) return;
        const newAction = prompt('Enter category (or custom):', addr.action);
        if (newAction === null) return;
        try {
            const res = await apiFetch('/api/admin/email-addresses/' + id, {
                method: 'PUT',
                body: JSON.stringify({
                    email: newEmail,
                    label: newAction,
                    action: newAction,
                    is_active: 1
                })
            });
            const data = await res.json();
            if (data.success) {
                loadAllData();
                showSaveMessage('✅ Email address updated!', false);
            } else {
                alert('Failed to update: ' + (data.error || 'Unknown'));
            }
        } catch (e) { alert('Error: ' + e.message); }
    }

    async function deleteEmailAddress(id) {
        if (!confirm('Delete this email address?')) return;
        try {
            const res = await apiFetch('/api/admin/email-addresses/' + id, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) {
                loadAllData();
                showSaveMessage('✅ Email address deleted!', false);
            } else {
                alert('Failed to delete: ' + (data.error || 'Unknown'));
            }
        } catch (e) { alert('Error: ' + e.message); }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  SAVE GENERAL SETTINGS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function saveGeneralSettings() {
        const timezone = document.getElementById('timezoneInput').value;
        const updates = [
            { category: 'general', key: 'timezone', value: timezone }
        ];
        try {
            const res = await apiFetch('/api/admin/settings', {
                method: 'PUT',
                body: JSON.stringify({ settings: updates })
            });
            const data = await res.json();
            if (data.success) {
                showSaveMessage('✅ General settings saved!', false);
            } else {
                showSaveMessage('❌ Failed to save general settings', true);
            }
        } catch (e) {
            showSaveMessage('❌ Error: ' + e.message, true);
        }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  SAVE SLA SETTINGS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function saveSlaSettings() {
        const updates = [];
        allCategories.forEach(cat => {
            const resp = document.getElementById(`sla_${cat}_response`);
            const res = document.getElementById(`sla_${cat}_resolution`);
            if (resp) updates.push({ category: 'sla', key: cat + '_response', value: resp.value });
            if (res) updates.push({ category: 'sla', key: cat + '_resolution', value: res.value });
        });
        try {
            const res = await apiFetch('/api/admin/settings', {
                method: 'PUT',
                body: JSON.stringify({ settings: updates })
            });
            const data = await res.json();
            if (data.success) {
                showSaveMessage('✅ SLA settings saved!', false);
            } else {
                showSaveMessage('❌ Failed to save SLA settings', true);
            }
        } catch (e) {
            showSaveMessage('❌ Error: ' + e.message, true);
        }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  SAVE COLOR SETTINGS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function saveColorSettings() {
        const mode = document.getElementById('themeMode').value;
        const accent = document.getElementById('themeAccent').value;
        const updates = [
            { category: 'theme', key: 'mode', value: mode },
            { category: 'theme', key: 'accent', value: accent }
        ];
        try {
            const res = await apiFetch('/api/admin/settings', {
                method: 'PUT',
                body: JSON.stringify({ settings: updates })
            });
            const data = await res.json();
            if (data.success) {
                showSaveMessage('✅ Color settings saved!', false);
                setTheme(mode);
                document.documentElement.style.setProperty('--accent', accent);
                document.documentElement.style.setProperty('--accent-hover', accent + 'dd');
            } else {
                showSaveMessage('❌ Failed to save color settings', true);
            }
        } catch (e) {
            showSaveMessage('❌ Error: ' + e.message, true);
        }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  SAVE AUTO-REPLY TEMPLATES
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function saveAutoReplyTemplates() {
        const updates = [];
        allCategories.forEach(cat => {
            const enabled = document.getElementById(`auto_${cat}_enabled`);
            const delay = document.getElementById(`auto_${cat}_delay`);
            const subject = document.getElementById(`auto_${cat}_subject`);
            const body = document.getElementById(`auto_${cat}_body`);
            if (enabled) updates.push({ category: 'auto_reply', key: cat + '_enabled', value: enabled.checked ? '1' : '0' });
            if (delay) updates.push({ category: 'auto_reply', key: cat + '_delay', value: delay.value });
            if (subject) updates.push({ category: 'auto_reply', key: cat + '_subject', value: subject.value });
            if (body) updates.push({ category: 'auto_reply', key: cat + '_body', value: body.value });
        });
        try {
            const res = await apiFetch('/api/admin/settings', {
                method: 'PUT',
                body: JSON.stringify({ settings: updates })
            });
            const data = await res.json();
            if (data.success) {
                showSaveMessage('✅ Auto-reply settings saved!', false);
            } else {
                showSaveMessage('❌ Failed to save auto-reply settings', true);
            }
        } catch (e) {
            showSaveMessage('❌ Error: ' + e.message, true);
        }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  SAVE CATEGORY SETTINGS (description, assigned email, color)
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function saveCategorySettings() {
        const updates = [];
        document.querySelectorAll('#tab-category_mgmt .cat-desc').forEach(el => {
            const cat = el.getAttribute('data-category');
            updates.push({ category: 'category', key: cat + '_description', value: el.value });
        });
        document.querySelectorAll('#tab-category_mgmt .cat-assigned').forEach(el => {
            const cat = el.getAttribute('data-category');
            updates.push({ category: 'category', key: cat + '_assigned_email', value: el.value });
        });
        document.querySelectorAll('#tab-category_mgmt .cat-color').forEach(el => {
            const cat = el.getAttribute('data-category');
            updates.push({ category: 'category', key: cat + '_color', value: el.value });
        });
        try {
            const res = await apiFetch('/api/admin/settings', {
                method: 'PUT',
                body: JSON.stringify({ settings: updates })
            });
            const data = await res.json();
            if (data.success) {
                showSaveMessage('✅ Category settings saved!', false);
                // Update color dots in auto-reply tab too
                document.querySelectorAll('#tab-auto_reply .color-dot').forEach(dot => {
                    const card = dot.closest('.category-card');
                    if (card) {
                        const cat = card.getAttribute('data-category');
                        const colorInput = document.querySelector(`#tab-category_mgmt .cat-color[data-category="${cat}"]`);
                        if (colorInput) dot.style.background = colorInput.value;
                    }
                });
            } else {
                showSaveMessage('❌ Failed to save category settings', true);
            }
        } catch (e) {
            showSaveMessage('❌ Error: ' + e.message, true);
        }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  DELETE CATEGORY (resets settings)
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function deleteCategory(category) {
        if (!confirm(`Reset category "${category}"? This will remove its custom settings.`)) return;
        const updates = [
            { category: 'category', key: category + '_description', value: category.charAt(0).toUpperCase() + category.slice(1) + ' inquiries' },
            { category: 'category', key: category + '_color', value: '#00ff9d' },
            { category: 'category', key: category + '_assigned_email', value: '' }
        ];
        // Also reset SLA and auto-reply for this category
        updates.push({ category: 'sla', key: category + '_response', value: '24' });
        updates.push({ category: 'sla', key: category + '_resolution', value: '72' });
        updates.push({ category: 'auto_reply', key: category + '_enabled', value: '0' });
        updates.push({ category: 'auto_reply', key: category + '_delay', value: '5' });
        updates.push({ category: 'auto_reply', key: category + '_subject', value: `[Ticket {{ticket_id}}] Your ${category} inquiry` });
        updates.push({ category: 'auto_reply', key: category + '_body', value: `Dear customer,\n\nThank you for your ${category} inquiry. We will respond shortly.\n\nBest regards,\nDornori Support` });
        try {
            const res = await apiFetch('/api/admin/settings', {
                method: 'PUT',
                body: JSON.stringify({ settings: updates })
            });
            const data = await res.json();
            if (data.success) {
                loadAllData();
                showSaveMessage('✅ Category reset!', false);
            } else {
                alert('Failed to reset category.');
            }
        } catch (e) { alert('Error: ' + e.message); }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  ADD NEW CATEGORY (modal via prompts)
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function openAddCategoryModal() {
        const name = prompt('Enter new category name (e.g., "billing"):');
        if (!name) return;
        const desc = prompt('Enter description:', name.charAt(0).toUpperCase() + name.slice(1) + ' inquiries');
        const color = prompt('Enter color (hex, e.g., #ff0000):', '#00ff9d');
        // Save as settings for this new category
        const updates = [
            { category: 'category', key: name + '_description', value: desc || name + ' inquiries' },
            { category: 'category', key: name + '_color', value: color || '#00ff9d' },
            { category: 'category', key: name + '_assigned_email', value: '' },
            { category: 'sla', key: name + '_response', value: '24' },
            { category: 'sla', key: name + '_resolution', value: '72' },
            { category: 'auto_reply', key: name + '_enabled', value: '0' },
            { category: 'auto_reply', key: name + '_delay', value: '5' },
            { category: 'auto_reply', key: name + '_subject', value: `[Ticket {{ticket_id}}] Your ${name} inquiry` },
            { category: 'auto_reply', key: name + '_body', value: `Dear customer,\n\nThank you for your ${name} inquiry. We will respond shortly.\n\nBest regards,\nDornori Support` }
        ];

        apiFetch('/api/admin/settings', {
            method: 'PUT',
            body: JSON.stringify({ settings: updates })
        }).then(res => res.json()).then(data => {
            if (data.success) {
                loadAllData();
                showSaveMessage(`✅ Category "${name}" added!`, false);
            } else {
                alert('Failed to add category.');
            }
        }).catch(e => alert('Error: ' + e.message));
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  SAVE ALL SETTINGS (global)
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function saveAllSettings() {
        const updates = [];

        // General
        const timezone = document.getElementById('timezoneInput');
        if (timezone) updates.push({ category: 'general', key: 'timezone', value: timezone.value });

        // SLA
        allCategories.forEach(cat => {
            const resp = document.getElementById(`sla_${cat}_response`);
            const res = document.getElementById(`sla_${cat}_resolution`);
            if (resp) updates.push({ category: 'sla', key: cat + '_response', value: resp.value });
            if (res) updates.push({ category: 'sla', key: cat + '_resolution', value: res.value });
        });

        // Color
        const mode = document.getElementById('themeMode');
        const accent = document.getElementById('themeAccent');
        if (mode) updates.push({ category: 'theme', key: 'mode', value: mode.value });
        if (accent) updates.push({ category: 'theme', key: 'accent', value: accent.value });

        // Auto-reply
        allCategories.forEach(cat => {
            const enabled = document.getElementById(`auto_${cat}_enabled`);
            const delay = document.getElementById(`auto_${cat}_delay`);
            const subject = document.getElementById(`auto_${cat}_subject`);
            const body = document.getElementById(`auto_${cat}_body`);
            if (enabled) updates.push({ category: 'auto_reply', key: cat + '_enabled', value: enabled.checked ? '1' : '0' });
            if (delay) updates.push({ category: 'auto_reply', key: cat + '_delay', value: delay.value });
            if (subject) updates.push({ category: 'auto_reply', key: cat + '_subject', value: subject.value });
            if (body) updates.push({ category: 'auto_reply', key: cat + '_body', value: body.value });
        });

        // Category management
        document.querySelectorAll('#tab-category_mgmt .cat-desc').forEach(el => {
            const cat = el.getAttribute('data-category');
            updates.push({ category: 'category', key: cat + '_description', value: el.value });
        });
        document.querySelectorAll('#tab-category_mgmt .cat-assigned').forEach(el => {
            const cat = el.getAttribute('data-category');
            updates.push({ category: 'category', key: cat + '_assigned_email', value: el.value });
        });
        document.querySelectorAll('#tab-category_mgmt .cat-color').forEach(el => {
            const cat = el.getAttribute('data-category');
            updates.push({ category: 'category', key: cat + '_color', value: el.value });
        });

        try {
            const res = await apiFetch('/api/admin/settings', {
                method: 'PUT',
                body: JSON.stringify({ settings: updates })
            });
            const data = await res.json();
            if (data.success) {
                showSaveMessage('✅ All settings saved!', false);
                // Refresh to reflect changes
                loadAllData();
                // Apply theme changes
                if (mode) setTheme(mode.value);
                if (accent) {
                    document.documentElement.style.setProperty('--accent', accent.value);
                    document.documentElement.style.setProperty('--accent-hover', accent.value + 'dd');
                }
            } else {
                showSaveMessage('❌ Failed to save all settings', true);
            }
        } catch (e) {
            showSaveMessage('❌ Error: ' + e.message, true);
        }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  INIT
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    loadAllData();

    // ── Add "Save All" button after the content ──
    window.addEventListener('load', function() {
        const container = document.querySelector('.container');
        const saveAllBtn = document.createElement('div');
        saveAllBtn.style.margin = '20px 0';
        saveAllBtn.innerHTML = `<button class="btn-primary" onclick="saveAllSettings()" style="width:100%;padding:14px;font-size:16px;">💾 Save All Settings (all tabs)</button>`;
        const content = document.getElementById('settingsContent');
        if (content && content.parentNode) {
            content.parentNode.insertBefore(saveAllBtn, content.nextSibling);
        }
    });
</script>
</body>
</html>
