<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings – Dornori</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
    <div class="header">
        <h1>⚙️ Settings</h1>
        <div class="header-right">
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
            <a href="dashboard.html">← Dashboard</a>
            <a href="reports.html">📊 Reports</a>
        </div>
    </div>

    <div class="tabs-container" id="tabsContainer"></div>
    <div id="settingsContent"><div class="loading">Loading…</div></div>

    <div id="saveMessage" class="saved">✅ Saved!</div>
    <div id="errorMessage" class="error">❌ Failed</div>
</div>

<!-- ── Category Modal ─────────────────────────────────────────── -->
<div id="catModal" class="modal-overlay">
    <div class="modal-content" style="max-width:480px;">
        <button class="modal-close" onclick="closeCatModal()">✕</button>
        <h3 id="catModalTitle" style="color:var(--accent);margin-bottom:20px;">Add Category</h3>
        <input type="hidden" id="catModalId" />
        <div class="setting-row"><label>Name (slug, no spaces)</label><input type="text" id="catModalName" placeholder="e.g. billing" /></div>
        <div class="setting-row"><label>Description</label><input type="text" id="catModalDesc" placeholder="Billing inquiries" /></div>
        <div class="setting-row"><label>Color</label><input type="color" id="catModalColor" value="#00ff9d" /></div>
        <div class="actions" style="margin-top:16px;"><button class="btn-primary" onclick="saveCatModal()">💾 Save</button></div>
    </div>
</div>

<!-- ── Auto-Reply Modal ───────────────────────────────────────── -->
<div id="arModal" class="modal-overlay">
    <div class="modal-content" style="max-width:600px;">
        <button class="modal-close" onclick="closeArModal()">✕</button>
        <h3 id="arModalTitle" style="color:var(--accent);margin-bottom:20px;">Auto-Reply</h3>
        <input type="hidden" id="arModalId" />
        <div class="setting-row">
            <label>Category</label>
            <select id="arModalCategory"></select>
        </div>
        <div class="setting-row">
            <label>Enabled</label>
            <div class="toggle-wrap"><input type="checkbox" id="arModalEnabled" /><label for="arModalEnabled">Send auto-reply for this category</label></div>
        </div>
        <div class="setting-row">
            <label>Subject <span class="hint">— use dynamic values below</span></label>
            <input type="text" id="arModalSubject" placeholder="[Ticket {{ticket_id}}] Your inquiry" />
        </div>
        <div class="setting-row">
            <label>Body (HTML accepted)</label>
            <div class="dynamic-tags">
                <span class="tag-label">Insert:</span>
                <button type="button" class="dyn-tag" onclick="insertDynTag('arModalBody','{{ticket_id}}')">{{ticket_id}}</button>
                <button type="button" class="dyn-tag" onclick="insertDynTag('arModalBody','{{sender_name}}')">{{sender_name}}</button>
                <button type="button" class="dyn-tag" onclick="insertDynTag('arModalBody','{{sender_email}}')">{{sender_email}}</button>
                <button type="button" class="dyn-tag" onclick="insertDynTag('arModalBody','{{category}}')">{{category}}</button>
                <button type="button" class="dyn-tag" onclick="insertDynTag('arModalBody','{{subject}}')">{{subject}}</button>
                <button type="button" class="dyn-tag" onclick="insertDynTag('arModalSubject','{{ticket_id}}')">→ subject</button>
            </div>
            <textarea id="arModalBody" rows="6" placeholder="<p>Thank you for your inquiry…</p>"></textarea>
        </div>
        <div class="actions" style="margin-top:16px;"><button class="btn-primary" onclick="saveArModal()">💾 Save</button></div>
    </div>
</div>

<!-- ── Outgoing Email Modal ───────────────────────────────────── -->
<div id="oeModal" class="modal-overlay">
    <div class="modal-content" style="max-width:600px;">
        <button class="modal-close" onclick="closeOeModal()">✕</button>
        <h3 id="oeModalTitle" style="color:var(--accent);margin-bottom:20px;">Edit Email Footer</h3>
        <input type="hidden" id="oeModalEmail" />
        <div class="setting-row">
            <label>Footer HTML for <strong id="oeModalEmailLabel"></strong></label>
            <div class="dynamic-tags">
                <span class="tag-label">Insert:</span>
                <button type="button" class="dyn-tag" onclick="insertDynTag('oeModalBody','{{ticket_id}}')">{{ticket_id}}</button>
                <button type="button" class="dyn-tag" onclick="insertDynTag('oeModalBody','{{unsubscribe_url}}')">{{unsubscribe_url}}</button>
                <button type="button" class="dyn-tag" onclick="insertDynTag('oeModalBody','{{sender_name}}')">{{sender_name}}</button>
            </div>
            <textarea id="oeModalBody" rows="8" placeholder="<p>Best regards,<br/>The Dornori Team</p>"></textarea>
        </div>
        <div class="actions" style="margin-top:16px;"><button class="btn-primary" onclick="saveOeModal()">💾 Save</button></div>
    </div>
</div>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CONFIG
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const API_BASE = 'https://dornori-ticketing.dornori-info.workers.dev';

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// THEME
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    document.querySelectorAll('.theme-toggle').forEach(t => t.textContent = theme === 'dark' ? '☀️' : '🌙');
}
function toggleTheme() {
    setTheme((document.documentElement.getAttribute('data-theme') || 'light') === 'light' ? 'dark' : 'light');
}
setTheme(localStorage.getItem('theme') || 'light');

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// AUTH
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const token = localStorage.getItem('token');
if (!token) window.location.href = '/admin';

async function apiFetch(url, opts = {}) {
    opts.headers = { ...(opts.headers || {}), 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
    const res = await fetch(API_BASE + url, opts);
    if (res.status === 401) { localStorage.removeItem('token'); window.location.href = '/admin'; throw new Error('Unauthorized'); }
    return res;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// STATE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let settings = [];
let emailAddresses = [];
let categories = [];   // derived from settings category.*_description
let activeTab = 'general';

function getSetting(cat, key, def = '') {
    const s = settings.find(s => s.category === cat && s.key === key);
    return s ? s.value : def;
}

function getCategories() {
    // Build from settings: every key matching category.*_description
    const cats = new Set(['support', 'newsletter', 'payment', 'other']);
    settings.forEach(s => {
        if (s.category === 'category' && s.key.endsWith('_description')) {
            cats.add(s.key.replace('_description', ''));
        }
    });
    return Array.from(cats);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// NOTIFY
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function notify(msg, isError = false) {
    const el = document.getElementById(isError ? 'errorMessage' : 'saveMessage');
    const other = document.getElementById(isError ? 'saveMessage' : 'errorMessage');
    other.classList.remove('show');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 4000);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// LOAD
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function loadAll() {
    document.getElementById('settingsContent').innerHTML = '<div class="loading">Loading…</div>';
    try {
        const [sr, er] = await Promise.all([
            apiFetch('/api/admin/settings'),
            apiFetch('/api/admin/email-addresses')
        ]);
        const sd = await sr.json(), ed = await er.json();
        settings = sd.settings || [];
        emailAddresses = ed.addresses || [];
        categories = getCategories();
        render();
        switchTab(activeTab);
    } catch(e) {
        document.getElementById('settingsContent').innerHTML = '<div class="loading">Error: ' + e.message + '</div>';
    }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SAVE SETTINGS HELPER
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function saveSettings(updates) {
    if (!updates.length) { notify('Nothing to save', true); return false; }
    const res = await apiFetch('/api/admin/settings', { method: 'PUT', body: JSON.stringify({ settings: updates }) });
    const d = await res.json();
    return d.success;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// RENDER TABS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function render() {
    const tabs = [
        { id: 'general',        label: '⚙️ General' },
        { id: 'sla',            label: '⏱️ SLA' },
        { id: 'categories',     label: '📂 Categories' },
        { id: 'email_routing',  label: '📤 Email Routing' },
        { id: 'auto_reply',     label: '🤖 Auto-Reply' },
        { id: 'outgoing_email', label: '✉️ Outgoing Email' },
    ];
    document.getElementById('tabsContainer').innerHTML = tabs.map((t, i) =>
        `<button class="tab-button" data-tab="${t.id}">${t.label}</button>`
    ).join('');
    document.querySelectorAll('.tab-button').forEach(b =>
        b.addEventListener('click', () => switchTab(b.dataset.tab))
    );
    document.getElementById('settingsContent').innerHTML = tabs.map(t => renderSection(t.id)).join('');
}

function switchTab(id) {
    activeTab = id;
    document.querySelectorAll('.tab-button').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
    document.querySelectorAll('.settings-section').forEach(s => s.classList.toggle('active', s.id === 'tab-' + id));
}

function renderSection(id) {
    switch(id) {
        case 'general':        return renderGeneral();
        case 'sla':            return renderSla();
        case 'categories':     return renderCategories();
        case 'email_routing':  return renderEmailRouting();
        case 'auto_reply':     return renderAutoReply();
        case 'outgoing_email': return renderOutgoingEmail();
    }
    return '';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// GENERAL
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderGeneral() {
    const tz = getSetting('general', 'timezone', 'UTC');
    const tzList = ['UTC','Europe/Vienna','Europe/London','Europe/Paris','Europe/Berlin','America/New_York','America/Los_Angeles','America/Chicago','Asia/Dubai','Asia/Singapore','Asia/Tokyo','Australia/Sydney','Pacific/Auckland'];
    return `<div class="settings-section" id="tab-general">
        <h2>⚙️ General</h2>
        <div class="setting-row">
            <label>Timezone</label>
            <select id="gen_timezone">${tzList.map(t => `<option value="${t}"${t===tz?' selected':''}>${t}</option>`).join('')}</select>
        </div>
        <div class="actions"><button class="btn-primary" onclick="saveGeneral()">💾 Save</button></div>
    </div>`;
}

async function saveGeneral() {
    const ok = await saveSettings([{ category:'general', key:'timezone', value: document.getElementById('gen_timezone').value }]);
    ok ? notify('✅ General saved') : notify('❌ Save failed', true);
    if (ok) await loadAll();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SLA
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderSla() {
    return `<div class="settings-section" id="tab-sla">
        <h2>⏱️ SLA Rules</h2>
        ${categories.map(cat => `
        <div class="card">
            <h4>${cap(cat)}</h4>
            <div class="setting-row"><label>Response (hours)</label><input type="number" id="sla_${cat}_response" value="${getSetting('sla', cat+'_response','24')}" /></div>
            <div class="setting-row"><label>Resolution (hours)</label><input type="number" id="sla_${cat}_resolution" value="${getSetting('sla', cat+'_resolution','72')}" /></div>
        </div>`).join('')}
        <div class="actions"><button class="btn-primary" onclick="saveSla()">💾 Save</button></div>
    </div>`;
}

async function saveSla() {
    const updates = [];
    categories.forEach(cat => {
        updates.push({ category:'sla', key: cat+'_response',   value: document.getElementById('sla_'+cat+'_response').value });
        updates.push({ category:'sla', key: cat+'_resolution', value: document.getElementById('sla_'+cat+'_resolution').value });
    });
    const ok = await saveSettings(updates);
    ok ? notify('✅ SLA saved') : notify('❌ Save failed', true);
    if (ok) await loadAll();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CATEGORIES
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderCategories() {
    const rows = categories.map(cat => {
        const desc  = getSetting('category', cat+'_description', cap(cat) + ' inquiries');
        const color = getSetting('category', cat+'_color', '#00ff9d');
        return `<tr>
            <td><span class="color-dot" style="background:${esc(color)}"></span>${esc(cat)}</td>
            <td>${esc(desc)}</td>
            <td><span class="color-swatch" style="background:${esc(color)}">${esc(color)}</span></td>
            <td>
                <button class="btn-edit-sm" onclick="openCatModal('${esc(cat)}','${esc(desc)}','${esc(color)}')">✏️ Edit</button>
                ${['support','newsletter','payment','other'].includes(cat) ? '<span class="hint">built-in</span>' : `<button class="btn-danger-sm" onclick="deleteCategory('${esc(cat)}')">🗑️</button>`}
            </td>
        </tr>`;
    }).join('');
    return `<div class="settings-section" id="tab-categories">
        <h2>📂 Categories</h2>
        <p class="intro-text">Categories are shared across Email Routing and Auto-Reply. Built-in categories cannot be deleted.</p>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Slug</th><th>Description</th><th>Color</th><th>Actions</th></tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>
        <div class="actions" style="margin-top:16px;">
            <button class="btn-primary" onclick="openCatModal()">➕ Add Category</button>
        </div>
    </div>`;
}

function openCatModal(name='', desc='', color='#00ff9d') {
    document.getElementById('catModalTitle').textContent = name ? 'Edit Category' : 'Add Category';
    document.getElementById('catModalId').value   = name;
    document.getElementById('catModalName').value  = name;
    document.getElementById('catModalName').disabled = !!name; // can't rename slug
    document.getElementById('catModalDesc').value  = desc;
    document.getElementById('catModalColor').value = color || '#00ff9d';
    document.getElementById('catModal').classList.add('active');
}
function closeCatModal() { document.getElementById('catModal').classList.remove('active'); }

async function saveCatModal() {
    const originalName = document.getElementById('catModalId').value;
    const name  = originalName || document.getElementById('catModalName').value.trim().toLowerCase().replace(/\s+/g,'-');
    const desc  = document.getElementById('catModalDesc').value.trim();
    const color = document.getElementById('catModalColor').value;
    if (!name) { alert('Name required'); return; }

    const updates = [
        { category:'category', key: name+'_description', value: desc || cap(name)+' inquiries' },
        { category:'category', key: name+'_color',       value: color },
    ];
    // Ensure SLA defaults exist if new
    if (!originalName) {
        updates.push({ category:'sla',        key: name+'_response',   value: '24' });
        updates.push({ category:'sla',        key: name+'_resolution', value: '72' });
        updates.push({ category:'auto_reply', key: name+'_enabled',    value: '0' });
        updates.push({ category:'auto_reply', key: name+'_subject',    value: `[Ticket {{ticket_id}}] Your ${name} inquiry` });
        updates.push({ category:'auto_reply', key: name+'_body',       value: `<p>Thank you for your ${name} inquiry. We will respond shortly.</p>` });
    }

    const ok = await saveSettings(updates);
    if (ok) { closeCatModal(); notify('✅ Category saved'); await loadAll(); }
    else { notify('❌ Save failed', true); }
}

async function deleteCategory(name) {
    if (!confirm(`Delete category "${name}"? This will NOT delete related settings automatically.`)) return;
    // Remove by setting blank description – worker doesn't have a delete-setting endpoint,
    // so we mark it with a special tombstone and exclude it from getCategories.
    // Alternative: just remove from the UI by filtering; DB row stays harmless.
    // We'll use a __deleted__ prefix convention.
    const ok = await saveSettings([{ category:'category', key: name+'_description', value: '__deleted__' }]);
    if (ok) { notify('✅ Category removed'); await loadAll(); }
    else { notify('❌ Delete failed', true); }
}

// Update getCategories to honour tombstone
const _origGetCategories = getCategories;
function getCategories() {
    const cats = new Set(['support', 'newsletter', 'payment', 'other']);
    settings.forEach(s => {
        if (s.category === 'category' && s.key.endsWith('_description') && s.value !== '__deleted__') {
            cats.add(s.key.replace('_description', ''));
        }
    });
    return Array.from(cats);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// EMAIL ROUTING
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderEmailRouting() {
    const catOptions = categories.map(c => `<option value="${c}">${cap(c)}</option>`).join('');
    const rows = emailAddresses.map(addr => {
        const opts = categories.map(c => `<option value="${c}"${c===addr.action?' selected':''}>${cap(c)}</option>`).join('');
        return `<tr>
            <td style="font-weight:500;">${esc(addr.email)}</td>
            <td><select class="er-cat-select" data-id="${addr.id}" onchange="updateEmailCategory(${addr.id}, this.value)">${opts}</select></td>
            <td>
                <button class="btn-edit-sm" onclick="editEmailPrompt(${addr.id})">✏️</button>
                <button class="btn-danger-sm" onclick="deleteEmail(${addr.id})" style="margin-left:4px;">🗑️</button>
            </td>
        </tr>`;
    }).join('');

    return `<div class="settings-section" id="tab-email_routing">
        <h2>📤 Email Routing</h2>
        <p class="intro-text">Map incoming email addresses to categories. Categories come from the Categories tab.</p>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Email Address</th><th>Routes to Category</th><th>Actions</th></tr></thead>
                <tbody id="erTableBody">${rows || '<tr><td colspan="3" style="color:var(--text-muted);text-align:center;padding:20px;">No addresses yet</td></tr>'}</tbody>
            </table>
        </div>
        <div class="row" style="margin-top:16px;align-items:flex-end;gap:10px;">
            <div style="flex:2;">
                <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">Email Address</label>
                <input type="email" id="newEmailInput" placeholder="incoming@yourdomain.com" style="width:100%;padding:8px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);" />
            </div>
            <div style="flex:1;">
                <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">Category</label>
                <select id="newEmailCategory" style="width:100%;padding:8px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);">${catOptions}</select>
            </div>
            <button class="btn-add" onclick="addEmail()" style="flex-shrink:0;">➕ Add</button>
        </div>
    </div>`;
}

async function updateEmailCategory(id, category) {
    const addr = emailAddresses.find(a => a.id === id);
    if (!addr) return;
    const res = await apiFetch('/api/admin/email-addresses/' + id, {
        method: 'PUT', body: JSON.stringify({ email: addr.email, label: category, action: category, is_active: 1 })
    });
    const d = await res.json();
    if (d.success) { addr.action = category; notify('✅ Updated'); }
    else { notify('❌ Failed', true); }
}

async function addEmail() {
    const email = document.getElementById('newEmailInput').value.trim();
    const category = document.getElementById('newEmailCategory').value;
    if (!email) { alert('Enter an email address'); return; }
    const res = await apiFetch('/api/admin/email-addresses', {
        method: 'POST', body: JSON.stringify({ email, label: category, action: category })
    });
    const d = await res.json();
    if (d.success) { document.getElementById('newEmailInput').value = ''; notify('✅ Added'); await loadAll(); }
    else { alert('Failed: ' + (d.error||'')); }
}

async function editEmailPrompt(id) {
    const addr = emailAddresses.find(a => a.id === id);
    if (!addr) return;
    const newEmail = prompt('Email address:', addr.email);
    if (newEmail === null) return;
    const res = await apiFetch('/api/admin/email-addresses/' + id, {
        method: 'PUT', body: JSON.stringify({ email: newEmail, label: addr.action, action: addr.action, is_active: 1 })
    });
    const d = await res.json();
    if (d.success) { notify('✅ Updated'); await loadAll(); }
    else { notify('❌ Failed', true); }
}

async function deleteEmail(id) {
    if (!confirm('Delete this email address?')) return;
    const res = await apiFetch('/api/admin/email-addresses/' + id, { method: 'DELETE' });
    const d = await res.json();
    if (d.success) { notify('✅ Deleted'); await loadAll(); }
    else { notify('❌ Failed', true); }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// AUTO-REPLY
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderAutoReply() {
    const rows = categories.map(cat => {
        const enabled = getSetting('auto_reply', cat+'_enabled', '0') === '1';
        const subject = getSetting('auto_reply', cat+'_subject', `[Ticket {{ticket_id}}] Your ${cat} inquiry`);
        const body    = getSetting('auto_reply', cat+'_body',    '');
        return `<tr>
            <td><span class="color-dot" style="background:${getSetting('category',cat+'_color','#00ff9d')}"></span>${esc(cat)}</td>
            <td><span class="status-pill ${enabled?'pill-on':'pill-off'}">${enabled?'On':'Off'}</span></td>
            <td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--text-muted);">${esc(subject)}</td>
            <td>
                <button class="btn-edit-sm" onclick="openArModal('${esc(cat)}','${enabled}','${esc(subject)}',${JSON.stringify(esc(body))})">✏️ Edit</button>
                ${enabled ? `<button class="btn-danger-sm" onclick="disableAr('${esc(cat)}')" style="margin-left:4px;">⏸ Disable</button>` : ''}
            </td>
        </tr>`;
    }).join('');
    return `<div class="settings-section" id="tab-auto_reply">
        <h2>🤖 Auto-Reply</h2>
        <p class="intro-text">Configure automatic replies sent when a ticket is created for each category. HTML is supported in the body. Use dynamic tags like <code>{{ticket_id}}</code>.</p>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Category</th><th>Status</th><th>Subject</th><th>Actions</th></tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>
    </div>`;
}

function openArModal(cat, enabled, subject, body) {
    const catSelect = document.getElementById('arModalCategory');
    catSelect.innerHTML = categories.map(c => `<option value="${c}"${c===cat?' selected':''}>${cap(c)}</option>`).join('');
    document.getElementById('arModalEnabled').checked = enabled === 'true' || enabled === true;
    document.getElementById('arModalSubject').value = subject || '';
    document.getElementById('arModalBody').value = body || '';
    document.getElementById('arModalTitle').textContent = cat ? `Auto-Reply: ${cap(cat)}` : 'Auto-Reply';
    document.getElementById('arModal').classList.add('active');
}
function closeArModal() { document.getElementById('arModal').classList.remove('active'); }

async function saveArModal() {
    const cat     = document.getElementById('arModalCategory').value;
    const enabled = document.getElementById('arModalEnabled').checked ? '1' : '0';
    const subject = document.getElementById('arModalSubject').value;
    const body    = document.getElementById('arModalBody').value;
    const updates = [
        { category:'auto_reply', key: cat+'_enabled', value: enabled },
        { category:'auto_reply', key: cat+'_subject', value: subject },
        { category:'auto_reply', key: cat+'_body',    value: body },
    ];
    const ok = await saveSettings(updates);
    if (ok) { closeArModal(); notify('✅ Auto-reply saved'); await loadAll(); }
    else { notify('❌ Save failed', true); }
}

async function disableAr(cat) {
    if (!confirm(`Disable auto-reply for "${cat}"?`)) return;
    const ok = await saveSettings([{ category:'auto_reply', key: cat+'_enabled', value:'0' }]);
    if (ok) { notify('✅ Disabled'); await loadAll(); }
    else { notify('❌ Failed', true); }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// OUTGOING EMAIL
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderOutgoingEmail() {
    const rows = emailAddresses.map(addr => {
        const footerKey = 'footer_' + addr.email.replace(/[^a-z0-9]/gi, '_');
        const hasFooter = !!getSetting('email', footerKey, '');
        return `<tr>
            <td style="font-weight:500;">${esc(addr.email)}</td>
            <td style="font-size:12px;color:var(--text-muted);">${esc(addr.label || addr.action)}</td>
            <td><span class="status-pill ${hasFooter?'pill-on':'pill-off'}">${hasFooter?'Custom':'None'}</span></td>
            <td>
                <button class="btn-edit-sm" onclick="openOeModal('${esc(addr.email)}')">✏️ Edit Footer</button>
            </td>
        </tr>`;
    }).join('');

    return `<div class="settings-section" id="tab-outgoing_email">
        <h2>✉️ Outgoing Email</h2>
        <p class="intro-text">Set an HTML footer for each outgoing email address. The footer is appended to every email sent from that address. HTML is fully supported. Addresses are managed in the Email Routing tab.</p>
        <div class="table-wrap">
            <table>
                <thead><tr><th>From Address</th><th>Label / Category</th><th>Footer</th><th>Actions</th></tr></thead>
                <tbody>${rows || '<tr><td colspan="4" style="color:var(--text-muted);text-align:center;padding:20px;">No email addresses configured. Add them in Email Routing first.</td></tr>'}</tbody>
            </table>
        </div>
    </div>`;
}

function openOeModal(email) {
    const footerKey = 'footer_' + email.replace(/[^a-z0-9]/gi, '_');
    document.getElementById('oeModalEmail').value       = email;
    document.getElementById('oeModalEmailLabel').textContent = email;
    document.getElementById('oeModalBody').value        = getSetting('email', footerKey, '');
    document.getElementById('oeModalTitle').textContent = 'Footer for ' + email;
    document.getElementById('oeModal').classList.add('active');
}
function closeOeModal() { document.getElementById('oeModal').classList.remove('active'); }

async function saveOeModal() {
    const email     = document.getElementById('oeModalEmail').value;
    const body      = document.getElementById('oeModalBody').value;
    const footerKey = 'footer_' + email.replace(/[^a-z0-9]/gi, '_');
    const ok = await saveSettings([{ category:'email', key: footerKey, value: body }]);
    if (ok) { closeOeModal(); notify('✅ Footer saved'); await loadAll(); }
    else { notify('❌ Save failed', true); }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// DYNAMIC TAG INSERT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function insertDynTag(targetId, tag) {
    const el = document.getElementById(targetId);
    if (!el) return;
    const start = el.selectionStart, end = el.selectionEnd;
    el.value = el.value.substring(0, start) + tag + el.value.substring(end);
    el.selectionStart = el.selectionEnd = start + tag.length;
    el.focus();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// MODAL CLOSE ON BACKDROP
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
['catModal','arModal','oeModal'].forEach(id => {
    document.getElementById(id).addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('active');
    });
});
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') ['catModal','arModal','oeModal'].forEach(id =>
        document.getElementById(id).classList.remove('active')
    );
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// UTILS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// INIT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
loadAll();
</script>
