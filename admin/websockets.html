<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Feed - Live Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #1e293b;
        }
        
        .header h1 {
            font-size: 24px;
            color: #38bdf8;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            animation: none;
        }
        
        .dot.connected {
            background: #22c55e;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .config {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .config label {
            display: block;
            margin-bottom: 5px;
            color: #94a3b8;
            font-size: 14px;
        }
        
        .config input {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .config button {
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        
        .config button:hover {
            background: #2563eb;
        }
        
        .config button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        
        .ticket-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .ticket-card {
            background: #1e293b;
            border-left: 4px solid #22c55e;
            border-radius: 8px;
            padding: 16px;
            animation: slideIn 0.3s ease;
        }
        
        .ticket-card.breached {
            border-left-color: #ef4444;
        }
        
        .ticket-card.at_risk {
            border-left-color: #f59e0b;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .ticket-number {
            font-family: monospace;
            color: #38bdf8;
            font-size: 14px;
        }
        
        .ticket-meta {
            display: flex;
            gap: 8px;
        }
        
        .badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .badge-category {
            background: #312e81;
            color: #a5b4fc;
        }
        
        .badge-status {
            background: #14532d;
            color: #86efac;
        }
        
        .badge-sla {
            font-weight: 700;
        }
        
        .badge-sla.on_track {
            background: #14532d;
            color: #86efac;
        }
        
        .badge-sla.at_risk {
            background: #451a03;
            color: #fbbf24;
        }
        
        .badge-sla.breached {
            background: #450a0a;
            color: #fca5a5;
        }
        
        .ticket-subject {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        .ticket-footer {
            display: flex;
            justify-content: space-between;
            color: #64748b;
            font-size: 13px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #475569;
        }
        
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .counter {
            background: #1e293b;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            color: #38bdf8;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎫 Live Ticket Feed</h1>
            <div class="status">
                <div class="dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
        </div>
        
        <div class="config">
            <label>Worker URL (wss://)</label>
            <input type="text" id="wsUrl" placeholder="wss://your-worker.workers.dev/api/admin/ws" value="">
            
            <label>JWT Token</label>
            <input type="text" id="token" placeholder="Paste your JWT token here" value="">
            
            <button id="connectBtn" onclick="toggleConnection()">Connect</button>
        </div>
        
        <div class="counter" id="counter" style="display:none">
            Tickets received: <strong id="ticketCount">0</strong>
        </div>
        
        <div class="ticket-list" id="ticketList">
            <div class="empty-state">
                <div class="icon">📭</div>
                <p>Waiting for tickets...</p>
                <p style="font-size:12px;margin-top:8px">Connect to start receiving real-time updates</p>
            </div>
        </div>
    </div>
    
    <script>
        let ws = null;
        let ticketCount = 0;
        
        function toggleConnection() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
            } else {
                connect();
            }
        }
        
        function connect() {
            const wsUrl = document.getElementById('wsUrl').value.trim();
            const token = document.getElementById('token').value.trim();
            
            if (!wsUrl || !token) {
                alert('Please enter both Worker URL and JWT token');
                return;
            }
            
            // Build full URL with token
            const fullUrl = `${wsUrl}?token=${encodeURIComponent(token)}`;
            
            console.log('Connecting to:', fullUrl);
            updateStatus('connecting', 'Connecting...');
            
            ws = new WebSocket(fullUrl);
            
            ws.onopen = () => {
                console.log('✅ WebSocket connected');
                updateStatus('connected', 'Connected');
                document.getElementById('connectBtn').textContent = 'Disconnect';
                document.getElementById('connectBtn').style.background = '#ef4444';
                document.getElementById('counter').style.display = 'block';
                
                // Start keepalive pings
                startKeepalive();
            };
            
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    console.log('📨 Received:', data);
                    
                    if (data.type === 'new_ticket') {
                        addTicket(data.ticket);
                    } else if (data.type === 'pong') {
                        console.log('💓 Pong');
                    }
                } catch (e) {
                    console.error('Parse error:', e);
                }
            };
            
            ws.onclose = (event) => {
                console.log('❌ WebSocket closed:', event.code, event.reason);
                updateStatus('disconnected', 'Disconnected');
                document.getElementById('connectBtn').textContent = 'Connect';
                document.getElementById('connectBtn').style.background = '#3b82f6';
                stopKeepalive();
                
                // Auto-reconnect after 5 seconds
                if (event.code !== 1000) {
                    setTimeout(() => {
                        console.log('🔄 Attempting reconnect...');
                        connect();
                    }, 5000);
                }
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }
        
        let keepaliveInterval;
        
        function startKeepalive() {
            keepaliveInterval = setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'ping' }));
                }
            }, 30000);
        }
        
        function stopKeepalive() {
            if (keepaliveInterval) {
                clearInterval(keepaliveInterval);
            }
        }
        
        function updateStatus(state, text) {
            const dot = document.getElementById('statusDot');
            dot.className = 'dot';
            if (state === 'connected') dot.classList.add('connected');
            document.getElementById('statusText').textContent = text;
        }
        
        function addTicket(ticket) {
            ticketCount++;
            document.getElementById('ticketCount').textContent = ticketCount;
            
            // Remove empty state if present
            const emptyState = document.querySelector('.empty-state');
            if (emptyState) emptyState.remove();
            
            const card = document.createElement('div');
            card.className = `ticket-card ${ticket.sla_status}`;
            
            const time = new Date(ticket.last_updated).toLocaleString();
            
            card.innerHTML = `
                <div class="ticket-header">
                    <span class="ticket-number">${escapeHtml(ticket.ticket_number)}</span>
                    <div class="ticket-meta">
                        <span class="badge badge-category">${escapeHtml(ticket.category)}</span>
                        <span class="badge badge-status">${escapeHtml(ticket.status)}</span>
                        <span class="badge badge-sla ${escapeHtml(ticket.sla_status)}">${escapeHtml(ticket.sla_status.replace('_', ' '))}</span>
                    </div>
                </div>
                <div class="ticket-subject">${escapeHtml(ticket.subject)}</div>
                <div class="ticket-footer">
                    <span>👤 ${escapeHtml(ticket.sender_name)}</span>
                    <span>🕐 ${time}</span>
                </div>
            `;
            
            // Insert at top
            const list = document.getElementById('ticketList');
            list.insertBefore(card, list.firstChild);
            
            // Keep max 50 cards to avoid DOM bloat
            const cards = list.querySelectorAll('.ticket-card');
            if (cards.length > 50) {
                cards[cards.length - 1].remove();
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }
        
        // Save values to localStorage for convenience
        document.getElementById('wsUrl').addEventListener('input', function() {
            localStorage.setItem('wsUrl', this.value);
        });
        
        document.getElementById('token').addEventListener('input', function() {
            localStorage.setItem('wsToken', this.value);
        });
        
        // Load saved values
        window.addEventListener('load', () => {
            const savedUrl = localStorage.getItem('wsUrl');
            const savedToken = localStorage.getItem('wsToken');
            
            if (savedUrl) document.getElementById('wsUrl').value = savedUrl;
            if (savedToken) document.getElementById('token').value = savedToken;
        });
    </script>
</body>
</html>
