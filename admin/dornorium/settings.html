<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings – Dornorium</title>
    <link rel="stylesheet" href="style.css" />
    <script src="shared.js"></script>
    <style>
        .tab-strip { display: flex; gap: 0; flex-wrap: wrap; border-bottom: 2px solid var(--border); margin-bottom: 28px; }
        .tab-strip button { padding: 12px 22px; background: none; border: none; border-bottom: 3px solid transparent; margin-bottom: -2px; color: var(--text-muted); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; transition: color .15s, border-color .15s; }
        .tab-strip button:hover { color: var(--text); }
        .tab-strip button.active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .s-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin-bottom: 20px; }
        .s-card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .s-card-head h3 { font-size: 15px; font-weight: 700; color: var(--text); }
        .s-card-head p { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.4; }
        .f-row { margin-bottom: 16px; }
        .f-row label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted); margin-bottom: 6px; }
        .f-row input[type="text"], .f-row input[type="email"], .f-row input[type="number"], .f-row input[type="password"], .f-row input[type="color"], .f-row select, .f-row textarea { width: 100%; padding: 9px 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-size: 14px; font-family: inherit; transition: border-color .15s; }
        .f-row input:focus, .f-row select:focus, .f-row textarea:focus { outline: none; border-color: var(--accent); }
        .f-row textarea { min-height: 100px; resize: vertical; font-family: 'Menlo', 'Consolas', monospace; font-size: 13px; line-height: 1.55; }
        .f-row input[type="color"] { height: 38px; padding: 3px 6px; cursor: pointer; }
        .f-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .f-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .tag-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; align-items: center; }
        .tag-bar-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); margin-right: 4px; }
        .tag-chip { padding: 3px 9px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 20px; font-size: 11px; font-family: monospace; color: var(--accent); cursor: pointer; font-weight: 600; transition: background .12s, color .12s; }
        .tag-chip:hover { background: var(--accent); color: var(--text-inverse); border-color: var(--accent); }
        .toggle-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .toggle-switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-track { position: absolute; inset: 0; background: var(--border); border-radius: 22px; cursor: pointer; transition: background .2s; }
        .toggle-track::after { content: ''; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: transform .2s; }
        .toggle-switch input:checked + .toggle-track { background: var(--accent); }
        .toggle-switch input:checked + .toggle-track::after { transform: translateX(18px); }
        .toggle-label { font-size: 14px; color: var(--text); font-weight: 500; }
        .cat-item { border: 1px solid var(--border); border-radius: 8px; padding: 0; margin-bottom: 12px; overflow: hidden; }
        .cat-item-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--bg-input); cursor: pointer; user-select: none; }
        .cat-item-head:hover { background: var(--bg-hover); }
        .cat-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
        .cat-name { font-weight: 700; font-size: 14px; flex: 1; }
        .cat-desc-preview { font-size: 12px; color: var(--text-muted); flex: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cat-chevron { color: var(--text-muted); font-size: 12px; transition: transform .2s; flex-shrink: 0; }
        .cat-item.open .cat-chevron { transform: rotate(90deg); }
        .cat-body { display: none; padding: 20px 16px; border-top: 1px solid var(--border); }
        .cat-item.open .cat-body { display: block; }
        .cat-actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
        .ar-item { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
        .ar-item-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-input); cursor: pointer; user-select: none; }
        .ar-item-head:hover { background: var(--bg-hover); }
        .ar-enabled-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .ar-enabled-dot.on { background: var(--success); }
        .ar-enabled-dot.off { background: var(--border); }
        .ar-cat-name { font-weight: 700; font-size: 14px; min-width: 120px; }
        .ar-subject-preview { font-size: 12px; color: var(--text-muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ar-chevron { color: var(--text-muted); font-size: 12px; transition: transform .2s; flex-shrink: 0; }
        .ar-item.open .ar-chevron { transform: rotate(90deg); }
        .ar-body { display: none; padding: 22px 18px; border-top: 1px solid var(--border); }
        .ar-item.open .ar-body { display: block; }
        .oe-item { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
        .oe-item-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-input); border-bottom: 1px solid var(--border); }
        .oe-email-label { font-weight: 700; font-size: 14px; flex: 1; }
        .oe-cat-badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; background: var(--bg-hover); color: var(--text-muted); text-transform: uppercase; letter-spacing: .4px; }
        .oe-body { padding: 20px 18px; }
        .oe-footer-status { font-size: 11px; color: var(--text-muted); font-style: italic; }
        .oe-footer-status.has-footer { color: var(--success); font-style: normal; }
        .email-row { display: grid; grid-template-columns: 1fr 150px 120px 90px 110px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
        .email-row .email-addr { font-weight: 600; font-size: 13px; font-family: monospace; word-break: break-all; }
        .email-row .status-badge { font-size: 10px; padding: 3px 10px; border-radius: 12px; font-weight: 600; text-align: center; display: inline-block; min-width: 55px; }
        .email-row .status-badge.active { background: var(--success); color: #fff; }
        .email-row .status-badge.inactive { background: var(--border); color: var(--text-muted); }
        .email-row select { padding: 5px 8px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 5px; color: var(--text); width: 100%; font-size: 12px; }
        .email-row .actions { display: flex; gap: 4px; flex-wrap: wrap; }
        .email-row .actions .btn { padding: 4px 10px; font-size: 11px; }
        .add-row { display: flex; gap: 10px; align-items: flex-end; padding: 16px; background: var(--bg-input); border: 1px dashed var(--border); border-radius: 8px; margin-top: 8px; flex-wrap: wrap; }
        .add-row .f-row { margin-bottom: 0; flex: 1; min-width: 130px; }
        .add-row .f-row:last-child { flex: 0 0 auto; }
        .btn { padding: 7px 16px; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
        .btn:hover { opacity: .85; }
        .btn-accent { background: var(--accent); color: #fff; }
        .btn-ghost { background: var(--bg-input); color: var(--text); border: 1px solid var(--border); }
        .btn-danger { background: var(--error); color: #fff; }
        .btn-sm { padding: 4px 10px; font-size: 11px; }
        .btn-success { background: var(--success); color: #fff; }
        .test-email-box { background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-top: 12px; }
        .test-email-box .f-row { margin-bottom: 12px; }
        .test-email-box .f-row:last-child { margin-bottom: 0; }
        .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; z-index: 9999; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background: var(--bg-secondary); color: var(--success); border-left: 4px solid var(--success); }
        .toast.error { background: var(--bg-secondary); color: var(--error); border-left: 4px solid var(--error); }
        .toast.warning { background: var(--bg-secondary); color: #92400e; border-left: 4px solid #f59e0b; }
        .empty-state { text-align: center; padding: 32px; color: var(--text-muted); font-size: 14px; }
        .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
        .section-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--accent); margin: 24px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
        .collapse-section { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
        .collapse-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-input); cursor: pointer; user-select: none; }
        .collapse-head:hover { background: var(--bg-hover); }
        .collapse-head h4 { font-size: 14px; font-weight: 700; color: var(--text); margin: 0; flex: 1; }
        .collapse-chevron { color: var(--text-muted); font-size: 12px; transition: transform .2s; flex-shrink: 0; }
        .collapse-section.open .collapse-chevron { transform: rotate(90deg); }
        .collapse-body { display: none; padding: 20px 18px; border-top: 1px solid var(--border); }
        .collapse-section.open .collapse-body { display: block; }
        .domain-row { display: grid; grid-template-columns: 1fr 120px 100px auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
        .domain-row .domain-name { font-weight: 600; font-size: 14px; }
        .domain-row .status-badge { font-size: 11px; padding: 2px 10px; border-radius: 12px; font-weight: 600; text-align: center; }
        .domain-row .status-badge.active { background: var(--success); color: #fff; }
        .domain-row .status-badge.pending { background: var(--warning); color: #fff; }
        .domain-row .status-badge.inactive { background: var(--border); color: var(--text-muted); }
        @media (max-width: 1024px) { .email-row { grid-template-columns: 1fr; gap: 6px; } .domain-row { grid-template-columns: 1fr; gap: 6px; } .add-row { flex-direction: column; } .add-row .f-row { min-width: 100%; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 class="brand-logo"><a href="https://www.dornori.info/dornorium" class="brand-logo-link"><span class="brand-icon">⚙️</span><span class="brand-text">Dornorium</span></a></h1>
        <div class="header-right">
            <div class="nav-links">
                <a id="nav-dashboard" href="dashboard.html">🎫 <span>Dashboard</span></a>
                <a id="nav-reports" href="reports.html">📊 <span>Reports</span></a>
                <a id="nav-newsletter" href="newsletter.html">📧 <span>Newsletter</span></a>
                <a id="nav-order-reply" href="order-reply.html">📦 <span>Order Reply</span></a>
                <a id="nav-settings" href="settings.html" class="active">⚙️ <span>Settings</span></a>
                <a id="nav-users" href="users.html">👥 <span>Users</span></a>
            </div>
            <script>
            (function(){
                document.querySelectorAll('.nav-links a').forEach(function(a){
                    if (a.classList.contains('active')) return;
                    fetch(a.getAttribute('href'), { method: 'HEAD' })
                        .then(function(res){ if (!res.ok) a.style.display = 'none'; })
                        .catch(function(){ a.style.display = 'none'; });
                });
            })();
            </script>
            <div class="nav-actions">
                <button id="purgeCacheBtn" class="btn-purge" onclick="purgeTicketCacheClick()">🗑️ Purge Cache</button>
                <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
                <div id="userDisplay"></div>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <div class="tab-strip" id="tabStrip"></div>
    <div id="tabContent"><div class="loading">Loading…</div></div>
</div>

<div id="toast" class="toast"></div>

<script>
// setTheme() / toggleTheme() come from shared.js
setTheme(localStorage.getItem('theme') || 'light');

// ── Auth ──
const token = localStorage.getItem('token');
const storedUser = localStorage.getItem('user');
const currentUser = storedUser ? JSON.parse(storedUser) : null;

if (!token || !currentUser || !hasAccess('settings', 'view')) {
    document.body.innerHTML = '<div style="padding: 40px; text-align: center;"><h1>⛔ Access Denied</h1><p>You don\'t have permission to access settings.</p><a href="dashboard.html" style="color: var(--accent);">← Back to Dashboard</a></div>';
    throw new Error('Settings access required');
}

(async function refreshCurrentUser() {
    try {
        const res = await fetch(API_BASE + '/api/admin/me', { headers: { Authorization: 'Bearer ' + token } });
        if (!res.ok) return;
        const data = await res.json();
        if (data.success && data.user) {
            currentUser.role = data.user.role;
            currentUser.page_permissions = data.user.page_permissions || {};
            currentUser.effective_permissions = data.user.effective_permissions || {};
            currentUser.allowed_languages = data.user.allowed_languages || [];
            currentUser.allowed_emails = data.user.allowed_emails || [];
            currentUser.allowed_categories = data.user.allowed_categories || [];
            currentUser.team_id = data.user.team_id || null;
            localStorage.setItem('user', JSON.stringify(currentUser));
            if (!hasAccess('settings', 'view')) { window.location.href = 'dashboard.html'; return; }
            if (typeof load === 'function') load();
        }
    } catch (e) {}
})();

function canEditSettings() { return hasAccess('settings', 'edit'); }
function canCreateSettings() { return hasAccess('settings', 'create'); }
function canDeleteSettings() { return hasAccess('settings', 'delete'); }

['nav-reports','nav-newsletter','nav-users'].forEach(id => {
    const page = id.replace('nav-', '');
    const el = document.getElementById(id);
    if (!el) return;
    const allowed = hasPageAccess(page);
    el.classList.toggle('nav-disabled', !allowed);
    if (!allowed) el.addEventListener('click', e => e.preventDefault());
});
const purgeBtn = document.getElementById('purgeCacheBtn');
if (purgeBtn) purgeBtn.disabled = !canEditSettings();

// ── API ──
async function api(path, opts = {}) {
    const headers = {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json',
        ...(opts.headers || {})
    };
    
    const response = await fetch(API_BASE + path, {
        ...opts,
        headers
    });
    
    if (response.status === 401) {
        localStorage.removeItem('token');
        throw new Error('Unauthorized');
    }
    if (response.status === 403) {
        throw new Error('Permission denied');
    }
    
    const text = await response.text();
    if (!text || text.trim() === '') {
        return { success: false, status: response.status, error: 'Empty response' };
    }
    try {
        return JSON.parse(text);
    } catch (e) {
        return { success: false, status: response.status, error: 'Invalid JSON: ' + e.message };
    }
}

// ── Toast ──
function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.innerHTML = msg;
    el.className = 'toast show ' + type;
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => el.classList.remove('show'), type === 'warning' ? 8000 : 3500);
}

// ── State ──
let settings = [], emailAddresses = [], currentTab = 'incoming';
let cloudflareDomains = [];
let cloudflareRules = [];
let configuredZoneId = null;
let configuredDomain = null;

function S(cat, key, def = '') {
    const s = settings.find(s => s.category === cat && s.key === key);
    return s ? s.value : def;
}

function getCategories() {
    const cats = new Set();
    settings.forEach(s => {
        if (s.category === 'category' && s.key.endsWith('_description') && s.value !== '__deleted__') cats.add(s.key.replace('_description', ''));
    });
    return Array.from(cats);
}

function getLanguages() {
    try { return JSON.parse(S('languages', 'list', '[]')); } catch (e) { return []; }
}

function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
function esc(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

// ── Load ──
async function load() {
    try {
        const [sd, ed] = await Promise.all([api('/api/admin/settings'), api('/api/admin/email-addresses')]);
        settings = sd.settings || [];
        emailAddresses = ed.addresses || [];
        
        const zoneSetting = settings.find(s => s.category === 'cloudflare' && s.key === 'zone_id');
        configuredZoneId = zoneSetting ? zoneSetting.value : null;
        const domainSetting = settings.find(s => s.category === 'cloudflare' && s.key === 'domain');
        configuredDomain = domainSetting ? domainSetting.value : null;
        
        await fetchCloudflareDomains();
        
        if (configuredZoneId) {
            await fetchCloudflareRules(configuredZoneId);
        } else {
            cloudflareRules = [];
        }
        
        renderAll();
        switchTab(currentTab);
    } catch(e) {
        document.getElementById('tabContent').innerHTML = '<div class="loading">Error: ' + e.message + '</div>';
    }
}

async function fetchCloudflareDomains() {
    try {
        const res = await api('/api/admin/setup/cloudflare-zones');
        if (res.success) {
            cloudflareDomains = res.zones || [];
        } else {
            cloudflareDomains = [];
        }
    } catch (e) {
        cloudflareDomains = [];
    }
}

async function fetchCloudflareRules(zoneId) {
    try {
        const res = await api(`/api/admin/setup/routing-rules/${zoneId}`);
        if (res.success) {
            cloudflareRules = res.rules || [];
        } else {
            cloudflareRules = [];
        }
    } catch (e) {
        cloudflareRules = [];
    }
}

async function saveSettings(updates) {
    const d = await api('/api/admin/settings', { method: 'PUT', body: JSON.stringify({ settings: updates }) });
    return d.success;
}

function disableElements(selector, disabled) {
    document.querySelectorAll(selector).forEach(el => {
        if (disabled) { el.disabled = true; el.style.opacity = '0.5'; el.style.cursor = 'not-allowed'; el.title = 'Permission denied'; }
        else { el.disabled = false; el.style.opacity = '1'; el.style.cursor = ''; el.title = ''; }
    });
}

// ─────────────────────────────────────────────────────────────
// TABS
// ─────────────────────────────────────────────────────────────
const TABS = [
    { id: 'system',      icon: '🔧', label: 'System Config' },
    { id: 'security',    icon: '🔒', label: 'Security' },
    { id: 'general',     icon: '⚙️', label: 'General' },
    { id: 'sla',         icon: '⏱️', label: 'SLA' },
    { id: 'categories',  icon: '📂', label: 'Categories' },
    { id: 'languages',   icon: '🌐', label: 'Languages' },
    { id: 'incoming',    icon: '📥', label: 'Incoming Email' },
    { id: 'outgoing',    icon: '📤', label: 'Outgoing Email' },
];

function renderAll() {
    document.getElementById('tabStrip').innerHTML = TABS.map(t =>
        `<button data-tab="${t.id}" onclick="switchTab('${t.id}')">${t.icon} ${t.label}</button>`
    ).join('');
    document.getElementById('tabContent').innerHTML = TABS.map(t =>
        `<div class="tab-panel" id="panel-${t.id}">${buildPanel(t.id)}</div>`
    ).join('');
}

function switchTab(id) {
    currentTab = id;
    document.querySelectorAll('.tab-strip button').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + id));
    const noEdit = !canEditSettings();
    if (id === 'incoming' || id === 'outgoing') {
        buildEmailTab(id).then(html => {
            const panel = document.getElementById('panel-' + id);
            if (panel) panel.innerHTML = html;
            if (noEdit) setTimeout(() => disableElements('#panel-' + id + ' input, #panel-' + id + ' textarea, #panel-' + id + ' select, #panel-' + id + ' button', true), 50);
        });
    }
    if (noEdit) setTimeout(() => disableElements(`#panel-${id} input, #panel-${id} textarea, #panel-${id} select, #panel-${id} button`, true), 50);
}

function buildPanel(id) {
    switch(id) {
        case 'system': return buildSystem();
        case 'security': return buildSecurity();
        case 'general': return buildGeneral();
        case 'sla': return buildSla();
        case 'categories': return buildCategories();
        case 'languages': return buildLanguages();
        case 'incoming':
        case 'outgoing': return '<div class="loading">Loading…</div>';
        default: return '';
    }
}

// ─────────────────────────────────────────────────────────────
// SYSTEM CONFIG (unchanged)
// ─────────────────────────────────────────────────────────────
function buildSystem() {
    return `<div class="s-card">
        <div class="s-card-head"><div><h3>System Configuration</h3><p>Core backend settings stored in D1 settings table</p></div></div>
        <div class="section-label">CORS & Cache</div>
        <div class="toggle-row">
            <label class="toggle-switch"><input type="checkbox" id="sys_cors_enabled" ${S('system','cors_enabled','0')==='1'?'checked':''} /><span class="toggle-track"></span></label>
            <span class="toggle-label">Enable CORS enforcement</span>
        </div>
        <p style="margin:-8px 0 12px;font-size:12px;color:var(--text-muted,#888);">If the origins below are wrong or incomplete while this is on, login will fail for everyone.</p>
        <div class="f-row">
            <label>CORS Allowed Origins (comma-separated)</label>
            <textarea id="sys_cors" style="min-height:80px;font-family:monospace;font-size:12px;">${esc(S('system','cors_allowed_origins',''))}</textarea>
        </div>
        <div class="f-row" style="max-width:320px;">
            <label>Ticket Cache Key</label>
            <input type="text" id="sys_cache_key" value="${esc(S('system','ticket_cache_key','ticket-list'))}" />
        </div>
        <div class="section-label">JWT & Lock Timeouts</div>
        <div class="f-grid-3">
            <div class="f-row"><label>JWT Expiry (seconds)</label><input type="number" id="sys_jwt_expiry" value="${esc(S('system','jwt_expiry_seconds','86400'))}" /></div>
            <div class="f-row"><label>Lock Timeout Write (ms)</label><input type="number" id="sys_lock_write" value="${esc(S('system','lock_timeout_write_ms','45000'))}" /></div>

async function addLang() {
    const code = document.getElementById('newLangCode').value.trim().toLowerCase(), name = document.getElementById('newLangName').value.trim();
    if (!code || !name) { toast('Fill all fields', 'error'); return; }
    const langs = getLanguages();
    if (langs.some(l => l.code === code)) { toast('Language code already exists', 'error'); return; }
    langs.push({ code, name });
    const ok = await saveSettings([{ category:'languages', key:'list', value: JSON.stringify(langs) }]);

    const ok = await saveSettings([{ category:'languages', key:'list', value: JSON.stringify(langs) }]);
    ok ? toast('✅ Language removed') : toast('❌ Failed', 'error');
    if (ok) await load();
}

// ─── INCOMING TAB ─────────────────────────────────────────────
async function buildIncomingTab(cats, langs) {
    let activeLang = sessionStorage.getItem('ar_active_lang') || (langs.length > 0 ? langs[0].code : 'en');

    // ── Cloudflare Domains Section ──
    let domainsHtml = '';
    if (cloudflareDomains.length > 0) {
        domainsHtml = cloudflareDomains.map(domain => {
            const isConfigured = domain.id === configuredZoneId;
            const statusClass = domain.status === 'active' ? 'active' : domain.status === 'pending' ? 'pending' : 'inactive';
            return `<div class="domain-row">
                <span class="domain-name">${esc(domain.name)}</span>
                <span class="status-badge ${statusClass}">${domain.status || 'unknown'}</span>
                <span style="font-size:11px;color:var(--text-muted);">${esc(domain.id.substring(0, 16))}...</span>
                <div style="display:flex;gap:6px;">
                    ${isConfigured ? 
                        `<span style="color:var(--success);font-size:12px;font-weight:600;">✅ Configured</span>` :
                        `<button class="btn btn-accent btn-sm" onclick="configureDomain('${domain.id}', '${domain.name}')">Use This Domain</button>`
                    }
                </div>
            </div>`;
        }).join('');
    } else {
        domainsHtml = '<div class="empty-state">No domains found in Cloudflare. <a href="domain-setup.html" style="color:var(--accent);">Add a domain →</a></div>';
    }

    // ── Email Routing Rules (MERGED: Cloudflare + DB) ──
    const catOpts = cats.map(c => `<option value="${c}">${cap(c)}</option>`).join('');
    const langOpts2 = langs.map(l => `<option value="${l.code}">${l.code} - ${l.name}</option>`).join('');
    
    let mergedRules = [];
    
    if (configuredZoneId && cloudflareRules.length > 0) {
        mergedRules = cloudflareRules.map(rule => {
            let email = '*';
            if (rule.matchers && rule.matchers.length > 0) {
                const matcher = rule.matchers[0];
                if (matcher.type === 'all') {
                    email = '*@*';
                } else if (matcher.value) {
                    email = matcher.value;
                }
            }
            
            const dbMapping = emailAddresses.find(a => a.email.toLowerCase() === email.toLowerCase());
            
            return {
                ruleId: rule.id,
                email: email,
                cloudflareEnabled: rule.enabled !== false,
                dbMapping: dbMapping || null,
                category: dbMapping ? dbMapping.action || dbMapping.label : '',
                language: dbMapping ? dbMapping.language || 'en' : 'en',
                hasMapping: !!dbMapping
            };
        });
    } else if (emailAddresses.length > 0) {
        mergedRules = emailAddresses.map(addr => ({
            ruleId: null,
            email: addr.email,
            cloudflareEnabled: false,
            dbMapping: addr,
            category: addr.action || addr.label || '',
            language: addr.language || 'en',
            hasMapping: true
        }));
    }

    const emailRows = mergedRules.map((item) => {
        const email = item.email;
        const isActive = item.cloudflareEnabled;
        const category = item.category || '';
        const language = item.language || 'en';
        const ruleId = item.ruleId;
        
        const catSel = cats.map(c => `<option value="${c}"${c===category?' selected':''}>${cap(c)}</option>`).join('');
        const langSel = langs.map(l => `<option value="${l.code}"${l.code===language?' selected':''}>${l.code} - ${l.name}</option>`).join('');
        
        return `<div class="email-row" data-rule-id="${ruleId || ''}" data-email="${esc(email)}">
            <span class="email-addr">${esc(email)}</span>
            <select class="category-select" onchange="updateMapping(this)" data-email="${esc(email)}" style="padding:5px 8px;background:var(--bg-input);border:1px solid var(--border);border-radius:5px;color:var(--text);width:100%;font-size:12px;">${catSel}</select>
            <select class="language-select" onchange="updateMapping(this)" data-email="${esc(email)}" style="padding:5px 8px;background:var(--bg-input);border:1px solid var(--border);border-radius:5px;color:var(--text);width:100%;font-size:12px;">${langSel}</select>
            ${ruleId ? 
                `<span class="status-badge ${isActive ? 'active' : 'inactive'}">${isActive ? 'Active' : 'Inactive'}</span>` :
                `<span style="font-size:10px;color:var(--warning);">⚠️ No Cloudflare rule</span>`
            }
            <div class="actions">
                ${ruleId ? 
                    `<button class="btn btn-ghost btn-sm" onclick="toggleCloudflareRule('${ruleId}', ${!isActive})" title="${isActive ? 'Deactivate' : 'Activate'} rule">${isActive ? '🔴' : '🟢'}</button>` :

async function buildOutgoingTab(cats, langs) {

    try { const res = await api('/api/admin/auto-reply'); if (res.success && Array.isArray(res.data)) autoReplies = res.data; } catch (e) {}

    // ── Auto-reply items ──
    const arItems = cats.map(cat => {
        const ar = autoReplies.find(a => a.category === cat && a.language === activeLang) || {};
        const enabled = ar.enabled ? 1 : 0, subject = ar.subject || `[Ticket {{ticket_id}}] Your ${cat} inquiry`, body = ar.body || '', from = ar.from || '';
        const color = S('category', cat+'_color', '#8892b0');
        const fromOpts = `<option value="">Default</option>` + emailAddresses.map(a => `<option value="${esc(a.email)}"${a.email===from?' selected':''}>${esc(a.email)}</option>`).join('');
        return `<div class="ar-item" id="aritem-${cat}">
            <div class="ar-item-head" onclick="document.getElementById('aritem-${cat}').classList.toggle('open')">

                <span class="cat-dot" style="background:${esc(color)};width:10px;height:10px;border-radius:50%;flex-shrink:0;"></span>
                <span class="ar-cat-name">${esc(cap(cat))}</span>

            </div>
            <div class="ar-body">
                <div class="toggle-row" style="margin-bottom:20px;"><label class="toggle-switch"><input type="checkbox" id="ar_en_${cat}" ${enabled?'checked':''} /><span class="toggle-track"></span></label><span class="toggle-label">Send auto-reply when a <strong>${cat}</strong> ticket is created</span></div>
                <div class="f-row"><label>Send from address</label><select id="ar_from_${cat}">${fromOpts}</select></div>
                <div class="f-row"><label>Subject line</label>${tagBar('ar_subj_'+cat)}<input type="text" id="ar_subj_${cat}" value="${esc(subject)}" /></div>

                </div>
            </div>
        </div>`;
    }).join('');

    const langOpts = langs.map(l => `<option value="${esc(l.code)}"${l.code===activeLang?' selected':''}>${esc(l.name)}</option>`).join('');

    // ── Outgoing email footers ──
    const oeItems = emailAddresses.map(addr => {
        const safeKey = addr.email.replace(/[^a-z0-9]/gi, '_'), footerKey = 'footer_' + safeKey, footer = S('email', footerKey, ''), hasFooter = footer.length > 0;
        return `<div class="oe-item">
            <div class="oe-item-head"><span style="width:8px;height:8px;border-radius:50%;background:${hasFooter?'var(--success)':'var(--border)'};flex-shrink:0;"></span><span class="oe-email-label">${esc(addr.email)}</span><span class="oe-cat-badge">${esc(addr.action||addr.label||'—')}</span><span class="oe-footer-status ${hasFooter?'has-footer':''}">${hasFooter?'Custom footer set':'No footer'}</span></div>
            <div class="oe-body">
                <div class="f-row"><label>Footer HTML</label><textarea id="oe_footer_${safeKey}" rows="7">${esc(footer)}</textarea></div>
                <div style="display:flex;gap:8px;margin-top:4px;align-items:center;">

    const fromOpts = `<option value="">Select sender...</option>` + emailAddresses.map(a => `<option value="${esc(a.email)}">${esc(a.email)}</option>`).join('');

    return `

        </div>
        <button class="btn btn-accent" style="margin-top:8px;" onclick="saveOutgoingSettings()">Save Outgoing Settings</button>
    </div>

    <!-- ─── AUTO-REPLY RULES ─── -->
    <div class="collapse-section open" id="sec-autoreply">
        <div class="collapse-head" onclick="toggleSection('sec-autoreply')">

        <div class="collapse-body">
            <p style="font-size:12px;color:var(--text-muted);margin-bottom:16px;">Configure automatic reply sent when a ticket is created.</p>
            <div class="f-row"><label>Language</label><select id="ar_lang_select" onchange="setArLanguage(this.value)">${langOpts}</select></div>

            <h4>✉️ Outgoing Email Footers</h4>
            <span class="collapse-chevron">▶</span>
        </div>
        <div class="collapse-body">
            <p style="font-size:12px;color:var(--text-muted);margin-bottom:16px;">Set a per-address HTML footer appended to every outgoing email.</p>

                <label>From Address</label>

// ─── INCOMING FUNCTIONS ────────────────────────────────────────
async function refreshDomains() {
    await fetchCloudflareDomains();
    if (configuredZoneId) {
        await fetchCloudflareRules(configuredZoneId);
    }
    const panel = document.getElementById('panel-incoming');
    if (panel) panel.innerHTML = await buildIncomingTab(getCategories(), getLanguages());
    toast('✅ Refreshed');
}

async function configureDomain(zoneId, domainName) {
    if (!confirm(`Use domain "${domainName}" for email routing?`)) return;
    try {
        const ok = await saveSettings([
            { category: 'cloudflare', key: 'zone_id', value: zoneId },
            { category: 'cloudflare', key: 'domain', value: domainName }
        ]);
        if (ok) {
            configuredZoneId = zoneId;
            configuredDomain = domainName;
            await fetchCloudflareRules(zoneId);
            toast(`✅ Domain ${domainName} configured`);
            const panel = document.getElementById('panel-incoming');
            if (panel) panel.innerHTML = await buildIncomingTab(getCategories(), getLanguages());
        } else {
            toast('❌ Failed to save domain', 'error');
        }
    } catch (e) {
        toast('❌ ' + e.message, 'error');
    }
}

async function createCloudflareRule(email) {
    if (!configuredZoneId) {
        toast('Select a domain first', 'error');
        return;
    }
    try {
        const res = await api('/api/admin/setup/routing-rule', {
            method: 'POST',
            body: JSON.stringify({ 
                zoneId: configuredZoneId,
                emailPattern: email,
                workerName: 'dornorium'
            })
        });
        if (res.success) {
            toast('✅ Cloudflare rule created');
            await fetchCloudflareRules(configuredZoneId);
            const panel = document.getElementById('panel-incoming');
            if (panel) panel.innerHTML = await buildIncomingTab(getCategories(), getLanguages());
        } else {
            toast('❌ ' + (res.error || 'Failed'), 'error');
        }
    } catch (e) {
        toast('❌ ' + e.message, 'error');
    }
}

async function toggleCloudflareRule(ruleId, newStatus) {
    if (!configuredZoneId) {
        toast('Select a domain first', 'error');
        return;
    }
    try {
        const res = await api(`/api/admin/setup/routing-rule/${ruleId}`, {
            method: 'PUT',
            body: JSON.stringify({ 
                zoneId: configuredZoneId, 
                enabled: newStatus 
            })
        });
        
        if (res.success) {
            toast(`✅ Rule ${newStatus ? 'activated' : 'deactivated'}`);
            await fetchCloudflareRules(configuredZoneId);
            const panel = document.getElementById('panel-incoming');
            if (panel) panel.innerHTML = await buildIncomingTab(getCategories(), getLanguages());
        } else {
            toast('❌ ' + (res.error || 'Failed'), 'error');
        }
    } catch (e) {
        toast('❌ ' + e.message, 'error');
    }
}

async function updateMapping(selectElement) {
    const email = selectElement.dataset.email;
    const row = selectElement.closest('.email-row');
    const categorySelect = row.querySelector('.category-select');
    const languageSelect = row.querySelector('.language-select');
    
    const category = categorySelect.value;
    const language = languageSelect.value;
    
    if (!email || !category || !language) {
        toast('Missing data', 'error');
        return;
    }
    
    let existing = emailAddresses.find(a => a.email.toLowerCase() === email.toLowerCase());
    
    try {
        if (existing) {
            const res = await api(`/api/admin/email-addresses/${existing.id}`, {
                method: 'PUT',
                body: JSON.stringify({
                    email: existing.email,
                    label: category,
                    action: category,
                    language: language,
                    is_active: existing.is_active ? 1 : 0
                })
            });
            
            if (res.success) {
                toast('✅ Mapping updated');
                existing.action = category;
                existing.language = language;
            } else {
                toast('❌ ' + (res.error || 'Failed'), 'error');
            }
        } else {
            const res = await api('/api/admin/email-addresses', {
                method: 'POST',
                body: JSON.stringify({
                    email: email,
                    label: category,
                    action: category,
                    language: language
                })
            });
            if (res.success) {
                toast('✅ Mapping created');
                await load();
                const panel = document.getElementById('panel-incoming');
                if (panel) panel.innerHTML = await buildIncomingTab(getCategories(), getLanguages());
            } else {
                toast('❌ ' + (res.error || 'Failed'), 'error');
            }
        }
    } catch (e) {
        toast('❌ ' + e.message, 'error');
    }
}

async function addEmail() {
    const email = document.getElementById('newEmailAddr').value.trim();
    const category = document.getElementById('newEmailCat').value;
    const language = document.getElementById('newEmailLang').value;
    
    if (!email) { toast('Enter an email address', 'error'); return; }
    if (!category) { toast('Select a category', 'error'); return; }
    if (!language) { toast('Select a language', 'error'); return; }
    
    if (emailAddresses.some(a => a.email.toLowerCase() === email.toLowerCase())) {
        toast('Email already exists', 'warning');
        return;
    }
    
    try {
        let cloudflareCreated = false;
        if (configuredZoneId) {
            const cfRes = await api('/api/admin/setup/routing-rule', {
                method: 'POST',
                body: JSON.stringify({ 
                    zoneId: configuredZoneId,
                    emailPattern: email,
                    workerName: 'dornorium'
                })
            });
            if (cfRes.success) {
                cloudflareCreated = true;
            } else {
                toast('⚠️ Cloudflare rule failed: ' + (cfRes.error || 'Unknown'), 'warning');
            }
        }
        
        const dbRes = await api('/api/admin/email-addresses', {
            method: 'POST',
            body: JSON.stringify({
                email: email,
                label: category,
                action: category,
                language: language
            })
        });
        
        if (dbRes.success) {
            toast(`✅ ${cloudflareCreated ? 'Email added with Cloudflare rule' : 'Email added (no Cloudflare rule)'}`);
            await load();
            const panel = document.getElementById('panel-incoming');
            if (panel) panel.innerHTML = await buildIncomingTab(getCategories(), getLanguages());
            document.getElementById('newEmailAddr').value = '';
        } else {
            toast('❌ Failed to add DB mapping: ' + (dbRes.error || 'Unknown'), 'error');
        }
    } catch (e) {
        toast('❌ ' + e.message, 'error');
    }
}

async function deleteEmail(email, ruleId) {
    if (!confirm(`Delete "${email}"? This will remove Cloudflare rule and DB mapping.`)) return;
    
    try {
        if (ruleId && configuredZoneId) {
            const cfRes = await api(`/api/admin/setup/routing-rule/${ruleId}`, {
                method: 'DELETE',
                body: JSON.stringify({ zoneId: configuredZoneId })
            });
            if (!cfRes.success) {
                toast('⚠️ Cloudflare rule delete failed: ' + (cfRes.error || 'Unknown'), 'warning');
            }
        }
        
        const existing = emailAddresses.find(a => a.email.toLowerCase() === email.toLowerCase());
        if (existing) {
            const dbRes = await api(`/api/admin/email-addresses/${existing.id}`, { method: 'DELETE' });
            if (!dbRes.success) {
                toast('⚠️ DB mapping delete failed: ' + (dbRes.error || 'Unknown'), 'warning');
            }
        }
        
        toast('✅ Deleted');
        await load();
        const panel = document.getElementById('panel-incoming');
        if (panel) panel.innerHTML = await buildIncomingTab(getCategories(), getLanguages());
    } catch (e) {
        toast('❌ ' + e.message, 'error');
    }
}

async function saveIncomingSettings() {
    const ok = await saveSettings([
        { category:'tickets', key:'email_body_max_length', value: document.getElementById('em_body_max').value },
        { category:'tickets', key:'reply_delimiter', value: document.getElementById('em_reply_delim').value },
    ]);
    ok ? toast('✅ Incoming settings saved') : toast('❌ Failed', 'error');
    if (ok) await load();
}

// ─── OUTGOING FUNCTIONS ────────────────────────────────────────
async function saveOutgoingSettings() {
    const updates = [
        { category:'email', key:'default_from', value: document.getElementById('em_default_from').value.trim() },
        { category:'email', key:'password_reset_from', value: document.getElementById('em_password_reset_from').value.trim() },
        { category:'general', key:'script_url', value: document.getElementById('em_script_url').value.trim() },
        { category:'email_script', key:'username', value: document.getElementById('em_script_username').value.trim() },
        { category:'tickets', key:'newsletter_batch_size', value: document.getElementById('em_nl_batch').value },
        { category:'newsletter', key:'unsubscribe_link_path', value: document.getElementById('em_unsub_path').value.trim() },
    ];

    const newPassword = document.getElementById('em_script_password').value;
    const newSecret = document.getElementById('em_script_secret').value;

    try {
        if (newPassword) {
            const enc = await api('/api/admin/setup/encrypt', { method: 'POST', body: JSON.stringify({ value: newPassword }) });
            if (!enc.encrypted) throw new Error(enc.error || 'Failed to encrypt password');
            updates.push({ category:'email_script', key:'password', value: enc.encrypted });
        }
        if (newSecret) {
            const enc = await api('/api/admin/setup/encrypt', { method: 'POST', body: JSON.stringify({ value: newSecret }) });
            if (!enc.encrypted) throw new Error(enc.error || 'Failed to encrypt secret');
            updates.push({ category:'email_script', key:'secret', value: enc.encrypted });
        }
    } catch (e) {
        toast('❌ ' + e.message, 'error');
        return;
    }

    const ok = await saveSettings(updates);
    ok ? toast('✅ Outgoing settings saved') : toast('❌ Failed', 'error');
    if (ok) {
        document.getElementById('em_script_password').value = '';
        document.getElementById('em_script_secret').value = '';
        await load();
    }
}

    const statusEl = document.getElementById('test_status');
    
    if (!from) { toast('Select a "From" address', 'error'); return; }
    if (!to) { toast('Enter a recipient email address', 'error'); return; }
    
    statusEl.textContent = '⏳ Sending...';
    
    try {
        // Use the existing sendEmail logic via the ticket reply endpoint
        // We'll create a temporary ticket to send the test
        const res = await api('/api/message', {
            method: 'POST',
            body: JSON.stringify({
                email: to,
                name: 'Test User',
                subject: subject,
                message: body,
                category: 'test',
                language: 'en',
                metadata: { test: true }
            })
        });
        
        if (res.success && res.ticketId) {
            // Send a reply to the test ticket
            const replyRes = await api(`/api/admin/ticket/${res.ticketId}/reply`, {
                method: 'POST',
                body: JSON.stringify({ from: from, body: body })
            });
            
            if (replyRes.success) {
                statusEl.textContent = '✅ Sent! Check your inbox.';
                toast('✅ Test email sent to ' + to);
            } else {
                statusEl.textContent = '❌ Failed to send: ' + (replyRes.error || 'Unknown error');
                toast('❌ Failed to send test email', 'error');
            }
        } else {
            statusEl.textContent = '❌ Failed to create test ticket';
            toast('❌ Failed to create test ticket', 'error');
        }
    } catch (e) {
        statusEl.textContent = '❌ Error: ' + e.message;
        toast('❌ ' + e.message, 'error');
    }
}

async function saveFooter(email, safeKey) { 
    const body = document.getElementById('oe_footer_'+safeKey).value; 
    const ok = await saveSettings([{ category:'email', key:'footer_'+safeKey, value: body }]); 
    if (ok) { 
        toast('✅ Footer saved for '+email); 
        const s = document.getElementById('oe_status_'+safeKey); 
        if (s) { s.textContent = 'Saved ✓'; setTimeout(() => s.textContent = '', 2500); } 
    } else toast('❌ Save failed','error'); 
}

async function clearFooter(email, safeKey) { 
    if (!confirm('Clear footer for '+email+'?')) return; 
    document.getElementById('oe_footer_'+safeKey).value = ''; 
    await saveFooter(email, safeKey); 
    await load(); 
}

// ─── AUTO-REPLY FUNCTIONS ──────────────────────────────────────
async function setArLanguage(lang) { 
    sessionStorage.setItem('ar_active_lang', lang); 
    const panel = document.getElementById('panel-outgoing'); 
    if (panel) panel.innerHTML = await buildOutgoingTab(getCategories(), getLanguages()); 
}

async function saveAr(cat, lang) {
    const enabled = document.getElementById('ar_en_'+cat).checked ? 1 : 0;
    const subject = document.getElementById('ar_subj_'+cat).value;
    const body = document.getElementById('ar_body_'+cat).value;
    const from = document.getElementById('ar_from_'+cat).value;
    const d = await api('/api/admin/auto-reply', { 
        method:'PUT', 
        body:JSON.stringify({ category:cat, language:lang, enabled, subject, body, from }) 
    });
    if (d.success) { 
        toast('✅ Auto-reply saved'); 
        const s = document.getElementById('ar_status_'+cat); 
        if (s) { s.textContent = 'Saved ✓'; setTimeout(() => s.textContent = '', 2500); } 
    } else toast('❌ Save failed', 'error');
}

async function deleteAr(cat, lang) { 
    if (!confirm(`Remove auto-reply for "${cat}" in ${lang}?`)) return; 
    const d = await api('/api/admin/auto-reply', { 
        method:'DELETE', 
        body:JSON.stringify({ category:cat, language:lang }) 
    }); 
    d.success ? (toast('✅ Auto-reply cleared'), load()) : toast('❌ Failed','error'); 
}

// ─── INIT ──
load();
renderUserBadge();

async function purgeTicketCacheClick() {
    if (!canEditSettings()) return;
    if (!confirm('Purge the ticket cache?')) return;
    try { 
        const res = await api('/api/admin/cache/purge', { method:'POST' }); 
        res.success ? toast('🗑️ Ticket cache cleared') : toast(res.error||'Failed','error'); 
    } catch (e) { toast(e.message||'Failed','error'); }
}
