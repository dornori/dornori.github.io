<!DOCTYPE html>
<html lang="en">
<head>

   <link rel="stylesheet" href="css/style.css" />
    <script src="js/shared.js"></script>
    <style>

        .tab-strip button:hover { color: var(--text); }

        .f-row input[type="color"] { height: 38px; padding: 3px 6px; cursor: pointer; }
        .f-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; z-index: 9999; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateY(0); }

        .toast.error { background: var(--bg-secondary); color: var(--error); border-left: 4px solid var(--error); }

        .empty-state { text-align: center; padding: 32px; color: var(--text-muted); font-size: 14px; }
        .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
        .section-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--accent); margin: 24px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
        .collapse-section { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
        .collapse-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-input); cursor: pointer; user-select: none; }

        .poll-log { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; font-family: monospace; font-size: 12px; color: var(--text-muted); max-height: 150px; overflow-y: auto; margin-top: 8px; white-space: pre-wrap; }
        .poll-log .ok { color: var(--success); }

        .step-indicator { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }

        .step-indicator .step.active { background: var(--accent); color: #fff; }

        @media (max-width: 1024px) { .email-row { grid-template-columns: 1fr; gap: 6px; } .domain-row { grid-template-columns: 1fr; gap: 6px; } .add-row { flex-direction: column; } .add-row .f-row { min-width: 100%; } }
    </style>
</head>
<body data-page="settings">
<div class="container">
    <div class="header">
        <h1 class="brand-logo"><a href="https://www.dornori.info/dornorium" class="brand-logo-link"><span class="brand-icon">⚙️</span><span class="brand-text">Dornorium</span></a></h1>
        <div class="header-right">
            <div class="nav-links">
                <a id="nav-dashboard" href="dashboard.html">🎫 <span>Dashboard</span></a>
                <a id="nav-reports" href="reports.html">📊 <span>Reports</span></a>
                <a id="nav-newsletter" href="newsletter.html">📧 <span>Newsletter</span></a>
                <a id="nav-order-reply" href="order-reply.html">📦 <span>Order Reply</span></a>
                <a id="nav-settings" href="settings.html" class="active">⚙️ <span>Settings</span></a>
                <a id="nav-users" href="users.html">👥 <span>Users</span></a>
            </div>
            <script>
                (function(){
                    document.querySelectorAll('.nav-links a').forEach(function(a){
                        if (a.classList.contains('active')) return;
                        var slug = a.getAttribute('href').replace(/\.html$/, '');
                        fetch(a.getAttribute('href'), { method: 'GET', cache: 'no-store' })
                            .then(function(res){ return res.text().then(function(html){
                                var marker = 'data-page="' + slug + '"';
                                if (res.status !== 200 || html.indexOf(marker) === -1) a.style.display = 'none';
                            }); })
                            .catch(function(){ a.style.display = 'none'; });
                    });
                })();
            </script>

            <div class="nav-actions">
                <button id="purgeCacheBtn" class="btn-purge" onclick="purgeTicketCacheClick()">🗑️ Purge Cache</button>
                <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
                <div id="userDisplay"></div>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <div class="tab-strip" id="tabStrip"></div>
    <div id="tabContent"><div class="loading">Loading…</div></div>
</div>

<div id="toast" class="toast"></div>

<script>
// setTheme() / toggleTheme() come from shared.js
setTheme(localStorage.getItem('theme') || 'light');

// ── Auth ──
const token = localStorage.getItem('token');
const storedUser = localStorage.getItem('user');
const currentUser = storedUser ? JSON.parse(storedUser) : null;

if (!token || !currentUser || !hasAccess('settings', 'view')) {
    document.body.innerHTML = '<div style="padding: 40px; text-align: center;"><h1>⛔ Access Denied</h1><p>You don\'t have permission to access settings.</p><a href="dashboard.html" style="color: var(--accent);">← Back to Dashboard</a></div>';
    throw new Error('Settings access required');
}

(async function refreshCurrentUser() {
    try {
        const res = await fetch(API_BASE + '/api/admin/me', { headers: { Authorization: 'Bearer ' + token } });
        if (!res.ok) return;
        const data = await res.json();
        if (data.success && data.user) {
            currentUser.role = data.user.role;
            currentUser.page_permissions = data.user.page_permissions || {};
            currentUser.effective_permissions = data.user.effective_permissions || {};
            currentUser.allowed_languages = data.user.allowed_languages || [];
            currentUser.allowed_emails = data.user.allowed_emails || [];
            currentUser.allowed_categories = data.user.allowed_categories || [];
            currentUser.team_id = data.user.team_id || null;
            localStorage.setItem('user', JSON.stringify(currentUser));
            if (!hasAccess('settings', 'view')) { window.location.href = 'dashboard.html'; return; }
            if (typeof load === 'function') load();
        }
    } catch (e) {}
})();

function canEditSettings() { return hasAccess('settings', 'edit'); }
function canCreateSettings() { return hasAccess('settings', 'create'); }
function canDeleteSettings() { return hasAccess('settings', 'delete'); }

['nav-reports','nav-newsletter','nav-users'].forEach(id => {
    const page = id.replace('nav-', '');
    const el = document.getElementById(id);
    if (!el) return;
    const allowed = hasPageAccess(page);
    el.classList.toggle('nav-disabled', !allowed);
    if (!allowed) el.addEventListener('click', e => e.preventDefault());
});
const purgeBtn = document.getElementById('purgeCacheBtn');
if (purgeBtn) purgeBtn.disabled = !canEditSettings();

// ── API ──
async function api(path, opts = {}) {
    const headers = {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json',
        ...(opts.headers || {})
    };
    
    const response = await fetch(API_BASE + path, {
        ...opts,
        headers
    });
    
    if (response.status === 401) {
        localStorage.removeItem('token');
        throw new Error('Unauthorized');
    }
    if (response.status === 403) {
        throw new Error('Permission denied');
    }
    
    const text = await response.text();
    if (!text || text.trim() === '') {
        return { success: false, status: response.status, error: 'Empty response' };
    }
    try {
        return JSON.parse(text);
    } catch (e) {
        return { success: false, status: response.status, error: 'Invalid JSON: ' + e.message };
    }
}

// ── Toast ──
function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.innerHTML = msg;
    el.className = 'toast show ' + type;
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => el.classList.remove('show'), type === 'warning' ? 8000 : 3500);
}

// ── State ──
let settings = [], emailAddresses = [], outgoingAddresses = [], currentTab = 'system';
let cloudflareDomains = [];
let cloudflareRules = [];
let configuredZoneId = null;
let configuredDomain = null;

// Domain setup state
let setupZoneId = null;
let setupDomainName = null;
let setupPollTimer = null;
let setupStep = 0;

function S(cat, key, def = '') {
    const s = settings.find(s => s.category === cat && s.key === key);
    return s ? s.value : def;
}

function getCategories() {
    const cats = new Set();
    settings.forEach(s => {
        if (s.category === 'category' && s.key.endsWith('_description') && s.value !== '__deleted__') cats.add(s.key.replace('_description', ''));
    });
    return Array.from(cats);
}

function getLanguages() {
    try { return JSON.parse(S('languages', 'list', '[]')); } catch (e) { return []; }
}

function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
function esc(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

// ── Refresh Helper ──
function refreshIncomingTab() {
    const panel = document.getElementById('panel-incoming');
    if (panel) {
        buildIncomingTab(getCategories(), getLanguages()).then(html => {
            if (panel) panel.innerHTML = html;
        });
    }
}

function refreshOutgoingTab() {
    const panel = document.getElementById('panel-outgoing');
    if (panel) {
        buildOutgoingTab(getCategories(), getLanguages()).then(html => {
            if (panel) panel.innerHTML = html;
        });
    }
}

function refreshDomainsTab() {
    return buildDomainsTab().then(html => {
        const panel = document.getElementById('panel-domains');
        if (panel) panel.innerHTML = html;
        // Keep incoming tab in sync if visible
        const incPanel = document.getElementById('panel-incoming');
        if (incPanel && incPanel.innerHTML && !incPanel.innerHTML.includes('Loading')) {
            refreshIncomingTab();
        }
    });
}

// ── Domain Dashboard ──
async function buildDomainsTab() {
    await fetchCloudflareDomains();
    const canEdit = canEditSettings();

    const domainIds = [];
    const domainCards = cloudflareDomains.map(z => {
        const routeType = z.route_type || 'none';
        const routeTarget = z.route_target || '';
        const dbStatus = z.db_status || z.status || 'unknown';
        const cfStatus = z.status || 'unknown';
        const dnsActive = dbStatus !== 'pending_setup' && cfStatus === 'active';

        let dnsBadge, resumeBtn, deleteBtn;

        if (dbStatus === 'pending_setup') {
            dnsBadge = `<span class="status-badge pending">⏳ DNS Pending</span>`;
            resumeBtn = `<button class="btn btn-sm btn-accent" onclick="domainCheckStatus('${z.id}', '${esc(z.name)}')">Resume Setup</button>`;
        } else if (dnsActive) {
            dnsBadge = `<span class="status-badge active">✅ DNS Active</span>`;
            resumeBtn = '';
        } else {
            dnsBadge = `<span class="status-badge inactive">⚠️ DNS Not Active</span>`;
            resumeBtn = `<button class="btn btn-sm btn-accent" onclick="domainCheckStatus('${z.id}', '${esc(z.name)}')">Check Nameservers</button>`;
        }

        deleteBtn = canEdit
            ? `<button class="btn btn-sm btn-danger" onclick="removeDomain('${z.id}', '${esc(z.name)}')" title="Remove domain">🗑️ Remove</button>`
            : '';

        const targetLabel = routeType === 'pages' ? 'Pages project name' : 'Destination URL';
        const targetPlaceholder = routeType === 'pages' ? 'my-pages-project' : 'https://example.com';
        const targetHint = routeType === 'pages'
            ? 'The project must already exist in Cloudflare Pages. Cloudflare will provision SSL automatically.'
            : 'Visitors will be 301-redirected here (query string preserved).';

        // Setup guide steps — DNS/zone only. Email routing lives on the Incoming tab.
        const nsBoxes = z.name_servers && z.name_servers.length
            ? z.name_servers.map(s => `<div class="nameserver-box"><span>${esc(s)}</span><button class="btn btn-sm btn-ghost" onclick="navigator.clipboard.writeText('${esc(s)}').then(()=>toast('Copied'))">Copy</button></div>`).join('')
            : '<p style="font-size:12px;color:var(--text-muted);">Nameserver info not available — refresh to load.</p>';

        const setupGuideId = `setup_guide_${z.id}`;
        const setupGuide = `
            <div id="${setupGuideId}" style="display:none;margin-top:14px;border-top:1px solid var(--border);padding-top:14px;">
                <h4 style="font-size:13px;font-weight:700;margin-bottom:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;">📋 Setup Guide</h4>
                <div style="display:grid;gap:12px;">
                    <div style="display:flex;gap:12px;align-items:flex-start;">
                        <span style="width:24px;height:24px;border-radius:50%;background:var(--success);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;">1</span>
                        <div>
                            <strong style="font-size:13px;">Domain added to Cloudflare</strong>
                            <p style="font-size:12px;color:var(--text-muted);margin:4px 0 0;">Zone ID: <code style="font-size:11px;">${esc(z.id)}</code></p>
                        </div>

// ── Live web-routing status check (DNS + Pages/redirect verification) ──
async function checkDomainRouteStatus(zoneId) {
    const box = document.getElementById(`route_status_${zoneId}`);
    if (!box) return;
    try {
        const res = await api(`/api/admin/setup/domain-route-status?zoneId=${encodeURIComponent(zoneId)}`);
        if (!res.success) {
            box.innerHTML = `<span class="status-badge inactive">⚠️ ${esc(res.error || 'Status check failed')}</span>`;
            return;
        }
        let badge;
        if (res.routeStatus === 'live') badge = `<span class="status-badge active">✅ Live</span>`;
        else if (res.routeStatus === 'provisioning') badge = `<span class="status-badge pending">⏳ Provisioning</span>`;
        else if (res.routeStatus === 'error') badge = `<span class="status-badge inactive">⚠️ Needs attention</span>`;
        else badge = `<span class="status-badge inactive">— Not configured</span>`;

        box.innerHTML = `
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                ${badge}
                <button class="btn btn-sm btn-ghost" onclick="checkDomainRouteStatus('${esc(zoneId)}')">🔄 Recheck</button>
            </div>
            <p style="font-size:11px;color:var(--text-muted);margin-top:6px;">${esc(res.routeDetail || '')}</p>
            ${!res.hasProxiedRecord && res.routeType !== 'none' ? '<p style="font-size:11px;color:var(--warning);margin-top:4px;">No proxied DNS record found for this domain yet.</p>' : ''}
        `;
    } catch (e) {
        box.innerHTML = `<span class="status-badge inactive">⚠️ ${esc(e.message)}</span>`;
    }
}

async function clearDomainRoute(zoneId) {
    if (!confirm('Clear routing for this domain? It will no longer point to any Pages project or redirect.')) return;
    try {
        const d = await api('/api/admin/setup/domain-route', {
            method: 'POST',
            body: JSON.stringify({ zoneId, mode: 'none', target: '' })
        });
        if (d.success) {
            toast('✅ Routing cleared');
            await refreshDomainsTab();
        } else {
            toast('❌ ' + (d.error || 'Failed'), 'error');
        }
    } catch (e) {
        toast('❌ ' + e.message, 'error');
    }
}

async function domainCheckStatus(zoneId, domainName) {
    setupZoneId = zoneId;
    setupDomainName = domainName;

}

function updateRouteTargetField(zoneId) {
    const mode = document.getElementById('route_mode_' + zoneId).value;
    const row = document.getElementById('route_target_row_' + zoneId);
    const label = document.getElementById('route_target_label_' + zoneId);
    const input = document.getElementById('route_target_' + zoneId);
    if (mode === 'none') { row.style.display = 'none'; return; }
    row.style.display = '';
    label.textContent = mode === 'pages' ? 'Pages project name' : 'Destination URL';
    input.placeholder = mode === 'pages' ? 'my-pages-project' : 'https://example.com';
}

async function saveDomainRoute(zoneId) {
    const mode = document.getElementById('route_mode_' + zoneId).value;
    const target = document.getElementById('route_target_' + zoneId).value.trim();
    if (mode !== 'none' && !target) { toast('Enter a target', 'error'); return; }
    try {
        const d = await api('/api/admin/setup/domain-route', {
            method: 'POST',
            body: JSON.stringify({ zoneId, mode, target })
        });
        if (d.success) {
            if (d.cf_note) {
                toast('⚠️ ' + d.cf_note, 'warning');
            } else if (d.cf_status && d.cf_status !== 'active') {
                toast('⏳ Saved — Cloudflare status: ' + d.cf_status, 'warning');
            } else {
                toast('✅ Domain routing saved');
            }
            await refreshDomainsTab();
        } else {
            toast('❌ ' + (d.error || 'Failed'), 'error');
        }
    } catch (e) {
        toast('❌ ' + e.message, 'error');
    }
}

// ── Load ──
async function load() {
    try {
        const [sd, ed, oed] = await Promise.all([
            api('/api/admin/settings'),
            api('/api/admin/incoming-email-addresses'),
            api('/api/admin/email-addresses?active_only=true')
        ]);
        settings = sd.settings || [];
        emailAddresses = ed.addresses || [];
        outgoingAddresses = oed.addresses || [];
        
        const zoneSetting = settings.find(s => s.category === 'cloudflare' && s.key === 'zone_id');
        configuredZoneId = zoneSetting ? zoneSetting.value : null;
        const domainSetting = settings.find(s => s.category === 'cloudflare' && s.key === 'domain');
        configuredDomain = domainSetting ? domainSetting.value : null;
        
        // If no zone in settings, use the first enabled domain from cloudflareDomains
        // (populated after fetchCloudflareDomains below)
        
        await fetchCloudflareDomains();
        
        // Always prefer the enabled domain from cloudflare_domains table (live CF data)
        // over the settings value which may be stale
        if (cloudflareDomains.length > 0) {
            const enabled = cloudflareDomains.find(d => d.db_enabled == 1) 
                         || cloudflareDomains.find(d => d.db_status === 'active')
                         || cloudflareDomains.find(d => d.status === 'active');
            if (enabled) {
                configuredZoneId = enabled.id;
                configuredDomain = enabled.name;
            }
        }
        
        const enabledZones = cloudflareDomains.filter(d => d.db_enabled == 1 || d.db_status === 'active');
        if (enabledZones.length > 0) {
            await fetchCloudflareRules(enabledZones.map(z => z.id));
        } else if (configuredZoneId) {
            await fetchCloudflareRules([configuredZoneId]);
        } else {
            cloudflareRules = [];
        }
        
        renderAll();
        switchTab(currentTab);
    } catch(e) {
        document.getElementById('tabContent').innerHTML = '<div class="loading">Error: ' + e.message + '</div>';
    }
}

async function fetchCloudflareDomains() {
    try {
        const res = await api('/api/admin/setup/cloudflare-zones');
        if (res.success) {
            cloudflareDomains = res.zones || [];
        } else {
            cloudflareDomains = [];
        }
    } catch (e) {
        cloudflareDomains = [];
    }
}

async function fetchCloudflareRules(zoneIds) {
    if (!Array.isArray(zoneIds)) zoneIds = [zoneIds];
    try {
        const results = await Promise.all(zoneIds.map(async zoneId => {
            try {
                const res = await api(`/api/admin/setup/routing-rules/${zoneId}`);
                return res.success ? (res.rules || []).map(r => ({ ...r, _zoneId: zoneId })) : [];
            } catch (e) { return []; }
        }));
        cloudflareRules = results.flat();
    } catch (e) {
        cloudflareRules = [];
    }
}

async function saveSettings(updates) {
    const d = await api('/api/admin/settings', { method: 'PUT', body: JSON.stringify({ settings: updates }) });
    return d.success;
}

function disableElements(selector, disabled) {
    document.querySelectorAll(selector).forEach(el => {
        if (disabled) { el.disabled = true; el.style.opacity = '0.5'; el.style.cursor = 'not-allowed'; el.title = 'Permission denied'; }
        else { el.disabled = false; el.style.opacity = '1'; el.style.cursor = ''; el.title = ''; }
    });
}

function renderAll() {
    document.getElementById('tabStrip').innerHTML = TABS.map(t =>
        `<button data-tab="${t.id}" onclick="switchTab('${t.id}')">${t.icon} ${t.label}</button>`
    ).join('');
    document.getElementById('tabContent').innerHTML = TABS.map(t =>
        `<div class="tab-panel" id="panel-${t.id}">${buildPanel(t.id)}</div>`
    ).join('');

function switchTab(id) {
    currentTab = id;
    document.querySelectorAll('.tab-strip button').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + id));
    const noEdit = !canEditSettings();
    if (id === 'incoming' || id === 'outgoing') {
        buildEmailTab(id).then(html => {
            const panel = document.getElementById('panel-' + id);
            if (panel) panel.innerHTML = html;
            if (noEdit) setTimeout(() => disableElements('#panel-' + id + ' input, #panel-' + id + ' textarea, #panel-' + id + ' select, #panel-' + id + ' button', true), 50);
        });
    }
    if (id === 'domains') {
        buildDomainsTab().then(html => {
            const panel = document.getElementById('panel-domains');
            if (panel) panel.innerHTML = html;
            if (noEdit) setTimeout(() => disableElements('#panel-domains input, #panel-domains textarea, #panel-domains select, #panel-domains button', true), 50);
        });
    }
    if (noEdit) setTimeout(() => disableElements(`#panel-${id} input, #panel-${id} textarea, #panel-${id} select, #panel-${id} button`, true), 50);
}

function buildPanel(id) {
    switch(id) {
        case 'system': return buildSystem();
        case 'security': return buildSecurity();
        case 'general': return buildGeneral();
        case 'sla': return buildSla();
        case 'categories': return buildCategories();
        case 'languages': return buildLanguages();
        case 'incoming':
        case 'outgoing': return '<div class="loading">Loading…</div>';
        case 'domains': return '<div class="loading">Loading…</div>';
        default: return '';
    }
}

// ─── DOMAIN SETUP FUNCTIONS ──────────────────────────────────
async function addDomain() {
    const domain = document.getElementById('setupDomain').value.trim().toLowerCase();
    if (!domain) { toast('Enter a domain name', 'error'); return; }
    
    const accountId = document.getElementById('cf_account_id').value.trim();
    if (!accountId) { toast('Enter Cloudflare Account ID first', 'error'); return; }
    
    const statusEl = document.getElementById('setupStatus');
    if (statusEl) statusEl.textContent = '⏳ Adding domain...';
    
    try {
        const res = await api('/api/admin/setup/cloudflare-zone', {
            method: 'POST',
            body: JSON.stringify({ domain: domain, accountId: accountId })
        });
        
        if (!res.success) {
            if (res.error && res.error.includes('already exists')) {
                toast('Domain already exists in Cloudflare', 'warning');
                await fetchCloudflareDomains();
                const existing = cloudflareDomains.find(d => d.name === domain);
                if (existing) {
                    setupZoneId = existing.id;
                    setupDomainName = domain;
                    setupStep = 2;
                    toast('✅ Domain found, showing nameservers');
                    refreshIncomingTab();
                    return;
                }
            }
            throw new Error(res.error || 'Failed to add domain');
        }
        
        setupZoneId = res.zoneId;
        setupDomainName = domain;
        setupStep = 2;
        
        await fetchCloudflareDomains();
        toast('✅ Domain added to Cloudflare');
        refreshIncomingTab();
        
    } catch (e) {
        if (statusEl) statusEl.textContent = '❌ ' + e.message;
        toast('❌ ' + e.message, 'error');
    }
}

function startPolling() {
    setupStep = 3;
    refreshIncomingTab();
    
    setTimeout(() => {
        if (setupPollTimer) clearInterval(setupPollTimer);
        setupPollTimer = setInterval(async () => {
            try {
                const res = await api(`/api/admin/setup/cloudflare-zone/${setupZoneId}`);
                if (!res.success) throw new Error(res.error || 'Failed to get status');
                
                const st = res.status || 'pending';
                
                if (st === 'active') {
                    stopPolling();
                    
                    // Update DB status to active
                    try {
                        await api('/api/admin/setup/domain-status', {
                            method: 'POST',
                            body: JSON.stringify({ zoneId: setupZoneId, status: 'active' })
                        });
                    } catch (e) { /* non-fatal */ }

                    // Save domain to settings so the domain field is updated
                    try {
                        await saveSettings([
                            { category: 'cloudflare', key: 'zone_id', value: setupZoneId },
                            { category: 'cloudflare', key: 'domain', value: setupDomainName }
                        ]);
                    } catch (e) { /* non-fatal */ }

                    // Auto-enable routing — no manual step needed
                    toast('✅ Domain active — enabling email routing...');
                    await enableRouting();
                    await load();
                    resetDomainSetup();
                }
            } catch (e) {
                console.warn('Polling error:', e.message);
            }
        }, 10000);
    }, 100);
}

function stopPolling() {
    if (setupPollTimer) {
        clearInterval(setupPollTimer);
        setupPollTimer = null;
    }
}

async function enableRouting() {
    let zoneId = setupZoneId || configuredZoneId;
    if (!zoneId) { toast('No zone configured', 'error'); return; }
    
    try {
        // Cloudflare refuses to enable Email Routing if non-Cloudflare MX records
        // already exist on the zone. Check first so we can give a clear fix instead
        // of a raw 400.
        const dnsCheck = await api(`/api/admin/setup/dns-records/${zoneId}`);
        if (dnsCheck.success) {
            const conflictingMx = (dnsCheck.records || []).filter(r =>
                r.type === 'MX' && !/\.mx\.cloudflare\.net\.?$/i.test(r.content || '')
            );
            if (conflictingMx.length) {
                const list = conflictingMx.map(r => `${r.name} → ${r.content}`).join('\n');
                if (!confirm(`Existing MX record(s) are blocking Email Routing:\n\n${list}\n\nRemove them and continue?`)) {
                    toast('Cancelled - remove the conflicting MX records first', 'warning');
                    return;
                }
                for (const r of conflictingMx) {
                    const del = await api(`/api/admin/setup/dns-records/${zoneId}/${r.id}`, { method: 'DELETE' });
                    if (!del.success) throw new Error('Failed to remove MX record ' + r.content + ': ' + (del.error || ''));
                }
            }
        }
        
        const res = await api('/api/admin/setup/email-routing', {
            method: 'POST',
            body: JSON.stringify({ zoneId: zoneId })
        });
        
        if (!res.success) throw new Error(res.error || 'Failed to enable routing');
        
        // Once Email Routing is enabled, Cloudflare locks the zone and manages
        // MX/SPF/DKIM itself - don't try to create them, just verify they're there.
        let dnsOk = false;
        try {
            const dnsCheck2 = await api(`/api/admin/setup/dns-records/${zoneId}`);
            if (dnsCheck2.success) {
                dnsOk = (dnsCheck2.records || []).some(r => r.type === 'MX');
            }
        } catch (e) { /* non-fatal */ }
        
        setupStep = 5;
        setupZoneId = zoneId;
        toast(dnsOk ? '✅ Email routing enabled with DNS records' : '⚠️ Email routing enabled - check DNS tab to confirm records', dnsOk ? 'success' : 'warning');
        refreshIncomingTab();
        
    } catch (e) {
        toast('❌ ' + e.message, 'error');
    }
}

async function createRoutingRule() {
    if (!setupZoneId) { toast('No zone to create rule for', 'error'); return; }
    
    const type = document.querySelector('input[name="ruleType"]:checked')?.value || 'catchall';
    let pattern = '*';
    if (type === 'specific') {
        const specific = document.getElementById('setupSpecificAddr').value.trim();
        if (!specific) { toast('Enter a specific email address', 'error'); return; }
        pattern = specific;
    }
    
    try {
        const res = await api('/api/admin/setup/routing-rule', {
            method: 'POST',
            body: JSON.stringify({ 
                zoneId: setupZoneId,
                emailPattern: pattern,
                workerName: S('cloudflare', 'worker_name', '')
            })
        });
        
        if (!res.success) throw new Error(res.error || 'Failed to create rule');
        
        await saveSettings([
            { category: 'cloudflare', key: 'zone_id', value: setupZoneId },
            { category: 'cloudflare', key: 'domain', value: setupDomainName }
        ]);
        
        configuredZoneId = setupZoneId;
        configuredDomain = setupDomainName;
        setupStep = 6;
        
        await fetchCloudflareRules(setupZoneId);
        toast('✅ Routing rule created! Setup complete.');
        refreshIncomingTab();
        
    } catch (e) {
        toast('❌ ' + e.message, 'error');
    }
}

function resetDomainSetup() {
    stopPolling();
    setupZoneId = null;
    setupDomainName = null;
    setupStep = 0;
    refreshIncomingTab();
    refreshDomainsTab();
}

    if (!confirm(`Remove outgoing address "${email}"?`)) return;
    try {
        const res = await api(`/api/admin/email-addresses/${id}`, { method: 'DELETE' });
        if (res.success) {
            toast('✅ Address removed');
            await load();
            switchTab('outgoing');
        } else {
            toast('❌ ' + (res.error || 'Failed'), 'error');
        }
    } catch (e) {
        toast('❌ ' + e.message, 'error');
    }
}

async function checkDomainStatus(zoneId, domainName) {
    // Resume polling for a domain in pending_setup state
    setupZoneId = zoneId;
    setupDomainName = domainName;
    startPolling();
}

async function cancelDomainSetup(zoneId) {
    if (!confirm(`Cancel setup for this domain? It will be removed from Cloudflare.`)) return;
    try {
        const res = await api(`/api/admin/setup/domain-remove`, {
            method: 'DELETE',
            body: JSON.stringify({ zoneId })
        });
        if (res.success) {
            toast('✅ Setup cancelled and domain removed');
            await load();
        } else {
            toast('❌ ' + (res.error || 'Failed to cancel'), 'error');
        }
    } catch (e) {
        toast('❌ ' + e.message, 'error');
    }
}

async function enableDomainRouting(zoneId, domainName) {
    if (!confirm(`Enable email routing for ${domainName}? Mail will start flowing to your Worker.`)) return;
    try {
        const res = await api('/api/admin/setup/email-routing', {
            method: 'POST',
            body: JSON.stringify({ zoneId })
        });
        if (res.success) {
            toast(`✅ Email routing enabled for ${domainName}`);
            await load();
        } else {
            toast('❌ ' + (res.error || 'Failed to enable routing'), 'error');
        }
    } catch (e) {
        toast('❌ ' + e.message, 'error');
    }
}

async function disableDomain(zoneId, domainName) {
    if (!confirm(`Disable email routing for ${domainName}? Mail will bounce if sent.`)) return;
    try {
        const res = await api('/api/admin/setup/email-routing-disable', {
            method: 'POST',
            body: JSON.stringify({ zoneId })
        });
        if (res.success) {
            toast(`✅ Email routing disabled for ${domainName}`);
            await load();
        } else {
            toast('❌ ' + (res.error || 'Failed to disable'), 'error');
        }
    } catch (e) {
        toast('❌ ' + e.message, 'error');
    }
}

async function removeDomain(zoneId, domainName) {
    if (!confirm(`⚠️ Remove ${domainName} completely?\n\nThis will permanently delete:\n• The domain from Cloudflare\n• All email routing rules\n• All configured email addresses for @${domainName}\n\nMail sent to this domain will bounce. This cannot be undone.`)) return;
    try {
        const res = await api(`/api/admin/setup/domain-remove`, {
            method: 'DELETE',
            body: JSON.stringify({ zoneId })
        });
        if (res.success) {
            toast(`✅ ${domainName} removed`);
            await load();
        } else {
            toast('❌ ' + (res.error || 'Failed to remove'), 'error');
        }
    } catch (e) {
        toast('❌ ' + e.message, 'error');
    }
}

// ─── INCOMING TAB ─────────────────────────────────────────────
async function buildIncomingTab(cats, langs) {
    let activeLang = sessionStorage.getItem('ar_active_lang') || (langs.length > 0 ? langs[0].code : 'en');

    // ── Cloudflare Domains ──
    let domainsHtml = '';
    if (cloudflareDomains.length > 0) {
        const tableRows = cloudflareDomains.map(domain => {
            const enabled = domain.db_enabled || 0;
            const dbStatus = domain.db_status || 'unknown';
            
            // Determine status display and button
            let statusClass, statusText, actions;
            
            if (dbStatus === 'pending_setup') {
                statusClass = 'pending';
                statusText = '⏳ Pending Setup';
                actions = `<button class="btn btn-sm btn-accent" onclick="checkDomainStatus('${domain.id}', '${esc(domain.name)}')">Check Status</button>
                           <button class="btn btn-sm btn-ghost" onclick="cancelDomainSetup('${domain.id}')">Cancel</button>`;
            } else if (enabled) {
                statusClass = 'active';
                statusText = '✅ Enabled';
                actions = `<button class="btn btn-sm btn-ghost" onclick="disableDomain('${domain.id}', '${esc(domain.name)}')">Disable</button>
                           <button class="btn btn-sm btn-danger" onclick="removeDomain('${domain.id}', '${esc(domain.name)}')">Remove</button>`;
            } else {
                statusClass = 'disabled';
                statusText = '⛔ Disabled';
                actions = `<button class="btn btn-sm btn-accent" onclick="enableDomainRouting('${domain.id}', '${esc(domain.name)}')">Enable</button>
                           <button class="btn btn-sm btn-danger" onclick="removeDomain('${domain.id}', '${esc(domain.name)}')">Remove</button>`;
            }
            
            return `<tr>
                <td>${esc(domain.name)}</td>
                <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                <td style="font-size:11px;font-family:monospace;color:var(--text-muted);">${esc(domain.id.substring(0, 16))}...</td>
                <td style="text-align:right;gap:6px;display:flex;justify-content:flex-end;">${actions}</td>
            </tr>`;
        }).join('');
        
        domainsHtml = `
            <table style="width:100%;border-collapse:collapse;margin-bottom:16px;">
                <thead>
                    <tr style="border-bottom:2px solid var(--border);">
                        <th style="text-align:left;padding:8px;font-size:12px;font-weight:600;color:var(--text-muted);">Domain</th>
                        <th style="text-align:left;padding:8px;font-size:12px;font-weight:600;color:var(--text-muted);">Status</th>
                        <th style="text-align:left;padding:8px;font-size:12px;font-weight:600;color:var(--text-muted);">Zone ID</th>
                        <th style="text-align:right;padding:8px;font-size:12px;font-weight:600;color:var(--text-muted);">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${tableRows}
                </tbody>
            </table>
        `;
    } else {
        domainsHtml = '<div class="empty-state">No domains found in Cloudflare. Use the setup below to add one.</div>';
    }

    // ── Domain Setup ──
    const setupHtml = buildDomainSetupHtml();

    // ── Email Routing Rules ──
    const catOpts = cats.map(c => `<option value="${c}">${cap(c)}</option>`).join('');
    const langOpts2 = langs.map(l => `<option value="${l.code}">${l.code} - ${l.name}</option>`).join('');
    
    let mergedRules = [];

    // Build a zoneId→domainName lookup
    const zoneNameMap = {};
    cloudflareDomains.forEach(d => { zoneNameMap[d.id] = d.name; });

    if (cloudflareRules.length > 0) {
        mergedRules = cloudflareRules.map(rule => {
            let email = '*';
            const zoneId = rule._zoneId || configuredZoneId || '';
            const domainName = zoneNameMap[zoneId] || zoneId;
            const isCatchAllRule = !rule.matchers || rule.matchers.length === 0 || rule.matchers[0]?.type === 'all';
            if (rule.matchers && rule.matchers.length > 0) {
                const matcher = rule.matchers[0];
                if (matcher.type === 'all') {
                    email = domainName ? `*@${domainName}` : '*@*';
                } else if (matcher.value) {
                    email = matcher.value;
                } else {
                    email = domainName ? `*@${domainName}` : '*@*';
                }
            } else {
                // empty matchers = catch-all
                email = domainName ? `*@${domainName}` : '*@*';
            }
            const dbMapping = emailAddresses.find(a => a.email.toLowerCase() === email.toLowerCase());
            return {
                ruleId: rule.id,
                zoneId: zoneId,
                domainName: domainName,
                email: email,
                isCatchAll: isCatchAllRule,
                cloudflareEnabled: rule.enabled !== false,
                dbMapping: dbMapping || null,
                category: dbMapping ? dbMapping.action || dbMapping.label : '',
                language: dbMapping ? dbMapping.language || 'en' : 'en',
                hasMapping: !!dbMapping
            };
        });
        // Also show DB addresses that have no CF rule yet — exclude wildcards
        const ruleEmails = new Set(mergedRules.map(r => r.email.toLowerCase()));
        emailAddresses.forEach(addr => {
            if (addr.email.startsWith('*') || addr.email === '*') return;
            if (!ruleEmails.has(addr.email.toLowerCase())) {
                const addrDomain = addr.email.split('@')[1]?.toLowerCase();
                const matchedZone = cloudflareDomains.find(d => d.name?.toLowerCase() === addrDomain);
                mergedRules.push({ ruleId: null, zoneId: matchedZone?.id || configuredZoneId || '', domainName: matchedZone?.name || addrDomain || '', email: addr.email, isCatchAll: false, cloudflareEnabled: false, dbMapping: addr, category: addr.action || addr.label || '', language: addr.language || 'en', hasMapping: true });
            }
        });
    } else {
        mergedRules = emailAddresses.filter(addr => !addr.email.startsWith('*') && addr.email !== '*').map(addr => {
            const addrDomain = addr.email.split('@')[1]?.toLowerCase();
            const matchedZone = cloudflareDomains.find(d => d.name?.toLowerCase() === addrDomain);
            return { ruleId: null, zoneId: matchedZone?.id || configuredZoneId || '', domainName: matchedZone?.name || addrDomain || '', email: addr.email, isCatchAll: false, cloudflareEnabled: false, dbMapping: addr, category: addr.action || addr.label || '', language: addr.language || 'en', hasMapping: true };
        });
    }

    const emailRows = mergedRules.map((item) => {
        const email = item.email;
        const isActive = item.cloudflareEnabled;
        const category = item.category || '';
        const language = item.language || 'en';
        const ruleId = item.ruleId;
        const zoneId = item.zoneId || '';
        const isCatchAll = item.isCatchAll;
        const catSel = `<option value=""${!category?' selected':''}>— not set —</option>` + cats.map(c => `<option value="${c}"${c===category?' selected':''}>${cap(c)}</option>`).join('');
        const langSel = langs.map(l => `<option value="${l.code}"${l.code===language?' selected':''}>${l.code} - ${l.name}</option>`).join('');

        return `<div class="email-row" data-rule-id="${ruleId || ''}" data-email="${esc(email)}">
            <span class="email-addr">${esc(email)}</span>
            <select class="category-select" onchange="updateMapping(this)" data-email="${esc(email)}" style="padding:5px 8px;background:var(--bg-input);border:1px solid var(--border);border-radius:5px;color:var(--text);width:100%;font-size:12px;">${catSel}</select>
            <select class="language-select" onchange="updateMapping(this)" data-email="${esc(email)}" style="padding:5px 8px;background:var(--bg-input);border:1px solid var(--border);border-radius:5px;color:var(--text);width:100%;font-size:12px;">${langSel}</select>
            ${ruleId ? 
                `<span class="status-badge ${isActive ? 'active' : 'inactive'}">${isActive ? 'Active' : 'Inactive'}</span>` :
                `<span style="font-size:10px;color:var(--warning);">⚠️ No CF rule</span>`
            }
            <div class="actions">
                ${ruleId ? 
                    `<button class="btn btn-ghost btn-sm" onclick="toggleCloudflareRule('${ruleId}', ${!isActive}, '${esc(email)}', '${zoneId}')" title="${isActive ? 'Deactivate' : 'Activate'} rule">${isActive ? '🔴' : '🟢'}</button>` :
                    `<button class="btn btn-accent btn-sm" onclick="createCloudflareRule('${esc(email)}', '${zoneId}')" style="font-size:10px;">Create Rule</button>`
                }
                ${isCatchAll ? '' : `<button class="btn btn-danger btn-sm" onclick="deleteEmail('${esc(email)}', '${ruleId || ''}', '${zoneId}')" title="Delete email and rule">🗑️</button>`}
            </div>
        </div>`;
    }).join('');

    const noRulesMessage = !configuredZoneId ? 
        '<div class="empty-state">Select a domain first to manage email rules.</div>' :
        '<div class="empty-state">No email rules configured. Add one below.</div>';

    const emailBodyMax = S('tickets','email_body_max_length','15000');
    const replyDelim = S('tickets','reply_delimiter','\\u0001');

    return `
    <div class="s-card">
        <div class="s-card-head">
            <div>
                <h3>🌐 Cloudflare Domains</h3>
                <p>Select which domain to manage email routing for.</p>
            </div>
            <button class="btn btn-ghost btn-sm" onclick="refreshDomains()" style="white-space:nowrap;">🔄 Refresh</button>
        </div>
        ${domainsHtml}
    </div>

    <div class="s-card">
        <div class="s-card-head"><div><h3>➕ Add New Domain</h3><p>Register a new domain with Cloudflare and set up email routing</p></div></div>
        ${setupHtml}
    </div>

    <div class="collapse-section open" id="sec-routing">
        <div class="collapse-head" onclick="toggleSection('sec-routing')">
            <h4>📤 Email Routing Rules</h4>
            <span class="collapse-chevron">▼</span>
        </div>
        <div class="collapse-body">
            <p style="font-size:12px;color:var(--text-muted);margin-bottom:16px;">
                Manage email addresses, their category mappings, and Cloudflare routing rules.
                ${configuredZoneId ? `<span style="color:var(--success);">✅ Cloudflare connected</span>` : `<span style="color:var(--warning);">⚠️ No domain selected</span>`}
            </p>
            ${emailRows || noRulesMessage}
            <hr class="divider" />
            <h4 style="font-size:13px;font-weight:700;color:var(--text-muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px;">Add new email address</h4>
            <div class="add-row">
                <div class="f-row" style="margin:0;flex:2;">
                    <label>Email address</label>
                    <input type="email" id="newEmailAddr" placeholder="support@example.com" />
                </div>
                <div class="f-row" style="margin:0;flex:1;">
                    <label>Category</label>
                    <select id="newEmailCat" style="padding:9px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:7px;color:var(--text);width:100%;">${catOpts}</select>
                </div>
                <div class="f-row" style="margin:0;flex:1;">
                    <label>Language</label>
                    <select id="newEmailLang" style="padding:9px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:7px;color:var(--text);width:100%;">${langOpts2}</select>
                </div>
                <button class="btn btn-accent" style="white-space:nowrap;margin-bottom:2px;" onclick="addIncomingRule()">Add Email</button>
            </div>
            <div style="margin-top:8px;font-size:11px;color:var(--text-muted);">
                ${configuredZoneId ? '✅ This will create a Cloudflare routing rule AND a DB mapping.' : '⚠️ Select a domain first to create Cloudflare rules.'}
            </div>
        </div>
    </div>

    <div class="s-card">
        <div class="s-card-head"><div><h3>🔑 Cloudflare Configuration</h3><p>API credentials for domain and email routing setup</p></div></div>
        <div class="f-grid-2">
            <div class="f-row">
                <label>Cloudflare Account ID</label>
                <input type="text" id="cf_account_id" value="${esc(S('cloudflare','account_id',''))}" placeholder="Your Cloudflare Account ID" />
                <p style="font-size:11px;color:var(--text-muted);margin-top:4px;">Find in Cloudflare Dashboard → Account Settings</p>
            </div>
            <div class="f-row">
                <label>Cloudflare API Token</label>
                <input type="password" id="cf_api_token" value="${S('cloudflare','api_token','') ? '****'.repeat(8) : ''}" placeholder="Your Cloudflare API Token" />
                <p style="font-size:11px;color:var(--text-muted);margin-top:4px;">Create in Cloudflare → API Tokens (encrypted)</p>
                ${S('cloudflare','api_token','') ? '<p style="font-size:11px;color:var(--success);margin-top:4px;">✅ Token set (encrypted)</p>' : ''}
            </div>
        </div>
        <div class="f-row" style="margin-top:16px;">
            <label>Worker Name</label>
            <input type="text" id="cf_worker_name" value="${esc(S('cloudflare','worker_name',''))}" placeholder="Your Cloudflare Worker name" />
            <p style="font-size:11px;color:var(--text-muted);margin-top:4px;">The name of your deployed Cloudflare Worker</p>
        </div>
        <button class="btn btn-accent" style="margin-top:8px;" onclick="saveCloudflareSettings()">Save Cloudflare Settings</button>
    </div>

    <div class="s-card">
        <div class="s-card-head"><div><h3>⚙️ Email Processing Settings</h3><p>Settings for incoming email processing</p></div></div>
        <div class="f-grid-2">
            <div class="f-row"><label>Email Body Max Length</label><input type="number" id="em_body_max" value="${esc(emailBodyMax)}" /></div>
            <div class="f-row"><label>Reply Delimiter</label><input type="text" id="em_reply_delim" value="${esc(replyDelim)}" /></div>
        </div>
        <button class="btn btn-accent" style="margin-top:8px;" onclick="saveIncomingSettings()">Save Incoming Settings</button>
    </div>`;
}

// ─── OUTGOING TAB ─────────────────────────────────────────────
async function buildOutgoingTab(cats, langs) {
    let activeLang = sessionStorage.getItem('ar_active_lang') || (langs.length > 0 ? langs[0].code : 'en');
    let autoReplies = [];
    try { const res = await api('/api/admin/auto-reply'); if (res.success && Array.isArray(res.data)) autoReplies = res.data; } catch (e) {}

    // All addresses available for outgoing use — senders only, not incoming routing addresses
    const allAddresses = outgoingAddresses;

    // ── Auto-reply items ──
    const arItems = cats.map(cat => {
        const ar = autoReplies.find(a => a.category === cat && a.language === activeLang) || {};
        const enabled = ar.enabled ? 1 : 0, subject = ar.subject || `[Ticket {{ticket_id}}] Your ${cat} inquiry`, body = ar.body || '', from = ar.from || '';
        const color = S('category', cat+'_color', '#8892b0');

                <div class="f-row"><label>Email body (HTML accepted)</label>${tagBar('ar_body_'+cat)}<textarea id="ar_body_${cat}">${esc(body)}</textarea></div>
                <div style="display:flex;gap:8px;margin-top:16px;align-items:center;">
                    <button class="btn btn-accent btn-sm" onclick="saveAr('${cat}','${activeLang}')">Save auto-reply</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteAr('${cat}','${activeLang}')">Remove</button>

                </div>
            </div>
        </div>`;

    const oeItems = allAddresses.map(addr => {
        const safeKey = addr.email.replace(/[^a-z0-9]/gi, '_'), footerKey = 'footer_' + safeKey, footer = S('email', footerKey, ''), hasFooter = footer.length > 0;
        return `<div class="oe-item">
            <div class="oe-item-head"><span style="width:8px;height:8px;border-radius:50%;background:${hasFooter?'var(--success)':'var(--border)'};flex-shrink:0;"></span><span class="oe-email-label">${esc(addr.email)}</span><span class="oe-cat-badge">${esc(addr.action||addr.label||'—')}</span><span class="oe-footer-status ${hasFooter?'has-footer':''}">${hasFooter?'Custom footer set':'No footer'}</span></div>
            <div class="oe-body">
                <div class="f-row"><label>Footer HTML</label><textarea id="oe_footer_${safeKey}" rows="7">${esc(footer)}</textarea></div>
                <div style="display:flex;gap:8px;margin-top:4px;align-items:center;">
                    <button class="btn btn-accent btn-sm" onclick="saveFooter('${esc(addr.email)}','${safeKey}')">Save footer</button>
                    ${hasFooter ? `<button class="btn btn-ghost btn-sm" onclick="clearFooter('${esc(addr.email)}','${safeKey}')">Clear footer</button>` : ''}
                    <span id="oe_status_${safeKey}" style="font-size:12px;color:var(--text-muted);margin-left:4px;"></span>
                </div>
            </div>
        </div>`;
    }).join('');

    // ── Outgoing sender addresses ──
    const outAddrRows = outgoingAddresses.map(addr => `
        <tr>
            <td>${esc(addr.email)}</td>
            <td>${esc(addr.label || '—')}</td>
            <td style="text-align:right;">
                <button class="btn btn-sm btn-danger" onclick="deleteOutgoingAddress(${addr.id}, '${esc(addr.email)}')">Remove</button>
            </td>
        </tr>
    `).join('');

    // ── Test Email Sending ──
    const fromOpts = `<option value="">Select sender...</option>` + allAddresses.map(a => `<option value="${esc(a.email)}">${esc(a.email)}</option>`).join('');

    return `
    <div class="s-card">
        <div class="s-card-head"><div><h3>📧 Outgoing Email Settings</h3><p>Configuration for sending emails</p></div></div>
        <div class="f-grid-2">
            <div class="f-row"><label>Default From Address</label><input type="email" id="em_default_from" value="${esc(S('email','default_from',''))}" placeholder="support@example.com" /></div>

        <div class="f-grid-3">
            <div class="f-row"><label>Google App Username</label><input type="text" id="em_script_username" value="${esc(S('email_script','username',''))}" placeholder="username" /></div>

            <div class="f-row"><label>Google App Secret</label><input type="password" id="em_script_secret" value="" placeholder="${S('email_script','secret','') ? '••••••••' : 'Leave blank to keep existing'}" autocomplete="new-password" /></div>
        </div>
        <button class="btn btn-accent" style="margin-top:8px;" onclick="saveOutgoingSettings()">Save Outgoing Settings</button>
    </div>

    <div class="s-card">
        <div class="s-card-head"><div><h3>✉️ Sender Addresses</h3><p>Email addresses used for sending — auto-replies, notifications, password resets.</p></div></div>
        ${outAddrRows.length ? `
        <table style="width:100%;border-collapse:collapse;margin-bottom:16px;">
            <thead>
                <tr style="border-bottom:2px solid var(--border);">
                    <th style="text-align:left;padding:8px;font-size:12px;font-weight:600;color:var(--text-muted);">Address</th>
                    <th style="text-align:left;padding:8px;font-size:12px;font-weight:600;color:var(--text-muted);">Label</th>
                    <th style="text-align:right;padding:8px;font-size:12px;font-weight:600;color:var(--text-muted);">Actions</th>
                </tr>
            </thead>
            <tbody>${outAddrRows}</tbody>

            <span class="collapse-chevron">▶</span>
        </div>

    <div class="s-card">
        <div class="s-card-head"><div><h3>🧪 Test Email Sending</h3><p>Send a test email to verify your outgoing email configuration</p></div></div>

            <div class="f-row">
                <label>From Address</label>
                <select id="test_from" style="padding:9px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:7px;color:var(--text);width:100%;">${fromOpts}</select>
            </div>
            <div class="f-row">
                <label>To Address</label>
                <input type="email" id="test_to" placeholder="recipient@example.com" />
            </div>
            <div class="f-row">
                <label>Subject</label>
                <input type="text" id="test_subject" placeholder="Test email from Dornorium" value="Test email from Dornorium" />
            </div>
            <div class="f-row">
                <label>Message Body (HTML supported)</label>
                <textarea id="test_body" rows="5" style="min-height:120px;" placeholder="Hello, this is a test email...">&lt;p&gt;This is a test email from Dornorium.&lt;/p&gt;&lt;p&gt;If you received this, your outgoing email configuration is working! ✅&lt;/p&gt;</textarea>
            </div>
            <div style="display:flex;gap:8px;margin-top:4px;">
                <button class="btn btn-accent" onclick="sendTestEmail()">📧 Send Test Email</button>

            </div>
        </div>
    </div>`;
}

// ─── INCOMING FUNCTIONS ────────────────────────────────────────
async function refreshDomains() {
    await fetchCloudflareDomains();
    if (configuredZoneId) {
        await fetchCloudflareRules(configuredZoneId);
    }
    refreshIncomingTab();
    toast('✅ Refreshed');
}

async function configureDomain(zoneId, domainName) {
    if (!confirm(`Use domain "${domainName}" for email routing?`)) return;
    try {
        const ok = await saveSettings([
            { category: 'cloudflare', key: 'zone_id', value: zoneId },
            { category: 'cloudflare', key: 'domain', value: domainName }
        ]);
        if (ok) {
            configuredZoneId = zoneId;
            configuredDomain = domainName;
            await fetchCloudflareRules(zoneId);
            toast(`✅ Domain ${domainName} configured`);
            refreshIncomingTab();
        } else {
            toast('❌ Failed to save domain', 'error');
        }
    } catch (e) {
        toast('❌ ' + e.message, 'error');
    }
}

async function createCloudflareRule(email, zoneId) {
    const targetZoneId = zoneId || (() => {
        const emailDomain = email.split('@')[1]?.toLowerCase();
        const matchedZone = cloudflareDomains.find(d => d.name?.toLowerCase() === emailDomain);
        return matchedZone ? matchedZone.id : configuredZoneId;
    })();
    if (!targetZoneId) {
        toast('No matching domain zone found', 'error');
        return;
    }
    try {
        const res = await api('/api/admin/setup/routing-rule', {
            method: 'POST',
            body: JSON.stringify({ 
                zoneId: targetZoneId,
                emailPattern: email,
                workerName: S('cloudflare', 'worker_name', '')
            })
        });
        if (res.success) {
            toast('✅ Cloudflare rule created');
            await fetchCloudflareRules(targetZoneId);
            refreshIncomingTab();
        } else {
            toast('❌ ' + (res.error || 'Failed'), 'error');
        }
    } catch (e) {
        toast('❌ ' + e.message, 'error');
    }
}

async function toggleCloudflareRule(ruleId, newStatus, email, zoneId) {
    const targetZoneId = zoneId || (() => {
        const emailDomain = email?.split('@')[1]?.toLowerCase();
        const matchedZone = emailDomain && cloudflareDomains.find(d => d.name?.toLowerCase() === emailDomain);
        return matchedZone ? matchedZone.id : configuredZoneId;
    })();
    if (!targetZoneId) {
        toast('No matching domain zone found', 'error');
        return;
    }
    try {
        const listRes = await api(`/api/admin/setup/routing-rules/${targetZoneId}`);
        if (!listRes.success) {
            toast('❌ Failed to get rule', 'error');
            return;
        }
        const rule = listRes.rules.find(r => r.id === ruleId);
        if (!rule) {
            toast('❌ Rule not found', 'error');
            return;
        }
        rule.enabled = newStatus;
        const res = await api(`/api/admin/setup/routing-rule/${ruleId}`, {
            method: 'PUT',
            body: JSON.stringify({ zoneId: targetZoneId, rule })
        });
        if (res.success) {
            toast(`✅ Rule ${newStatus ? 'activated' : 'deactivated'}`);
            const enabledZones = cloudflareDomains.filter(d => d.db_enabled == 1 || d.db_status === 'active').map(d => d.id);
            await fetchCloudflareRules(enabledZones.length ? enabledZones : [targetZoneId]);
            refreshIncomingTab();
        } else {
            toast('❌ ' + (res.error || 'Failed'), 'error');
        }
    } catch (e) {
        toast('❌ ' + e.message, 'error');
    }
}

async function updateMapping(selectElement) {
    const email = selectElement.dataset.email;
    const row = selectElement.closest('.email-row');
    const categorySelect = row.querySelector('.category-select');
    const languageSelect = row.querySelector('.language-select');
    
    const category = categorySelect.value;
    const language = languageSelect.value;
    
    if (!email || !language) {
        toast('Missing data', 'error');
        return;
    }

    // Don't save if category not set yet
    if (!category) return;
    
    let existing = emailAddresses.find(a => a.email.toLowerCase() === email.toLowerCase());
    
    try {
        if (existing) {
            const res = await api('/api/admin/incoming-email-addresses', {
                method: 'POST',
                body: JSON.stringify({ email: existing.email, label: category, action: category, language })
            });
            if (res.success) { toast('✅ Mapping updated'); existing.action = category; existing.language = language; }
            else toast('❌ ' + (res.error || 'Failed'), 'error');
        } else {
            // May exist in DB as outgoing — try POST, fall back to upsert via email lookup
            const res = await api('/api/admin/incoming-email-addresses', {
                method: 'POST',
                body: JSON.stringify({ email, label: category, action: category, language })
            });
            if (res.success) {
                toast('✅ Mapping saved');
                await load();
                refreshIncomingTab();
            } else {
                toast('❌ ' + (res.error || 'Failed'), 'error');
            }
        }
    } catch (e) {
        toast('❌ ' + e.message, 'error');
    }
}

async function addIncomingRule() {
    const email = document.getElementById('newEmailAddr').value.trim();
    const category = document.getElementById('newEmailCat').value;
    const language = document.getElementById('newEmailLang').value;
    if (!email) { toast('Enter an email address', 'error'); return; }

    const emailDomain = email.split('@')[1]?.toLowerCase();
    const matchedZone = cloudflareDomains.find(d => d.name?.toLowerCase() === emailDomain);
    const targetZoneId = matchedZone ? matchedZone.id : configuredZoneId;

    if (!targetZoneId) { toast('❌ No matching domain zone found for ' + (emailDomain || email), 'error'); return; }

    try {
        const cfRes = await api('/api/admin/setup/routing-rule', {
            method: 'POST',
            body: JSON.stringify({ zoneId: targetZoneId, emailPattern: email, workerName: S('cloudflare', 'worker_name', '') })
        });
        if (cfRes.success) {
            // Save category/language DB mapping if category is set
            if (category) {
                await api('/api/admin/incoming-email-addresses', {
                    method: 'POST',
                    body: JSON.stringify({ email, label: category, action: category, language: language || 'en' })
                });
            }
            toast('✅ Cloudflare routing rule created');
            document.getElementById('newEmailAddr').value = '';
            const enabledZones = cloudflareDomains.filter(d => d.db_enabled == 1 || d.db_status === 'active').map(d => d.id);
            await load();
            await fetchCloudflareRules(enabledZones.length ? enabledZones : [targetZoneId]);
            refreshIncomingTab();
        } else {
            toast('❌ ' + (cfRes.error || 'Failed'), 'error');
        }
    } catch (e) {
        toast('❌ ' + e.message, 'error');
    }
}

async function addEmail() {
    const email = document.getElementById('newEmailAddr').value.trim();
    const category = document.getElementById('newEmailCat').value;
    const language = document.getElementById('newEmailLang').value;
    
    if (!email) { toast('Enter an email address', 'error'); return; }
    if (!category) { toast('Select a category', 'error'); return; }
    if (!language) { toast('Select a language', 'error'); return; }
    
    if (emailAddresses.some(a => a.email.toLowerCase() === email.toLowerCase())) {
        toast('Email already exists', 'warning');
        return;
    }
    
    try {
        const res = await api('/api/admin/email-addresses', {
            method: 'POST',
            body: JSON.stringify({ email, label: category, action: category, language })
        });
        if (res.success) {
            toast('✅ Email added');
            document.getElementById('newEmailAddr').value = '';
            await load();
        } else {
            toast('❌ ' + (res.error || 'Failed'), 'error');
        }
    } catch (e) {
        toast('❌ ' + e.message, 'error');
    }
}

async function deleteEmail(email, ruleId, zoneId) {
    if (!confirm(`Delete "${email}"? This will remove Cloudflare rule and DB mapping.`)) return;
    
    try {
        const targetZoneId = zoneId || (() => {
            const emailDomain = email.split('@')[1]?.toLowerCase();
            const matchedZone = cloudflareDomains.find(d => d.name?.toLowerCase() === emailDomain);
            return matchedZone ? matchedZone.id : configuredZoneId;
        })();

        if (ruleId && targetZoneId) {
            const cfRes = await api(`/api/admin/setup/routing-rule/${ruleId}`, {
                method: 'DELETE',
                body: JSON.stringify({ zoneId: targetZoneId })
            });
            if (!cfRes.success) {
                toast('⚠️ Cloudflare rule delete failed: ' + (cfRes.error || 'Unknown'), 'warning');
            }
        }

        // Clean up incoming_email_addresses mapping
        const incomingMatch = emailAddresses.find(a => a.email.toLowerCase() === email.toLowerCase());
        if (incomingMatch) {
            await api(`/api/admin/incoming-email-addresses/${incomingMatch.id}`, { method: 'DELETE' });
        }
        
        toast('✅ Deleted');
        await load();
        refreshIncomingTab();
    } catch (e) {
        toast('❌ ' + e.message, 'error');
    }
}

async function saveCloudflareSettings() {
    const accountId = document.getElementById('cf_account_id').value.trim();
    const apiToken = document.getElementById('cf_api_token').value.trim();
    
    const workerName = document.getElementById('cf_worker_name').value.trim();
    const updates = [];
    
    try {
        if (accountId) {
            updates.push({ category:'cloudflare', key:'account_id', value: accountId });
        }
        if (workerName) {
            updates.push({ category:'cloudflare', key:'worker_name', value: workerName });
        }
        if (apiToken) {
            const enc = await api('/api/admin/setup/encrypt', { method: 'POST', body: JSON.stringify({ value: apiToken }) });
            if (!enc.encrypted) throw new Error('Failed to encrypt API token');
            updates.push({ category:'cloudflare', key:'api_token', value: enc.encrypted });
        }
    } catch (e) {
        toast('❌ ' + e.message, 'error');
        return;
    }
    
    const ok = await saveSettings(updates);
    ok ? toast('✅ Cloudflare settings saved') : toast('❌ Failed', 'error');
    if (ok) await load();
}

async function saveIncomingSettings() {
    const ok = await saveSettings([
        { category:'tickets', key:'email_body_max_length', value: document.getElementById('em_body_max').value },
        { category:'tickets', key:'reply_delimiter', value: document.getElementById('em_reply_delim').value },
    ]);
    ok ? toast('✅ Incoming settings saved') : toast('❌ Failed', 'error');
    if (ok) await load();
}

// ─── OUTGOING FUNCTIONS ────────────────────────────────────────
async function saveOutgoingSettings() {
    const updates = [
        { category:'email', key:'default_from', value: document.getElementById('em_default_from').value.trim() },
        { category:'email', key:'password_reset_from', value: document.getElementById('em_password_reset_from').value.trim() },
        { category:'general', key:'script_url', value: document.getElementById('em_script_url').value.trim() },
        { category:'email_script', key:'username', value: document.getElementById('em_script_username').value.trim() },
    ];

    const newPassword = document.getElementById('em_script_password').value;
    const newSecret = document.getElementById('em_script_secret').value;

    try {
        if (newPassword) {
            const enc = await api('/api/admin/setup/encrypt', { method: 'POST', body: JSON.stringify({ value: newPassword }) });
            if (!enc.encrypted) throw new Error(enc.error || 'Failed to encrypt password');
            updates.push({ category:'email_script', key:'password', value: enc.encrypted });
        }
        if (newSecret) {
            const enc = await api('/api/admin/setup/encrypt', { method: 'POST', body: JSON.stringify({ value: newSecret }) });
            if (!enc.encrypted) throw new Error(enc.error || 'Failed to encrypt secret');
            updates.push({ category:'email_script', key:'secret', value: enc.encrypted });
        }
    } catch (e) {
        toast('❌ ' + e.message, 'error');
        return;
    }

    const ok = await saveSettings(updates);
    ok ? toast('✅ Outgoing settings saved') : toast('❌ Failed', 'error');
    if (ok) {
        document.getElementById('em_script_password').value = '';
        document.getElementById('em_script_secret').value = '';
        await load();
    }
}

async function sendTestEmail() {
    const from = document.getElementById('test_from').value;
    const to = document.getElementById('test_to').value.trim();
    const subject = document.getElementById('test_subject').value.trim() || 'Test email from Dornorium';
    const body = document.getElementById('test_body').value || '<p>Test email</p>';
    const statusEl = document.getElementById('test_status');
    
    if (!from) { toast('Select a "From" address', 'error'); return; }
    if (!to) { toast('Enter a recipient email address', 'error'); return; }
    
    statusEl.textContent = '⏳ Sending...';
    
    try {
        const res = await api('/api/message', {
            method: 'POST',
            body: JSON.stringify({
                email: to,
                name: 'Test User',
                subject: subject,
                message: body,
                category: 'test',
                language: 'en',
                metadata: { test: true }
            })
        });
        
        if (res.success && res.ticketId) {
            const replyRes = await api(`/api/admin/ticket/${res.ticketId}/reply`, {
                method: 'POST',
                body: JSON.stringify({ from: from, body: body })
            });
            
            if (replyRes.success) {
                statusEl.textContent = '✅ Sent! Check your inbox.';
                toast('✅ Test email sent to ' + to);
            } else {
                statusEl.textContent = '❌ Failed to send: ' + (replyRes.error || 'Unknown error');
                toast('❌ Failed to send test email', 'error');
            }
        } else {
            statusEl.textContent = '❌ Failed to create test ticket';
            toast('❌ Failed to create test ticket', 'error');
        }
    } catch (e) {
        statusEl.textContent = '❌ Error: ' + e.message;
        toast('❌ ' + e.message, 'error');
    }
}

async function saveFooter(email, safeKey) { 
    const body = document.getElementById('oe_footer_'+safeKey).value; 
    const ok = await saveSettings([{ category:'email', key:'footer_'+safeKey, value: body }]); 
    if (ok) { 
        toast('✅ Footer saved for '+email); 
        const s = document.getElementById('oe_status_'+safeKey); 
        if (s) { s.textContent = 'Saved ✓'; setTimeout(() => s.textContent = '', 2500); } 
    } else toast('❌ Save failed','error'); 
}

async function clearFooter(email, safeKey) { 
    if (!confirm('Clear footer for '+email+'?')) return; 
    document.getElementById('oe_footer_'+safeKey).value = ''; 
    await saveFooter(email, safeKey); 
    await load(); 
}

async function setArLanguage(lang) { 
    sessionStorage.setItem('ar_active_lang', lang); 
    refreshOutgoingTab();
}

async function saveAr(cat, lang) {
    const enabled = document.getElementById('ar_en_'+cat).checked ? 1 : 0;
    const subject = document.getElementById('ar_subj_'+cat).value;
    const body = document.getElementById('ar_body_'+cat).value;
    const from = document.getElementById('ar_from_'+cat).value;
    const d = await api('/api/admin/auto-reply', { 
        method:'PUT', 
        body:JSON.stringify({ category:cat, language:lang, enabled, subject, body, from }) 
    });
    if (d.success) { 
        toast('✅ Auto-reply saved'); 
        const s = document.getElementById('ar_status_'+cat); 
        if (s) { s.textContent = 'Saved ✓'; setTimeout(() => s.textContent = '', 2500); } 
    } else toast('❌ Save failed', 'error');
}

async function deleteAr(cat, lang) { 
    if (!confirm(`Remove auto-reply for "${cat}" in ${lang}?`)) return; 
    const d = await api('/api/admin/auto-reply', { 
        method:'DELETE', 
        body:JSON.stringify({ category:cat, language:lang }) 
    }); 
    d.success ? (toast('✅ Auto-reply cleared'), load()) : toast('❌ Failed','error'); 
}
