<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings – Dornorium</title>
   <link rel="stylesheet" href="css/style.css" />
    <script src="js/shared.js"></script>
    <style>
        .tab-strip { display: flex; gap: 0; flex-wrap: wrap; border-bottom: 2px solid var(--border); margin-bottom: 28px; }
        .tab-strip button { padding: 12px 22px; background: none; border: none; border-bottom: 3px solid transparent; margin-bottom: -2px; color: var(--text-muted); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; transition: color .15s, border-color .15s; }
        .tab-strip button:hover { color: var(--text); }
        .tab-strip button.active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .s-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin-bottom: 20px; }
        .s-card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .s-card-head h3 { font-size: 15px; font-weight: 700; color: var(--text); }
        .s-card-head p { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.4; }
        .f-row { margin-bottom: 16px; }
        .f-row label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted); margin-bottom: 6px; }
        .f-row input[type="text"], .f-row input[type="email"], .f-row input[type="number"], .f-row input[type="password"], .f-row input[type="color"], .f-row select, .f-row textarea { width: 100%; padding: 9px 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-size: 14px; font-family: inherit; transition: border-color .15s; }
        .f-row input:focus, .f-row select:focus, .f-row textarea:focus { outline: none; border-color: var(--accent); }
        .f-row textarea { min-height: 100px; resize: vertical; font-family: 'Menlo', 'Consolas', monospace; font-size: 13px; line-height: 1.55; }
        .f-row input[type="color"] { height: 38px; padding: 3px 6px; cursor: pointer; }
        .f-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .f-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .tag-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; align-items: center; }
        .tag-bar-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); margin-right: 4px; }
        .tag-chip { padding: 3px 9px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 20px; font-size: 11px; font-family: monospace; color: var(--accent); cursor: pointer; font-weight: 600; transition: background .12s, color .12s; }
        .tag-chip:hover { background: var(--accent); color: var(--text-inverse); border-color: var(--accent); }
        .toggle-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .toggle-switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-track { position: absolute; inset: 0; background: var(--border); border-radius: 22px; cursor: pointer; transition: background .2s; }
        .toggle-track::after { content: ''; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: transform .2s; }
        .toggle-switch input:checked + .toggle-track { background: var(--accent); }
        .toggle-switch input:checked + .toggle-track::after { transform: translateX(18px); }
        .toggle-label { font-size: 14px; color: var(--text); font-weight: 500; }
        .cat-item { border: 1px solid var(--border); border-radius: 8px; padding: 0; margin-bottom: 12px; overflow: hidden; }
        .cat-item-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--bg-input); cursor: pointer; user-select: none; }
        .cat-item-head:hover { background: var(--bg-hover); }
        .cat-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
        .cat-name { font-weight: 700; font-size: 14px; flex: 1; }
        .cat-desc-preview { font-size: 12px; color: var(--text-muted); flex: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cat-chevron { color: var(--text-muted); font-size: 12px; transition: transform .2s; flex-shrink: 0; }
        .cat-item.open .cat-chevron { transform: rotate(90deg); }
        .cat-body { display: none; padding: 20px 16px; border-top: 1px solid var(--border); }
        .cat-item.open .cat-body { display: block; }
        .cat-actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
        .ar-item { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
        .ar-item-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-input); cursor: pointer; user-select: none; }
        .ar-item-head:hover { background: var(--bg-hover); }
        .ar-enabled-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .ar-enabled-dot.on { background: var(--success); }
        .ar-enabled-dot.off { background: var(--border); }
        .ar-cat-name { font-weight: 700; font-size: 14px; min-width: 120px; }
        .ar-subject-preview { font-size: 12px; color: var(--text-muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ar-chevron { color: var(--text-muted); font-size: 12px; transition: transform .2s; flex-shrink: 0; }
        .ar-item.open .ar-chevron { transform: rotate(90deg); }
        .ar-body { display: none; padding: 22px 18px; border-top: 1px solid var(--border); }
        .ar-item.open .ar-body { display: block; }
        .oe-item { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
        .oe-item-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-input); border-bottom: 1px solid var(--border); }
        .oe-email-label { font-weight: 700; font-size: 14px; flex: 1; }
        .oe-cat-badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; background: var(--bg-hover); color: var(--text-muted); text-transform: uppercase; letter-spacing: .4px; }
        .oe-body { padding: 20px 18px; }
        .oe-footer-status { font-size: 11px; color: var(--text-muted); font-style: italic; }
        .oe-footer-status.has-footer { color: var(--success); font-style: normal; }
        .email-row { display: grid; grid-template-columns: 1fr 150px 120px 90px 110px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
        .email-row .email-addr { font-weight: 600; font-size: 13px; font-family: monospace; word-break: break-all; }
        .email-row .status-badge { font-size: 10px; padding: 3px 10px; border-radius: 12px; font-weight: 600; text-align: center; display: inline-block; min-width: 55px; }
        .email-row .status-badge.active { background: var(--success); color: #fff; }
        .email-row .status-badge.inactive { background: var(--border); color: var(--text-muted); }
        .email-row select { padding: 5px 8px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 5px; color: var(--text); width: 100%; font-size: 12px; }
        .email-row .actions { display: flex; gap: 4px; flex-wrap: wrap; }
        .email-row .actions .btn { padding: 4px 10px; font-size: 11px; }
        .add-row { display: flex; gap: 10px; align-items: flex-end; padding: 16px; background: var(--bg-input); border: 1px dashed var(--border); border-radius: 8px; margin-top: 8px; flex-wrap: wrap; }
        .add-row .f-row { margin-bottom: 0; flex: 1; min-width: 130px; }
        .add-row .f-row:last-child { flex: 0 0 auto; }
        .btn { padding: 7px 16px; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
        .btn:hover { opacity: .85; }
        .btn-accent { background: var(--accent); color: #fff; }
        .btn-ghost { background: var(--bg-input); color: var(--text); border: 1px solid var(--border); }
        .btn-danger { background: var(--error); color: #fff; }
        .btn-sm { padding: 4px 10px; font-size: 11px; }
        .btn-success { background: var(--success); color: #fff; }
        .test-email-box { background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-top: 12px; }
        .test-email-box .f-row { margin-bottom: 12px; }
        .test-email-box .f-row:last-child { margin-bottom: 0; }
        .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; z-index: 9999; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background: var(--bg-secondary); color: var(--success); border-left: 4px solid var(--success); }
        .toast.error { background: var(--bg-secondary); color: var(--error); border-left: 4px solid var(--error); }
        .toast.warning { background: var(--bg-secondary); color: #92400e; border-left: 4px solid #f59e0b; }
        .empty-state { text-align: center; padding: 32px; color: var(--text-muted); font-size: 14px; }
        .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
        .section-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--accent); margin: 24px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
        .collapse-section { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
        .collapse-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-input); cursor: pointer; user-select: none; }
        .collapse-head:hover { background: var(--bg-hover); }
        .collapse-head h4 { font-size: 14px; font-weight: 700; color: var(--text); margin: 0; flex: 1; }
        .collapse-chevron { color: var(--text-muted); font-size: 12px; transition: transform .2s; flex-shrink: 0; }
        .collapse-section.open .collapse-chevron { transform: rotate(90deg); }
        .collapse-body { display: none; padding: 20px 18px; border-top: 1px solid var(--border); }
        .collapse-section.open .collapse-body { display: block; }
        .domain-row { display: grid; grid-template-columns: 1fr 120px 100px auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
        .domain-row .domain-name { font-weight: 600; font-size: 14px; }
        .domain-row .domain-status { font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: 600; text-align: center; }
        .domain-row .domain-status.active { background: var(--success); color: #fff; }
        .domain-row .domain-status.pending { background: #92400e; color: #fff; }
        .domain-row .domain-actions { display: flex; gap: 4px; }
        .verbose-log { background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-top: 12px; max-height: 300px; overflow-y: auto; font-family: 'Menlo', 'Consolas', monospace; font-size: 11px; line-height: 1.5; }
        .log-entry { display: flex; gap: 8px; padding: 4px 0; }
        .log-time { color: var(--text-muted); flex-shrink: 0; }
        .log-level { flex-shrink: 0; font-weight: 700; }
        .log-level.info { color: var(--accent); }
        .log-level.success { color: var(--success); }
        .log-level.error { color: var(--error); }
        .log-level.warn { color: #f59e0b; }
        .log-msg { flex: 1; color: var(--text); word-break: break-word; }
        .status-panel { background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin: 12px 0; }
        .status-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 12px; }
        .status-key { font-weight: 600; color: var(--text-muted); }
        .status-value { color: var(--text); font-family: monospace; }
    </style>
</head>
<body style="display:none;">
    <div class="top-nav">
        <div class="logo-nav">
            <img src="/dornorium/assets/icons/favicon-32x32.png" alt="Dornorium" style="width:28px;height:28px;margin-right:10px;border-radius:4px;">
            <span style="font-size:16px;font-weight:700;">Settings</span>
        </div>
        <div class="user-badge" id="userBadge"></div>
    </div>
    <div class="page-container">
        <div class="page-sidebar" id="pageSidebar"></div>
        <div class="page-main">
            <div style="padding:24px;max-width:1200px;">
                <div id="tabContent"></div>
            </div>
        </div>
    </div>

<script>
// ──────────────────────────────────────────────────────────────
// STATE
let settings = [];
let emailAddresses = [];
let outgoingAddresses = [];
let cloudflareDomains = [];
let cloudflareRules = [];
let configuredZoneId = null;
let configuredDomain = null;
let currentTab = 'domains';
let setupZoneId = null;
let setupDomainName = null;
let pollingInterval = null;
let routeLogs = {};

// ──────────────────────────────────────────────────────────────
// UTILITY FUNCTIONS
function esc(str) { return (str || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function toast(msg, type = 'success') { const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg; document.body.appendChild(t); t.classList.add('show'); setTimeout(() => t.remove(), 3000); }
async function api(endpoint, opts = {}) { const res = await fetch(endpoint, { ...opts, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sessionStorage.getItem('token'), ...opts.headers } }); if (!res.ok) throw new Error(`${res.status}`); return res.json(); }
function canEdit() { try { return JSON.parse(sessionStorage.getItem('user_perms') || '[]').includes('edit'); } catch (e) { return false; } }
function canEditSettings() { return canEdit(); }
function switchTab(name) { currentTab = name; document.querySelectorAll('[data-tab]').forEach(el => { el.classList.toggle('active', el.dataset.tab === name); }); renderAll(); }

function addLog(zoneId, level, msg) {
    if (!routeLogs[zoneId]) routeLogs[zoneId] = [];
    const time = new Date().toLocaleTimeString();
    routeLogs[zoneId].push({ time, level, msg });
    const logEl = document.querySelector(`#route_log_${esc(zoneId)}`);
    if (logEl) {
        logEl.innerHTML = routeLogs[zoneId].map(entry => `
            <div class="log-entry">
                <span class="log-time">${esc(entry.time)}</span>
                <span class="log-level ${esc(entry.level)}">${esc(entry.level.toUpperCase())}</span>
                <span class="log-msg">${esc(entry.msg)}</span>
            </div>
        `).join('');
        logEl.scrollTop = logEl.scrollHeight;
    }
}

async function checkDomainRoutingState(zoneId) {
    try {
        addLog(zoneId, 'info', 'Checking current domain routing state...');
        const res = await api('/api/admin/setup/domain-route-state', {
            method: 'GET'
        });
        
        if (res.success && res.state) {
            const state = res.state;
            addLog(zoneId, 'success', `Current state: mode=${state.route_type || 'none'}, target=${state.route_target || 'none'}`);
            
            const stateEl = document.querySelector(`#route_state_${esc(zoneId)}`);
            if (stateEl) {
                stateEl.innerHTML = `
                    <div class="status-row">
                        <span class="status-key">Route Mode:</span>
                        <span class="status-value">${esc(state.route_type || 'not configured')}</span>
                    </div>
                    <div class="status-row">
                        <span class="status-key">Route Target:</span>
                        <span class="status-value">${esc(state.route_target || '-')}</span>
                    </div>
                    <div class="status-row">
                        <span class="status-key">CF Status:</span>
                        <span class="status-value">${esc(state.cf_status || 'unknown')}</span>
                    </div>
                `;
            }
            return state;
        } else {
            addLog(zoneId, 'warn', 'Could not fetch current state');
            return null;
        }
    } catch (e) {
        addLog(zoneId, 'error', 'State check failed: ' + e.message);
        return null;
    }
}

async function enableDomainRouting(zoneId, mode, target) {
    if (!zoneId || !mode || (mode !== 'none' && !target)) {
        toast('Invalid parameters', 'error');
        return false;
    }

    try {
        addLog(zoneId, 'info', '─ Starting domain routing setup ─');
        addLog(zoneId, 'info', `Step 1: Validating inputs (mode=${mode}, target=${target || 'clear'})`);
        
        const cleanTarget = String(target || '').trim();
        
        if (mode === 'pages') {
            if (!cleanTarget.match(/^(https?:\/\/)?([a-z0-9-]+)(\.pages\.dev)?\/?$/i)) {
                addLog(zoneId, 'error', 'Invalid Pages project format');
                toast('Invalid project format', 'error');
                return false;
            }
            addLog(zoneId, 'success', 'Pages project format validated');
        } else if (mode === 'redirect') {
            if (!cleanTarget.match(/^https?:\/\/.+/i) && !cleanTarget.match(/^[a-z0-9.-]+\.[a-z]{2,}$/i)) {
                addLog(zoneId, 'error', 'Invalid redirect URL format');
                toast('Invalid URL format', 'error');
                return false;
            }
            addLog(zoneId, 'success', 'Redirect URL format validated');
        }

        addLog(zoneId, 'info', 'Step 2: Checking current routing state...');
        await checkDomainRoutingState(zoneId);

        addLog(zoneId, 'info', 'Step 3: Sending configuration to server...');
        const res = await api('/api/admin/setup/domain-route', {
            method: 'POST',
            body: JSON.stringify({ zoneId, mode, target: cleanTarget })
        });

        if (!res.success) {
            addLog(zoneId, 'error', 'Server error: ' + (res.error || 'Unknown error'));
            toast('❌ ' + (res.error || 'Failed'), 'error');
            return false;
        }

        addLog(zoneId, 'success', 'Configuration accepted by server');

        if (mode === 'pages') {
            addLog(zoneId, 'info', 'Step 4: Attaching domain to Pages project...');
            addLog(zoneId, 'warn', 'Note: Cloudflare provisioning (DNS + certificate) may take 1-5 minutes');
            if (res.cf_note) addLog(zoneId, 'warn', 'CF Note: ' + res.cf_note);
            if (res.cf_status) addLog(zoneId, 'info', 'Initial CF status: ' + res.cf_status);
        } else if (mode === 'redirect') {
            addLog(zoneId, 'info', 'Step 4: Configuring redirect rule...');
            addLog(zoneId, 'info', 'Ensuring proxied DNS record exists...');
            if (res.cf_note) addLog(zoneId, 'info', 'CF Note: ' + res.cf_note);
        } else if (mode === 'none') {
            addLog(zoneId, 'info', 'Step 4: Clearing all routing...');
        }

        addLog(zoneId, 'success', '✓ Domain routing configuration complete');
        addLog(zoneId, 'info', 'Refreshing state...');
        await checkDomainRoutingState(zoneId);

        toast('✅ Domain routing updated');
        await refreshDomainsTab();
        return true;
    } catch (e) {
        addLog(zoneId, 'error', 'Exception: ' + e.message);
        toast('❌ ' + e.message, 'error');
        return false;
    }
}

// ──────────────────────────────────────────────────────────────
// DOMAIN TAB BUILD
function buildDomainsTab() {
    const domainCards = cloudflareDomains.map(z => {
        const canEdit = canEditSettings();
        const routeType = z.route_type || 'none';
        const routeTarget = z.route_target || '';
        
        let targetLabel = 'Target';
        let targetPlaceholder = '';
        let targetHint = '';
        
        if (routeType === 'pages') {
            targetLabel = 'Pages Project';
            targetPlaceholder = 'my-pages-project';
            targetHint = 'Enter the project slug, e.g., "my-pages-project" (with or without .pages.dev suffix)';
        } else if (routeType === 'redirect') {
            targetLabel = 'Destination URL';
            targetPlaceholder = 'https://example.com';
            targetHint = 'Full URL where traffic will be redirected';
        }

        const statusBadge = z.db_status === 'active' ? '<span class="tag-chip" style="background:var(--success);color:#fff;border-color:var(--success);">✓ Active</span>' : '<span class="tag-chip" style="background:#f59e0b;color:#fff;border-color:#f59e0b;">⏳ Pending</span>';
        const cfStatus = z.status || 'unknown';

        return `<div class="s-card">
            <div class="s-card-head">
                <div style="flex:1;">
                    <h3 style="margin:0 0 4px;">🌍 ${esc(z.name)}</h3>
                    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                        ${statusBadge}
                        <span style="font-size:11px;color:var(--text-muted);">CF: ${esc(cfStatus)}</span>
                        <code style="font-size:10px;color:var(--text-muted);">${esc(z.id.substring(0,16))}…</code>
                    </div>
                </div>
            </div>
            
            <div style="margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:14px;">
                <h4 style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;">🔗 Domain Routing</h4>
                <p style="font-size:12px;color:var(--text-muted);margin:0 0 12px;">Route this domain to Cloudflare Pages or redirect to another URL.</p>
                
                <div class="status-panel">
                    <div style="font-size:11px;font-weight:700;color:var(--accent);margin-bottom:8px;">CURRENT STATE</div>
                    <div id="route_state_${esc(z.id)}">
                        <div class="status-row">
                            <span class="status-key">Mode:</span>
                            <span class="status-value">${esc(routeType)}</span>
                        </div>
                        <div class="status-row">
                            <span class="status-key">Target:</span>
                            <span class="status-value">${esc(routeTarget || '-')}</span>
                        </div>
                    </div>
                </div>
                
                <div class="f-row">
                    <label>Select Routing Mode</label>
                    <select id="route_mode_${esc(z.id)}" onchange="updateRouteTargetField('${esc(z.id)}')" ${!canEdit ? 'disabled' : ''}>
                        <option value="none" ${routeType==='none'?'selected':''}>— No Routing —</option>
                        <option value="pages" ${routeType==='pages'?'selected':''}>Cloudflare Pages Project</option>
                        <option value="redirect" ${routeType==='redirect'?'selected':''}>Redirect to URL</option>
                    </select>
                </div>
                
                <div class="f-row" id="route_target_row_${esc(z.id)}" style="${routeType==='none' ? 'display:none;' : ''}">
                    <label id="route_target_label_${esc(z.id)}">${targetLabel}</label>
                    <input type="text" id="route_target_${esc(z.id)}" value="${esc(routeTarget)}" placeholder="${targetPlaceholder}" ${!canEdit ? 'disabled' : ''} />
                    <p style="font-size:11px;color:var(--text-muted);margin-top:4px;">${targetHint}</p>
                </div>
                
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <button class="btn btn-accent btn-sm" onclick="enableDomainRouting('${esc(z.id)}', document.getElementById('route_mode_${esc(z.id)}').value, document.getElementById('route_target_${esc(z.id)}').value)" ${!canEdit ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>Apply Routing</button>
                    ${routeType !== 'none' ? `<button class="btn btn-ghost btn-sm" onclick="enableDomainRouting('${esc(z.id)}', 'none', '')" ${!canEdit ? 'disabled' : ''}>Clear Routing</button>` : ''}
                </div>
                
                <div class="verbose-log" id="route_log_${esc(z.id)}">
                    <div class="log-entry"><span class="log-time">[ready]</span><span class="log-level info">INFO</span><span class="log-msg">Waiting for action...</span></div>
                </div>
            </div>
        </div>`;
    }).join('');

    return `
    <div class="s-card-head" style="margin-bottom:14px;">
        <div><h3>🌍 Domains & Routing</h3><p>Configure how your domains route to Cloudflare Pages or external URLs.</p></div>
        <button class="btn btn-ghost btn-sm" onclick="refreshDomainsTab()" style="white-space:nowrap;">🔄 Refresh</button>
    </div>
    ${domainCards || '<div class="empty-state">No domains found.</div>'}`;
}

function updateRouteTargetField(zoneId) {
    const mode = document.getElementById('route_mode_' + zoneId).value;
    const row = document.getElementById('route_target_row_' + zoneId);
    const label = document.getElementById('route_target_label_' + zoneId);
    const input = document.getElementById('route_target_' + zoneId);
    if (mode === 'none') { row.style.display = 'none'; return; }
    row.style.display = '';
    label.textContent = mode === 'pages' ? 'Pages Project' : 'Destination URL';
    input.placeholder = mode === 'pages' ? 'my-pages-project' : 'https://example.com';
}

// ──────────────────────────────────────────────────────────────
// LOAD & RENDER
async function load() {
    try {
        const [sd, ed, oed] = await Promise.all([
            api('/api/admin/settings'),
            api('/api/admin/incoming-email-addresses'),
            api('/api/admin/email-addresses?active_only=true')
        ]);
        settings = sd.settings || [];
        emailAddresses = ed.addresses || [];
        outgoingAddresses = oed.addresses || [];
        
        await fetchCloudflareDomains();
        renderAll();
        switchTab(currentTab);
    } catch(e) {
        document.getElementById('tabContent').innerHTML = '<div class="loading">Error: ' + e.message + '</div>';
    }
}

async function fetchCloudflareDomains() {
    try {
        const res = await api('/api/admin/setup/cloudflare-zones');
        if (res.success) {
            cloudflareDomains = res.zones || [];
        } else {
            cloudflareDomains = [];
        }
    } catch (e) {
        cloudflareDomains = [];
    }
}

async function refreshDomainsTab() {
    await fetchCloudflareDomains();
    if (currentTab === 'domains') {
        renderAll();
    }
}

function renderAll() {
    if (currentTab === 'domains') {
        document.getElementById('tabContent').innerHTML = buildDomainsTab();
    }
}

function renderUserBadge() {
    try {
        const user = JSON.parse(sessionStorage.getItem('user') || '{}');
        const badge = document.getElementById('userBadge');
        if (badge && user.email) {
            badge.innerHTML = `<div style="text-align:right;"><div style="font-size:12px;font-weight:700;color:var(--text);">${esc(user.email.split('@')[0])}</div><div style="font-size:10px;color:var(--text-muted);">Admin</div></div>`;
        }
    } catch (e) { }
}

load();
renderUserBadge();
</script>
