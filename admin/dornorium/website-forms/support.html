<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script>
(function() {
    var config = {};
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/dornorium/config.json', false);
        xhr.send();
        if (xhr.status === 200) config = JSON.parse(xhr.responseText);
    } catch (e) {}
    window.DORNORIUM_CONFIG = {
        API_BASE: config.API_BASE || '',
        LANG_BASE_PATH: config.LANG_BASE_PATH || '/lang/',
        CSS_PATH: config.CSS_PATH || '/css/dornorium.css'
    };
    document.write('<link rel="stylesheet" href="' + window.DORNORIUM_CONFIG.CSS_PATH + '">');
})();
</script>
<style>
.dornorium-brand { display:block !important; }
</style>
<link rel="icon" type="image/png" sizes="32x32" href="/dornorium/assets/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/dornorium/assets/icons/favicon-16x16.png">
<link rel="shortcut icon" href="/dornorium/assets/icons/favicon.ico" type="image/x-icon">
</head>
<body>
<div class="container">
<div id="sf-toast" class="sf-toast" role="status" aria-live="polite"></div>
<div class="sf-wrap">
    <div class="sf-header">
        <i class="fas fa-headset"></i>
        <div>
            <div id="sf-title" style="font-size:1.4rem;font-weight:700;"></div>
            <div id="sf-subtitle" style="opacity:.8;font-size:.9rem;margin-top:.2rem;"></div>
        </div>
    </div>

    <div class="sf-body" id="sf-body">
        <div class="sf-progress-row">
            <span class="sf-progress-note"><i class="far fa-clock"></i> <span id="avg-resolution"></span></span>
            <span id="sf-step-label" class="sf-progress-step"></span>
        </div>
        <div class="sf-progress-track"><div id="sf-prog" class="sf-progress-fill" style="width:5%"></div></div>

        <div id="sf-loading" class="sf-loading">
            <i class="fas fa-spinner fa-spin" style="font-size:1.75rem;color:var(--accent)"></i>
            <p style="margin-top:.75rem" id="loading-text"></p>
        </div>

        <div id="sf-s1" class="sf-hidden">
            <div style="font-size:1.1rem;font-weight:600;margin-bottom:1rem;" id="select-issue"></div>
            <div id="sf-cats" class="sf-cat-grid"></div>
            <p class="sf-note"><i class="fas fa-shield-alt"></i> <span id="most-issues"></span></p>
        </div>

        <div id="sf-s2" class="sf-hidden"></div>

        <div id="sf-s3" class="sf-hidden">
            <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem;">
                <i class="fas fa-headset" style="font-size:1.4rem;color:var(--accent)"></i>
                <span style="font-size:1.25rem;font-weight:700;" id="need-help"></span>
            </div>
            <p style="color:var(--text-muted);font-size:.9rem;margin-bottom:1.5rem;" id="response-time"></p>

            <div class="sf-grid2">
                <div class="sf-field">
                    <label class="sf-label" for="sf-name" id="label-name"></label>
                    <input id="sf-name" type="text" class="sf-input" autocomplete="name" maxlength="120" aria-describedby="sf-name-err">
                    <span class="sf-field-error" id="sf-name-err" role="alert"></span>
                </div>
                <div class="sf-field">
                    <label class="sf-label" for="sf-email" id="label-email"></label>
                    <input id="sf-email" type="email" class="sf-input" autocomplete="email" maxlength="254" aria-describedby="sf-email-err">
                    <span class="sf-field-error" id="sf-email-err" role="alert"></span>
                </div>
            </div>

            <!-- UPDATED: Order number field with DOR- prefix -->
            <div class="sf-field">
                <label class="sf-label" for="sf-order" id="label-order"></label>
                <div style="position:relative;display:flex;align-items:center;border:1px solid var(--border);border-radius:.875rem;background:var(--bg);overflow:hidden;">
                    <span style="padding:0.75rem 0 0.75rem 1rem;font-weight:600;color:var(--text);background:color-mix(in srgb, var(--accent) 8%, transparent);border-right:1px solid var(--border);white-space:nowrap;user-select:none;">DOR-</span>
                    <input id="sf-order" type="text" class="sf-input" style="border:none;border-radius:0;flex:1;padding:0.75rem 1rem;" maxlength="50" aria-describedby="sf-order-err" placeholder="20260703-DY67SZ">
                </div>
                <span class="sf-field-error" id="sf-order-err" role="alert"></span>
                <small style="color:var(--text-muted);font-size:0.7rem;margin-top:4px;display:block;" id="order-help-text"></small>
            </div>

            <div class="sf-field" id="sf-summary-container" style="display:none;">
                <label class="sf-label" id="label-summary-table"></label>
                <div id="sf-summary-table" style="width:100%;margin-top:8px;"></div>
            </div>

            <div class="sf-field">
                <label class="sf-label" id="label-comments"></label>
                <textarea id="sf-desc" rows="6" class="sf-input" style="resize:vertical;font-family:monospace;font-size:0.85rem;line-height:1.5;" maxlength="2000" aria-describedby="comments-help-text"></textarea>
                <div id="sf-char-counter" class="sf-char-counter">0 / 2000</div>
                <small style="color:var(--text-muted);font-size:0.7rem;margin-top:4px;display:block;" id="comments-help-text"></small>
            </div>

            <div class="sf-turnstile-wrap">
                <div id="sf-turnstile-container"></div>
                <span class="sf-turnstile-error sf-hidden" id="sf-turnstile-err" role="alert"></span>
            </div>

            <button id="sf-submit" class="sf-submit"></button>
        </div>
    </div>
</div>
<script>
(function() {
    'use strict';

    var API_BASE = window.DORNORIUM_CONFIG.API_BASE;
    var LANG_BASE_PATH = window.DORNORIUM_CONFIG.LANG_BASE_PATH;
    var WORKER_URL = API_BASE + '/api/message';
    var TURNSTILE_KEY = (window.CONFIG && window.CONFIG.turnstile && window.CONFIG.turnstile.sitekey) || null;

    var lang = document.documentElement.lang || 'en';
    var formJsonPath = LANG_BASE_PATH + lang + '/form.json';
    var redirectUrl = null;

    var dom = {};
    var turnstileWidgetId = null;
    var turnstileToken = null;
    var formData = {};
    var currentCategory = null;
    var currentQuestionId = null;
    var answers = [];
    var isSubmitting = false;
    var abortController = null;
    var jsonLoadRetries = 0;
    var MAX_JSON_RETRIES = 3;
    var JSON_RETRY_DELAY = 1000;
    var eventListeners = [];

    function cacheDom() {
        var ids = ['sf-toast', 'sf-title', 'sf-subtitle', 'avg-resolution', 'sf-step-label', 'sf-prog', 'sf-loading', 'loading-text', 'sf-s1', 'sf-s2', 'sf-s3', 'select-issue', 'sf-cats', 'most-issues', 'need-help', 'response-time', 'sf-name', 'sf-email', 'sf-order', 'sf-desc', 'sf-submit', 'sf-name-err', 'sf-email-err', 'sf-order-err', 'sf-turnstile-container', 'sf-turnstile-err', 'sf-summary-container', 'sf-summary-table', 'label-name', 'label-email', 'label-order', 'label-comments', 'label-summary-table', 'order-help-text', 'comments-help-text', 'sf-char-counter'];
        for (var i = 0; i < ids.length; i++) {
            dom[ids[i]] = document.getElementById(ids[i]);
        }
    }

    function setText(id, text) {
        var el = dom[id] || document.getElementById(id);
        if (el) el.textContent = text;
    }

    function stripHtml(str) {
        if (typeof str !== 'string') return '';
        return str.replace(/<[^>]*>/g, '').trim();
    }

    function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) && email.length <= 254;
    }

    // Decides what ticket "category" gets sent to the worker.
    // Controlled via an optional "ticketCategory" block in form.json:
    //   { "ticketCategory": { "mode": "default", "default": "support" } }
    //   { "ticketCategory": { "mode": "formId", "default": "support" } }
    // mode "default" (or the block omitted entirely) always sends `default`.
    // mode "formId" sends the selected troubleshooting category's own id
    // (falling back to `default` if nothing was selected), for setups that
    // have added matching categories in the admin panel.
    function resolveTicketCategory() {
        var cfg = (formData && formData.ticketCategory) || {};
        var fallback = cfg.default || 'support';
        if (cfg.mode === 'formId') {
            return (currentCategory && currentCategory.id) || fallback;
        }
        return fallback;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function formatSummaryTable(answersArray) {
        if (!answersArray || answersArray.length === 0) return '';
        var html = '<table class="summary-table">';
        for (var i = 0; i < answersArray.length; i++) {
            var item = answersArray[i];
            var stepNum = i + 1;
            var summaryText = item.summary || item.answer || 'Step ' + stepNum + ' completed';
            var summary = escapeHtml(summaryText);
            html += '<tr><td class="step-number">' + stepNum + '</td><td class="summary-text">' + summary + '</td></tr>';
        }
        html += '</table>';
        return html;
    }

    function showToast(msg, ms, isError) {
        ms = ms || 3000;
        var t = dom['sf-toast'];
        if (!t) return;
        t.textContent = msg;
        t.style.opacity = '1';
        t.style.background = isError ? '#ef4444' : 'var(--header-bg)';
        t.style.color = isError ? '#fff' : 'var(--text)';
        t.style.border = isError ? 'none' : '1px solid var(--border)';
        setTimeout(function() { t.style.opacity = '0'; }, ms);
    }

    function showSuccessMessage(message, ticketNumber) {
        var body = document.getElementById('sf-body');
        var successTitle = formData.successTitle || 'Thank You!';
        var saveReferenceText = formData.saveReferenceText || 'Please save this reference number for future inquiries.';

        var successHtml = '<div class="sf-success-box" style="text-align:center;padding:2rem;" tabindex="-1">' +
            '<i class="fas fa-check-circle" style="font-size:4rem;color:#10b981;margin-bottom:1rem;"></i>' +
            '<h3 style="font-size:1.5rem;margin-bottom:1rem;color:var(--text);">' + escapeHtml(successTitle) + '</h3>' +
            '<div class="sf-ref-number" style="font-size:1.2rem;font-weight:700;color:var(--accent);margin:1rem 0;letter-spacing:1px;"><i class="fas fa-ticket-alt"></i> ' + escapeHtml(ticketNumber) + '</div>' +
            '<p style="color:var(--text-muted);margin-bottom:0.75rem;line-height:1.6;">' + escapeHtml(message) + '</p>' +
            '<p style="font-size: 0.85rem; margin-top: 1rem;color:var(--text-muted);">' + escapeHtml(saveReferenceText) + '</p>' +
            '</div>';
        body.innerHTML = successHtml;
    }

    async function loadFormDataWithRetry() {
        try {
            var res = await fetch(formJsonPath, { cache: 'no-store' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            formData = await res.json();
            jsonLoadRetries = 0;
            populateUI();
        } catch (err) {
            console.error('Failed to load form.json:', err);
            if (jsonLoadRetries < MAX_JSON_RETRIES) {
                jsonLoadRetries++;
                setTimeout(loadFormDataWithRetry, JSON_RETRY_DELAY);
            } else {
                if (dom['sf-loading']) {
                    dom['sf-loading'].innerHTML = '<p style="color:red">Failed to load form data.<br>Path: ' + formJsonPath + '</p>';
                }
            }
        }
    }

    function populateUI() {
        setText('sf-title', formData.title || 'Support');
        setText('sf-subtitle', formData.subtitle || 'We\'re here to help');
        setText('avg-resolution', formData.avgResolution || 'Avg. resolution 2 min');
        setText('select-issue', formData.selectIssue || 'Select your issue');
        setText('most-issues', formData.mostIssuesResolved || 'Most issues resolved quickly');
        setText('need-help', formData.needHumanHelp || 'Need human help?');
        setText('response-time', formData.responseTime || 'Our support team responds within 4 hours.');
        setText('loading-text', formData.loading || 'Loading...');
        if (dom['sf-submit']) dom['sf-submit'].textContent = formData.submitButton || 'Submit';

        if (dom['label-name']) dom['label-name'].innerHTML = (formData.fullName || 'Full name') + ' <span style="color:#ef4444">*</span>';
        if (dom['label-email']) dom['label-email'].innerHTML = (formData.email || 'Email address') + ' <span style="color:#ef4444">*</span>';
        if (dom['label-order']) dom['label-order'].innerHTML = (formData.orderNumber || 'Order number') + ' <span style="color:#ef4444">*</span>';
        if (dom['order-help-text']) dom['order-help-text'].textContent = formData.orderHelpText || 'Format: DOR-20260703-DY67SZ (shown as example)';
        if (dom['label-summary-table']) dom['label-summary-table'].textContent = formData.summaryLabel || 'Issue Summary';

        var maxChars = formData.maxCommentsChars || 2000;
        if (dom['label-comments']) dom['label-comments'].innerHTML = (formData.additionalComments || 'Additional comments') + ' <span style="color:var(--text-muted);font-weight:normal;">(optional)</span>';
        if (dom['sf-desc']) {
            dom['sf-desc'].placeholder = formData.commentsPlaceholder || 'Enter your comments';
            dom['sf-desc'].maxLength = maxChars;
        }
        if (dom['comments-help-text']) dom['comments-help-text'].textContent = formData.commentsHelpText || 'Please provide additional details about your issue.';

        initCharCounter(maxChars);

        var container = dom['sf-cats'];
        if (container) {
            container.innerHTML = '';
            var categories = formData.categories || [];
            for (var i = 0; i < categories.length; i++) {
                var cat = categories[i];
                var btn = document.createElement('button');
                btn.className = 'sf-btn';
                btn.innerHTML = '<i class="fas fa-chevron-circle-right"></i> ' + escapeHtml(cat.title);
                btn.onclick = (function(c) { return function() { startCategory(c); }; })(cat);
                container.appendChild(btn);
            }
        }

        if (dom['sf-loading']) dom['sf-loading'].style.display = 'none';
        if (dom['sf-s1']) dom['sf-s1'].classList.remove('sf-hidden');
        updateProgress(5, formData.step1Label || 'Step 1: Choose category');
    }

    function initCharCounter(maxChars) {
        if (!dom['sf-desc'] || !dom['sf-char-counter']) return;
        var updateCounter = function() {
            var current = dom['sf-desc'].value.length;
            var remaining = maxChars - current;
            dom['sf-char-counter'].textContent = current + ' / ' + maxChars;
            dom['sf-char-counter'].classList.remove('warning', 'danger');
            if (remaining < 50) dom['sf-char-counter'].classList.add('danger');
            else if (remaining < 200) dom['sf-char-counter'].classList.add('warning');
        };
        dom['sf-desc'].addEventListener('input', updateCounter);
        eventListeners.push({element: dom['sf-desc'], type: 'input', handler: updateCounter});
        updateCounter();
    }

    function updateProgress(percent, label) {
        if (dom['sf-prog']) dom['sf-prog'].style.width = percent + '%';
        if (dom['sf-step-label']) dom['sf-step-label'].textContent = label;
    }

    function startCategory(cat) {
        currentCategory = cat;
        answers = [];
        if (cat.questions && cat.questions.length > 0) {
            currentQuestionId = cat.questions[0].id;
            showQuestionById(currentQuestionId);
        } else {
            showContactForm();
        }
    }

    function findQuestion(questionId) {
        if (!currentCategory || !currentCategory.questions) return null;
        for (var i = 0; i < currentCategory.questions.length; i++) {
            if (currentCategory.questions[i].id === questionId) return currentCategory.questions[i];
        }
        return null;
    }

    function showQuestionById(questionId) {
        var question = findQuestion(questionId);
        if (!question) { showContactForm(); return; }

        var troubleshootingLabel = formData.troubleshootingLabel || 'Troubleshooting';
        var html = '<div class="sf-q-label"><i class="fas fa-question-circle"></i> ' + troubleshootingLabel + '</div>';
        html += '<div class="sf-q-text">' + escapeHtml(question.text) + '</div>';

        for (var i = 0; i < question.options.length; i++) {
            var opt = question.options[i];
            html += '<button class="sf-opt" onclick="window.selectAnswerExternal(\'' + questionId + '\', ' + i + ')"><span>' + escapeHtml(opt.text) + '</span><i class="fas fa-arrow-right"></i></button>';
        }

        var startOverLabel = formData.startOverLabel || 'Start over';
        html += '<div style="margin-top:1rem"><button class="sf-reset" onclick="window.sfResetExternal()"><i class="fas fa-undo-alt"></i> ' + startOverLabel + '</button></div>';

        if (dom['sf-s2']) dom['sf-s2'].innerHTML = html;
        if (dom['sf-s1']) dom['sf-s1'].classList.add('sf-hidden');
        if (dom['sf-s2']) dom['sf-s2'].classList.remove('sf-hidden');
        if (dom['sf-s3']) dom['sf-s3'].classList.add('sf-hidden');
        updateProgress(45, formData.step2Label || 'Step 2: Troubleshooting');
    }

    window.selectAnswerExternal = function(questionId, optionIndex) {
        var question = findQuestion(questionId);
        if (!question) return;
        var opt = question.options[optionIndex];
        answers.push({
            question: question.text,
            answer: opt.text,
            summary: opt.summary || opt.text
        });
        var nextId = opt.next;
        if (nextId === 'resolved_end') {
            var endpoint = formData.endpoints && formData.endpoints.resolved_end;
            if (endpoint && endpoint.type === 'redirect' && endpoint.redirect_url) {
                showToast(endpoint.message || 'Issue resolved!', (endpoint.delay_seconds || 2) * 1000);
                setTimeout(function() { window.location.href = endpoint.redirect_url; }, (endpoint.delay_seconds || 2) * 1000);
            } else {
                showSuccessMessage((endpoint && endpoint.message) || 'Issue resolved! Thank you.', 'RESOLVED');
            }
            return;
        }
        if (nextId === 'contact') { showContactForm(); return; }
        var nextQuestion = findQuestion(nextId);
        if (nextQuestion) { currentQuestionId = nextId; showQuestionById(nextId); }
        else { showContactForm(); }
    };

    function destroyTurnstile() {
        if (turnstileWidgetId !== null) {
            try {
                if (typeof turnstile !== 'undefined' && turnstile.remove) {
                    turnstile.remove(turnstileWidgetId);
                }
            } catch(e) {}
            turnstileWidgetId = null;
        }
        turnstileToken = null;
        if (dom['sf-turnstile-container']) {
            while (dom['sf-turnstile-container'].firstChild) {
                dom['sf-turnstile-container'].removeChild(dom['sf-turnstile-container'].firstChild);
            }
        }
    }

    function initTurnstile() {
        var container = dom['sf-turnstile-container'];
        if (!container) return;

        if (!TURNSTILE_KEY || TURNSTILE_KEY === '1x00000000000000000000AA') {
            container.style.display = 'none';
            turnstileToken = 'no-turnstile-required';
            return;
        }

        if (typeof turnstile === 'undefined') {
            setTimeout(initTurnstile, 200);
            return;
        }

        destroyTurnstile();
        container.style.display = 'block';

        try {
            turnstileWidgetId = turnstile.render(container, {
                sitekey: TURNSTILE_KEY,
                theme: 'light',
                callback: function(token) {
                    turnstileToken = token;
                    var err = dom['sf-turnstile-err'];
                    if (err) {
                        err.textContent = '';
                        err.classList.add('sf-hidden');
                    }
                    if (container) container.classList.remove('sf-input-error');
                },
                'expired-callback': function() {
                    turnstileToken = null;
                    var err = dom['sf-turnstile-err'];
                    if (err) {
                        err.textContent = formData.turnstileExpiredError || 'Security verification expired. Please try again.';
                        err.classList.remove('sf-hidden');
                    }
                    if (container) container.classList.add('sf-input-error');
                },
                'error-callback': function() {
                    turnstileToken = null;
                    var err = dom['sf-turnstile-err'];
                    if (err) {
                        err.textContent = formData.turnstileFailedError || 'Security verification failed.';
                        err.classList.remove('sf-hidden');
                    }
                    if (container) container.classList.add('sf-input-error');
                }
            });
        } catch(e) {
            console.error('Turnstile render error:', e);
        }
    }

    function showContactForm() {
        var summaryHtml = formatSummaryTable(answers);
        if (answers.length > 0 && dom['sf-summary-container'] && dom['sf-summary-table']) {
            dom['sf-summary-table'].innerHTML = summaryHtml;
            dom['sf-summary-container'].style.display = 'block';
        } else if (dom['sf-summary-container']) {
            dom['sf-summary-container'].style.display = 'none';
        }

        if (dom['sf-s1']) dom['sf-s1'].classList.add('sf-hidden');
        if (dom['sf-s2']) dom['sf-s2'].classList.add('sf-hidden');
        if (dom['sf-s3']) dom['sf-s3'].classList.remove('sf-hidden');
        updateProgress(85, formData.step3Label || 'Step 3: Contact support');

        initTurnstile();
    }

    function setFieldError(inputId, errorId, message) {
        var input = dom[inputId];
        var errEl = dom[errorId];
        if (message) {
            if (input) input.classList.add('sf-input-error');
            if (errEl) errEl.textContent = message;
            return true;
        } else {
            if (input) input.classList.remove('sf-input-error');
            if (errEl) errEl.textContent = '';
            return false;
        }
    }

    function validateForm() {
        var hasError = false;
        var nameInput = dom['sf-name']?.value || '';
        var emailInput = dom['sf-email']?.value || '';
        var orderInput = dom['sf-order']?.value || '';

        setFieldError('sf-name', 'sf-name-err', '');
        setFieldError('sf-email', 'sf-email-err', '');
        setFieldError('sf-order', 'sf-order-err', '');

        if (dom['sf-turnstile-err']) dom['sf-turnstile-err'].classList.add('sf-hidden');
        if (dom['sf-turnstile-container']) dom['sf-turnstile-container'].classList.remove('sf-input-error');

        if (!nameInput.trim()) {
            setFieldError('sf-name', 'sf-name-err', formData.fullNameRequired || 'Full name is required.');
            hasError = true;
        }

        if (!emailInput.trim()) {
            setFieldError('sf-email', 'sf-email-err', formData.emailRequired || 'Email address is required.');
            hasError = true;
        } else if (!isValidEmail(emailInput)) {
            setFieldError('sf-email', 'sf-email-err', formData.emailInvalid || 'Please enter a valid email address.');
            hasError = true;
        }

        // UPDATED: Order number validation - accepts alphanumeric with hyphens
        if (!orderInput.trim()) {
            setFieldError('sf-order', 'sf-order-err', formData.orderNumberRequired || 'Order number is required.');
            hasError = true;
        } else if (!/^[A-Za-z0-9-]+$/.test(orderInput.trim())) {
            setFieldError('sf-order', 'sf-order-err', 'Order number contains invalid characters. Use letters, numbers, and hyphens only.');
            hasError = true;
        }

        var turnstileEnabled = TURNSTILE_KEY && TURNSTILE_KEY !== '1x00000000000000000000AA';
        if (turnstileEnabled) {
            if (!turnstileToken) {
                if (dom['sf-turnstile-err']) {
                    dom['sf-turnstile-err'].textContent = formData.turnstileError || 'Please complete the security check.';
                    dom['sf-turnstile-err'].classList.remove('sf-hidden');
                }
                if (dom['sf-turnstile-container']) dom['sf-turnstile-container'].classList.add('sf-input-error');
                hasError = true;
            }
        }

        if (hasError) {
            var firstError = document.querySelector('.sf-input-error');
            if (firstError) firstError.focus();
            showToast(formData.errorFixAbove || 'Please fix the errors above before submitting.', 3000, true);
        }

        return {
            valid: !hasError,
            sanitised: {
                name: stripHtml(nameInput),
                email: stripHtml(emailInput),
                order: stripHtml(orderInput),
                comments: stripHtml(dom['sf-desc']?.value || '')
            }
        };
    }

    // ============================================================
    // FIXED: sendSupportRequest - matches contact.html payload format
    // ============================================================
    async function sendSupportRequest() {
        if (isSubmitting) {
            showToast(formData.alreadySubmittingText || 'Submission already in progress...', 2000, false);
            return;
        }

        var validation = validateForm();
        if (!validation.valid) return;

        isSubmitting = true;
        var sanitised = validation.sanitised;
        var submitBtn = dom['sf-submit'];
        var originalText = submitBtn?.textContent || 'Submit';

        if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = formData.sendingText || 'Sending...';
        }

        // Build full message - combine troubleshooting steps + comments
        var fullMessage = '';
        
        if (answers.length > 0) {
            fullMessage += '=== TROUBLESHOOTING STEPS ===\n\n';
            for (var i = 0; i < answers.length; i++) {
                var item = answers[i];
                fullMessage += 'Step ' + (i + 1) + ': ' + (item.summary || item.answer) + '\n';
            }
            fullMessage += '\n';
        }
        
        if (sanitised.comments) {
            fullMessage += '=== ADDITIONAL COMMENTS ===\n\n';
            fullMessage += sanitised.comments + '\n\n';
        }
        
        fullMessage += '=== ORDER INFORMATION ===\n';
        fullMessage += 'Order Number: DOR-' + sanitised.order + '\n';

        var categoryId = currentCategory?.id || 'support';

        // UPDATED: Payload matches contact.html format EXACTLY
        var payload = {
            category: resolveTicketCategory(),
            name: sanitised.name,
            email: sanitised.email,
            phone: '',
            company: '',
            subject: 'Support: ' + (currentCategory?.title || 'General') + ' (Order: DOR-' + sanitised.order + ')',
            language: lang,
            message: fullMessage,
            orderNumber: 'DOR-' + sanitised.order,
            metadata: {
                source: 'support-form',
                userAgent: navigator.userAgent,
                topic: categoryId,
                topicLabel: currentCategory?.title || 'General',
                orderNumber: 'DOR-' + sanitised.order,
                troubleshootingSteps: answers.length,
                hasComments: !!sanitised.comments,
                troubleshooting: answers.map(function(a) {
                    return { question: a.question, answer: a.answer, summary: a.summary };
                }),
                additionalComments: sanitised.comments || ''
            }
        };

        console.log('📤 Sending support request (contact.html format):');
        console.log('  Category:', payload.category);
        console.log('  Name:', payload.name);
        console.log('  Email:', payload.email);
        console.log('  Order:', payload.orderNumber);
        console.log('  UserAgent:', payload.metadata.userAgent);
        console.log('  Troubleshooting steps:', payload.metadata.troubleshootingSteps);

        if (abortController) abortController.abort();
        abortController = new AbortController();
        var timeoutId = setTimeout(function() {
            if (abortController) abortController.abort();
        }, 30000);

        try {
            var response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                signal: abortController.signal
            });

            clearTimeout(timeoutId);

            var result;
            try {
                result = await response.json();
            } catch (e) {
                throw new Error('Invalid server response');
            }

            console.log('📥 Server response:', result);

            if (!response.ok) {
                throw new Error(result.error || 'Server returned ' + response.status);
            }
            if (!result.success) {
                throw new Error(result.error || 'Server rejected the request');
            }

            if (redirectUrl && redirectUrl.trim()) {
                window.location.href = redirectUrl;
            } else {
                var ticketNumber = result.ticketNumber || 'TKT-' + Date.now().toString().slice(-6);
                var successMessage = formData.successMessage || 'Your support request has been submitted. Our team will respond within 4 hours.';
                showSuccessMessage(successMessage, ticketNumber);
            }
        } catch (err) {
            clearTimeout(timeoutId);
            console.error('❌ Submission error:', err);
            var errorMsg = err.message || (formData.submissionErrorText || 'Submission failed') + '. ' + (formData.retryText || 'Please try again.');
            if (err.name === 'AbortError') {
                errorMsg = formData.timeoutErrorText || 'Request timed out. Please try again.';
            }
            showToast(errorMsg, 5000, true);

            if (turnstileWidgetId !== null && typeof turnstile !== 'undefined' && turnstile.reset) {
                try {
                    turnstile.reset(turnstileWidgetId);
                    turnstileToken = null;
                } catch(e) {}
            }

            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
            isSubmitting = false;
            return;
        }

        isSubmitting = false;
        abortController = null;
    }

    function resetForm() {
        currentCategory = null;
        currentQuestionId = null;
        answers = [];

        if (dom['sf-s1']) dom['sf-s1'].classList.remove('sf-hidden');
        if (dom['sf-s2']) dom['sf-s2'].classList.add('sf-hidden');
        if (dom['sf-s3']) dom['sf-s3'].classList.add('sf-hidden');
        if (dom['sf-summary-container']) dom['sf-summary-container'].style.display = 'none';
        updateProgress(5, formData.step1Label || 'Step 1: Choose category');

        if (dom['sf-name']) dom['sf-name'].value = '';
        if (dom['sf-email']) dom['sf-email'].value = '';
        if (dom['sf-order']) dom['sf-order'].value = '';
        if (dom['sf-desc']) dom['sf-desc'].value = '';

        var errorIds = ['sf-name-err', 'sf-email-err', 'sf-order-err'];
        for (var i = 0; i < errorIds.length; i++) {
            var errEl = dom[errorIds[i]];
            if (errEl) errEl.textContent = '';
        }
        var inputIds = ['sf-name', 'sf-email', 'sf-order'];
        for (var i = 0; i < inputIds.length; i++) {
            var input = dom[inputIds[i]];
            if (input) input.classList.remove('sf-input-error');
        }

        destroyTurnstile();

        if (dom['sf-turnstile-err']) dom['sf-turnstile-err'].classList.add('sf-hidden');

        if (dom['sf-cats']) {
            var firstCat = dom['sf-cats'].querySelector('button');
            if (firstCat) firstCat.focus();
        }

        showToast(formData.resetText || 'Session reset', 1500);
    }

    window.sfResetExternal = resetForm;

    function cleanup() {
        for (var i = 0; i < eventListeners.length; i++) {
            var listener = eventListeners[i];
            if (listener.element) {
                listener.element.removeEventListener(listener.type, listener.handler);
            }
        }
        eventListeners = [];
        if (abortController) {
            abortController.abort();
            abortController = null;
        }
        destroyTurnstile();
    }

    function setupEventListeners() {
        var submitHandler = function(e) {
            if (e.target.closest('#sf-submit')) {
                e.preventDefault();
                sendSupportRequest();
            }
        };

        // UPDATED: No digit-only filter - allow alphanumeric with hyphens
        document.addEventListener('click', submitHandler);
        eventListeners.push({element: document, type: 'click', handler: submitHandler});
    }

    function init() {
        cacheDom();
        setupEventListeners();
        loadFormDataWithRetry();
        window.addEventListener('beforeunload', cleanup);
    }

    init();
})();
</script>
