<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script>
(function() {
    var config = {};
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/dornorium/config.json', false);
        xhr.send();
        if (xhr.status === 200) config = JSON.parse(xhr.responseText);
    } catch (e) {}
    window.DORNORIUM_CONFIG = {
        API_BASE: config.API_BASE || '',
        LANG_BASE_PATH: config.LANG_BASE_PATH || '/lang/',
        CSS_PATH: config.CSS_PATH || '/css/dornorium.css'
    };
    document.write('<link rel="stylesheet" href="' + window.DORNORIUM_CONFIG.CSS_PATH + '">');
})();
</script>
<style>
.dornorium-brand { display:block !important; }
body:not(:has(.dornorium-brand)) .dornorium-brand { display:none !important; }
</style>
<link rel="icon" type="image/png" sizes="32x32" href="/dornorium/assets/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/dornorium/assets/icons/favicon-16x16.png">
<link rel="shortcut icon" href="/dornorium/assets/icons/favicon.ico" type="image/x-icon">
</head>
<body>
<div class="container">
<div id="cf-toast" class="cf-toast" role="status" aria-live="polite"></div>
<div class="cf-wrap">
    <div class="cf-header">
        <i class="fas fa-envelope"></i>
        <div>
            <div id="cf-title" style="font-size:1.4rem;font-weight:700;"></div>
            <div id="cf-subtitle" style="opacity:.8;font-size:.9rem;margin-top:.2rem;"></div>
        </div>
    </div>

    <div class="cf-body" id="cf-body">
        <div class="cf-progress-row">
            <span class="cf-progress-note"><i class="far fa-clock"></i> <span id="cf-avg-response"></span></span>
            <span id="cf-step-label" class="cf-progress-step"></span>
        </div>
        <div class="cf-progress-track"><div id="cf-prog" class="cf-progress-fill" style="width:10%"></div></div>

        <div id="cf-s1">
            <div style="font-size:1.1rem;font-weight:600;margin-bottom:1rem;" id="cf-select-prompt"></div>
            <div id="cf-cats" class="cf-cat-grid"></div>
            <p class="cf-note" id="cf-select-note"><i class="fas fa-info-circle"></i> <span id="cf-select-note-text"></span></p>
        </div>

        <div id="cf-s2" style="display:none;">
            <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem;">
                <i class="fas fa-user" style="font-size:1.2rem;color:var(--accent)"></i>
                <span style="font-size:1.1rem;font-weight:600;" id="cf-details-heading"></span>
            </div>
            <p style="color:var(--text-muted);font-size:.9rem;margin-bottom:1.5rem;" id="cf-details-sub"></p>

            <div class="cf-grid2">
                <div class="cf-field">
                    <label class="cf-label" for="cf-first-name" id="label-first-name"></label>
                    <input id="cf-first-name" type="text" class="cf-input" autocomplete="given-name">
                    <span class="cf-field-error" id="cf-first-name-err"></span>
                </div>
                <div class="cf-field">
                    <label class="cf-label" for="cf-last-name" id="label-last-name"></label>
                    <input id="cf-last-name" type="text" class="cf-input" autocomplete="family-name">
                    <span class="cf-field-error" id="cf-last-name-err"></span>
                </div>
            </div>

            <div class="cf-grid2">
                <div class="cf-field">
                    <label class="cf-label" for="cf-email" id="label-email"></label>
                    <input id="cf-email" type="email" class="cf-input" autocomplete="email">
                    <span class="cf-field-error" id="cf-email-err"></span>
                </div>
                <div class="cf-field">
                    <label class="cf-label" for="cf-phone" id="label-phone"></label>
                    <input id="cf-phone" type="tel" class="cf-input" autocomplete="tel">
                    <span class="cf-field-error" id="cf-phone-err"></span>
                </div>
            </div>

            <div class="cf-field">
                <label class="cf-label" for="cf-company" id="label-company"></label>
                <input id="cf-company" type="text" class="cf-input" autocomplete="organization">
            </div>

            <div class="cf-field">
                <label class="cf-label" for="cf-subject" id="label-subject"></label>
                <input id="cf-subject" type="text" class="cf-input">
                <span class="cf-field-error" id="cf-subject-err"></span>
            </div>

            <div class="cf-field">
                <label class="cf-label" for="cf-message" id="label-message"></label>
                <textarea id="cf-message" rows="6" class="cf-input"></textarea>
                <div id="cf-char-counter" class="cf-char-counter">0 / 5000</div>
                <span class="cf-field-error" id="cf-message-err"></span>
            </div>

            <div class="cf-turnstile-wrap">
                <div id="cf-turnstile-container"></div>
                <span class="cf-turnstile-error cf-hidden" id="cf-turnstile-err" role="alert"></span>
            </div>

            <button id="cf-submit" class="cf-submit"></button>
            <button id="cf-back" style="margin-top:10px;background:transparent;border:1px solid var(--border);color:var(--text-muted);padding:8px 16px;border-radius:8px;cursor:pointer;width:100%;font-family:var(--font-sans);font-size:.9rem;"></button>
        </div>

        <div id="cf-success" style="display:none;text-align:center;padding:30px 20px;">
            <i class="fas fa-check-circle" style="font-size:3rem;color:#10b981;"></i>
            <h3 id="cf-success-title" style="color:var(--text);margin:12px 0 6px;"></h3>
            <p id="cf-success-message" style="color:var(--text-muted);"></p>
            <p style="font-size:0.85rem;color:var(--text-muted);margin-top:0.5rem;">
                <span id="cf-ticket-label"></span> <span id="cf-ref-number" style="color:var(--accent);font-weight:600;font-family:monospace;"></span>
            </p>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';

    var API_BASE = window.DORNORIUM_CONFIG.API_BASE;
    var LANG_BASE_PATH = window.DORNORIUM_CONFIG.LANG_BASE_PATH;
    var WORKER_URL = API_BASE + '/api/message';
    var TURNSTILE_KEY = (window.CONFIG && window.CONFIG.turnstile && window.CONFIG.turnstile.sitekey) || null;

    var lang = document.documentElement.lang || 'en';
    var jsonPath = LANG_BASE_PATH + lang + '/contact.json';

    var t = {};
    var selectedCategory = null;
    var turnstileWidget = null;
    var turnstileToken = null;
    var isSubmitting = false;

    function $(id) { return document.getElementById(id); }

    function setText(id, text) { var el = $(id); if (el) el.textContent = text; }

    function showToast(msg, isError) {
        var el = $('cf-toast');
        if (!el) return;
        el.textContent = msg;
        el.style.background = isError ? '#ef4444' : 'var(--header-bg)';
        el.style.color = isError ? '#fff' : 'var(--text)';
        el.style.border = isError ? 'none' : '1px solid var(--border)';
        el.style.opacity = '1';
        setTimeout(function() { el.style.opacity = '0'; }, 3000);
    }

    function isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e) && e.length <= 254; }

    function destroyTurnstile() {
        if (turnstileWidget !== null) {
            try { if (typeof turnstile !== 'undefined' && turnstile.remove) turnstile.remove(turnstileWidget); } catch(e) {}
            turnstileWidget = null;
        }
        turnstileToken = null;
        var c = $('cf-turnstile-container');
        if (c) while (c.firstChild) c.removeChild(c.firstChild);
    }

    function initTurnstile() {
        var c = $('cf-turnstile-container');
        if (!c) return;
        if (!TURNSTILE_KEY || TURNSTILE_KEY === '1x00000000000000000000AA') {
            c.style.display = 'none';
            turnstileToken = 'no-turnstile-required';
            return;
        }
        if (typeof turnstile === 'undefined') { setTimeout(initTurnstile, 300); return; }
        destroyTurnstile();
        c.style.display = 'block';
        try {
            turnstileWidget = turnstile.render(c, {
                sitekey: TURNSTILE_KEY,
                theme: 'light',
                callback: function(token) {
                    turnstileToken = token;
                    var err = $('cf-turnstile-err');
                    if (err) { err.textContent = ''; err.classList.add('cf-hidden'); }
                },
                'expired-callback': function() {
                    turnstileToken = null;
                    var err = $('cf-turnstile-err');
                    if (err) { err.textContent = t.turnstileExpired || 'Verification expired.'; err.classList.remove('cf-hidden'); }
                },
                'error-callback': function() {
                    turnstileToken = null;
                    var err = $('cf-turnstile-err');
                    if (err) { err.textContent = t.turnstileFailed || 'Verification failed.'; err.classList.remove('cf-hidden'); }
                }
            });
        } catch(e) { console.error('Turnstile error:', e); }
    }

    function selectCategory(cat) {
        selectedCategory = cat;
        $('cf-s1').style.display = 'none';
        $('cf-s2').style.display = 'block';
        setText('cf-step-label', t.step2Label || 'Step 2: Your details');
        $('cf-prog').style.width = '50%';
        initTurnstile();
        $('cf-first-name').focus();
    }

    function goBack() {
        $('cf-s2').style.display = 'none';
        $('cf-s1').style.display = 'block';
        setText('cf-step-label', t.stepSelectLabel || 'Select a category');
        $('cf-prog').style.width = '10%';
        destroyTurnstile();
    }

    function getVal(id) { var el = $(id); return el ? el.value.trim() : ''; }

    function submitForm() {
        if (isSubmitting) return;
        if (!selectedCategory) { showToast(t.selectCategoryFirst || 'Please select a category first.', true); return; }

        var firstName = getVal('cf-first-name');
        var lastName = getVal('cf-last-name');
        var email = getVal('cf-email');
        var phone = getVal('cf-phone');
        var subject = getVal('cf-subject');
        var message = getVal('cf-message');
        var company = getVal('cf-company');

        document.querySelectorAll('.cf-field-error').forEach(function(el) { el.textContent = ''; });
        document.querySelectorAll('.cf-input').forEach(function(el) { el.classList.remove('cf-input-error'); });

        var hasError = false;
        function fieldErr(inputId, errId, msg) {
            $(errId).textContent = msg; $(inputId).classList.add('cf-input-error'); hasError = true;
        }

        if (!firstName) fieldErr('cf-first-name', 'cf-first-name-err', t.required || 'Required');
        if (!lastName) fieldErr('cf-last-name', 'cf-last-name-err', t.required || 'Required');
        if (!email) fieldErr('cf-email', 'cf-email-err', t.required || 'Required');
        else if (!isValidEmail(email)) fieldErr('cf-email', 'cf-email-err', t.invalidEmail || 'Invalid email');
        // Phone validation - more flexible, allow empty
        if (phone && !/^[\+\d\s\-\(\)]{7,20}$/.test(phone)) {
            fieldErr('cf-phone', 'cf-phone-err', t.invalidPhone || 'Invalid phone format');
        }
        if (!subject) fieldErr('cf-subject', 'cf-subject-err', t.required || 'Required');
        if (!message) fieldErr('cf-message', 'cf-message-err', t.required || 'Required');
        else if (message.length < 10) fieldErr('cf-message', 'cf-message-err', t.minMessage || 'Min 10 characters');

        var turnstileEnabled = TURNSTILE_KEY && TURNSTILE_KEY !== '1x00000000000000000000AA';
        if (turnstileEnabled && !turnstileToken) {
            var terr = $('cf-turnstile-err');
            if (terr) { terr.textContent = t.turnstileError || 'Please complete the security check.'; terr.classList.remove('cf-hidden'); }
            hasError = true;
        }

        if (hasError) { showToast(t.fixErrors || 'Please fix the errors above.', true); return; }

        isSubmitting = true;
        var btn = $('cf-submit');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + (t.sendingText || 'Sending...');

        // Build payload with ALL fields separate
        var payload = {
            category: selectedCategory,
            name: firstName + ' ' + lastName,
            email: email,
            phone: phone || '',  // Phone is sent as a separate field
            company: company || '',  // Company is sent as a separate field
            subject: subject,
            language: lang,
            message: message,  // Message is separate from phone and company
            metadata: { 
                source: 'contact-form', 
                firstName: firstName, 
                lastName: lastName, 
                language: lang,
                phoneProvided: !!phone,
                companyProvided: !!company,
                category: selectedCategory
            }
        };

        // Debug: Log the payload to verify fields
        console.log('📤 Sending contact form payload:');
        console.log('  - Category:', payload.category);
        console.log('  - Name:', payload.name);
        console.log('  - Email:', payload.email);
        console.log('  - Phone:', payload.phone, '(separate field)');
        console.log('  - Company:', payload.company, '(separate field)');
        console.log('  - Subject:', payload.subject);
        console.log('  - Message length:', payload.message.length, 'chars');
        console.log('  - Full payload:', payload);

        fetch(WORKER_URL, { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify(payload) 
        })
        .then(function(res) { 
            if (!res.ok) {
                return res.text().then(function(text) {
                    throw new Error('HTTP ' + res.status + ': ' + text);
                });
            }
            return res.json(); 
        })
        .then(function(result) {
            console.log('📥 Server response:', result);
            if (result.success) {
                $('cf-s2').style.display = 'none';
                $('cf-success').style.display = 'block';
                setText('cf-ref-number', result.ticketNumber || 'TKT-ERROR');
                $('cf-prog').style.width = '100%';
                setText('cf-step-label', t.stepDoneLabel || '✅ Done');
                showToast(t.successTitle || 'Message sent!', false);
            } else {
                throw new Error(result.error || 'Server returned error');
            }
        })
        .catch(function(err) {
            console.error('❌ Submission error:', err);
            showToast((t.sendFailed || 'Failed to send') + ': ' + err.message, true);
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> ' + (t.submitButton || 'Send Message');
            if (turnstileWidget !== null && typeof turnstile !== 'undefined' && turnstile.reset) {
                try {
                    turnstile.reset(turnstileWidget);
                    turnstileToken = null;
                } catch(e) { /* ignore */ }
            }
        })
        .finally(function() { 
            isSubmitting = false; 
        });
    }

    function populateUI() {
        setText('cf-title', t.title || 'Contact Us');
        setText('cf-subtitle', t.subtitle || '');
        setText('cf-avg-response', t.avgResponse || '');
        setText('cf-step-label', t.stepSelectLabel || 'Select a category');
        setText('cf-select-prompt', t.selectPrompt || '');
        setText('cf-select-note-text', t.selectNote || '');
        setText('cf-details-heading', t.detailsHeading || 'Your Details');
        setText('cf-details-sub', t.detailsSub || '');
        setText('cf-success-title', t.successTitle || 'Message Sent!');
        setText('cf-success-message', t.successMessage || '');
        setText('cf-ticket-label', t.ticketLabel || 'Ticket Number:');

        var lbl = function(id, key, optional) {
            var el = $(id);
            if (!el) return;
            var labelText = t[key] || key;
            if (optional) {
                el.innerHTML = labelText + ' <span style="color:var(--text-muted);font-weight:400;">' + (t[optional] || optional) + '</span>';
            } else {
                el.innerHTML = labelText + ' <span style="color:#ef4444">*</span>';
            }
        };
        lbl('label-first-name', 'firstName');
        lbl('label-last-name', 'lastName');
        lbl('label-email', 'email');
        lbl('label-phone', 'phone', 'phoneOptional');
        lbl('label-company', 'company', 'companyOptional');
        lbl('label-subject', 'subject');
        lbl('label-message', 'message');

        var fields = [
            ['cf-first-name', 'firstNamePlaceholder'],
            ['cf-last-name', 'lastNamePlaceholder'],
            ['cf-email', 'emailPlaceholder'],
            ['cf-phone', 'phonePlaceholder'],
            ['cf-company', 'companyPlaceholder'],
            ['cf-subject', 'subjectPlaceholder'],
            ['cf-message', 'messagePlaceholder']
        ];
        fields.forEach(function(f) { var el = $(f[0]); if (el) el.placeholder = t[f[1]] || ''; });

        var submitBtn = $('cf-submit');
        if (submitBtn) submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> ' + (t.submitButton || 'Send Message');
        var backBtn = $('cf-back');
        if (backBtn) backBtn.textContent = t.backButton || '← Back to categories';

        var cats = $('cf-cats');
        if (cats) {
            cats.innerHTML = '';
            (t.categories || []).forEach(function(cat) {
                var btn = document.createElement('button');
                btn.className = 'cf-btn';
                btn.dataset.cat = cat.id;
                btn.innerHTML = '<i class="' + cat.icon + '"></i> ' + cat.label;
                btn.onclick = function() { selectCategory(cat.id); };
                cats.appendChild(btn);
            });
        }

        var msg = $('cf-message');
        var counter = $('cf-char-counter');
        if (msg && counter) {
            msg.addEventListener('input', function() { 
                counter.textContent = msg.value.length + ' / 5000'; 
            });
        }

        var backBtn2 = $('cf-back');
        if (backBtn2) backBtn2.onclick = goBack;
        var submitBtn2 = $('cf-submit');
        if (submitBtn2) submitBtn2.onclick = submitForm;
    }

    fetch(jsonPath, { cache: 'no-store' })
        .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function(data) { 
            console.log('📄 Loaded language file:', lang);
            t = data; 
            populateUI(); 
        })
        .catch(function(err) { 
            console.error('❌ Failed to load contact.json:', err); 
            // Fallback to English
            t = {
                title: 'Contact Us',
                firstName: 'First Name',
                lastName: 'Last Name',
                email: 'Email',
                phone: 'Phone',
                company: 'Company',
                subject: 'Subject',
                message: 'Message'
            };
            populateUI();
        });
})();
</script>
</div>
<div class="dornorium-brand" style="text-align:center;padding:16px 0 10px;border-top:1px solid #eee;margin-top:24px;font-size:11px;color:#999;data-token='d7f3a9c2e1b8f4';">
    <img src="/dornorium/assets/icons/favicon-32x32.png" alt="Dornorium" width="32" height="32" style="display:inline-block;vertical-align:middle;margin-right:6px;">
    <span style="vertical-align:middle;">Powered by <a href="https://www.dornori.info/dornorium" target="_blank" style="color:#666;text-decoration:none;font-weight:600;">Dornorium</a></span>
    <span style="margin:0 8px;color:#ddd;">&middot;</span>
</div>
<script>
(function(){var b=document.querySelector('.dornorium-brand');if(!b||!b.getAttribute('data-token')){console.warn('Branding removed — license required: https://www.dornori.info/pricing');var style=document.createElement('style');style.textContent='body{filter:blur(2px);pointer-events:none;opacity:.5}body::after{content:"License required";position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:red;font-size:24px;font-weight:bold;background:white;padding:20px;border-radius:8px;z-index:9999}';document.head.appendChild(style);}})();
</script>
</body>
</html>
