<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Newsletter – Dornorium</title>
 <link rel="stylesheet" href="css/style.css" />
    <script src="js/shared.js"></script>
    <style>

        .s-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .s-card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
        .s-card-head h3 { font-size: 15px; font-weight: 700; color: var(--text); }
        .s-card-head p  { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.4; }

        .f-row { margin-bottom: 16px; }
        .f-row label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted); margin-bottom: 6px; }
        .f-row input[type="text"],
        .f-row select {
            width: 100%; padding: 9px 12px; background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 7px; color: var(--text); font-size: 14px; font-family: inherit; transition: border-color .15s;
        }
        .f-row input:focus, .f-row select:focus { outline: none; border-color: var(--accent); }

        .editor-wrap { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .editor-toolbar {
            display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 8px;
            background: var(--bg-input); border-bottom: 1px solid var(--border);
        }
        .editor-toolbar button, .editor-toolbar select {
            padding: 4px 8px; background: none; border: 1px solid transparent; border-radius: 5px;
            color: var(--text); font-size: 13px; cursor: pointer; font-family: inherit; line-height: 1;
            transition: background .12s, border-color .12s;
        }
        .editor-toolbar button:hover { background: var(--bg-secondary); border-color: var(--border); }
        .editor-toolbar button.active { background: var(--accent); color: var(--text-inverse); border-color: var(--accent); }
        .editor-toolbar .sep { width: 1px; background: var(--border); margin: 2px 4px; align-self: stretch; }
        .editor-toolbar select {
            padding: 3px 6px; background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 5px; color: var(--text); font-size: 12px; cursor: pointer;
        }
        #nl_editor {
            min-height: 280px; padding: 14px 16px; outline: none;
            background: var(--bg-input); color: var(--text); font-size: 14px; line-height: 1.6;
        }
        #nl_editor:focus { background: var(--bg-secondary); }
        #nl_editor h1, #nl_editor h2, #nl_editor h3 { margin: .5em 0; }
        #nl_editor p { margin: .4em 0; }
        #nl_editor ul, #nl_editor ol { padding-left: 1.4em; margin: .4em 0; }
        #nl_editor a { color: var(--accent); }
        #nl_editor blockquote { border-left: 3px solid var(--accent); margin: .5em 0; padding-left: 12px; color: var(--text-muted); }

        #nl_source {
            display: none; width: 100%; min-height: 280px; padding: 14px 16px;
            background: var(--bg-input); color: var(--text); font-size: 12.5px;
            font-family: 'Menlo','Consolas',monospace; line-height: 1.55;
            border: none; outline: none; resize: vertical; box-sizing: border-box;
        }
        .editor-wrap.source-mode #nl_editor { display: none; }
        .editor-wrap.source-mode #nl_source { display: block; }
        .editor-wrap.source-mode .editor-toolbar button:not(#sourceToggleBtn),
        .editor-wrap.source-mode .editor-toolbar select,
        .editor-wrap.source-mode .editor-toolbar .sep { opacity: .3; pointer-events: none; }

        .source-hint {
            display: none; font-size: 12px; color: var(--text-muted); padding: 6px 16px 10px 16px;
            background: var(--bg-input); border-top: 1px solid var(--border);
        }
        .editor-wrap.source-mode .source-hint { display: block; }
        .source-hint code {
            background: var(--bg-secondary); padding: 1px 6px; border-radius: 4px;
            font-size: 11px; border: 1px solid var(--border);
        }

        .tag-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
        .tag-bar-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); margin-right: 4px; }
        .tag-chip {
            padding: 3px 9px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 20px;
            font-size: 11px; font-family: monospace; color: var(--accent); cursor: pointer; font-weight: 600;
            transition: background .12s, color .12s;
        }
        .tag-chip:hover { background: var(--accent); color: var(--text-inverse); border-color: var(--accent); }

        .modal-bg {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55);
            z-index: 1000; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-bg.show { display: flex; }
        .modal {
            background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px;
            width: 100%; max-width: 680px; max-height: 88vh; display: flex; flex-direction: column;
            box-shadow: 0 8px 40px var(--shadow);
        }
        .modal-head {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .modal-head h3 { font-size: 15px; font-weight: 700; }
        .modal-head button { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); line-height: 1; }
        .modal-body { flex: 1; overflow-y: auto; padding: 20px; }
        .modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; flex-shrink: 0; }
        #previewFrame {
            width: 100%; border: none; border-radius: 6px; background: #fff;
            min-height: 360px; display: block;
        }
        .preview-subject { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
        .preview-subject strong { color: var(--text); }

        .confirm-msg { font-size: 14px; color: var(--text); line-height: 1.6; }
        .confirm-msg strong { color: var(--accent); }
        .progress-bar-wrap { height: 6px; background: var(--bg-input); border-radius: 3px; margin-top: 14px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; background: var(--accent); border-radius: 3px; width: 0; transition: width .3s; }

        .btn { padding: 8px 18px; border: none; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
        .btn:hover { opacity: .85; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-accent  { background: var(--accent);  color: var(--text-inverse); }
        .btn-ghost   { background: var(--bg-input); color: var(--text); border: 1px solid var(--border); }
        .btn-warning { background: #f59e0b;         color: #fff; }
        .btn-danger  { background: var(--error);    color: #fff; }
        .btn-sm  { padding: 5px 12px; font-size: 12px; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }

        .toast {
            position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px;
            font-size: 14px; font-weight: 600; z-index: 9999; opacity: 0; transform: translateY(8px);
            transition: opacity .2s, transform .2s; pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background: var(--bg-secondary); color: var(--success); border-left: 4px solid var(--success); box-shadow: 0 4px 20px var(--shadow); }
        .toast.error   { background: var(--bg-secondary); color: var(--error);   border-left: 4px solid var(--error);   box-shadow: 0 4px 20px var(--shadow); }
        .toast.warning { background: var(--bg-secondary); color: #92400e; border-left: 4px solid #f59e0b; box-shadow: 0 4px 20px var(--shadow); pointer-events: auto; }
        .toast.warning a { color: inherit; text-decoration: underline; }

        .n-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
        .n-toolbar input[type="text"] {
            flex: 1; min-width: 180px; padding: 9px 12px; background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 7px; color: var(--text); font-size: 14px;
        }

        table { width: 100%; border-collapse: collapse; }
        table th, table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        table th { background: var(--bg-input); font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
        table td { font-size: 13px; color: var(--text); }
        table tbody tr:hover { background: var(--bg-input); }
        .table-wrap { overflow-x: auto; }

        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 2px 8px var(--shadow); }
        .stat-card .number { font-size: 28px; font-weight: bold; color: var(--accent); }
        .stat-card .label { font-size: 13px; color: var(--text-muted); margin-top: 5px; }

        .sent-pill { display: inline-block; padding: 4px 10px; background: var(--success); color: white; font-size: 11px; border-radius: 20px; font-weight: 600; }

        /* Disabled state styling */
        .disabled-form {
            opacity: 0.5;
            pointer-events: none;
            cursor: not-allowed;
        }
        .disabled-form input,
        .disabled-form select,
        .disabled-form textarea,
        .disabled-form button {
            opacity: 0.5;
            pointer-events: none;
            cursor: not-allowed;
        }
        .disabled-form .btn {
            opacity: 0.5;
            pointer-events: none;
            cursor: not-allowed;
        }
        .disabled-form .tag-chip {
            opacity: 0.5;
            pointer-events: none;
            cursor: not-allowed;
        }
        .disabled-form .toggle-switch {
            opacity: 0.5;
            pointer-events: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 class="brand-logo"><a href="https://www.dornori.info/dornorium" class="brand-logo-link"><span class="brand-icon">📧  </span><span class="brand-text">Dornorium</span></a></h1>
        <div class="header-right">
            <div class="nav-links">
                <a id="nav-dashboard" href="dashboard.html">🎫 <span>Dashboard</span></a>
                <a id="nav-reports" href="reports.html">📊 <span>Reports</span></a>
                <a id="nav-newsletter" href="newsletter.html" class="active">📧 <span>Newsletter</span></a>
                <a id="nav-order-reply" href="order-reply.html">📦 <span>Order Reply</span></a>
                <a id="nav-settings" href="settings.html">⚙️ <span>Settings</span></a>
                <a id="nav-users" href="users.html">👥 <span>Users</span></a>
            </div>
            <script>
            (function(){
                document.querySelectorAll('.nav-links a').forEach(function(a){
                    if (a.classList.contains('active')) return;
                    fetch(a.getAttribute('href'), { method: 'HEAD' })
                        .then(function(res){ if (!res.ok) a.style.display = 'none'; })
                        .catch(function(){ a.style.display = 'none'; });
                });
            })();
            </script>
            <div class="nav-actions">
                <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
                <div id="userDisplay"></div>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <div class="n-page">
        <div id="content"><div class="loading">Loading…</div></div>
    </div>
</div>

<div class="modal-bg" id="previewModal">
    <div class="modal">
        <div class="modal-head">
            <h3>📨 Email Preview</h3>
            <button onclick="closePreview()">✕</button>
        </div>
        <div class="modal-body">
            <div class="preview-subject" id="previewSubjectLine"></div>
            <iframe id="previewFrame" title="Email preview" sandbox="allow-same-origin"></iframe>
        </div>
        <div class="modal-foot">
            <button class="btn btn-ghost" onclick="closePreview()">Close</button>
        </div>
    </div>
</div>

<div class="modal-bg" id="sendModal">
    <div class="modal" style="max-width:480px;">
        <div class="modal-head">
            <h3>🚀 Confirm Send</h3>
            <button onclick="closeSendModal()">✕</button>
        </div>
        <div class="modal-body">
            <p class="confirm-msg" id="sendConfirmMsg"></p>
            <div class="progress-bar-wrap" id="progressWrap">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
        <div class="modal-foot" id="sendModalFoot">
            <button class="btn btn-ghost" onclick="closeSendModal()">Cancel</button>
            <button class="btn btn-warning" id="confirmSendBtn" onclick="executeSend()">Yes, send now</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    // ─── PAGE ACCESS CHECK ──────────────────────────────────────
    (function() {
        if (!checkPageAccess('newsletter')) return;
    })();


    // ─── THEME ────────────────────────────────────────────────────
    setTheme(localStorage.getItem('theme') || 'light');

    const token = localStorage.getItem('token');
    const storedUser = localStorage.getItem('user');
    const currentUser = storedUser ? JSON.parse(storedUser) : null;

    // ─── PERMISSION HELPERS ──────────────────────────────────────
    // hasPageAccess() comes from shared.js

    function canEditNewsletter() {
        return hasAccess('newsletter', 'edit');
    }

    function canCreateNewsletter() {
        return hasAccess('newsletter', 'create');
    }

    function canDeleteNewsletter() {
        return hasAccess('newsletter', 'delete');
    }

    function canViewNewsletter() {
        return hasAccess('newsletter', 'view');
    }

    // ─── PERMISSION CHECK ──────────────────────────────────────
    if (!token || !currentUser || !canViewNewsletter()) {
        document.body.innerHTML = '<div style="padding: 40px; text-align: center;"><h1>⛔ Access Denied</h1><p>You don\'t have permission to access newsletter.</p><a href="dashboard.html" style="color: var(--accent);">← Back to Dashboard</a></div>';
        throw new Error('Newsletter access required');
    }

    // ─── NAVIGATION SETUP ───────────────────────────────────────
    setupNavigation();

    // ─── API WRAPPER ─────────────────────────────────────────────
    async function api(path, opts = {}) {
        opts.headers = {
            ...(opts.headers || {}),
            Authorization: 'Bearer ' + token,
            'Content-Type': 'application/json'
        };
        const res = await fetch(API_BASE + path, opts);
        if (res.status === 401) {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            throw new Error('Unauthorized');
        }
        if (res.status === 403) {
            throw new Error('Permission denied');
        }
        return res.json();
    }

    // ─── TOAST SYSTEM ────────────────────────────────────────────

    function toast(msg, type = 'success') {
        const el = document.getElementById('toast');
        el.innerHTML = msg;
        el.className = 'toast show ' + type;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), type === 'warning' ? 8000 : 3500);
    }

    // ─── SHARED CONFIG ──────────────────────────────────────────
    function extractLanguages(res) {
        try {
            return JSON.parse((res.data && res.data.languages && res.data.languages.list) || '[]');
        } catch (e) { return []; }
    }

    function extractCategories(res) {
        const cats = new Set();
        Object.keys((res.data && res.data.category) || {}).forEach(k => {
            if (k.endsWith('_description') && res.data.category[k] !== '__deleted__') cats.add(k.replace('_description', ''));
        });
        return Array.from(cats);
    }

    async function loadAppConfig(forceFresh = false) {
        if (!forceFresh) {
            const cached = localStorage.getItem('appConfig');
            const cachedVersion = localStorage.getItem('appConfigVersion');
            if (cached && cachedVersion) {
                checkForConfigUpdate(cachedVersion);
                return JSON.parse(cached);
            }
        }
        const res = await api('/api/admin/settings');
        const config = {
            languages: extractLanguages(res),
            categories: extractCategories(res),
            version: (res.data && res.data.system && res.data.system.config_version) || Date.now().toString()
        };
        localStorage.setItem('appConfig', JSON.stringify(config));
        localStorage.setItem('appConfigVersion', config.version);
        return config;
    }

    async function checkForConfigUpdate(cachedVersion) {
        try {
            const res = await api('/api/admin/config-version');
            if (res.version && res.version !== cachedVersion) {
                toast("Configuration was updated by admin. Please <a href='#' onclick='logout()'>re-login</a> to see changes.", "warning");
            }
        } catch (e) {}
    }

    let _configPromise = null;

    function getSharedConfig(forceFresh) {
        if (forceFresh || !_configPromise) {
            _configPromise = loadAppConfig(forceFresh).finally(() => { _configPromise = null; });
        }
        return _configPromise;
    }

    // ─── STATE ────────────────────────────────────────────────────
    let settings = {},
        subscribers = [],
        newsletters = [],
        filterText = '',
        currentLang = 'en',
        sourceMode = false,
        pendingSend = null;

    // ─── ESCAPE HTML ─────────────────────────────────────────────
    function esc(s) {
        return s ? String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;') : '';
    }

    // formatDate() comes from shared.js

    // ─── LANGUAGES ───────────────────────────────────────────────
    function getLangs() {
        try {
            const list = settings.languages?.list || '[]';
            const parsed = JSON.parse(list);
            return [{ code: 'all', name: '📢 All Languages' }, ...parsed];
        } catch {
            return [{ code: 'all', name: '📢 All Languages' }, { code: 'en', name: 'English' }];
        }
    }

    function getLangName(code) {
        const langs = getLangs();
        return langs.find(l => l.code === code)?.name || code;
    }

    function setLang(lang) {
        currentLang = lang;
        sessionStorage.setItem('nl_lang', lang);
        sourceMode = false;
        filterText = '';
        render();
    }

    // ─── BUILD TAG BAR ──────────────────────────────────────────
    function buildTagBar(targetId = 'nl_editor') {
        return `<div class="tag-bar">
            <span class="tag-bar-label">Insert tag:</span>
            <button type="button" class="tag-chip" onclick="insertTag('${targetId}','{{subscriber_email}}')">{{subscriber_email}}</button>
            <button type="button" class="tag-chip" onclick="insertTag('${targetId}','{{subscriber_name}}')">{{subscriber_name}}</button>
            <button type="button" class="tag-chip" onclick="insertTag('${targetId}','{{unsubscribe_link}}')">{{unsubscribe_link}}</button>
        </div>`;
    }

    function insertTag(id, tag) {
        const el = document.getElementById(id);
        if (!el) return;
        el.focus();
        
        // Handle textarea
        if (el.tagName === 'TEXTAREA') {
            const start = el.selectionStart;
            const end = el.selectionEnd;
            el.value = el.value.substring(0, start) + tag + el.value.substring(end);
            el.selectionStart = el.selectionEnd = start + tag.length;
        } 
        // Handle contentEditable div
        else if (el.contentEditable === 'true') {
            document.execCommand('insertText', false, tag);
        }
    }

    // ─── EDITOR COMMANDS ────────────────────────────────────────
    function cmd(command, val) {
        document.getElementById('nl_editor').focus();
        document.execCommand(command, false, val || null);
    }

    function editorBlock(sel) {
        document.getElementById('nl_editor').focus();
        document.execCommand('formatBlock', false, sel.value);
        sel.value = 'p';
    }

    function insertLink() {
        const url = prompt('Enter URL:');
        if (!url) return;
        const text = prompt('Link text (leave blank to use URL):') || url;
        document.getElementById('nl_editor').focus();
        document.execCommand('insertHTML', false, `<a href="${url}">${text}</a>`);
    }

    function insertImage() {
        const url = prompt('Enter image URL:');
        if (!url) return;
        document.getElementById('nl_editor').focus();
        document.execCommand('insertImage', false, url);
    }

    function toggleSource() {
        const wrap = document.querySelector('.editor-wrap');
        const editor = document.getElementById('nl_editor');
        const source = document.getElementById('nl_source');
        const btn = document.getElementById('sourceToggleBtn');
        if (!sourceMode) {
            source.value = editor.innerHTML;
            wrap.classList.add('source-mode');
            btn.classList.add('active');
            sourceMode = true;
        } else {
            editor.innerHTML = source.value;
            wrap.classList.remove('source-mode');
            btn.classList.remove('active');
            sourceMode = false;
        }
    }

    function getEditorHtml() {
        if (sourceMode) return document.getElementById('nl_source').value.trim();
        return document.getElementById('nl_editor').innerHTML.trim();
    }

    function getSubject() {
        return document.getElementById('compose_subject').value.trim();
    }

    function loadDraft(subject, body) {
        document.getElementById('compose_subject').value = subject || '';
        if (sourceMode) {
            document.getElementById('nl_source').value = body || '';
        } else {
            document.getElementById('nl_editor').innerHTML = body || '';
        }
    }

    // ─── BUILD HISTORY ──────────────────────────────────────────
    function buildHistory() {
        if (!newsletters.length) {
            return '<div class="s-card"><div class="s-card-head"><div><h3>📋 Sent &amp; Drafts</h3><p>No newsletters yet.</p></div></div></div>';
        }

        let filtered = newsletters;
        if (currentLang !== 'all') {
            filtered = newsletters.filter(n => n.language === currentLang);
        }

        if (!filtered.length) {
            return `<div class="s-card"><div class="s-card-head"><div><h3>📋 Sent &amp; Drafts — ${esc(getLangName(currentLang))}</h3><p>No newsletters yet in this language.</p></div></div></div>`;
        }

        const rows = filtered.map(n => {
            const isDraft = n.status === 'draft';
            return `<tr>
                <td>${esc(n.subject)}</td>
                <td>${isDraft ? '<em style="color:var(--text-muted)">Draft</em>' : '<span class="sent-pill">Sent</span>'}</td>
                <td>${isDraft ? formatDate(n.created_at) : formatDate(n.sent_at)}</td>
                <td>${isDraft ? '—' : (n.recipient_count || '—')}</td>
                <td style="display:flex;gap:6px;flex-wrap:wrap;">
                    <button class="btn btn-ghost btn-sm" onclick="loadNewsletter(${n.id})" ${!canEditNewsletter() && !canCreateNewsletter() ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>✏️ ${isDraft ? 'Edit' : 'Duplicate'}</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteNewsletter(${n.id}, '${esc(n.subject)}')" ${!canDeleteNewsletter() ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>Delete</button>
                </td>
            </tr>`;
        }).join('');

        return `<div class="s-card" id="historyCard">
            <div class="s-card-head"><div><h3>📋 Sent &amp; Drafts — ${esc(getLangName(currentLang))}</h3><p>History for this language. Click Edit/Duplicate to load into the editor.</p></div></div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Subject</th><th>Status</th><th>Date</th><th>Recipients</th><th>Actions</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>
        </div>`;
    }

    function rebuildHistory() {
        const existing = document.getElementById('historyCard');
        if (existing) existing.outerHTML = buildHistory();
    }

    // ─── NEWSLETTER ACTIONS ─────────────────────────────────────
    async function loadNewsletter(id) {
        const n = newsletters.find(x => x.id === id);
        if (!n) return;
        loadDraft(n.subject, n.body);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        toast('Loaded into editor');
    }

    async function deleteNewsletter(id, subject) {
        if (!confirm(`Delete "${subject}"?\nThis cannot be undone.`)) return;
        try {
            const d = await api('/api/admin/newsletters/' + id, { method: 'DELETE' });
            if (d.success) {
                toast('✅ Deleted');
                newsletters = newsletters.filter(n => n.id !== id);
                rebuildHistory();
            } else {
                toast('❌ Delete failed', 'error');
            }
        } catch (e) {
            toast('❌ ' + e.message, 'error');
        }
    }

    // ─── BUILD AUTO-REPLY ──────────────────────────────────────
    function buildAutoReply() {
        const lang = currentLang === 'all' ? 'en' : currentLang;
        const langKey = lang === 'en' ? '' : '_' + lang;

        let enabled = settings.auto_reply?.[`newsletter${langKey}_enabled`] === '1';
        let subject = settings.auto_reply?.[`newsletter${langKey}_subject`];
        let body = settings.auto_reply?.[`newsletter${langKey}_body`];

        if (subject === undefined) {
            enabled = settings.auto_reply?.newsletter_enabled === '1';
            subject = settings.auto_reply?.newsletter_subject || 'Welcome to the Dornori Newsletter';
            body = settings.auto_reply?.newsletter_body || '';
        }

        const unsubPath = settings.newsletter?.[`unsubscribe_link_path_${lang}`] || settings.newsletter?.unsubscribe_link_path || 'unsubscribe.html';
        const langName = getLangName(lang);
        const canEdit = canEditNewsletter();

        return `<div class="s-card">
            <div class="s-card-head">
                <div><h3>⚙️ Subscribe Confirmation Auto-Reply (${esc(langName)})</h3>
                <p>Sent automatically on signup. Available tags: {{subscriber_email}}, {{subscriber_name}}, {{unsubscribe_link}}</p></div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
                <label style="display:flex;align-items:center;gap:8px;margin:0;cursor:pointer;">
                    <input type="checkbox" id="nl_enabled" ${enabled?'checked':''} style="width:18px;height:18px;" ${!canEdit ? 'disabled' : ''} />
                    <span style="font-size:14px;color:var(--text);font-weight:500;">Send confirmation email on subscribe</span>
                </label>
            </div>
            <div class="f-row">
                <label>Subject</label>
                <input type="text" id="nl_ar_subject" value="${esc(subject)}" ${!canEdit ? 'disabled' : ''} />
            </div>
            <div class="f-row">
                <label>Body (HTML)</label>
                ${buildTagBar('nl_ar_body')}
                <textarea id="nl_ar_body" style="width:100%;min-height:120px;padding:9px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;font-family:Menlo,Consolas,monospace;line-height:1.55;resize:vertical;" ${!canEdit ? 'disabled' : ''}>${esc(body)}</textarea>
            </div>
            <div class="f-row">
                <label>Unsubscribe Link Path</label>
                <input type="text" id="nl_unsub_path" value="${esc(unsubPath)}" placeholder="unsubscribe.html" ${!canEdit ? 'disabled' : ''} />
                <p style="font-size:11px;color:var(--text-muted);margin-top:4px;">Filename only (e.g., unsubscribe.html). The domain and ?token= will be added automatically.</p>
            </div>
            <button class="btn btn-accent" onclick="saveAutoReply()" ${!canEdit ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>Save auto-reply</button>
        </div>`;
    }

    // ─── BUILD GENERAL SETTINGS ─────────────────────────────────
    function buildGeneralSettings() {
        const batchSize = settings.tickets?.newsletter_batch_size || '10';
        const canEdit = canEditNewsletter();

        return `<div class="s-card">
            <div class="s-card-head">
                <div><h3>⚙️ General Settings</h3></div>
            </div>
            <div class="f-row">
                <label>Newsletter Batch Size</label>
                <input type="number" id="nl_batch_size" value="${esc(batchSize)}" placeholder="10" ${!canEdit ? 'disabled' : ''} />
                <p style="font-size:11px;color:var(--text-muted);margin-top:4px;">Number of newsletters to send per batch (recommended: 10-100)</p>
            </div>
            <button class="btn btn-accent" onclick="saveGeneralSettings()" ${!canEdit ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>Save settings</button>
        </div>`;
    }

    // ─── BUILD STATS ────────────────────────────────────────────
    function buildStats() {
        let active, unsub;
        if (currentLang === 'all') {
            active = subscribers.filter(s => s.status === 'active').length;
            unsub = subscribers.filter(s => s.status === 'unsubscribed').length;
        } else {
            active = subscribers.filter(s => s.status === 'active' && s.language === currentLang).length;
            unsub = subscribers.filter(s => s.status === 'unsubscribed' && s.language === currentLang).length;
        }
        const total = active + unsub;

        return `<div class="stats">
            <div class="stat-card"><div class="number">${total}</div><div class="label">Total</div></div>
            <div class="stat-card"><div class="number">${active}</div><div class="label">Active</div></div>
            <div class="stat-card"><div class="number">${unsub}</div><div class="label">Unsubscribed</div></div>
        </div>`;
    }

    // ─── BUILD SUBSCRIBERS ──────────────────────────────────────
    function buildSubs() {
        let active, unsub;
        if (currentLang === 'all') {
            active = subscribers.filter(s => s.status === 'active' && (!filterText || s.email.includes(filterText) || (s.name || '').includes(filterText)));
            unsub = subscribers.filter(s => s.status === 'unsubscribed' && (!filterText || s.email.includes(filterText) || (s.name || '').includes(filterText)));
        } else {
            active = subscribers.filter(s => s.status === 'active' && s.language === currentLang && (!filterText || s.email.includes(filterText) || (s.name || '').includes(filterText)));
            unsub = subscribers.filter(s => s.status === 'unsubscribed' && s.language === currentLang && (!filterText || s.email.includes(filterText) || (s.name || '').includes(filterText)));
        }

        const activeRows = active.map(s => `<tr>
            <td>${esc(s.email)}</td>
            <td>${esc(s.name || '—')}</td>
            <td>${esc(s.language || '—')}</td>
            <td>${formatDate(s.subscribed_at)}</td>
            <td><button class="btn btn-danger btn-sm" onclick="delSub(${s.id},'${esc(s.email)}')" ${!canDeleteNewsletter() ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>Delete</button></td>
        </tr>`).join('');

        const unsubRows = unsub.map(s => `<tr>
            <td>${esc(s.email)}</td>
            <td>${esc(s.name || '—')}</td>
            <td>${esc(s.language || '—')}</td>
            <td>${formatDate(s.unsubscribed_at)}</td>
            <td><button class="btn btn-danger btn-sm" onclick="delSub(${s.id},'${esc(s.email)}')" ${!canDeleteNewsletter() ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>Delete</button></td>
        </tr>`).join('');

        return `<div class="s-card">
            <div class="s-card-head">
                <div><h3>👥 Active Subscribers — ${esc(getLangName(currentLang))}</h3></div>
                <button class="btn btn-ghost btn-sm" onclick="expCsv('active')">⬇ Export CSV</button>
            </div>
            <div class="n-toolbar">
                <input type="text" id="nl_search" placeholder="Search by email or name…" oninput="onSearch(this.value)" value="${esc(filterText)}" />
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Email</th><th>Name</th><th>Language</th><th>Subscribed</th><th>Actions</th></tr></thead>
                    <tbody>${activeRows || '<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text-muted);">No entries</td></tr>'}</tbody>
                </table>
            </div>
        </div>
        <div class="s-card">
            <div class="s-card-head">
                <div><h3>🚫 Unsubscribed — ${esc(getLangName(currentLang))}</h3></div>
                <button class="btn btn-ghost btn-sm" onclick="expCsv('unsubscribed')">⬇ Export CSV</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Email</th><th>Name</th><th>Language</th><th>Unsubscribed</th><th>Actions</th></tr></thead>
                    <tbody>${unsubRows || '<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text-muted);">No entries</td></tr>'}</tbody>
                </table>
            </div>
        </div>`;
    }

    // ─── RENDER ──────────────────────────────────────────────────
    function render() {
        const langs = getLangs();
        const canCreate = canCreateNewsletter();
        const canEdit = canEditNewsletter();
        const canDelete = canDeleteNewsletter();

        const langOpts = langs.map(l =>
            `<option value="${esc(l.code)}"${l.code === currentLang ? ' selected' : ''}>${esc(l.name)}</option>`
        ).join('');

        const hasEditOrCreate = canEdit || canCreate;
        const isDisabled = !hasEditOrCreate;

        document.getElementById('content').innerHTML = `
            <div class="s-card">
                <div class="s-card-head">
                    <div><h3>✍️ Compose Newsletter</h3><p>Write and send to subscribers in the selected language. "All Languages" sends to active subscribers in all languages.</p></div>
                </div>
                <div class="f-row">
                    <label>Language</label>
                    <select onchange="setLang(this.value)" ${isDisabled ? 'disabled' : ''}>${langOpts}</select>
                </div>
                <div class="f-row">
                    <label>Subject</label>
                    <input type="text" id="compose_subject" placeholder="e.g. New arrivals — Star-A Mushroom in Sage" ${isDisabled ? 'disabled' : ''} />
                </div>
                <div class="f-row" style="margin-bottom:8px;">
                    <label>Body</label>
                    ${buildTagBar()}
                    <div class="editor-wrap">
                        <div class="editor-toolbar" id="editorToolbar">
                            <select onchange="editorBlock(this)" ${isDisabled ? 'disabled' : ''}>
                                <option value="p">Paragraph</option>
                                <option value="h1">Heading 1</option>
                                <option value="h2">Heading 2</option>
                                <option value="h3">Heading 3</option>
                            </select>
                            <div class="sep"></div>
                            <button title="Bold" onclick="cmd('bold')" ${isDisabled ? 'disabled' : ''}><b>B</b></button>
                            <button title="Italic" onclick="cmd('italic')" ${isDisabled ? 'disabled' : ''}><i>I</i></button>
                            <button title="Underline" onclick="cmd('underline')" ${isDisabled ? 'disabled' : ''}><u>U</u></button>
                            <button title="Strikethrough" onclick="cmd('strikeThrough')" ${isDisabled ? 'disabled' : ''}><s>S</s></button>
                            <div class="sep"></div>
                            <button title="Bullet list" onclick="cmd('insertUnorderedList')" ${isDisabled ? 'disabled' : ''}>• List</button>
                            <button title="Numbered list" onclick="cmd('insertOrderedList')" ${isDisabled ? 'disabled' : ''}>1. List</button>
                            <button title="Blockquote" onclick="cmd('formatBlock','blockquote')" ${isDisabled ? 'disabled' : ''}>❝</button>
                            <div class="sep"></div>
                            <button title="Link" onclick="insertLink()" ${isDisabled ? 'disabled' : ''}>🔗 Link</button>
                            <button title="Image URL" onclick="insertImage()" ${isDisabled ? 'disabled' : ''}>🖼 Image</button>
                            <div class="sep"></div>
                            <button title="Align left" onclick="cmd('justifyLeft')" ${isDisabled ? 'disabled' : ''}>⬛️↙</button>
                            <button title="Align center" onclick="cmd('justifyCenter')" ${isDisabled ? 'disabled' : ''}>⬛️↓</button>
                            <button title="Align right" onclick="cmd('justifyRight')" ${isDisabled ? 'disabled' : ''}>⬛️↘</button>
                            <div class="sep"></div>
                            <button title="Undo" onclick="cmd('undo')" ${isDisabled ? 'disabled' : ''}>↩</button>
                            <button title="Redo" onclick="cmd('redo')" ${isDisabled ? 'disabled' : ''}>↪</button>
                            <div class="sep"></div>
                            <button title="Remove formatting" onclick="cmd('removeFormat')" ${isDisabled ? 'disabled' : ''}>✕ fmt</button>
                            <div class="sep"></div>
                            <button id="sourceToggleBtn" title="Toggle HTML source" onclick="toggleSource()" style="font-family:monospace;font-weight:700;" ${isDisabled ? 'disabled' : ''}>&lt;/&gt; Source</button>
                        </div>
                        <div id="nl_editor" contenteditable="${isDisabled ? 'false' : 'true'}" spellcheck="true" ${isDisabled ? 'style="opacity:0.5;cursor:not-allowed"' : ''}></div>
                        <textarea id="nl_source" spellcheck="false" placeholder="Paste your full HTML here…" ${isDisabled ? 'disabled' : ''}></textarea>
                        <div class="source-hint">
                            ⚡ <strong>Source mode</strong> — paste raw HTML directly. Tags like <code>{{subscriber_email}}</code> and <code>{{unsubscribe_link}}</code> are still replaced.
                        </div>
                    </div>
                </div>
                <div class="btn-row">
                    <button class="btn btn-ghost" onclick="previewEmail()" ${isDisabled ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>👁 Preview</button>
                    <button class="btn btn-ghost" onclick="saveDraft()" ${!canCreate ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>💾 Save draft</button>
                    <button class="btn btn-warning" onclick="showConfirmSend()" ${!canCreate ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>🚀 Send to subscribers</button>
                </div>
            </div>
            ${buildHistory()}
            ${buildAutoReply()}
            ${buildStats()}
            ${buildSubs()}
            ${buildGeneralSettings()}
        `;
    }

    // ─── SEARCH ──────────────────────────────────────────────────
    function onSearch(v) {
        filterText = v.trim().toLowerCase();
        render();
    }

    // ─── SAVE AUTO-REPLY ────────────────────────────────────────
    async function saveAutoReply() {
        if (!canEditNewsletter()) {
            alert('You do not have permission to edit newsletter settings');
            return;
        }
        const unsubPath = document.getElementById('nl_unsub_path').value.trim() || 'unsubscribe.html';
        const lang = currentLang === 'all' ? 'en' : currentLang;
        const langKey = lang === 'en' ? '' : '_' + lang;

        const ok = await saveSettings([
            { category: 'auto_reply', key: `newsletter${langKey}_enabled`, value: document.getElementById('nl_enabled').checked ? '1' : '0' },
            { category: 'auto_reply', key: `newsletter${langKey}_subject`, value: document.getElementById('nl_ar_subject').value },
            { category: 'auto_reply', key: `newsletter${langKey}_body`, value: document.getElementById('nl_ar_body').value },
            { category: 'newsletter', key: `unsubscribe_link_path_${lang}`, value: unsubPath }
        ]);
        ok ? toast('✅ Auto-reply saved') : toast('❌ Failed', 'error');
        if (ok) await load();
    }

    async function saveSettings(updates) {
        try {
            const d = await api('/api/admin/settings', {
                method: 'PUT',
                body: JSON.stringify({ settings: updates })
            });
            return d.success;
        } catch (e) {
            return false;
        }
    }

    // ─── PREVIEW ─────────────────────────────────────────────────
    function previewEmail() {
        const subj = getSubject();
        const body = getEditorHtml();
        if (!subj && !body) {
            toast('Nothing to preview yet', 'error');
            return;
        }
        const html = sourceMode ?
            body :
            `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:system-ui,sans-serif;max-width:600px;margin:24px auto;padding:0 16px;color:#1a202c;line-height:1.6;}a{color:#0a8f5c;}blockquote{border-left:3px solid #0a8f5c;margin:.5em 0;padding-left:12px;color:#4a5568;}img{max-width:100%;}h1,h2,h3{margin:.5em 0;}</style></head><body>${body}</body></html>`;
        document.getElementById('previewSubjectLine').innerHTML = `<strong>Subject:</strong> ${esc(subj) || '<em>(no subject)</em>'}`;
        const frame = document.getElementById('previewFrame');
        frame.srcdoc = html;
        document.getElementById('previewModal').classList.add('show');
    }

    function closePreview() {
        document.getElementById('previewModal').classList.remove('show');
    }

    // ─── SEND CONFIRMATION ──────────────────────────────────────
    function showConfirmSend() {
        const subj = getSubject();
        const body = getEditorHtml();
        if (!subj) { toast('Subject is required', 'error'); return; }
        if (!body) { toast('Body is required', 'error'); return; }

        let active;
        if (currentLang === 'all') {
            active = subscribers.filter(s => s.status === 'active').length;
        } else {
            active = subscribers.filter(s => s.status === 'active' && s.language === currentLang).length;
        }
        if (!active) { toast('No active subscribers to send to', 'error'); return; }

        pendingSend = { subj, body };
        document.getElementById('sendConfirmMsg').innerHTML =
            `You are about to send <strong>"${esc(subj)}"</strong> to <strong>${active} active subscriber${active === 1 ? '' : 's'}</strong> in <strong>${esc(getLangName(currentLang))}</strong>.<br><br>This cannot be undone.`;
        document.getElementById('progressWrap').style.display = 'none';
        document.getElementById('progressBar').style.width = '0';
        document.getElementById('sendModalFoot').innerHTML = `
            <button class="btn btn-ghost" onclick="closeSendModal()">Cancel</button>
            <button class="btn btn-warning" id="confirmSendBtn" onclick="executeSend()">Yes, send now</button>`;
        document.getElementById('sendModal').classList.add('show');
    }

    function closeSendModal() {
        document.getElementById('sendModal').classList.remove('show');
        pendingSend = null;
    }

    async function executeSend() {
        if (!pendingSend) return;
        const { subj, body } = pendingSend;
        document.getElementById('sendModalFoot').innerHTML = '<span style="font-size:13px;color:var(--text-muted);">Sending…</span>';
        document.getElementById('progressWrap').style.display = 'block';
        document.getElementById('progressBar').style.width = '30%';
        try {
            const d = await api('/api/admin/newsletters', {
                method: 'POST',
                body: JSON.stringify({ subject: subj, body: body, language: currentLang })
            });
            document.getElementById('progressBar').style.width = '100%';
            if (d.success) {
                setTimeout(() => {
                    closeSendModal();
                    toast(`✅ Sent to ${d.sent} subscriber${d.sent === 1 ? '' : 's'}`);
                    newsletters = [d.newsletter, ...newsletters];
                    document.getElementById('nl_editor').innerHTML = '';
                    document.getElementById('compose_subject').value = '';
                    rebuildHistory();
                }, 400);
            } else {
                closeSendModal();
                toast('❌ Send failed: ' + (d.error || 'Unknown error'), 'error');
            }
        } catch (e) {
            closeSendModal();
            toast('❌ ' + e.message, 'error');
        }
    }

    // ─── SAVE GENERAL SETTINGS ──────────────────────────────────
    async function saveGeneralSettings() {
        if (!canEditNewsletter()) {
            alert('You do not have permission to edit settings');
            return;
        }
        const batchSize = document.getElementById('nl_batch_size').value.trim();
        if (!batchSize || isNaN(batchSize) || parseInt(batchSize) < 1) {
            toast('Please enter a valid batch size', 'error');
            return;
        }
        try {
            const d = await api('/api/admin/settings', {
                method: 'PUT',
                body: JSON.stringify({
                    settings: [
                        { category: 'tickets', key: 'newsletter_batch_size', value: batchSize }
                    ]
                })
            });
            if (d.success) {
                toast('✅ General settings saved');
                settings.tickets = settings.tickets || {};
                settings.tickets.newsletter_batch_size = batchSize;
            } else {
                toast('❌ ' + (d.error || 'Save failed'), 'error');
            }
        } catch (e) {
            toast('❌ ' + e.message, 'error');
        }
    }

    // ─── SAVE DRAFT ─────────────────────────────────────────────
    async function saveDraft() {
        if (!canCreateNewsletter()) {
            alert('You do not have permission to create newsletters');
            return;
        }
        const subj = getSubject();
        const body = getEditorHtml();
        if (!subj && !body) { toast('Nothing to save', 'error'); return; }
        try {
            const d = await api('/api/admin/newsletters', {
                method: 'POST',
                body: JSON.stringify({ subject: subj, body: body, language: currentLang, status: 'draft' })
            });
            if (d.success) {
                toast('💾 Draft saved');
                newsletters = [d.newsletter, ...newsletters.filter(n => n.id !== d.newsletter.id)];
                rebuildHistory();
            } else {
                toast('❌ ' + (d.error || 'Save failed'), 'error');
            }
        } catch (e) {
            toast('❌ ' + e.message, 'error');
        }
    }

    // ─── DELETE SUBSCRIBER ──────────────────────────────────────
    async function delSub(id, email) {
        if (!confirm(`Delete "${email}"?`)) return;
        try {
            const d = await api('/api/admin/subscribers/' + id, { method: 'DELETE' });
            if (d.success) {
                toast('✅ Deleted');
                load();
            } else {
                toast('❌ Failed', 'error');
            }
        } catch (e) {
            toast('❌ ' + e.message, 'error');
        }
    }

    // ─── EXPORT CSV ─────────────────────────────────────────────
    function expCsv(status) {
        let list;
        if (currentLang === 'all') {
            list = subscribers.filter(s => s.status === status && (!filterText || s.email.includes(filterText)));
        } else {
            list = subscribers.filter(s => s.status === status && s.language === currentLang && (!filterText || s.email.includes(filterText)));
        }
        if (!list.length) { toast('Nothing to export', 'error'); return; }
        const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
        const lines = [
            ['Email', 'Name', 'Language', 'Status', 'Subscribed At', 'Unsubscribed At'].join(',')
        ];
        list.forEach(s => lines.push(
            [s.email, s.name, s.language, s.status, s.subscribed_at, s.unsubscribed_at || ''].map(q).join(',')
        ));
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
        a.download = `dornori-${status}-${currentLang}-${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
    }

    // ─── LOAD DATA ──────────────────────────────────────────────
    async function load() {
        try {
            const [sd, nd, ld] = await Promise.all([
                api('/api/admin/settings'),
                api('/api/admin/subscribers'),
                api('/api/admin/newsletters')
            ]);
            settings = sd.data || {};
            subscribers = nd.data || [];
            newsletters = ld.data || [];
            currentLang = sessionStorage.getItem('nl_lang') || 'en';
            render();
            loadAppConfig();
        } catch (e) {
            document.getElementById('content').innerHTML = '<div class="loading">Error: ' + e.message + '</div>';
        }
    }


    // ─── INIT ────────────────────────────────────────────────────
    load();

    // Expose functions globally
    window.setLang = setLang;
    window.insertTag = insertTag;
    window.cmd = cmd;
    window.editorBlock = editorBlock;
    window.insertLink = insertLink;
    window.insertImage = insertImage;
    window.toggleSource = toggleSource;
    window.previewEmail = previewEmail;
    window.closePreview = closePreview;
    window.showConfirmSend = showConfirmSend;
    window.closeSendModal = closeSendModal;
    window.executeSend = executeSend;
    window.saveDraft = saveDraft;
    window.saveAutoReply = saveAutoReply;
    window.saveGeneralSettings = saveGeneralSettings;
    window.loadNewsletter = loadNewsletter;
    window.deleteNewsletter = deleteNewsletter;
    window.delSub = delSub;
    window.expCsv = expCsv;
    window.onSearch = onSearch;
    window.logout = logout;
    window.toggleTheme = toggleTheme;
</script>
