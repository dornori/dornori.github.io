<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Routing Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="shared.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; justify-content: center; padding: 40px 16px;
    }
    .container {
      width: 100%; max-width: 1000px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 32px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
    
    .user-badge {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 16px; background: var(--bg); border-radius: 8px;
      border: 1px solid var(--border); margin-bottom: 20px;
    }
    .user-badge .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--accent); display: flex; align-items: center;
      justify-content: center; font-weight: 700; font-size: 14px;
    }
    .user-badge .info { font-size: 13px; }
    .user-badge .info .name { font-weight: 600; }
    .user-badge .info .role { color: var(--muted); font-size: 12px; }
    
    .domain-selector {
      display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap;
      align-items: center;
    }
    .domain-selector select {
      flex: 1; min-width: 200px; padding: 10px 14px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 14px;
    }
    .domain-selector select:focus { outline: none; border-color: var(--accent); }
    
    .btn {
      padding: 10px 18px; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    
    .rule-list {
      margin-top: 16px;
    }
    .rule-item {
      display: grid;
      grid-template-columns: 1fr 120px 140px auto;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .rule-item .pattern {
      font-family: monospace;
      font-weight: 600;
      font-size: 14px;
    }
    .rule-item .status {
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 600;
      text-align: center;
    }
    .rule-item .status.active {
      background: var(--success);
      color: #fff;
    }
    .rule-item .status.inactive {
      background: var(--border);
      color: var(--muted);
    }
    .rule-item .actions {
      display: flex;
      gap: 6px;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-size: 14px;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      max-width: 500px;
      width: 90%;
    }
    .modal-content h2 { margin: 0 0 16px; font-size: 18px; }
    .modal-content label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .modal-content input, .modal-content select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 16px;
    }
    .modal-content input:focus, .modal-content select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 8px;
    }
    
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 12px 20px; border-radius: 8px;
      font-size: 14px; font-weight: 600;
      z-index: 9999;
      opacity: 0; transform: translateY(8px);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1; transform: translateY(0);
    }
    .toast.success {
      background: var(--bg-secondary); color: var(--success);
      border-left: 4px solid var(--success);
      box-shadow: 0 4px 20px var(--shadow);
    }
    .toast.error {
      background: var(--bg-secondary); color: var(--danger);
      border-left: 4px solid var(--danger);
    }
    
    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="container">
  <h1>📧 Email Routing Dashboard</h1>
  <div class="subtitle">Manage incoming email routing rules for your domains</div>
  
  <!-- User Badge -->
  <div class="user-badge" id="userBadge">
    <div class="avatar" id="userAvatar">👤</div>
    <div class="info">
      <div class="name" id="userName">Loading...</div>
      <div class="role" id="userRole">Checking permissions...</div>
    </div>
  </div>
  
  <!-- Domain Selector -->
  <div class="domain-selector">
    <select id="domainSelect" onchange="loadDomainRules()">
      <option value="">Select a domain...</option>
    </select>
    <button class="btn btn-success btn-sm" onclick="openAddDomainModal()">➕ Add Domain</button>
    <button class="btn btn-secondary btn-sm" onclick="refreshDomains()">🔄 Refresh</button>
  </div>
  
  <!-- Rules List -->
  <div id="rulesContainer">
    <div class="loading">Select a domain to view routing rules</div>
  </div>
  
  <!-- Add Rule Button -->
  <div id="addRuleBtn" class="hidden" style="margin-top:16px;">
    <button class="btn btn-primary" onclick="openAddRuleModal()">➕ Add Routing Rule</button>
  </div>
</div>

<!-- Add Domain Modal -->
<div class="modal" id="addDomainModal">
  <div class="modal-content">
    <h2>Add Domain</h2>
    <label>Domain Name</label>
    <input type="text" id="newDomainName" placeholder="example.com" />
    <div id="domainCheckResult" style="font-size:13px;color:var(--muted);margin-bottom:12px;"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('addDomainModal')">Cancel</button>
      <button class="btn btn-primary" onclick="addDomain()">Add Domain</button>
    </div>
  </div>
</div>

<!-- Add Rule Modal -->
<div class="modal" id="addRuleModal">
  <div class="modal-content">
    <h2>Add Routing Rule</h2>
    <label>Email Pattern</label>
    <select id="rulePatternType" onchange="toggleRulePattern()">
      <option value="catchall">Catch-all (*@domain.com)</option>
      <option value="specific">Specific address</option>
    </select>
    <div id="specificAddressField" class="hidden">
      <label>Email Address</label>
      <input type="email" id="ruleSpecificAddress" placeholder="support@example.com" />
    </div>
    <label>Worker Name</label>
    <input type="text" id="ruleWorkerName" placeholder="worker-name" value="dornorium" />
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('addRuleModal')">Cancel</button>
      <button class="btn btn-primary" onclick="createRule()">Create Rule</button>
    </div>
  </div>
</div>

<!-- Edit Rule Modal -->
<div class="modal" id="editRuleModal">
  <div class="modal-content">
    <h2>Edit Routing Rule</h2>
    <div id="editRuleContent"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('editRuleModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveRuleEdit()">Save Changes</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// Get authentication from dashboard
const token = localStorage.getItem('token');
const storedUser = localStorage.getItem('user');
const currentUser = storedUser ? JSON.parse(storedUser) : null;

if (!token || !currentUser) {
  document.body.innerHTML = `
    <div class="container" style="text-align:center;padding:60px 32px;">
      <h2>⛔ Not Logged In</h2>
      <p style="color:var(--muted);">Please <a href="index.html" style="color:var(--accent);">log in</a> first.</p>
    </div>
  `;
  throw new Error('Not logged in');
}

if (currentUser.role !== 'admin' && !currentUser.effective_permissions?.settings?.edit) {
  document.body.innerHTML = `
    <div class="container" style="text-align:center;padding:60px 32px;">
      <h2>⛔ Access Denied</h2>
      <p style="color:var(--muted);">You need <strong>admin</strong> privileges to manage email routing.</p>
      <a href="settings.html" style="color:var(--accent);">← Back to Settings</a>
    </div>
  `;
  throw new Error('Admin access required');
}

// Show user info
document.getElementById('userName').textContent = currentUser.name || currentUser.email;
document.getElementById('userRole').textContent = currentUser.role === 'admin' ? '🔑 Admin' : '👤 ' + currentUser.role;
document.getElementById('userAvatar').textContent = (currentUser.name || currentUser.email || 'U')[0].toUpperCase();

// ── State ──
const API_BASE = window.API_BASE || (() => {
  const url = new URL(window.location.href);
  return url.origin + '/api';
})();

let domains = [];
let currentZoneId = null;
let currentDomainName = null;
let currentRules = [];
let editingRuleId = null;

const $ = id => document.getElementById(id);
const headers = () => ({ 
  'Authorization': `Bearer ${token}`, 
  'Content-Type': 'application/json' 
});

// ── Toast ──
function toast(msg, type = 'success') {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

// ── Domains ──
async function refreshDomains() {
  try {
    const res = await fetch(`${API_BASE}/api/admin/setup/cloudflare-zones`, {
      headers: headers()
    });
    const data = await res.json();
    
    if (!data.success) throw new Error(data.error || 'Failed to load domains');
    
    domains = data.zones || [];
    const select = $('domainSelect');
    const currentValue = select.value;
    
    select.innerHTML = '<option value="">Select a domain...</option>';
    domains.forEach(zone => {
      const opt = document.createElement('option');
      opt.value = zone.id;
      opt.textContent = `${zone.name} (${zone.status})`;
      select.appendChild(opt);
    });
    
    if (currentValue && domains.some(d => d.id === currentValue)) {
      select.value = currentValue;
    }
    
    toast(`✅ Loaded ${domains.length} domains`);
    loadDomainRules();
  } catch (e) {
    toast('❌ ' + e.message, 'error');
  }
}

function openAddDomainModal() {
  $('addDomainModal').classList.add('active');
  $('newDomainName').value = '';
  $('domainCheckResult').textContent = '';
}

function closeModal(id) {
  $(id).classList.remove('active');
}

async function addDomain() {
  const domain = $('newDomainName').value.trim().toLowerCase();
  if (!domain) {
    toast('Enter a domain name', 'error');
    return;
  }
  
  try {
    const res = await fetch(`${API_BASE}/api/admin/setup/cloudflare-zone`, {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ domain })
    });
    const data = await res.json();
    
    if (!data.success) throw new Error(data.error || 'Failed to add domain');
    
    closeModal('addDomainModal');
    toast(`✅ Domain ${domain} added successfully`);
    refreshDomains();
  } catch (e) {
    toast('❌ ' + e.message, 'error');
  }
}

// ── Rules ──
async function loadDomainRules() {
  const select = $('domainSelect');
  const zoneId = select.value;
  const container = $('rulesContainer');
  const addBtn = $('addRuleBtn');
  
  if (!zoneId) {
    container.innerHTML = '<div class="empty-state">Select a domain to view routing rules</div>';
    addBtn.classList.add('hidden');
    currentZoneId = null;
    return;
  }
  
  currentZoneId = zoneId;
  const domain = domains.find(d => d.id === zoneId);
  currentDomainName = domain ? domain.name : 'unknown';
  
  container.innerHTML = '<div class="loading">Loading rules...</div>';
  
  try {
    const res = await fetch(`${API_BASE}/api/admin/setup/routing-rules/${zoneId}`, {
      headers: headers()
    });
    const data = await res.json();
    
    if (!data.success) throw new Error(data.error || 'Failed to load rules');
    
    currentRules = data.rules || [];
    renderRules(currentRules);
    addBtn.classList.remove('hidden');
  } catch (e) {
    container.innerHTML = `<div class="empty-state">❌ ${e.message}</div>`;
    toast('❌ ' + e.message, 'error');
  }
}

function renderRules(rules) {
  const container = $('rulesContainer');
  
  if (!rules || rules.length === 0) {
    container.innerHTML = `<div class="empty-state">No routing rules for ${currentDomainName}</div>`;
    return;
  }
  
  let html = `<div style="margin-bottom:12px;font-size:13px;color:var(--muted);">${rules.length} rules for ${currentDomainName}</div>`;
  html += '<div class="rule-list">';
  
  rules.forEach(rule => {
    const pattern = rule.matchers && rule.matchers.length > 0 
      ? rule.matchers.map(m => m.type === 'all' ? '*@*' : m.value || m.field || 'all').join(', ')
      : 'all';
    const isActive = rule.enabled !== false;
    const action = rule.actions && rule.actions.length > 0 
      ? rule.actions.map(a => a.type + (a.value ? ':' + a.value.join(',') : '')).join(', ')
      : 'worker';
    
    html += `
      <div class="rule-item">
        <span class="pattern">${pattern}</span>
        <span class="status ${isActive ? 'active' : 'inactive'}">${isActive ? 'Active' : 'Inactive'}</span>
        <span style="font-size:12px;color:var(--muted);">${action}</span>
        <div class="actions">
          <button class="btn btn-secondary btn-sm" onclick="toggleRule('${rule.id}')">
            ${isActive ? '🔴' : '🟢'}
          </button>
          <button class="btn btn-secondary btn-sm" onclick="openEditRuleModal('${rule.id}')">✏️</button>
          <button class="btn btn-danger btn-sm" onclick="deleteRule('${rule.id}')">🗑️</button>
        </div>
      </div>
    `;
  });
  
  html += '</div>';
  container.innerHTML = html;
}

// ── Create Rule ──
function openAddRuleModal() {
  if (!currentZoneId) {
    toast('Select a domain first', 'error');
    return;
  }
  $('addRuleModal').classList.add('active');
  $('ruleSpecificAddress').value = '';
  $('ruleSpecificAddress').classList.add('hidden');
  $('rulePatternType').value = 'catchall';
  $('ruleWorkerName').value = 'dornorium';
}

function toggleRulePattern() {
  const type = $('rulePatternType').value;
  const field = $('specificAddressField');
  if (type === 'specific') {
    field.classList.remove('hidden');
  } else {
    field.classList.add('hidden');
  }
}

async function createRule() {
  const type = $('rulePatternType').value;
  let pattern = '*';
  
  if (type === 'specific') {
    pattern = $('ruleSpecificAddress').value.trim();
    if (!pattern || !pattern.includes('@')) {
      toast('Enter a valid email address', 'error');
      return;
    }
  }
  
  const workerName = $('ruleWorkerName').value.trim() || 'dornorium';
  
  try {
    const res = await fetch(`${API_BASE}/api/admin/setup/routing-rule`, {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({
        zoneId: currentZoneId,
        emailPattern: pattern,
        workerName: workerName
      })
    });
    const data = await res.json();
    
    if (!data.success) throw new Error(data.error || 'Failed to create rule');
    
    closeModal('addRuleModal');
    toast('✅ Rule created successfully');
    loadDomainRules();
  } catch (e) {
    toast('❌ ' + e.message, 'error');
  }
}

// ── Toggle Rule ──
async function toggleRule(ruleId) {
  const rule = currentRules.find(r => r.id === ruleId);
  if (!rule) return;
  
  const newStatus = !rule.enabled;
  
  try {
    const res = await fetch(`${API_BASE}/api/admin/setup/routing-rule/${ruleId}`, {
      method: 'PUT',
      headers: headers(),
      body: JSON.stringify({
        zoneId: currentZoneId,
        enabled: newStatus
      })
    });
    const data = await res.json();
    
    if (!data.success) throw new Error(data.error || 'Failed to update rule');
    
    toast(`✅ Rule ${newStatus ? 'activated' : 'deactivated'}`);
    loadDomainRules();
  } catch (e) {
    toast('❌ ' + e.message, 'error');
  }
}

// ── Edit Rule ──
function openEditRuleModal(ruleId) {
  const rule = currentRules.find(r => r.id === ruleId);
  if (!rule) return;
  
  editingRuleId = ruleId;
  const modal = $('editRuleModal');
  const content = $('editRuleContent');
  
  const pattern = rule.matchers && rule.matchers.length > 0 
    ? rule.matchers.map(m => m.type === 'all' ? '*@*' : m.value || m.field || 'all').join(', ')
    : 'all';
  const action = rule.actions && rule.actions.length > 0 
    ? rule.actions.map(a => a.type + (a.value ? ':' + a.value.join(',') : '')).join(', ')
    : 'worker';
  
  content.innerHTML = `
    <label>Pattern</label>
    <div style="font-family:monospace;padding:10px 12px;background:var(--bg);border-radius:6px;margin-bottom:16px;">${pattern}</div>
    <label>Action</label>
    <div style="font-family:monospace;padding:10px 12px;background:var(--bg);border-radius:6px;margin-bottom:16px;">${action}</div>
    <label>Status</label>
    <select id="editRuleStatus">
      <option value="true" ${rule.enabled !== false ? 'selected' : ''}>Active</option>
      <option value="false" ${rule.enabled === false ? 'selected' : ''}>Inactive</option>
    </select>
  `;
  
  modal.classList.add('active');
}

async function saveRuleEdit() {
  const enabled = $('editRuleStatus').value === 'true';
  
  try {
    const res = await fetch(`${API_BASE}/api/admin/setup/routing-rule/${editingRuleId}`, {
      method: 'PUT',
      headers: headers(),
      body: JSON.stringify({
        zoneId: currentZoneId,
        enabled: enabled
      })
    });
    const data = await res.json();
    
    if (!data.success) throw new Error(data.error || 'Failed to update rule');
    
    closeModal('editRuleModal');
    toast('✅ Rule updated');
    loadDomainRules();
  } catch (e) {
    toast('❌ ' + e.message, 'error');
  }
}

// ── Delete Rule ──
async function deleteRule(ruleId) {
  if (!confirm('Delete this routing rule?')) return;
  
  try {
    const res = await fetch(`${API_BASE}/api/admin/setup/routing-rule/${ruleId}`, {
      method: 'DELETE',
      headers: headers(),
      body: JSON.stringify({ zoneId: currentZoneId })
    });
    const data = await res.json();
    
    if (!data.success) throw new Error(data.error || 'Failed to delete rule');
    
    toast('✅ Rule deleted');
    loadDomainRules();
  } catch (e) {
    toast('❌ ' + e.message, 'error');
  }
}

// ── Init ──
refreshDomains();

// Close modals on backdrop click
document.querySelectorAll('.modal').forEach(modal => {
  modal.addEventListener('click', function(e) {
    if (e.target === this) {
      this.classList.remove('active');
    }
  });
});
</script>
</body>
</html>
