<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DORNORIUM • The Living Network</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
    let API_BASE = '';
    fetch('config.json')
      .then(r => r.json())
      .then(c => { API_BASE = c.API_BASE; })
      .catch(() => { API_BASE = ''; });
    </script>
    <style>
        :root {
            --cyan: #60a5fa; --silver: #e2e8f0; --bg: #0a0a0a;
            --accent: #38bdf8; --accent2: #818cf8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: var(--silver); font-family: 'Inter', system-ui, sans-serif; overflow: hidden; height: 100vh; position: relative; }
        .container { position: relative; width: 100%; height: 100vh; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 2rem; }
        .title {
            font-family: 'Space Grotesk', sans-serif; font-size: clamp(3rem, 8vw, 7rem);
            font-weight: 600; letter-spacing: -0.05em;
            background: linear-gradient(90deg, #60a5fa, #e2e8f0, #60a5fa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(96,165,250,0.6);
            opacity: 0;
        }
        .subtitle { font-size: 1.25rem; letter-spacing: 0.5em; text-transform: uppercase; color: #94a3b8; margin-top: 1rem; opacity: 0; }
        .scene { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; align-items: center; justify-content: center; flex-direction: column; }
        .globe-container { width: 420px; height: 420px; border-radius: 50%; position: relative; border: 2px solid rgba(96,165,250,0.4); box-shadow: 0 0 80px rgba(96,165,250,0.3); overflow: hidden; }
        .final-text { font-size: 2.8rem; font-weight: 600; letter-spacing: -0.03em; margin-bottom: 1rem; }
        .scanline { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, transparent 40%, rgba(96,165,250,0.08) 50%, transparent 60%); animation: scan 6s linear infinite; pointer-events: none; z-index: 3; }
        @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(400%); } }
        .sky-layer { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
        .rising-sun { position: absolute; left: 50%; transform: translateX(-50%); width: 100px; height: 100px; background: radial-gradient(circle, #fff 0%, #ffd780 20%, #f59e0b 45%, rgba(245,158,11,0.3) 70%, transparent 100%); border-radius: 50%; z-index: 5; }
        .sun-rays { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 200px; height: 200px; z-index: 4; opacity: 0.6; }
        .sun-ray { position: absolute; top: 50%; left: 50%; width: 2px; height: 80px; background: linear-gradient(to top, rgba(255,220,100,.5), transparent); transform-origin: bottom center; }
        .mountains-foreground { position: absolute; bottom: 0; left: 0; width: 100%; height: 220px; z-index: 6; pointer-events: none; }
        .fg-mountain { position: absolute; bottom: 0; width: 0; height: 0; border-style: solid; }
        .fg-mountain.back { border-left: 280px solid transparent; border-right: 280px solid transparent; border-bottom: 180px solid #0d1a30; left: 15%; opacity: 0.85; }
        .fg-mountain.mid { border-left: 200px solid transparent; border-right: 200px solid transparent; border-bottom: 140px solid #111f38; left: 5%; opacity: 0.9; }
        .fg-mountain.front { border-left: 240px solid transparent; border-right: 240px solid transparent; border-bottom: 200px solid #162544; left: 25%; }
        .fg-mountain.right { border-left: 180px solid transparent; border-right: 180px solid transparent; border-bottom: 150px solid #0f1f35; left: 55%; opacity: 0.9; }
        .fg-mountain.far-right { border-left: 150px solid transparent; border-right: 150px solid transparent; border-bottom: 120px solid #0a1525; left: 70%; opacity: 0.8; }
        .fg-mountain::after { content: ''; position: absolute; top: -20px; left: -18px; width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-bottom: 20px solid rgba(255,255,255,.1); }
        .fg-mountain.front::after { top: -28px; left: -22px; border-left-width: 22px; border-right-width: 22px; border-bottom-width: 28px; }
        .fg-lake { position: absolute; bottom: 0; left: 10%; right: 10%; height: 3px; background: linear-gradient(90deg, transparent, rgba(56,189,248,.3), rgba(129,140,248,.4), rgba(56,189,248,.3), transparent); border-radius: 50%; box-shadow: 0 0 20px rgba(56,189,248,.25), 0 0 40px rgba(129,140,248,.15); z-index: 7; }
        @media (max-width: 500px) { .globe-container { width: 300px; height: 300px; } }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="bg-canvas"></canvas>
        <div class="sky-layer">
            <div class="sun-rays" id="sunRays"></div>
            <div class="rising-sun" id="risingSun" style="bottom:-120px;"></div>
        </div>
        <div class="mountains-foreground">
            <div class="fg-mountain far-right"></div>
            <div class="fg-mountain right"></div>
            <div class="fg-mountain back"></div>
            <div class="fg-mountain mid"></div>
            <div class="fg-mountain front"></div>
            <div class="fg-lake" id="fgLake"></div>
        </div>
        <div id="scene1" class="scene" style="display: flex;">
            <div class="content">
                <h1 id="title-main" class="title">DORNORIUM</h1>
                <p class="subtitle">THE LIVING NETWORK</p>
            </div>
        </div>
        <div id="scene2" class="scene">
            <div class="content"><div class="globe-container" id="globe"></div></div>
        </div>
        <div id="scene3" class="scene">
            <div class="content" style="padding-bottom: 20vh;">
                <h1 class="final-text" style="background: linear-gradient(90deg, #60a5fa, #e2e8f0); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">DORNORIUM</h1>
                <p style="font-size: 1.35rem; color: #94a3b8; max-width: 620px; line-height: 1.4;">Form → Secure Routing → Global Agents → Instant Resolution</p>
                <div style="margin-top: 4rem; font-size: 0.9rem; letter-spacing: 4px; color: #475569;">2026</div>
            </div>
        </div>
        <div class="scanline"></div>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        class Particle {
            constructor() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 2.5 + 0.8; this.speedX = Math.random() * 0.6 - 0.3; this.speedY = Math.random() * 0.6 - 0.3; this.opacity = Math.random() * 0.6 + 0.3; }
            update() { this.x += this.speedX; this.y += this.speedY; if (this.x < 0 || this.x > canvas.width) this.speedX *= -1; if (this.y < 0 || this.y > canvas.height) this.speedY *= -1; }
            draw() { ctx.save(); ctx.globalAlpha = this.opacity; ctx.fillStyle = '#60a5fa'; ctx.shadowBlur = 12; ctx.shadowColor = '#60a5fa'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
        }
        function initParticles() { particles = []; for (let i = 0; i < 180; i++) particles.push(new Particle()); }
        function animateBackground() { ctx.fillStyle = 'rgba(10, 10, 12, 0.12)'; ctx.fillRect(0, 0, canvas.width, canvas.height); for (let i = 0; i < particles.length; i++) { particles[i].update(); particles[i].draw(); for (let j = i + 1; j < particles.length; j++) { const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, d = Math.sqrt(dx*dx+dy*dy); if (d < 110) { ctx.save(); ctx.globalAlpha = (110-d)/110*0.15; ctx.strokeStyle = '#60a5fa'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); ctx.restore(); } } } requestAnimationFrame(animateBackground); }
        function showScene(id) { document.querySelectorAll('.scene').forEach(s => s.style.display = 'none'); document.getElementById(id).style.display = 'flex'; }

        let globeAngle = 0;
        function animateGlobe() {
            const globeEl = document.getElementById('globe');
            const gCanvas = document.createElement('canvas'); gCanvas.width = 420; gCanvas.height = 420;
            gCanvas.style.cssText = 'position:absolute;top:0;left:0;z-index:5;'; globeEl.appendChild(gCanvas); const gCtx = gCanvas.getContext('2d');
            function draw() { gCtx.clearRect(0, 0, 420, 420); gCtx.save(); gCtx.translate(210, 210);
                gCtx.beginPath(); gCtx.ellipse(18, 25, 165, 45, 0, 0, Math.PI*2); gCtx.fillStyle = 'rgba(0,0,0,0.6)'; gCtx.fill();
                const grad = gCtx.createRadialGradient(-50, -55, 40, 20, 20, 170); grad.addColorStop(0, '#1e2937'); grad.addColorStop(1, '#0f172a');
                gCtx.beginPath(); gCtx.arc(0, 0, 160, 0, Math.PI*2); gCtx.fillStyle = grad; gCtx.fill();
                gCtx.strokeStyle = 'rgba(96,165,250,0.35)'; gCtx.lineWidth = 2.5;
                for (let i = -3; i <= 3; i++) { const r = globeAngle + i*25; gCtx.save(); gCtx.rotate(r*Math.PI/180); gCtx.beginPath(); gCtx.moveTo(-145,0); gCtx.quadraticCurveTo(0,-110,145,0); gCtx.stroke(); gCtx.restore(); }
                gCtx.strokeStyle = '#60a5fa'; gCtx.lineWidth = 3;
                for (let i = 0; i < 4; i++) { const rad = 75+i*22; gCtx.save(); gCtx.globalAlpha = 0.6-i*0.1; gCtx.beginPath(); gCtx.arc(0,0,rad,globeAngle*0.8*Math.PI/180,(globeAngle*0.8+120)*Math.PI/180); gCtx.stroke(); gCtx.restore(); }
                gCtx.beginPath(); gCtx.arc(-45,-55,65,0,Math.PI*2); gCtx.fillStyle = 'rgba(224,242,255,0.12)'; gCtx.fill();
                gCtx.restore(); globeAngle += 0.6; requestAnimationFrame(draw); }
            draw();
        }

        async function api(path, opts={}) { const res = await fetch(API_BASE+path, {...opts, headers:{'Content-Type':'application/json',...(opts.headers||{})}}); return {status:res.status, data:await res.json()}; }

        function startSunRise() {
            gsap.to("#risingSun", { bottom: "45%", duration: 8, ease: "power2.out",
                onUpdate: function() { const p = this.progress(); if(p>0.3)document.querySelectorAll('.fg-mountain').forEach(m=>m.style.borderBottomColor='#2a5588'); if(p>0.4)document.getElementById('fgLake').classList.add('sunrise'); }
            });
            gsap.fromTo("#sunRays", {opacity:0}, {opacity:0.7, duration:2, delay:2});
            gsap.to("#sunRays", {rotation:360, duration:20, repeat:-1, ease:"none"});
        }

        function startExperience() {
            const tl = gsap.timeline();
            startSunRise();
            showScene('scene1');
            gsap.fromTo("#title-main", {y:60,opacity:0}, {y:0,opacity:1,duration:1.5,ease:"power3.out"});
            tl.to("#scene1 .subtitle", {opacity:1,y:20,duration:0.8,delay:0.8});
            tl.to("#scene1", {opacity:0,duration:0.6,delay:0.7,onComplete:()=>{showScene('scene2');animateGlobe();}});
            tl.to({},{duration:3});
            tl.to("#scene2", {opacity:0,duration:0.5,onComplete:()=>showScene('scene3')});
            tl.fromTo("#scene3 .final-text", {y:80,opacity:0}, {y:0,opacity:1,duration:1,ease:"power4.out"});
            tl.to({},{duration:1,onComplete:checkSetup});
        }

        async function checkSetup() {
            while (!API_BASE) { await new Promise(r => setTimeout(r, 100)); }
            try {
                const { data } = await api('/api/setup/status');
                if (data.setupComplete) {
                    gsap.to("#scene3", {opacity:0,duration:0.6,onComplete:()=>{window.location.href='dashboard.html';}});
                } else {
                    window.location.href = 'setup.html';
                }
            } catch(e) {
                window.location.href = 'setup.html';
            }
        }

        (function createRays() { const c=document.getElementById('sunRays'); for(let i=0;i<16;i++){const r=document.createElement('div');r.className='sun-ray';r.style.transform=`translate(-50%,-100%) rotate(${i*22.5}deg)`;c.appendChild(r);} })();

        window.onload=function(){resizeCanvas();initParticles();animateBackground();setTimeout(startExperience,400);document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')location.reload();});};
        window.addEventListener('resize',()=>resizeCanvas());
    </script>
</body>
</html>
