<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DORNORIUM • The Living Network</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        :root {
            --cyan: #60a5fa; --silver: #e2e8f0; --bg: #0a0a0a;
            --accent: #38bdf8; --accent2: #818cf8; --gold: #f59e0b;
            --success: #22c55e; --error: #ef4444; --border: #1e293b;
            --input-bg: #0a0a0f; --bg-card: #13131f; --radius: 14px;
            --text-muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: var(--silver); font-family: 'Inter', system-ui, sans-serif; overflow: hidden; height: 100vh; position: relative; }
        .container { position: relative; width: 100%; height: 100vh; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 2rem; }
        .title {
            font-family: 'Space Grotesk', sans-serif; font-size: clamp(3rem, 8vw, 7rem);
            font-weight: 600; letter-spacing: -0.05em;
            background: linear-gradient(90deg, #60a5fa, #e2e8f0, #60a5fa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(96,165,250,0.6); opacity: 0;
        }
        .subtitle { font-size: 1.25rem; letter-spacing: 0.5em; text-transform: uppercase; color: #94a3b8; margin-top: 1rem; opacity: 0; }
        .scene { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; align-items: center; justify-content: center; flex-direction: column; }
        .globe-container { width: 420px; height: 420px; border-radius: 50%; position: relative; border: 2px solid rgba(96,165,250,0.4); box-shadow: 0 0 80px rgba(96,165,250,0.3); overflow: hidden; }
        .final-text { font-size: 2.8rem; font-weight: 600; letter-spacing: -0.03em; margin-bottom: 1rem; }
        .scanline { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, transparent 40%, rgba(96,165,250,0.08) 50%, transparent 60%); animation: scan 6s linear infinite; pointer-events: none; z-index: 3; }
        @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(400%); } }
        .sky-layer { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
        .rising-sun { position: absolute; left: 50%; transform: translateX(-50%); width: 100px; height: 100px; background: radial-gradient(circle, #fff 0%, #ffd780 20%, #f59e0b 45%, rgba(245,158,11,0.3) 70%, transparent 100%); border-radius: 50%; z-index: 5; }
        .sun-rays { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 200px; height: 200px; z-index: 4; opacity: 0.6; }
        .sun-ray { position: absolute; top: 50%; left: 50%; width: 2px; height: 80px; background: linear-gradient(to top, rgba(255,220,100,.5), transparent); transform-origin: bottom center; }
        .mountains-foreground { position: absolute; bottom: 0; left: 0; width: 100%; height: 220px; z-index: 6; pointer-events: none; }
        .fg-mountain { position: absolute; bottom: 0; width: 0; height: 0; border-style: solid; }
        .fg-mountain.back { border-left: 280px solid transparent; border-right: 280px solid transparent; border-bottom: 180px solid #0d1a30; left: 15%; opacity: 0.85; }
        .fg-mountain.mid { border-left: 200px solid transparent; border-right: 200px solid transparent; border-bottom: 140px solid #111f38; left: 5%; opacity: 0.9; }
        .fg-mountain.front { border-left: 240px solid transparent; border-right: 240px solid transparent; border-bottom: 200px solid #162544; left: 25%; }
        .fg-mountain.right { border-left: 180px solid transparent; border-right: 180px solid transparent; border-bottom: 150px solid #0f1f35; left: 55%; opacity: 0.9; }
        .fg-mountain.far-right { border-left: 150px solid transparent; border-right: 150px solid transparent; border-bottom: 120px solid #0a1525; left: 70%; opacity: 0.8; }
        .fg-mountain::after { content: ''; position: absolute; top: -20px; left: -18px; width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-bottom: 20px solid rgba(255,255,255,.1); }
        .fg-mountain.front::after { top: -28px; left: -22px; border-left-width: 22px; border-right-width: 22px; border-bottom-width: 28px; }
        .fg-lake { position: absolute; bottom: 0; left: 10%; right: 10%; height: 3px; background: linear-gradient(90deg, transparent, rgba(56,189,248,.3), rgba(129,140,248,.4), rgba(56,189,248,.3), transparent); border-radius: 50%; box-shadow: 0 0 20px rgba(56,189,248,.25); z-index: 7; }
        .setup-overlay { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; padding: 20px; }
        .setup-overlay.active { display: flex; }
        .setup-card { background: var(--bg-card); border-radius: var(--radius); padding: 40px; max-width: 620px; width: 100%; border: 1px solid var(--border); box-shadow: 0 0 80px rgba(56,189,248,.08); animation: cardIn .5s ease; max-height: 85vh; overflow-y: auto; }
        @keyframes cardIn { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .setup-card h2 { font-size: 20px; margin-bottom: 8px; }
        .setup-card .desc { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; line-height: 1.6; }
        .setup-card h3 { font-size: 15px; margin: 20px 0 10px; color: var(--accent); }
        .dl-buttons { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
        .dl-btn { flex: 1; min-width: 120px; padding: 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); text-align: center; cursor: pointer; transition: all .2s; text-decoration: none; font-weight: 600; font-size: 14px; }
        .dl-btn:hover { border-color: var(--accent); background: rgba(56,189,248,.08); }
        .dl-btn .os-icon { font-size: 28px; display: block; margin-bottom: 6px; }
        .btn { padding: 12px 26px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; width: 100%; }
        .btn-primary { background: var(--accent); color: #0a0a0f; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        .btn:disabled { opacity: .4; cursor: not-allowed; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 16px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; font-family: inherit; }
        .form-group input:focus { outline: none; border-color: var(--accent); }
        .status { font-size: 13px; padding: 12px 16px; border-radius: 8px; margin-top: 14px; display: none; text-align: center; }
        .status.success { display: block; background: rgba(34,197,94,.08); color: var(--success); border: 1px solid rgba(34,197,94,.15); }
        .status.error { display: block; background: rgba(239,68,68,.08); color: var(--error); border: 1px solid rgba(239,68,68,.15); }
        .status.info { display: block; background: rgba(56,189,248,.08); color: var(--accent); border: 1px solid rgba(56,189,248,.15); }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid transparent; border-top-color: currentColor; border-radius: 50%; animation: spin .6s linear infinite; margin-right: 6px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .code-block { background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: 'Menlo', monospace; font-size: 11px; color: var(--accent); margin: 8px 0; word-break: break-all; }
        ol { color: var(--text-muted); font-size: 13px; padding-left: 18px; line-height: 2; margin-bottom: 16px; }
        ol li { margin-bottom: 2px; }
        .step-num { display: inline-block; width: 22px; height: 22px; border-radius: 50%; background: var(--border); color: var(--text-muted); text-align: center; line-height: 22px; font-size: 11px; font-weight: 700; margin-right: 8px; }
        .link-btn { color: var(--accent); text-decoration: underline; cursor: pointer; }
        @media (max-width: 500px) { .setup-card { padding: 24px 18px; } .globe-container { width: 300px; height: 300px; } }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="bg-canvas"></canvas>
        <div class="sky-layer"><div class="sun-rays" id="sunRays"></div><div class="rising-sun" id="risingSun" style="bottom:-120px;"></div></div>
        <div class="mountains-foreground">
            <div class="fg-mountain far-right"></div><div class="fg-mountain right"></div>
            <div class="fg-mountain back"></div><div class="fg-mountain mid"></div>
            <div class="fg-mountain front"></div><div class="fg-lake" id="fgLake"></div>
        </div>
        <div id="scene1" class="scene" style="display: flex;"><div class="content"><h1 id="title-main" class="title">DORNORIUM</h1><p class="subtitle">THE LIVING NETWORK</p></div></div>
        <div id="scene2" class="scene"><div class="content"><div class="globe-container" id="globe"></div></div></div>
        <div id="scene3" class="scene">
            <div class="content" style="padding-bottom: 20vh;">
                <h1 class="final-text" style="background: linear-gradient(90deg, #60a5fa, #e2e8f0); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">DORNORIUM</h1>
                <p style="font-size: 1.35rem; color: #94a3b8;">Form → Secure Routing → Global Agents → Instant Resolution</p>
                <div style="margin-top: 4rem; font-size: 0.9rem; letter-spacing: 4px; color: #475569;">2026</div>
            </div>
        </div>
        <div class="scanline"></div>
    </div>

    <div class="setup-overlay" id="setupOverlay"><div class="setup-card" id="setupCard"></div></div>

    <script>
        const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d'); let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        class Particle {
            constructor() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 2.5 + 0.8; this.speedX = Math.random() * 0.6 - 0.3; this.speedY = Math.random() * 0.6 - 0.3; this.opacity = Math.random() * 0.6 + 0.3; }
            update() { this.x += this.speedX; this.y += this.speedY; if (this.x < 0 || this.x > canvas.width) this.speedX *= -1; if (this.y < 0 || this.y > canvas.height) this.speedY *= -1; }
            draw() { ctx.save(); ctx.globalAlpha = this.opacity; ctx.fillStyle = '#60a5fa'; ctx.shadowBlur = 12; ctx.shadowColor = '#60a5fa'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
        }
        function initParticles() { particles = []; for (let i = 0; i < 180; i++) particles.push(new Particle()); }
        function animateBackground() { ctx.fillStyle = 'rgba(10, 10, 12, 0.12)'; ctx.fillRect(0, 0, canvas.width, canvas.height); for (let i = 0; i < particles.length; i++) { particles[i].update(); particles[i].draw(); for (let j = i + 1; j < particles.length; j++) { const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, d = Math.sqrt(dx*dx+dy*dy); if (d < 110) { ctx.save(); ctx.globalAlpha = (110-d)/110*0.15; ctx.strokeStyle = '#60a5fa'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); ctx.restore(); } } } requestAnimationFrame(animateBackground); }
        function showScene(id) { document.querySelectorAll('.scene').forEach(s => s.style.display = 'none'); document.getElementById(id).style.display = 'flex'; }

        let globeAngle = 0;
        function animateGlobe() {
            const globeEl = document.getElementById('globe'); const gCanvas = document.createElement('canvas'); gCanvas.width = 420; gCanvas.height = 420;
            gCanvas.style.cssText = 'position:absolute;top:0;left:0;z-index:5;'; globeEl.appendChild(gCanvas); const gCtx = gCanvas.getContext('2d');
            function draw() { gCtx.clearRect(0, 0, 420, 420); gCtx.save(); gCtx.translate(210, 210);
                gCtx.beginPath(); gCtx.ellipse(18, 25, 165, 45, 0, 0, Math.PI*2); gCtx.fillStyle = 'rgba(0,0,0,0.6)'; gCtx.fill();
                const grad = gCtx.createRadialGradient(-50, -55, 40, 20, 20, 170); grad.addColorStop(0, '#1e2937'); grad.addColorStop(1, '#0f172a');
                gCtx.beginPath(); gCtx.arc(0, 0, 160, 0, Math.PI*2); gCtx.fillStyle = grad; gCtx.fill();
                gCtx.strokeStyle = 'rgba(96,165,250,0.35)'; gCtx.lineWidth = 2.5;
                for (let i = -3; i <= 3; i++) { const r = globeAngle + i*25; gCtx.save(); gCtx.rotate(r*Math.PI/180); gCtx.beginPath(); gCtx.moveTo(-145,0); gCtx.quadraticCurveTo(0,-110,145,0); gCtx.stroke(); gCtx.restore(); }
                gCtx.strokeStyle = '#60a5fa'; gCtx.lineWidth = 3;
                for (let i = 0; i < 4; i++) { const rad = 75+i*22; gCtx.save(); gCtx.globalAlpha = 0.6-i*0.1; gCtx.beginPath(); gCtx.arc(0,0,rad,globeAngle*0.8*Math.PI/180,(globeAngle*0.8+120)*Math.PI/180); gCtx.stroke(); gCtx.restore(); }
                gCtx.beginPath(); gCtx.arc(-45,-55,65,0,Math.PI*2); gCtx.fillStyle = 'rgba(224,242,255,0.12)'; gCtx.fill();
                gCtx.restore(); globeAngle += 0.6; requestAnimationFrame(draw); }
            draw();
        }

        function startSunRise() {
            gsap.to("#risingSun", { bottom: "45%", duration: 8, ease: "power2.out", onUpdate: function() { const p = this.progress(); if(p>0.3)document.querySelectorAll('.fg-mountain').forEach(m=>m.style.borderBottomColor='#2a5588'); if(p>0.4)document.getElementById('fgLake').classList.add('sunrise'); } });
            gsap.fromTo("#sunRays", {opacity:0}, {opacity:0.7, duration:2, delay:2}); gsap.to("#sunRays", {rotation:360, duration:20, repeat:-1, ease:"none"});
        }

        function startExperience() {
            const tl = gsap.timeline(); startSunRise(); showScene('scene1');
            gsap.fromTo("#title-main", {y:60,opacity:0}, {y:0,opacity:1,duration:1.5,ease:"power3.out"});
            tl.to("#scene1 .subtitle", {opacity:1,y:20,duration:0.8,delay:0.8});
            tl.to("#scene1", {opacity:0,duration:0.6,delay:0.7,onComplete:()=>{showScene('scene2');animateGlobe();}});
            tl.to({},{duration:3}); tl.to("#scene2", {opacity:0,duration:0.5,onComplete:()=>showScene('scene3')});
            tl.fromTo("#scene3 .final-text", {y:80,opacity:0}, {y:0,opacity:1,duration:1,ease:"power4.out"});
            tl.to({},{duration:1,onComplete:bootstrap});
        }

        let API_BASE = ''; let encryptionKey = crypto.randomUUID() + crypto.randomUUID().replace(/-/g, '');
        async function api(path, opts = {}) { const r = await fetch(API_BASE + path, { ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } }); return { status: r.status, data: await r.json().catch(() => ({})) }; }
        function showOverlay(html) { document.getElementById('setupCard').innerHTML = html; document.getElementById('setupOverlay').classList.add('active'); }
        function hideOverlay() { document.getElementById('setupOverlay').classList.remove('active'); }
        function showStatus(id, msg, type) { const el = document.getElementById(id); if(el) { el.textContent = msg; el.className = 'status ' + type; } }

        async function bootstrap() {
            let hasConfig = false;
            try { const c = await fetch('config.json').then(r => r.json()); if (c.API_BASE && c.API_BASE.startsWith('http')) { API_BASE = c.API_BASE; hasConfig = true; } } catch(e) {}
            if (!hasConfig) { showPhaseNoConfig(); return; }
            try { const { data } = await api('/api/setup/status'); if (data.setupComplete) { gsap.to("#scene3", {opacity:0,duration:0.6,onComplete:()=>{window.location.href='dashboard.html';}}); } else if (typeof data.setupComplete === 'boolean') { showPhaseCreateAdmin(); } else { showPhaseWorkerError(); } } catch(e) { showPhaseWorkerError(); }
        }

        function showPhaseNoConfig() {
            showOverlay(`
                <h2>🚀 Welcome to Dornorium</h2>
                <p class="desc">Follow these steps to deploy your backend to Cloudflare and connect it to this site.</p>

                <h3>Step 1: Get Your Cloudflare API Keys</h3>
                <ol>
                    <li>Go to <a href="https://dash.cloudflare.com" target="_blank" class="link-btn">dash.cloudflare.com</a> and log in</li>
                    <li>Copy your <strong>Account ID</strong> (found in the URL or right sidebar)</li>
                    <li>Go to <a href="https://dash.cloudflare.com/profile/api-tokens" target="_blank" class="link-btn">API Tokens</a> → <strong>Create Token</strong></li>
                    <li>Use the <strong>"Edit Cloudflare Workers"</strong> template</li>
                    <li>Under <strong>Account Resources</strong>, select your account</li>
                    <li>Under <strong>Zone Resources</strong>, select "All zones"</li>
                    <li>Click <strong>Continue to summary</strong> → <strong>Create Token</strong></li>
                    <li><strong>Copy the token immediately</strong> — it won't be shown again!</li>
                </ol>

                <h3>Step 2: Download & Run the Installer</h3>
                <p class="desc">Choose your operating system. The installer will ask for your Account ID and API Token, then create everything automatically.</p>
                <div class="dl-buttons">
                    <a class="dl-btn" href="install.bat" download><span class="os-icon">🪟</span>Windows (.bat)</a>
                    <a class="dl-btn" href="install.sh" download><span class="os-icon">🍎</span>macOS (.sh)</a>
                    <a class="dl-btn" href="install.sh" download><span class="os-icon">🐧</span>Linux (.sh)</a>
                </div>
                <p class="desc" style="font-size:11px;">Double-click the file to run it. Enter your Account ID and API Token when prompted. The installer creates the Worker, D1 database, Durable Object, secrets, and a <code>config.json</code> file.</p>

                <h3>Step 3: Upload config.json</h3>
                <ol>
                    <li>The installer creates a <code>config.json</code> file in the same folder</li>
                    <li>Upload <code>config.json</code> to your website — same folder as this page</li>
                    <li>Click the button below</li>
                </ol>
                <button class="btn btn-success" onclick="checkConfigAgain()">✅ I've Uploaded config.json — Continue</button>
                <div class="status" id="noconfig-status"></div>
            `);
        }

        async function checkConfigAgain() {
            showStatus('noconfig-status', '<span class="spinner"></span> Checking…', 'info');
            try { const c = await fetch('config.json?' + Date.now()).then(r => r.json()); if (c.API_BASE && c.API_BASE.startsWith('http')) { API_BASE = c.API_BASE; try { const { data } = await api('/api/setup/status'); if (typeof data.setupComplete === 'boolean') { hideOverlay(); data.setupComplete ? window.location.href = 'dashboard.html' : showPhaseCreateAdmin(); } else { showStatus('noconfig-status', '❌ Worker not responding. Check config.json URL.', 'error'); } } catch(e) { showStatus('noconfig-status', '❌ Cannot reach worker at ' + API_BASE, 'error'); } } else { showStatus('noconfig-status', '❌ config.json found but API_BASE is missing.', 'error'); } } catch(e) { showStatus('noconfig-status', '❌ config.json not found. Upload it to the same folder as this page.', 'error'); }
        }

        function showPhaseCreateAdmin() {
            showOverlay(`
                <h2>👤 Create Admin Account</h2>
                <p class="desc">Your worker is connected! Create the first administrator account to get started.</p>
                <div class="form-group"><label>Admin Email</label><input type="email" id="adminEmail" placeholder="admin@example.com" /></div>
                <div class="form-group"><label>Display Name</label><input type="text" id="adminName" placeholder="Admin" /></div>
                <div class="form-group"><label>Password (12+ chars, A-Z, a-z, 0-9, special)</label><input type="password" id="adminPassword" placeholder="••••••••••••" /></div>
                <button class="btn btn-success" onclick="createAdmin()">🚀 Create Admin & Launch</button>
                <div class="status" id="admin-status"></div>
            `);
        }

        function showPhaseWorkerError() {
            showOverlay(`
                <h2>⚠️ Worker Not Reachable</h2>
                <p class="desc">Cannot connect to the worker at <code>${API_BASE || 'unknown'}</code>.</p>
                <p class="desc">Make sure the installer ran successfully and config.json has the correct URL.</p>
                <button class="btn btn-primary" onclick="location.reload()">🔄 Retry</button>
            `);
        }

        async function createAdmin() {
            const email = document.getElementById('adminEmail').value.trim(), name = document.getElementById('adminName').value.trim(), password = document.getElementById('adminPassword').value;
            if (!email || !name || !password) { showStatus('admin-status', 'All fields required.', 'error'); return; }
            showStatus('admin-status', '<span class="spinner"></span> Creating…', 'info');
            try { const { data } = await api('/api/setup/create-admin', { method: 'POST', body: JSON.stringify({ encryptionKey: encryptionKey, email, name, password }) }); if (data.success) { localStorage.setItem('token', data.token); localStorage.setItem('user', JSON.stringify(data.user)); showStatus('admin-status', '✅ Admin created! Redirecting…', 'success'); setTimeout(() => window.location.href = 'dashboard.html', 1500); } else { showStatus('admin-status', '❌ ' + (data.error || 'Failed. Is ENCRYPTION_KEY set?'), 'error'); } } catch(e) { showStatus('admin-status', '❌ ' + e.message, 'error'); }
        }

        (function createRays() { const c=document.getElementById('sunRays'); for(let i=0;i<16;i++){const r=document.createElement('div');r.className='sun-ray';r.style.transform=`translate(-50%,-100%) rotate(${i*22.5}deg)`;c.appendChild(r);} })();
        window.onload=function(){resizeCanvas();initParticles();animateBackground();setTimeout(startExperience,400);};
        window.addEventListener('resize',()=>resizeCanvas());
    </script>
</body>
</html>
