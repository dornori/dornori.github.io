<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users – Dornori</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .container { max-width: 1400px !important; }
        .users-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-add-user { background: var(--accent); color: var(--text-inverse); padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-add-user:hover { opacity: 0.9; }
        .users-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .users-table th, .users-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        .users-table th { background: var(--bg-header); font-weight: 600; font-size: 14px; }
        .users-table tr:hover { background: var(--bg-card); }
        .role-badge { display: inline-block; padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .role-badge.admin { background: #ef4444; color: white; }
        .role-badge.manager { background: #f59e0b; color: white; }
        .role-badge.tl { background: #06b6d4; color: white; }
        .role-badge.agent { background: #3b82f6; color: white; }
        .langs-cell { font-size: 12px; color: var(--text-muted); }
        .action-btn { padding: 6px 12px; font-size: 13px; margin-right: 6px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; }
        .action-btn:hover { background: var(--accent); color: var(--text-inverse); }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .action-btn.delete { background: #fecaca; color: #991b1b; border-color: #fca5a5; }
        .action-btn.delete:hover:not(:disabled) { background: #fca5a5; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 25px; max-width: 700px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .modal-header h3 { margin: 0; font-size: 20px; }
        .modal-close { background: none; border: none; font-size: 28px; cursor: pointer; color: var(--text-muted); padding: 0; }
        .modal-close:hover { color: var(--text); }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-input); color: var(--text); font-size: 14px; box-sizing: border-box; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); }
        .form-group input:disabled { opacity: 0.6; cursor: not-allowed; }
        .role-info { font-size: 12px; color: var(--text-muted); margin-top: 5px; }
        .langs-group { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 8px; }
        .lang-checkbox { display: flex; align-items: center; padding: 8px; background: var(--bg-input); border-radius: 4px; }
        .lang-checkbox input, .lang-checkbox label { margin: 0; cursor: pointer; }
        .lang-checkbox input { margin-right: 8px; }
        .lang-checkbox label { font-weight: normal; }
        .emails-group { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 8px; }
        .email-checkbox { display: flex; align-items: center; padding: 8px; background: var(--bg-input); border-radius: 4px; }
        .email-checkbox input, .email-checkbox label { margin: 0; cursor: pointer; font-size: 12px; }
        .email-checkbox input { margin-right: 8px; }
        .add-item-btn { padding: 8px 12px; font-size: 12px; background: var(--accent); color: var(--text-inverse); border: none; border-radius: 4px; cursor: pointer; margin-top: 8px; }
        .add-item-btn:hover { opacity: 0.9; }
        .add-item-row { display: flex; gap: 8px; margin-top: 8px; }
        .add-item-row input { flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-input); color: var(--text); }
        .add-item-row button { padding: 8px 12px; background: var(--accent); color: var(--text-inverse); border: none; border-radius: 4px; cursor: pointer; }
        .add-item-row button:hover { opacity: 0.9; }
        .item-tag { display: inline-block; background: var(--accent); color: var(--text-inverse); padding: 4px 8px; border-radius: 3px; margin-right: 6px; margin-bottom: 6px; font-size: 12px; }
        .item-tag button { background: none; border: none; color: inherit; cursor: pointer; margin-left: 4px; padding: 0; font-weight: bold; }
        .form-footer { display: flex; gap: 10px; margin-top: 25px; justify-content: flex-end; }
        .btn-primary { background: var(--accent); color: var(--text-inverse); padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .btn-primary:hover:not(:disabled) { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: var(--bg-input); color: var(--text); padding: 10px 20px; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; }
        .btn-secondary:hover { background: var(--bg-card); }
        .error { color: #ef4444; font-size: 13px; margin-top: 5px; }
        .success { color: #22c55e; font-size: 13px; margin-top: 5px; }
        .loading { text-align: center; padding: 40px; color: var(--text-muted); }
        .perm-denied { padding: 40px; text-align: center; }
        .perm-denied h2 { color: #ef4444; margin-bottom: 10px; }
        .section-divider { border-top: 1px solid var(--border); margin: 20px 0; padding-top: 15px; }
        .section-title { font-weight: 700; font-size: 13px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>👥 User Management</h1>
        <div class="header-right">
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
            <a href="dashboard.html">← Dashboard</a>
            <a href="reports.html">📊 Reports</a>
            <a href="settings.html">⚙️ Settings</a>
        </div>
    </div>

    <div id="permDenied" class="card perm-denied" style="display:none;">
        <h2>⛔ Permission Denied</h2>
        <p>You don't have permission to manage users.</p>
    </div>

    <div id="usersApp" style="display:none;">
        <div class="users-header">
            <h2>Manage Users</h2>
            <button class="btn-add-user" id="addUserBtn" onclick="openAddUserModal()">+ Add User</button>
        </div>

        <div class="card">
            <div id="usersTableContainer" class="loading">Loading users...</div>
        </div>
    </div>
</div>

<!-- ADD USER MODAL -->
<div id="addUserModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Add New User</h3>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div id="addUserForm">
            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="newEmail" placeholder="user@example.com" />
            </div>
            <div class="form-group">
                <label>Name *</label>
                <input type="text" id="newName" placeholder="John Doe" />
            </div>
            <div class="form-group">
                <label>Password *</label>
                <input type="password" id="newPassword" placeholder="Min 8 chars" />
            </div>
            <div class="form-group">
                <label>Role *</label>
                <select id="newRole" onchange="updateRoleInfo()">
                    <option value="agent">Agent - Handle assigned tickets</option>
                    <option value="tl">Team Leader - Manage team &amp; tickets</option>
                    <option value="manager">Manager - Manage all users &amp; tickets</option>
                    <option value="admin">Admin - Full system access</option>
                </select>
                <div class="role-info" id="roleInfo"></div>
            </div>

            <div class="form-group">
                <label>Languages *</label>
                <div class="langs-group" id="newLanguages"></div>
            </div>

            <div id="newTeamGroup" class="form-group" style="display:none;">
                <label>Team</label>
                <select id="newTeamId">
                    <option value="">— Select Team —</option>
                </select>
                <div class="section-divider"></div>
                <label>Or Create New Team</label>
                <div class="add-item-row">
                    <input type="text" id="newTeamName" placeholder="Team name (e.g., Support NL)" />
                    <button onclick="createNewTeam()">Create</button>
                </div>
                <div id="newTeamsList"></div>
            </div>

            <div id="newEmailsGroup" class="form-group" style="display:none;">
                <label>Support Email Addresses *</label>
                <div class="emails-group" id="newEmails"></div>
                <div class="section-divider"></div>
                <label>Or Add New Email</label>
                <div class="add-item-row">
                    <input type="email" id="newEmailAddr" placeholder="support@example.com" />
                    <button onclick="addNewEmail()">Add</button>
                </div>
                <div id="newEmailsList"></div>
            </div>

            <div id="addUserError" class="error"></div>
            <div class="form-footer">
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn-primary" onclick="addUser()">Add User</button>
            </div>
        </div>
    </div>
</div>

<!-- EDIT USER MODAL -->
<div id="editUserModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Edit User</h3>
            <button class="modal-close" onclick="closeEditModal()">×</button>
        </div>
        <div id="editUserForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="editEmail" disabled style="opacity: 0.6;" />
            </div>
            <div class="form-group">
                <label>Name *</label>
                <input type="text" id="editName" />
            </div>

            <div id="editRoleGroup" class="form-group">
                <label>Role *</label>
                <select id="editRole" onchange="updateEditRoleInfo()">
                    <option value="agent">Agent - Handle assigned tickets</option>
                    <option value="tl">Team Leader - Manage team &amp; tickets</option>
                    <option value="manager">Manager - Manage all users &amp; tickets</option>
                    <option value="admin">Admin - Full system access</option>
                </select>
                <div class="role-info" id="editRoleInfo"></div>
            </div>

            <div class="form-group">
                <label>Languages *</label>
                <div class="langs-group" id="editLanguages"></div>
            </div>

            <div id="editTeamGroup" class="form-group" style="display:none;">
                <label>Team</label>
                <select id="editTeamId">
                    <option value="">— Select Team —</option>
                </select>
                <div class="section-divider"></div>
                <label>Or Create New Team</label>
                <div class="add-item-row">
                    <input type="text" id="editTeamName" placeholder="Team name (e.g., Support NL)" />
                    <button onclick="createNewTeamEdit()">Create</button>
                </div>
                <div id="editTeamsList"></div>
            </div>

            <div id="editEmailsGroup" class="form-group" style="display:none;">
                <label>Support Email Addresses *</label>
                <div class="emails-group" id="editEmails"></div>
                <div class="section-divider"></div>
                <label>Or Add New Email</label>
                <div class="add-item-row">
                    <input type="email" id="editEmailAddr" placeholder="support@example.com" />
                    <button onclick="addNewEmailEdit()">Add</button>
                </div>
                <div id="editEmailsList"></div>
            </div>

            <div id="editUserError" class="error"></div>
            <div class="form-footer">
                <button class="btn-secondary" onclick="closeEditModal()">Cancel</button>
                <button class="btn-primary" onclick="saveUser()">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE = 'https://dornori-ticketing.dornori-info.workers.dev';
    const LANGUAGES = { en: 'English', nl: 'Dutch', de: 'German', fr: 'French', es: 'Spanish', it: 'Italian', pt: 'Portuguese', cs: 'Czech' };
    const ROLE_DESCRIPTIONS = {
        admin: 'Full system access. Can manage users, settings, and all data.',
        manager: 'Manage all agents &amp; team leaders. View all tickets and reports.',
        tl: 'Manage your team. Assign tickets within team. View team reports.',
        agent: 'View &amp; update assigned tickets. Add comments &amp; replies.'
    };

    let token = localStorage.getItem('token');
    let currentUser = null;
    let allUsers = [];
    let supportEmails = [];
    let teams = [];
    let editingEmail = null;
    let newTeams = [];
    let newEmails = [];
    let editTeams = [];
    let editEmails = [];

    if (!token) window.location.href = '/admin';

    try {
        const stored = localStorage.getItem('user');
        if (stored) currentUser = JSON.parse(stored);
    } catch (e) {}

    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        document.querySelectorAll('.theme-toggle').forEach(t => t.textContent = theme === 'dark' ? '☀️' : '🌙');
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        setTheme(current === 'light' ? 'dark' : 'light');
    }

    setTheme(localStorage.getItem('theme') || 'light');

    function canManageUsers() {
        if (!currentUser) return false;
        return ['admin', 'manager', 'tl'].includes(currentUser.role);
    }

    function canCreateUsers() {
        if (!currentUser) return false;
        return ['admin', 'manager'].includes(currentUser.role);
    }

    function canEditUser(targetUser) {
        if (!currentUser) return false;
        if (targetUser.email === 'admin@dornori.com' && currentUser.role !== 'admin') return false;
        if (currentUser.role === 'admin') return true;
        if (currentUser.role === 'manager') return targetUser.role !== 'admin';
        if (currentUser.role === 'tl') return currentUser.team_id && targetUser.team_id === currentUser.team_id && targetUser.role === 'agent';
        return false;
    }

    function canDeleteUser(targetUser) {
        if (!currentUser) return false;
        if (targetUser.email === 'admin@dornori.com') return false;
        return currentUser.role === 'admin';
    }

    function getViewableUsers() {
        if (!currentUser) return [];
        if (currentUser.role === 'admin') return allUsers;
        if (currentUser.role === 'manager') return allUsers.filter(u => u.role !== 'admin');
        if (currentUser.role === 'tl') return allUsers.filter(u => u.team_id === currentUser.team_id);
        return [currentUser];
    }

    function checkPermission() {
        if (!canManageUsers()) {
            document.getElementById('permDenied').style.display = 'block';
            document.getElementById('usersApp').style.display = 'none';
            return false;
        }
        document.getElementById('permDenied').style.display = 'none';
        document.getElementById('usersApp').style.display = 'block';
        return true;
    }

    async function loadData() {
        if (!checkPermission()) return;

        try {
            const usersRes = await fetch(API_BASE + '/api/admin/users', {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (usersRes.status === 401 || usersRes.status === 403) {
                localStorage.removeItem('token');
                window.location.href = '/admin';
                return;
            }

            const usersData = await usersRes.json();
            if (usersData.success) {
                allUsers = usersData.users || [];
            }

            const settingsRes = await fetch(API_BASE + '/api/admin/settings', {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (settingsRes.ok) {
                const settingsData = await settingsRes.json();
                if (settingsData.success) {
                    supportEmails = settingsData.support_emails || [];
                    teams = settingsData.teams || [];
                }
            }

            renderUI();
            renderUsers();
        } catch (e) {
            document.getElementById('usersTableContainer').innerHTML = '<div class="error">Error loading data: ' + e.message + '</div>';
        }
    }

    function renderUI() {
        document.getElementById('addUserBtn').style.display = canCreateUsers() ? 'block' : 'none';
        renderLanguageCheckboxes('newLanguages');
        renderLanguageCheckboxes('editLanguages');
        renderEmailCheckboxes('newEmails');
        renderEmailCheckboxes('editEmails');
        renderTeamSelect('newTeamId');
        renderTeamSelect('editTeamId');
    }

    function renderLanguageCheckboxes(containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = Object.entries(LANGUAGES).map(([code, name]) => `
            <div class="lang-checkbox">
                <input type="checkbox" id="${containerId}_${code}" value="${code}" />
                <label for="${containerId}_${code}">${name}</label>
            </div>
        `).join('');
    }

    function renderEmailCheckboxes(containerId) {
        const container = document.getElementById(containerId);
        if (supportEmails.length === 0) {
            container.innerHTML = '<div style="font-size:12px;color:var(--text-muted)">No support emails configured. Add one below.</div>';
            return;
        }
        container.innerHTML = supportEmails.map(email => `
            <div class="email-checkbox">
                <input type="checkbox" value="${email}" />
                <label>${email}</label>
            </div>
        `).join('');
    }

    function renderTeamSelect(selectId) {
        const select = document.getElementById(selectId);
        select.innerHTML = '<option value="">— Select Team —</option>' + 
            teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('') +
            newTeams.map(t => `<option value="${t}" style="font-style:italic">[NEW] ${t}</option>`).join('');
    }

    function renderUsers() {
        const viewable = getViewableUsers();
        if (viewable.length === 0) {
            document.getElementById('usersTableContainer').innerHTML = '<div class="loading">No users to display</div>';
            return;
        }

        let html = '<table class="users-table"><thead><tr>';
        html += '<th>Email</th><th>Name</th><th>Role</th><th>Languages</th>';
        if (['admin', 'manager'].includes(currentUser.role)) html += '<th>Team</th>';
        if (supportEmails.length > 0) html += '<th>Emails</th>';
        html += '<th style="width:140px">Actions</th></tr></thead><tbody>';

        viewable.forEach(u => {
            const canEdit = canEditUser(u);
            const canDelete = canDeleteUser(u);
            const teamName = teams.find(t => t.id === u.team_id)?.name || u.team_id || '-';

            html += '<tr>';
            html += `<td><strong>${u.email}</strong></td>`;
            html += `<td>${u.name || '-'}</td>`;
            html += `<td><span class="role-badge ${u.role}">${u.role.toUpperCase()}</span></td>`;
            html += `<td><span class="langs-cell">${(u.allowed_languages || ['en']).join(', ')}</span></td>`;
            if (['admin', 'manager'].includes(currentUser.role)) html += `<td><span class="langs-cell">${teamName}</span></td>`;
            if (supportEmails.length > 0) {
                const userEmails = u.allowed_emails || [];
                html += `<td><span class="langs-cell">${userEmails.length > 0 ? userEmails.length + ' email(s)' : '-'}</span></td>`;
            }
            html += '<td>';
            if (canEdit) html += `<button class="action-btn" onclick="openEditUserModal('${u.email}')">Edit</button>`;
            if (canDelete) html += `<button class="action-btn delete" onclick="deleteUser('${u.email}')">Delete</button>`;
            html += '</td></tr>';
        });

        html += '</tbody></table>';
        document.getElementById('usersTableContainer').innerHTML = html;
    }

    function updateRoleInfo() {
        const role = document.getElementById('newRole').value;
        document.getElementById('roleInfo').textContent = ROLE_DESCRIPTIONS[role] || '';
        const teamGroup = document.getElementById('newTeamGroup');
        const emailsGroup = document.getElementById('newEmailsGroup');
        teamGroup.style.display = ['tl', 'agent'].includes(role) ? 'block' : 'none';
        emailsGroup.style.display = ['agent', 'tl', 'manager'].includes(role) ? 'block' : 'none';
    }

    function updateEditRoleInfo() {
        const role = document.getElementById('editRole').value;
        document.getElementById('editRoleInfo').textContent = ROLE_DESCRIPTIONS[role] || '';
        const teamGroup = document.getElementById('editTeamGroup');
        const emailsGroup = document.getElementById('editEmailsGroup');
        teamGroup.style.display = ['tl', 'agent'].includes(role) ? 'block' : 'none';
        emailsGroup.style.display = ['agent', 'tl', 'manager'].includes(role) ? 'block' : 'none';
    }

    function createNewTeam() {
        const input = document.getElementById('newTeamName');
        const name = input.value.trim();
        if (!name) return;
        if (newTeams.includes(name)) { alert('Team already added'); return; }
        newTeams.push(name);
        input.value = '';
        renderTeamSelect('newTeamId');
        renderNewTeamsList();
    }

    function createNewTeamEdit() {
        const input = document.getElementById('editTeamName');
        const name = input.value.trim();
        if (!name) return;
        if (editTeams.includes(name) || newTeams.includes(name)) { alert('Team already added'); return; }
        editTeams.push(name);
        input.value = '';
        renderTeamSelect('editTeamId');
        renderEditTeamsList();
    }

    function addNewEmail() {
        const input = document.getElementById('newEmailAddr');
        const email = input.value.trim();
        if (!email || !email.includes('@')) { alert('Invalid email'); return; }
        if (newEmails.includes(email) || supportEmails.includes(email)) { alert('Email already exists'); return; }
        newEmails.push(email);
        input.value = '';
        renderEmailCheckboxes('newEmails');
        renderNewEmailsList();
    }

    function addNewEmailEdit() {
        const input = document.getElementById('editEmailAddr');
        const email = input.value.trim();
        if (!email || !email.includes('@')) { alert('Invalid email'); return; }
        if (editEmails.includes(email) || newEmails.includes(email) || supportEmails.includes(email)) { alert('Email already exists'); return; }
        editEmails.push(email);
        input.value = '';
        renderEmailCheckboxes('editEmails');
        renderEditEmailsList();
    }

    function renderNewTeamsList() {
        const container = document.getElementById('newTeamsList');
        if (newTeams.length === 0) { container.innerHTML = ''; return; }
        container.innerHTML = '<div style="margin-top:8px">' + newTeams.map(t => `
            <span class="item-tag">[NEW] ${t}<button onclick="removeNewTeam('${t}')">✕</button></span>
        `).join('') + '</div>';
    }

    function renderEditTeamsList() {
        const container = document.getElementById('editTeamsList');
        if (editTeams.length === 0) { container.innerHTML = ''; return; }
        container.innerHTML = '<div style="margin-top:8px">' + editTeams.map(t => `
            <span class="item-tag">[NEW] ${t}<button onclick="removeEditTeam('${t}')">✕</button></span>
        `).join('') + '</div>';
    }

    function renderNewEmailsList() {
        const container = document.getElementById('newEmailsList');
        if (newEmails.length === 0) { container.innerHTML = ''; return; }
        container.innerHTML = '<div style="margin-top:8px">' + newEmails.map(e => `
            <span class="item-tag">[NEW] ${e}<button onclick="removeNewEmail('${e}')">✕</button></span>
        `).join('') + '</div>';
    }

    function renderEditEmailsList() {
        const container = document.getElementById('editEmailsList');
        if (editEmails.length === 0) { container.innerHTML = ''; return; }
        container.innerHTML = '<div style="margin-top:8px">' + editEmails.map(e => `
            <span class="item-tag">[NEW] ${e}<button onclick="removeEditEmail('${e}')">✕</button></span>
        `).join('') + '</div>';
    }

    function removeNewTeam(name) { newTeams = newTeams.filter(t => t !== name); renderTeamSelect('newTeamId'); renderNewTeamsList(); }
    function removeEditTeam(name) { editTeams = editTeams.filter(t => t !== name); renderTeamSelect('editTeamId'); renderEditTeamsList(); }
    function removeNewEmail(email) { newEmails = newEmails.filter(e => e !== email); renderEmailCheckboxes('newEmails'); renderNewEmailsList(); }
    function removeEditEmail(email) { editEmails = editEmails.filter(e => e !== email); renderEmailCheckboxes('editEmails'); renderEditEmailsList(); }

    function openAddUserModal() {
        newTeams = [];
        newEmails = [];
        document.getElementById('newEmail').value = '';
        document.getElementById('newName').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('newRole').value = 'agent';
        document.getElementById('newTeamId').value = '';
        document.getElementById('newTeamName').value = '';
        document.getElementById('newEmailAddr').value = '';
        document.getElementById('addUserError').textContent = '';
        document.querySelectorAll('#newLanguages input').forEach(i => i.checked = false);
        document.querySelectorAll('#newEmails input').forEach(i => i.checked = false);
        renderNewTeamsList();
        renderNewEmailsList();
        updateRoleInfo();
        document.getElementById('addUserModal').classList.add('show');
    }

    function closeModal() {
        document.getElementById('addUserModal').classList.remove('show');
    }

    function openEditUserModal(email) {
        const user = allUsers.find(u => u.email === email);
        if (!user || !canEditUser(user)) return;

        editingEmail = email;
        editTeams = [];
        editEmails = [];
        document.getElementById('editEmail').value = user.email;
        document.getElementById('editName').value = user.name || '';
        document.getElementById('editRole').value = user.role;
        document.getElementById('editTeamId').value = user.team_id || '';
        document.getElementById('editTeamName').value = '';
        document.getElementById('editEmailAddr').value = '';
        document.getElementById('editUserError').textContent = '';

        document.querySelectorAll('#editLanguages input').forEach(i => i.checked = false);
        (user.allowed_languages || ['en']).forEach(lang => {
            const input = document.querySelector(`#editLanguages input[value="${lang}"]`);
            if (input) input.checked = true;
        });

        document.querySelectorAll('#editEmails input').forEach(i => i.checked = false);
        (user.allowed_emails || []).forEach(email => {
            const input = document.querySelector(`#editEmails input[value="${email}"]`);
            if (input) input.checked = true;
        });

        renderEditTeamsList();
        renderEditEmailsList();
        updateEditRoleInfo();
        document.getElementById('editUserModal').classList.add('show');
    }

    function closeEditModal() {
        document.getElementById('editUserModal').classList.remove('show');
        editingEmail = null;
    }

    async function addUser() {
        const email = document.getElementById('newEmail').value.trim();
        const name = document.getElementById('newName').value.trim();
        const password = document.getElementById('newPassword').value;
        const role = document.getElementById('newRole').value;
        const teamId = document.getElementById('newTeamId').value.trim() || null;
        const langs = Array.from(document.querySelectorAll('#newLanguages input:checked')).map(i => i.value);
        const emails = [...Array.from(document.querySelectorAll('#newEmails input:checked')).map(i => i.value), ...newEmails];

        const errorEl = document.getElementById('addUserError');
        errorEl.textContent = '';

        if (!email || !name || !password) { errorEl.textContent = 'All fields required'; return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errorEl.textContent = 'Invalid email'; return; }
        if (password.length < 8) { errorEl.textContent = 'Password min 8 chars'; return; }
        if (langs.length === 0) { errorEl.textContent = 'Select languages'; return; }
        if (['agent', 'tl'].includes(role) && emails.length === 0) { errorEl.textContent = 'Select/add email addresses'; return; }

        try {
            const res = await fetch(API_BASE + '/api/admin/users', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email, name, password, role,
                    allowed_languages: langs,
                    allowed_emails: emails,
                    team_id: teamId
                })
            });

            const data = await res.json();
            if (res.ok && data.success) {
                closeModal();
                loadData();
            } else {
                errorEl.textContent = data.error || 'Error adding user';
            }
        } catch (e) {
            errorEl.textContent = 'Network error';
        }
    }

    async function saveUser() {
        const name = document.getElementById('editName').value.trim();
        const role = document.getElementById('editRole').value;
        const teamId = document.getElementById('editTeamId').value.trim() || null;
        const langs = Array.from(document.querySelectorAll('#editLanguages input:checked')).map(i => i.value);
        const emails = [...Array.from(document.querySelectorAll('#editEmails input:checked')).map(i => i.value), ...editEmails];

        const errorEl = document.getElementById('editUserError');
        errorEl.textContent = '';

        if (!name) { errorEl.textContent = 'Name required'; return; }
        if (langs.length === 0) { errorEl.textContent = 'Select languages'; return; }
        if (['agent', 'tl'].includes(role) && emails.length === 0) { errorEl.textContent = 'Select/add email addresses'; return; }

        try {
            const res = await fetch(`${API_BASE}/api/admin/users/${encodeURIComponent(editingEmail)}`, {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name, role,
                    allowed_languages: langs,
                    allowed_emails: emails,
                    team_id: teamId
                })
            });

            const data = await res.json();
            if (res.ok && data.success) {
                closeEditModal();
                loadData();
            } else {
                errorEl.textContent = data.error || 'Error saving user';
            }
        } catch (e) {
            errorEl.textContent = 'Network error';
        }
    }

    async function deleteUser(email) {
        if (!confirm(`Delete user ${email}? This cannot be undone.`)) return;

        try {
            const res = await fetch(`${API_BASE}/api/admin/users/${encodeURIComponent(email)}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (res.ok) {
                loadData();
            } else {
                alert('Error deleting user');
            }
        } catch (e) {
            alert('Network error');
        }
    }

    loadData();
    window.setTheme = setTheme;
    window.toggleTheme = toggleTheme;
</script>
</body>
</html>
