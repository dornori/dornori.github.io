<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password – EdgeDesk</title>
    <link rel="stylesheet" href="style.css" />
    <script src="config.js"></script>
</head>
<body>
<div class="container">
    <div id="resetPassword">
        <h1 class="brand-logo"><span class="brand-icon">🔐</span><span class="brand-text">EdgeDesk</span></h1>

        <div id="rpForm">
            <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">Choose a new password for your account.</p>
            <input type="password" id="rpPassword1" placeholder="New password (min. 8 characters)" />
            <input type="password" id="rpPassword2" placeholder="Confirm new password" />
            <button onclick="submitReset()">Set new password</button>
            <div id="rpError" class="error"></div>
            <div id="rpLoading" class="loading">⏳ Updating password...</div>
        </div>

        <div id="rpSuccess" style="display:none;text-align:center;">
            <p style="color:var(--text);">✅ Your password has been updated.</p>
            <a href="dashboard.html" style="color:var(--accent);font-weight:600;">Go to login →</a>
        </div>

        <div id="rpInvalid" style="display:none;text-align:center;">
            <p style="color:var(--error);">This reset link is invalid or has expired.</p>
            <a href="dashboard.html" style="color:var(--accent);font-weight:600;">Back to login</a>
        </div>
    </div>
</div>

<script>
    const API_BASE = getConfigValue('API_BASE', 'https://dornori-ticketing.dornori-info.workers.dev');
    const resetToken = new URLSearchParams(window.location.search).get('token');

    if (!resetToken) {
        document.getElementById('rpForm').style.display = 'none';
        document.getElementById('rpInvalid').style.display = 'block';
    }

    async function submitReset() {
        var p1 = document.getElementById('rpPassword1').value;
        var p2 = document.getElementById('rpPassword2').value;
        var errorEl = document.getElementById('rpError');
        var loadingEl = document.getElementById('rpLoading');
        var btn = document.querySelector('#rpForm button');
        errorEl.textContent = '';

        if (!p1 || p1.length < 8) { errorEl.textContent = 'Password must be at least 8 characters.'; return; }
        if (p1 !== p2) { errorEl.textContent = 'Passwords do not match.'; return; }

        loadingEl.classList.add('active');
        btn.disabled = true;
        try {
            var res = await fetch(API_BASE + '/api/admin/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: resetToken, password: p1 })
            });
            var data = await res.json();
            if (res.ok && data.success) {
                document.getElementById('rpForm').style.display = 'none';
                document.getElementById('rpSuccess').style.display = 'block';
            } else {
                errorEl.textContent = data.error || 'This reset link is invalid or has expired.';
            }
        } catch (e) {
            errorEl.textContent = 'Network error – please try again.';
        } finally {
            loadingEl.classList.remove('active');
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
