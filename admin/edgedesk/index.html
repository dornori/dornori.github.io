<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Setup Test</title>
    <script>
    let API_BASE = '';
    fetch('config.json')
      .then(r => r.json())
      .then(c => { API_BASE = c.API_BASE; console.log('API_BASE:', API_BASE); test(); })
      .catch(e => { console.error('config error:', e); });
    
    async function test() {
        console.log('Testing with API_BASE:', API_BASE);
        try {
            const res = await fetch(API_BASE + '/api/setup/status');
            const data = await res.json();
            console.log('Status:', data);
            document.body.innerHTML = '<h1>' + (data.setupComplete ? 'SETUP COMPLETE' : 'NEEDS SETUP') + '</h1>';
        } catch(e) {
            document.body.innerHTML = '<h1>ERROR: ' + e.message + '</h1>';
            console.error(e);
        }
    }
    </script>
</head>
<body><h1>Loading...</h1></body>
</html>
