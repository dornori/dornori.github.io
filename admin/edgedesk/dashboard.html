<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dornori Ticketing</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
    <div id="login">
        <h1>🔐 Dornori Ticketing</h1>
        <input type="email" id="loginEmail" placeholder="Email" />
        <input type="password" id="loginPassword" placeholder="Enter your password">
        <button onclick="login()">Login</button>
        <div id="loginError" class="error"></div>
        <div id="loginLoading" class="loading">⏳ Logging in...</div>
    </div>

    <div id="dashboard" style="display:none;">
        <div class="header">
            <h1>🎫 Dornori Ticketing <span id="wsIndicator" style="font-size:12px;font-weight:400;color:var(--text-muted);"></span></h1>
            <div class="header-right">
                <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
                <a id="nav-reports" href="reports.html" style="display:none;">📊 Reports</a>
                <a id="nav-newsletter" href="newsletter.html" style="display:none;">📧 Newsletter</a>
                <a id="nav-settings" href="settings.html" style="display:none;">⚙️ Settings</a>
                <a id="nav-users" href="users.html" style="display:none;">👥 Users</a>
                <button id="purgeCacheBtn" onclick="purgeTicketCacheClick()" style="display:none;">🗑️ Purge Cache</button>
                <div id="userDisplay"></div>
                <button onclick="logout()">Logout</button>
            </div>
        </div>

        <div id="notificationBanner" class="notification-permission-banner">
            ⚠️ Notifications are blocked. 
            <button onclick="requestNotificationPermission()">Enable Notifications</button>
        </div>

        <div class="stats" id="stats"></div>

        <div class="ticket-tabs">
            <button class="ticket-tab active" data-tab="active" onclick="switchTab('active')">Active</button>
            <button class="ticket-tab" data-tab="resolved" onclick="switchTab('resolved')">Resolved</button>
            <button class="ticket-tab" data-tab="closed" onclick="switchTab('closed')">Closed</button>
        </div>

        <div class="filters">
            <input type="text" id="filterSearch" placeholder="Search # / sender / subject..." onkeydown="if(event.key==='Enter') resetAndLoad()" style="flex:1;min-width:180px;" />
            <select id="filterLanguage" onchange="resetAndLoad()">
                <option value="">All Languages</option>
            </select>
            <select id="filterCategory" onchange="resetAndLoad()">
                <option value="">All Categories</option>
            </select>
            <select id="filterSort" onchange="resetAndLoad()">
                <option value="last_updated">Sort: Last Updated</option>
                <option value="created">Sort: Created Date</option>
                <option value="sla">Sort: SLA Status</option>
            </select>
            <select id="filterPageSize" onchange="currentLimit=parseInt(this.value);resetAndLoad()">
                <option value="25">25 / page</option>
                <option value="50">50 / page</option>
                <option value="100">100 / page</option>
            </select>
            <button class="btn-refresh" onclick="resetAndLoad()">⟳ Refresh</button>
        </div>

        <div id="ticketList" class="ticket-list"></div>
        <div id="paginationWrap" class="load-more-wrap"></div>
    </div>

    <!-- TICKET MODAL -->
    <div id="ticketModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div id="lockBanner" style="display:none;margin-bottom:14px;padding:10px 14px;border-radius:6px;background:#fef3c7;color:#92400e;font-size:13px;font-weight:600;"></div>
            <div id="modalContent"></div>
        </div>
    </div>
</div>

<div id="barToast" class="toast"></div>

<script>
    const API_BASE = 'https://dornori-ticketing.dornori-info.workers.dev';
    const WS_URL = 'wss://dornori-ticketing.dornori-info.workers.dev/api/admin/ws';
    
    let token = null;
    let currentUser = null;
    let currentTab = 'active';
    let currentLimit = 25;
    let currentPage = 1;
    let currentTotalPages = 1;
    let currentTotal = 0;
    let loadedTickets = [];
    let emailSenders = [];
    let allLanguages = [];
    let LANG_NAMES = {};
    let languagesLoaded = false;
    let categoriesLoaded = false;
    let allCategories = [];
    let isRefreshing = false;
    let userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    let currentModalTicketId = null;
    let ticketLockedByOther = false;
    let ticketLockedByInfo = null;
    let ticketLocks = {}; // Track all locked tickets: { ticketId: { email, name } }
    
    // ─── WEBSOCKET ──────────────────────────────────────────
    let ws = null;
    let wsReconnectTimer = null;

    function connectWebSocket() {
        if (!token) return;
        
        try {
            ws = new WebSocket(WS_URL + '?token=' + encodeURIComponent(token));
            
            ws.onopen = function() {
                console.log('🔌 WebSocket connected');
                document.getElementById('wsIndicator').textContent = '🟢 Live';
                document.getElementById('wsIndicator').style.color = '#22c55e';
            };
            
            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'pong') return;

                    if (data.type === 'ticket_locked' && data.ticket_id) {
                        ticketLocks[data.ticket_id] = data.locked_by || {};
                        if (currentModalTicketId === data.ticket_id && data.locked_by && data.locked_by.email !== (currentUser && currentUser.email)) {
                            ticketLockedByOther = true;
                            ticketLockedByInfo = data.locked_by;
                        }
                        renderTickets(loadedTickets);
                        return;
                    }

                    if (data.type === 'lock_sync') {
                        var newLocks = data.locks || {};
                        if (currentModalTicketId !== null) {
                            var stillLocked = newLocks[currentModalTicketId];
                            if (stillLocked && stillLocked.email !== (currentUser && currentUser.email)) {
                                ticketLockedByOther = true;
                                ticketLockedByInfo = stillLocked;
                            } else {
                                ticketLockedByOther = false;
                                ticketLockedByInfo = null;
                            }
                        }
                        ticketLocks = newLocks;
                        renderTickets(loadedTickets);
                        return;
                    }

                    if (data.type === 'ticket_unlocked' && data.ticket_id) {
                        delete ticketLocks[data.ticket_id];
                        if (currentModalTicketId === data.ticket_id) {
                            ticketLockedByOther = false;
                            ticketLockedByInfo = null;
                        }
                        renderTickets(loadedTickets);
                        return;
                    }

                    if ((data.type === 'new_ticket' || data.type === 'ticket_updated') && data.ticket) {
                        const t = data.ticket;
                        const isNew = data.type === 'new_ticket';
                        console.log((isNew ? '🎫 New ticket' : '✏️ Ticket updated') + ' via WebSocket:', t.ticket_number);
                        
                        const ticketObj = {
                            id: t.id || 0,
                            ticket_id: t.id || 0,
                            ticket_number: t.ticket_number,
                            category: t.category,
                            sla_status: t.sla_status,
                            status: t.status,
                            subject: t.subject,
                            sender_name: t.sender_name,
                            sender_email: t.sender_email || '',
                            last_updated_by: t.last_updated_by || '',
                            last_action: t.last_updated,
                            created_at: t.last_updated,
                            language: t.language || 'en'
                        };
                        
                        upsertTicketInList(ticketObj, isNew);

                        if (currentModalTicketId === ticketObj.ticket_id) {
                            openTicketModal(ticketObj.ticket_id, true);
                        }
                        
                        if (isNew) {
                            showToast('🎫 New Ticket', '#' + t.ticket_number + ' - ' + (t.subject || 'No subject'), 'success');
                        } else {
                            showToast('✏️ Ticket Updated', '#' + t.ticket_number + ' - ' + (t.subject || 'No subject'), 'info');
                        }
                        
                        try {
                            if (Notification.permission === 'granted') {
                                new Notification((isNew ? '🎫 New Ticket #' : '✏️ Ticket Updated #') + t.ticket_number, {
                                    body: t.subject || (isNew ? 'New ticket arrived' : 'Ticket was updated'),
                                    icon: '/favicon.ico'
                                });
                            }
                        } catch(e) {}
                        
                        loadStats();
                    }
                } catch(e) {
                    console.warn('WebSocket message parse error:', e.message);
                }
            };
            
            ws.onclose = function(event) {
                console.log('🔌 WebSocket closed:', event.code);
                document.getElementById('wsIndicator').textContent = '🔴 Offline';
                document.getElementById('wsIndicator').style.color = '#ef4444';
                ws = null;
                
                if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
                wsReconnectTimer = setTimeout(connectWebSocket, 5000);
            };
            
            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
            };
            
            const pingInterval = setInterval(function() {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'ping' }));
                } else {
                    clearInterval(pingInterval);
                }
            }, 30000);
            
        } catch(e) {
            console.error('WebSocket connection failed:', e.message);
            if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
            wsReconnectTimer = setTimeout(connectWebSocket, 5000);
        }
    }

    function disconnectWebSocket() {
        if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
        if (ws) {
            ws.onclose = null;
            ws.close();
            ws = null;
        }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  PERMISSION SERVICE - UNIFIED
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const PermissionService = {
        updateUI() {
            this.updateNavigation();
        },

        can(action, page = 'tickets') {
            if (!currentUser) return false;
            if (currentUser.role === 'admin') return true;
            
            // Map UI actions to permission keys
            const actionMap = {
                'view': 'view',
                'edit': 'edit',
                'update': 'edit',
                'create': 'create',
                'delete': 'delete',
                'comment': 'edit',
                'reply': 'edit',
                'assign': 'edit'
            };
            
            const pagePerms = currentUser.page_permissions || {};
            const perms = pagePerms[page] || {};
            const mappedAction = actionMap[action] || action;
            return perms[mappedAction] === true;
        },

        hasPageAccess(page) {
            if (!currentUser) return false;
            if (currentUser.role === 'admin') return true;
            const pagePerms = currentUser.page_permissions || {};
            const perms = pagePerms[page] || {};
            return perms.view === true;
        },

        updateNavigation() {
            const navs = [
                { id: 'nav-reports', page: 'reports' },
                { id: 'nav-newsletter', page: 'newsletter' },
                { id: 'nav-settings', page: 'settings' },
                { id: 'nav-users', page: 'users' }
            ];
            
            for (const nav of navs) {
                const el = document.getElementById(nav.id);
                if (el) {
                    el.style.display = this.hasPageAccess(nav.page) ? '' : 'none';
                }
            }
            const purgeBtn = document.getElementById('purgeCacheBtn');
            if (purgeBtn) purgeBtn.style.display = (currentUser && currentUser.role === 'admin') ? '' : 'none';
        }
    };

    // ─── PERMISSION HELPERS ──────────────────────────────────
    function canEdit() {
        if (!currentUser) return false;
        if (currentUser.role === 'admin') return true;
        const perms = currentUser.page_permissions?.tickets || {};
        return perms.edit === true;
    }

    function canCreate() {
        if (!currentUser) return false;
        if (currentUser.role === 'admin') return true;
        const perms = currentUser.page_permissions?.tickets || {};
        return perms.create === true;
    }

    function canDelete() {
        if (!currentUser) return false;
        if (currentUser.role === 'admin') return true;
        const perms = currentUser.page_permissions?.tickets || {};
        return perms.delete === true;
    }

    function disableIfNoPermission(button, canDo) {
        if (!canDo) {
            button.disabled = true;
            button.title = 'Permission denied';
            button.style.opacity = '0.5';
            button.style.cursor = 'not-allowed';
        }
        return button;
    }

    function showToast(title, message, type = 'info') {
        const toast = document.createElement('div');
        toast.className = 'notification-toast';
        const colors = {
            info: 'var(--accent)',
            success: '#22c55e',
            error: '#ef4444',
            warning: '#f59e0b'
        };
        toast.style.borderLeftColor = colors[type] || colors.info;
        toast.innerHTML = `
            <button class="close-toast" onclick="this.parentElement.remove()">×</button>
            <h4>${title}</h4>
            <p>${message}</p>
        `;
        document.body.appendChild(toast);
        setTimeout(() => {
            if (toast.parentElement) toast.remove();
        }, 8000);
    }

    let barToastTimer;
    function barToast(msg, type = 'success') {
        const el = document.getElementById('barToast');
        el.innerHTML = msg;
        el.className = 'toast show ' + type;
        clearTimeout(barToastTimer);
        barToastTimer = setTimeout(() => el.classList.remove('show'), type === 'warning' ? 8000 : 3500);
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  SHARED CONFIG VERSION CACHE
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function extractLanguages(res) {
        try {
            return JSON.parse((res.settings && res.settings.find(s => s.category === 'languages' && s.key === 'list')?.value) || '[]');
        } catch (e) { return []; }
    }
    function extractCategories(res) {
        const cats = new Set();
        (res.settings || []).forEach(s => {
            if (s.category === 'category' && s.key.endsWith('_description') && s.value !== '__deleted__') {
                cats.add(s.key.replace('_description', ''));
            }
        });
        return Array.from(cats);
    }
    async function loadAppConfig(forceFresh = false) {
        if (!forceFresh) {
            const cached = localStorage.getItem('appConfig');
            const cachedVersion = localStorage.getItem('appConfigVersion');
            if (cached && cachedVersion) {
                checkForConfigUpdate(cachedVersion);
                return JSON.parse(cached);
            }
        }
        const res = await fetch(API_BASE + "/api/admin/settings", {
            headers: { "Authorization": "Bearer " + token }
        }).then(r => r.json());
        const config = {
            languages: extractLanguages(res),
            categories: extractCategories(res),
            version: (res.data && res.data.system && res.data.system.config_version) || '0'
        };
        localStorage.setItem('appConfig', JSON.stringify(config));
        localStorage.setItem('appConfigVersion', config.version);
        return config;
    }
    async function checkForConfigUpdate(cachedVersion) {
        try {
            const res = await fetch(API_BASE + "/api/admin/config-version", {
                headers: { "Authorization": "Bearer " + token }
            }).then(r => r.json());
            if (res.version && res.version !== cachedVersion) {
                barToast("Configuration was updated by admin. Please <a href='#' onclick='logout()'>re-login</a> to see changes.", "warning");
                localStorage.setItem('appConfigVersion', res.version);
            }
        } catch (e) {}
    }
    let _configPromise = null;
    function getSharedConfig(forceFresh) {
        if (forceFresh || !_configPromise) {
            _configPromise = loadAppConfig(forceFresh).finally(() => { _configPromise = null; });
        }
        return _configPromise;
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  LOAD LANGUAGES FROM SETTINGS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function loadLanguagesFromSettings() {
        try {
            if (currentUser.role !== 'admin') {
                const userLangs = currentUser.allowed_languages || [];
                allLanguages = userLangs.length ? userLangs.map(code => ({ code, name: LANG_NAMES[code] || code })) : [];
            } else {
                const config = await getSharedConfig();
                allLanguages = config.languages || [];
                LANG_NAMES = {};
                allLanguages.forEach(lang => { LANG_NAMES[lang.code] = lang.name; });
            }
            languagesLoaded = true;
            applyUserLanguageFilter();
        } catch (e) {
            console.error('Failed to load languages:', e);
            allLanguages = [];
            languagesLoaded = true;
            applyUserLanguageFilter();
        }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  LOAD CATEGORIES FROM USER PROFILE
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function loadCategoriesFromSettings() {
        try {
            if (currentUser.role !== 'admin') {
                allCategories = (currentUser.allowed_categories || []).sort();
            } else {
                const config = await getSharedConfig();
                allCategories = (config.categories || []).sort();
            }
            categoriesLoaded = true;
            updateCategoryDropdown();
        } catch (e) {
            console.error('Failed to load categories:', e);
            allCategories = [];
            categoriesLoaded = true;
            updateCategoryDropdown();
        }
    }

    function updateCategoryDropdown() {
        const sel = document.getElementById('filterCategory');
        if (!sel) return;
        
        let opts = '<option value="">All Categories</option>';
        for (const cat of allCategories) {
            const label = cat.charAt(0).toUpperCase() + cat.slice(1);
            opts += '<option value="' + cat + '">' + label + '</option>';
        }
        sel.innerHTML = opts;
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  INIT & STORAGE
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    window.addEventListener('load', async function() {
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        
        const savedToken = localStorage.getItem('token');
        const savedUser = localStorage.getItem('user');
        
        if (savedToken && savedUser) {
            try {
                token = savedToken;
                currentUser = JSON.parse(savedUser);
                
                if (currentUser) {
                    document.getElementById('login').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    await refreshCurrentUser();
                    PermissionService.updateUI();
                    updateUserDisplay();
                    
                    loadEmailSenders();
                    
                    Promise.all([
                        loadLanguagesFromSettings(),
                        loadCategoriesFromSettings()
                    ]).then(() => {
                        loadStats();
                        resetAndLoad();
                        connectWebSocket();
                        checkNotificationBanner();
                    });
                }
            } catch (e) {
                console.error('Failed to restore session:', e);
                localStorage.removeItem('token');
                localStorage.removeItem('user');
            }
        }
    });

    async function refreshCurrentUser() {
        try {
            const res = await fetch(API_BASE + "/api/admin/me", {
                headers: { "Authorization": "Bearer " + token }
            });
            if (!res.ok) return;
            const data = await res.json();
            if (data.success && data.user) {
                currentUser = {
                    email: data.user.email,
                    name: data.user.name,
                    role: data.user.role,
                    page_permissions: data.user.page_permissions || {},
                    allowed_languages: data.user.allowed_languages || [],
                    allowed_emails: data.user.allowed_emails || [],
                    allowed_categories: data.user.allowed_categories || [],
                    team_id: data.user.team_id || null
                };
                localStorage.setItem('user', JSON.stringify(currentUser));
            }
        } catch (e) {
            console.warn('Could not refresh permissions:', e.message);
        }
    }

    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        setTheme(current === 'light' ? 'dark' : 'light');
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  AUTHENTICATION
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function login() {
        var email = document.getElementById("loginEmail").value;
        var password = document.getElementById("loginPassword").value;
        var errorEl = document.getElementById("loginError");
        var loadingEl = document.getElementById("loginLoading");
        var btn = document.querySelector("#login button");
        errorEl.textContent = "";
        loadingEl.classList.add("active");
        btn.disabled = true;
        btn.textContent = "🔐 Logging in...";
        
        try {
            var res = await fetch(API_BASE + "/api/admin/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email, password: password })
            });
            var data = await res.json();
            if (data.success) {
                token = data.token;
                currentUser = {
                    email: data.user.email,
                    name: data.user.name,
                    role: data.user.role,
                    page_permissions: data.user.page_permissions || {},
                    allowed_languages: data.user.allowed_languages || [],
                    allowed_emails: data.user.allowed_emails || [],
                    allowed_categories: data.user.allowed_categories || [],
                    team_id: data.user.team_id || null
                };
                localStorage.setItem("token", token);
                localStorage.setItem("user", JSON.stringify(currentUser));
                console.log('✅ Login successful for:', email, 'Role:', currentUser.role);
                
                PermissionService.updateUI();
                updateUserDisplay();

    async function loadEmailSenders() {
        try {
            try {
                const profileRes = await fetch(API_BASE + '/api/admin/user-profile', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (profileRes.ok) {
                    const profileData = await profileRes.json();
                    if (profileData.success && profileData.user) {
                        currentUser.allowed_emails = profileData.user.allowed_emails || [];
                        currentUser.allowed_languages = profileData.user.allowed_languages || [];
                        currentUser.allowed_categories = profileData.user.allowed_categories || [];
                        localStorage.setItem('user', JSON.stringify(currentUser));
                    }
                }
            } catch (e) {
                console.warn('Could not refresh profile, using cached data');
            }
            
            if (currentUser.role !== 'admin') {
                emailSenders = currentUser.allowed_emails || [];
                return;
            }
            
            const res = await fetch(API_BASE + "/api/admin/email-addresses?active_only=true", {
                headers: { "Authorization": "Bearer " + token }
            });
            
            if (!res.ok) {
                emailSenders = [];
                return;
            }
            
            const data = await res.json();
            if (data.success) {
                const allAddresses = data.addresses || [];
                emailSenders = allAddresses
                    .map(addr => addr.address || addr.email)
                    .filter(e => e);
            } else {
                emailSenders = [];
            }
        } catch (e) {
            console.error('Failed to load senders:', e);
            emailSenders = [];
        }

    async function loadTickets(goToPage) {
        var list = document.getElementById("ticketList");
        var pagWrap = document.getElementById("paginationWrap");

        if (goToPage) currentPage = goToPage;
        else currentPage = 1;

        list.innerHTML = '<div class="loading">Loading...</div>';
        pagWrap.innerHTML = '';

        var category = document.getElementById("filterCategory").value;
        var language = document.getElementById("filterLanguage").value;
        var sort = document.getElementById("filterSort").value;
        var search = document.getElementById("filterSearch").value.trim();
        var statuses = getStatusesForTab(currentTab);

        var url = API_BASE + "/api/admin/tickets?page=" + currentPage + "&limit=" + currentLimit;
        if (statuses.length > 0) {
            url += "&statuses=" + statuses.join(',');
        }
        if (category) url += "&category=" + encodeURIComponent(category);
        if (language) url += "&language=" + encodeURIComponent(language);
        if (sort) url += "&sort=" + encodeURIComponent(sort);
        if (search) url += "&search=" + encodeURIComponent(search);

        try {
            var res = await fetch(url, { headers: { "Authorization": "Bearer " + token } });
            if (res.status === 401) { logout(); return; }
            var data = await res.json();
            if (data.success) {
                var tickets = data.tickets || [];
                var pagination = data.pagination || { total: 0, page: 1, totalPages: 1 };
                currentTotal = pagination.total;
                currentPage = pagination.page;
                currentTotalPages = pagination.totalPages;

                loadedTickets = tickets;

                renderTickets(loadedTickets);
                updatePagination();
            } else {
                list.innerHTML = '<div class="loading">Error loading tickets</div>';
            }
        } catch (e) {
            list.innerHTML = '<div class="loading">Error: ' + e.message + '</div>';
        }
    }

    function renderTickets(tickets) {
        var list = document.getElementById("ticketList");

                '<span class="ticket-num">' + escapeHtml(t.ticket_number || '') + '</span>' +
                '<span class="status ' + statusClass + '">' + t.status.replace('_', ' ') + '</span>' +
                '<span class="cat-cell"><span class="cat-dot" style="background:' + catColor + ';"></span><span class="cat-name">' + escapeHtml(catLabel) + '</span></span>' +
                '<span class="email" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;">' + (t.sender_email || "") + '</span>' +
                '<span class="subject" title="' + escapeHtml(subjectText) + '">' + escapeHtml(truncatedSubject) + '</span>' +
                '<span style="font-size:12px;color:var(--text-muted);">' + formatDate(actionDate) + '</span>' +

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  TARGETED TICKET INJECTION
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function ticketMatchesCurrentFilters(t) {
        var statuses = getStatusesForTab(currentTab);
        if (statuses.length > 0 && statuses.indexOf(t.status) === -1) return false;
        var category = document.getElementById("filterCategory").value;
        var language = document.getElementById("filterLanguage").value;
        if (category && t.category !== category) return false;
        if (language && t.language !== language) return false;
        return true;
    }

    function parseTicketDate(dateStr) {
        if (!dateStr) return 0;
        var cleaned = ('' + dateStr).replace(' ', 'T');
        if (!cleaned.includes('Z') && !cleaned.includes('+')) { cleaned += 'Z'; }
        var d = new Date(cleaned);
        return isNaN(d.getTime()) ? 0 : d.getTime();
    }

    var SLA_SORT_RANK = { breached: 0, critical: 1, at_risk: 2, paused: 3, on_track: 4 };
    function compareTickets(a, b, sort) {
        if (sort === 'sla') {
            var ra = SLA_SORT_RANK.hasOwnProperty(a.sla_status) ? SLA_SORT_RANK[a.sla_status] : 5;
            var rb = SLA_SORT_RANK.hasOwnProperty(b.sla_status) ? SLA_SORT_RANK[b.sla_status] : 5;
            if (ra !== rb) return ra - rb;
            return parseTicketDate(b.last_action || b.created_at) - parseTicketDate(a.last_action || a.created_at);
        }
        if (sort === 'created') {
            return parseTicketDate(b.created_at) - parseTicketDate(a.created_at);
        }
        return parseTicketDate(b.last_action || b.created_at) - parseTicketDate(a.last_action || a.created_at);
    }

    function upsertTicketInList(ticket, isNew) {
        var existingIdx = loadedTickets.findIndex(function (t) { return t.ticket_id === ticket.ticket_id; });
        if (existingIdx !== -1) loadedTickets.splice(existingIdx, 1);

        if (!ticketMatchesCurrentFilters(ticket)) {
            renderTickets(loadedTickets);
            return;
        }

        var sort = document.getElementById("filterSort").value || 'last_updated';
        var insertAt = loadedTickets.length;
        for (var i = 0; i < loadedTickets.length; i++) {
            if (compareTickets(ticket, loadedTickets[i], sort) < 0) { insertAt = i; break; }
        }

        if (insertAt >= loadedTickets.length && loadedTickets.length > 0) return;

        loadedTickets.splice(insertAt, 0, ticket);
        if (isNew && existingIdx === -1) { currentTotal += 1; }
        renderTickets(loadedTickets);
        updatePagination();
    }

    function updatePagination() {
        const pagWrap = document.getElementById('paginationWrap');
        if (currentTotal === 0) { pagWrap.innerHTML = ''; return; }
        var prevDisabled = currentPage <= 1 ? 'disabled' : '';
        var nextDisabled = currentPage >= currentTotalPages ? 'disabled' : '';
        pagWrap.innerHTML =
            '<div style="display:flex;align-items:center;justify-content:center;gap:12px;">' +
            '<button ' + prevDisabled + ' onclick="loadTickets(currentPage-1)">‹ Previous</button>' +
            '<span style="color:var(--text-muted);font-size:13px;">Page ' + currentPage + ' of ' + currentTotalPages + ' (' + currentTotal + ' tickets)</span>' +
            '<button ' + nextDisabled + ' onclick="loadTickets(currentPage+1)">Next ›</button>' +
            '</div>';
    }

    var CAT_COLORS = ["#5aa9ff","#ffb347","#a78bfa","#34d399","#f87171","#fbbf24","#60a5fa","#4ade80","#fb923c","#c084fc"];
    var catColorMap = {};
    var catColorIdx = 0;
    function getCatColor(cat) {
        if (!cat || cat.trim() === '') return "#8892b0";
        if (!catColorMap[cat]) { catColorMap[cat] = CAT_COLORS[catColorIdx % CAT_COLORS.length]; catColorIdx++; }
        return catColorMap[cat];
    }
    function getSlaColor(cls) {
        var map = {
            'sla-on-track': '#22c55e',
            'sla-at-risk':  '#eab308',
            'sla-critical': '#f97316',
            'sla-breached': '#ef4444',
            'sla-paused':   '#8892b0'
        };
        return map[cls] || '#8892b0';
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    //  MODAL
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function openModal() {
        document.getElementById("ticketModal").classList.add("active");
        document.body.style.overflow = "hidden";
    }

    function releaseTicketLock(id, useBeacon) {
        if (!id) return;
        var url = API_BASE + "/api/admin/ticket/" + id + "/unlock";
        if (useBeacon && navigator.sendBeacon) {
            try {
                navigator.sendBeacon(url, new Blob([JSON.stringify({ token: token })], { type: "text/plain" }));
                return;
            } catch (e) {}
        }
        try {
            fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
                keepalive: true
            }).catch(function(){});
        } catch (e) {}
    }

    function closeModal() {
        document.getElementById("ticketModal").classList.remove("active");
        document.body.style.overflow = "";
        if (currentModalTicketId) {
            releaseTicketLock(currentModalTicketId, true);
        }
        currentModalTicketId = null;
        ticketLockedByOther = false;
        ticketLockedByInfo = null;
    }

    document.getElementById("ticketModal").addEventListener("click", function(e) {
        if (e.target === this) { closeModal(); }
    });
    document.addEventListener("keydown", function(e) {
        if (e.key === "Escape") { closeModal(); }
    });
    window.addEventListener("beforeunload", function() {
        if (currentModalTicketId) releaseTicketLock(currentModalTicketId, true);
    });

    function applyLockStateToModal() {
        return;
    }

    async function openTicketModal(id, isRefresh) {
        if (!isRefresh) {
            if (currentModalTicketId && currentModalTicketId !== id) releaseTicketLock(currentModalTicketId);
            currentModalTicketId = id;
            ticketLockedByOther = false;
            ticketLockedByInfo = null;

            try {
                var lockRes = await fetch(API_BASE + "/api/admin/ticket/" + id + "/lock", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token }
                });
                if (lockRes.status === 401) { logout(); return; }
                var lockData = await lockRes.json();
                if (!lockData.success && lockData.locked_by) {
                    ticketLockedByOther = true;
                    ticketLockedByInfo = lockData.locked_by;
                    currentModalTicketId = null;
                    if (currentUser && currentUser.role === 'admin') {
                        var proceedForce = confirm('This ticket is locked by ' + (lockData.locked_by.name || lockData.locked_by.email) + '. Force unlock and open it?');
                        if (proceedForce) {
                            await fetch(API_BASE + "/api/admin/ticket/" + id + "/unlock", {
                                method: "POST",
                                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token }
                            }).catch(function(){});
                            return openTicketModal(id, isRefresh);
                        }
                    }
                    showToast('🔒 Ticket Locked', 'This ticket is being edited by ' + (lockData.locked_by.name || lockData.locked_by.email), 'warning');
                    return;
                }
            } catch (e) {
                showToast('❌ Error', 'Failed to lock ticket', 'error');
                return;
            }
            
            openModal();
            var content = document.getElementById("modalContent");
            content.innerHTML = '<div class="loading">Loading...</div>';
        }

        var content = document.getElementById("modalContent");
        try {
            var res = await fetch(API_BASE + "/api/admin/ticket/" + id, {
                headers: { "Authorization": "Bearer " + token }
            });
            if (res.status === 401) { logout(); closeModal(); return; }
            var data = await res.json();
            var ticket = data.ticket || data.data || data;
            if (ticket && ticket.id) {
                if (!ticket.comments) ticket.comments = [];
                renderTicketDetailModal(ticket);
                applyLockStateToModal();
            } else if (!isRefresh) {
                content.innerHTML = '<div class="loading">Error loading ticket</div>';
            }
        } catch (e) {
            if (!isRefresh) content.innerHTML = '<div class="loading">Error: ' + e.message + '</div>';
        }
    }

    function renderTicketDetailModal(ticket) {
        var content = document.getElementById("modalContent");
        var activityHtml = "";
        if (ticket.comments && ticket.comments.length > 0) {
            for (var i = 0; i < ticket.comments.length; i++) {
                var c = ticket.comments[i];
                var isPublicReply = c.comment_type === 'public';
                var isIncoming = c.comment_type === 'incoming';
                var isStatusChange = c.comment_type === 'status_change';
                var timestamp = formatDate(c.created_at);
                var author = c.author_email || 'System';
                
                var boxStyle = 'style="border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:12px;background:var(--bg-input);"';
                var headerStyle = 'style="display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border);"';
                var iconStyle = 'style="font-size:18px;min-width:24px;"';
                var titleStyle = 'style="font-weight:600;font-size:13px;flex:1;"';
                var timeStyle = 'style="font-size:12px;color:var(--text-muted);"';
                var subHeaderStyle = 'style="font-size:12px;color:var(--text-muted);margin-bottom:8px;padding:0 0 8px 0;border-bottom:1px solid var(--border);"';
                var msgStyle = 'style="font-size:13px;line-height:1.6;margin-top:8px;white-space:pre-wrap;word-wrap:break-word;"';
                
                if (isPublicReply) {
                    var raw = c.content || '';
                    var replyFrom = '';
                    var replyContent = raw;
                    if (raw.charAt(0) === '\u0001') {
                        var parts = raw.substring(1).split('\u0001');
                        replyFrom = parts[0] || '';
                        replyContent = parts.slice(1).join('\u0001');
                    } else {
                        replyFrom = author;
                        replyContent = raw.replace(/^Reply sent:\s*/, '');
                    }
                    activityHtml += '<div ' + boxStyle + '>' +
                        '<div ' + headerStyle + '>' +
                        '<span ' + iconStyle + '>📧</span>' +
                        '<span ' + titleStyle + '>Email sent to Customer</span>' +
                        '<span ' + timeStyle + '>' + timestamp + '</span>' +
                        '</div>' +
                        '<div ' + subHeaderStyle + '>' +
                        '<div>' + escapeHtml(author) + '</div>' +
                        (replyFrom ? '<div style="margin-top:4px;"><strong>Sent from:</strong> ' + escapeHtml(replyFrom) + '</div>' : '') +
                        '</div>' +
                        '<div ' + msgStyle + '>' + escapeHtml(replyContent) + '</div>' +
                        '</div>';
                } else if (isIncoming) {
                    activityHtml += '<div ' + boxStyle + '>' +
                        '<div ' + headerStyle + '>' +
                        '<span ' + iconStyle + '>📥</span>' +
                        '<span ' + titleStyle + '>Email received from Customer</span>' +
                        '<span ' + timeStyle + '>' + timestamp + '</span>' +
                        '</div>' +
                        '<div ' + subHeaderStyle + '>' + escapeHtml(author) + '</div>' +
                        '<div ' + msgStyle + '>' + escapeHtml(c.content || '') + '</div>' +
                        '</div>';
                } else if (isStatusChange) {
                    var oldStatus = c.old_status || 'unknown';
                    var newStatus = c.new_status || 'unknown';
                    activityHtml += '<div ' + boxStyle + '>' +
                        '<div ' + headerStyle + '>' +
                        '<span ' + iconStyle + '>✏️</span>' +
                        '<span ' + titleStyle + '>Status changed</span>' +
                        '<span ' + timeStyle + '>' + timestamp + '</span>' +
                        '</div>' +
                        '<div ' + subHeaderStyle + '>' +
                        escapeHtml(author) +
                        '</div>' +
                        '<div style="font-size:13px;"><span style="display:inline-block;padding:3px 10px;border-radius:4px;background:#fee2e2;color:#991b1b;font-family:monospace;font-weight:600;">' + escapeHtml(oldStatus) + '</span><span style="margin:0 8px;">→</span><span style="display:inline-block;padding:3px 10px;border-radius:4px;background:#dbeafe;color:#1e40af;font-family:monospace;font-weight:600;">' + escapeHtml(newStatus) + '</span></div>' +
                        '</div>';
                } else {
                    activityHtml += '<div ' + boxStyle + '>' +
                        '<div ' + headerStyle + '>' +
                        '<span ' + iconStyle + '>💭</span>' +
                        '<span ' + titleStyle + '>Internal comment</span>' +
                        '<span ' + timeStyle + '>' + timestamp + '</span>' +
                        '</div>' +
                        '<div ' + subHeaderStyle + '>' +
                        escapeHtml(author) +
                        '</div>' +
                        '<div ' + msgStyle + '>' + escapeHtml(c.content || '') + '</div>' +
                        '</div>';
                }
            }
        }

        var statusOptions = ["new", "open", "in_progress", "pending", "resolved", "closed"];
        var statusDropdown = '<select id="detailStatus">';
        for (var i = 0; i < statusOptions.length; i++) {
            var s = statusOptions[i];
            statusDropdown += '<option value="' + s + '" ' + (s === ticket.status ? "selected" : "") + '>' + s.replace('_', ' ') + '</option>';
        }
        statusDropdown += '</select>';

        var senderDropdown = '<select id="detailReplyFrom">';
        if (emailSenders && emailSenders.length > 0) {
            var isFirst = true;
            for (var i = 0; i < emailSenders.length; i++) {
                var email = emailSenders[i];
                var selected = isFirst ? "selected" : "";
                senderDropdown += '<option value="' + email + '" ' + selected + '>' + email + '</option>';
                isFirst = false;
            }
        } else {
            senderDropdown += '<option value="" disabled selected>No email senders available</option>';
        }
        senderDropdown += '</select>';

        var slaLabel = getSlaDisplay(ticket.sla_status || 'on_track').label;
        var slaClass = getSlaDisplay(ticket.sla_status || 'on_track').cls;
        var catColor = getCatColor(ticket.category);
        var isClosed = ticket.status === 'closed';

        var fullName = [ticket.sender_name, ticket.sender_last_name].filter(Boolean).join(' ') || 'Unknown';
        var orderNum = ticket.order_number ? escapeHtml(ticket.order_number) : '—';
        var ticketCompany = '—';
        try {
            var metaObj = typeof ticket.metadata === 'string' ? JSON.parse(ticket.metadata) : (ticket.metadata || {});
            if (metaObj && metaObj.company) ticketCompany = metaObj.company;
        } catch (e) {}
        var sourceLabel = getSourceLabel(metaObj);

        var actionsHtml = '';
        if (!isClosed) {
            var canEditTicket = canEdit();
            actionsHtml = `
            <div class="detail-section action-section">
                <h4>✏️ Update Status</h4>
                ${statusDropdown}
                <div class="actions"><button class="btn-primary" onclick="updateStatus(${ticket.id})" ${!canEditTicket ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>Save Status</button></div>
            </div>
            <div class="detail-section action-section comment-input">
                <h4>📝 Add Comment</h4>
                <textarea id="detailComment" placeholder="Write an internal comment..." ${!canEditTicket ? 'disabled' : ''}></textarea>
                <div class="actions"><button class="btn-primary" onclick="addComment(${ticket.id})" ${!canEditTicket ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>Add Comment</button></div>
            </div>
            <div class="detail-section action-section">
                <h4>✉️ Reply to Customer</h4>
                <label>From:</label>
                ${senderDropdown}
                <textarea id="detailReplyBody" placeholder="Write your reply to the customer..." ${!canEditTicket ? 'disabled' : ''}></textarea>
                <div class="actions"><button class="btn-primary" onclick="sendReply(${ticket.id})" ${!canEditTicket ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>Send Reply</button></div>
            </div>`;
        } else {
            actionsHtml = `
            <div class="detail-section action-section">
                <h4>✏️ Reopen Ticket</h4>
                ${statusDropdown}
                <div class="actions"><button class="btn-primary" onclick="updateStatus(${ticket.id})" ${!canEdit() ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>Update Status</button></div>
            </div>`;
        }

        content.innerHTML = `
            <div class="detail-section">
                <h3>📋 Ticket Details</h3>
                <div class="modal-subject-row"><span class="meta-label" style="font-size:11px;color:var(--text-muted);margin-right:6px;">Subject:</span><span class="modal-subject-text">${escapeHtml(ticket.subject || 'No subject')}</span></div>
                <div class="ticket-meta-grid">
                    <div class="meta-item"><span class="meta-label">Ticket Number</span><span class="meta-value" style="font-family:monospace;color:var(--accent);">#${ticket.ticket_number}</span></div>
                    <div class="meta-item"><span class="meta-label">Status</span><span class="meta-value">${ticket.status.toUpperCase()}</span></div>
                    <div class="meta-item"><span class="meta-label">SLA</span><span class="meta-value ${slaClass} sla-badge-inline">${slaLabel}</span></div>
                    <div class="meta-item"><span class="meta-label">Category</span><span class="meta-value"><span class="cat-dot" style="background:${catColor};margin-right:6px;"></span>${ticket.category || "Other"}</span></div>
                    <div class="meta-item"><span class="meta-label">Name</span><span class="meta-value">${escapeHtml(fullName)}</span></div>
                    <div class="meta-item"><span class="meta-label">Email</span><span class="meta-value">${ticket.sender_email || "Unknown"}</span></div>
                    <div class="meta-item"><span class="meta-label">Phone</span><span class="meta-value">${escapeHtml(ticket.sender_phone || '—')}</span></div>
                    <div class="meta-item"><span class="meta-label">Company</span><span class="meta-value">${escapeHtml(ticketCompany)}</span></div>
                    <div class="meta-item"><span class="meta-label">Source</span><span class="meta-value">${sourceLabel}</span></div>
                    <div class="meta-item"><span class="meta-label">Order Number</span><span class="meta-value">${orderNum}</span></div>
                    <div class="meta-item"><span class="meta-label">Created</span><span class="meta-value">${formatDate(ticket.created_at)}</span></div>
                    <div class="meta-item"><span class="meta-label">Updated By</span><span class="meta-value">${ticket.last_updated_by ? (ticket.last_updated_by === ticket.sender_email ? '👤 Customer (' + escapeHtml(ticket.last_updated_by) + ')' : escapeHtml(ticket.last_updated_by)) : '—'}</span></div>
                    <div class="meta-item"><span class="meta-label">Last Updated</span><span class="meta-value">${formatDate(ticket.updated_at || ticket.last_action || ticket.created_at)}</span></div>
                </div>
            </div>
            <div class="detail-section">
                <h3>💬 Message <span style="font-size:12px;font-weight:500;color:var(--text-muted);">${sourceLabel}</span></h3>
                <div class="ticket-body">${escapeHtml(ticket.message || "No message")}</div>
            </div>
            <div class="detail-section activity-log-section">
                <h3>📋 Activity Log (${ticket.comments ? ticket.comments.length : 0})</h3>
                ${activityHtml || '<div style="color:var(--text-muted);font-size:13px;">No activity yet</div>'}
            </div>
            ${actionsHtml}
        `;
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  ACTIONS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function updateStatus(id) {
        if (!canEdit()) {
            showToast('❌ Permission Denied', 'You do not have edit permission for tickets', 'error');
            return;
        }
        var status = document.getElementById("detailStatus").value;
        try {
            var res = await fetch(API_BASE + "/api/admin/ticket/" + id + "/status", {
                method: "PUT",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
                body: JSON.stringify({ status: status })
            });
            if (res.status === 401) { logout(); closeModal(); return; }
            var data = await res.json();
            if (data.success) { 
                openTicketModal(id); 
                loadStats(); 
                resetAndLoad();
            } else {
                showToast('❌ Update Failed', data.error || 'Unknown error', 'error');
            }
        } catch (e) { 
            showToast('❌ Error', e.message, 'error');
        }
    }

    async function addComment(id) {
        if (!canEdit()) {
            showToast('❌ Permission Denied', 'You do not have edit permission for tickets', 'error');
            return;
        }
        var content = document.getElementById("detailComment").value;
        if (!content) {
            showToast('⚠️ Please enter a comment', 'Comment is required', 'warning');
            return;
        }
        try {
            var res = await fetch(API_BASE + "/api/admin/ticket/" + id + "/comment", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
                body: JSON.stringify({ content: content, type: "internal" })
            });
            if (res.status === 401) { logout(); closeModal(); return; }
            var data = await res.json();
            if (data.success) { 
                document.getElementById("detailComment").value = ""; 
                openTicketModal(id); 
                loadStats(); 
                resetAndLoad();
            } else {
                showToast('❌ Failed', 'Failed to add comment', 'error');
            }
        } catch (e) { 
            showToast('❌ Error', e.message, 'error');
        }
    }

    async function sendReply(id) {
        if (!canEdit()) {
            showToast('❌ Permission Denied', 'You do not have edit permission for tickets', 'error');
            return;
        }
        var from = document.getElementById("detailReplyFrom").value;
        var rawBody = document.getElementById("detailReplyBody").value;
        if (!rawBody) {
            showToast('⚠️ Please enter a reply', 'Reply content is required', 'warning');
            return;
        }
        var body = '<p>' + rawBody
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/\r\n|\r|\n/g, '</p><p>') + '</p>';
        body = body.replace(/<p>\s*<\/p>/g, '');
        try {
            var res = await fetch(API_BASE + "/api/admin/ticket/" + id + "/reply", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
                body: JSON.stringify({ from: from, body: body })
            });
            if (res.status === 401) { logout(); closeModal(); return; }
            var data = await res.json();
            if (data.success) { 
                document.getElementById("detailReplyBody").value = ""; 
                openTicketModal(id); 
                loadStats(); 
                resetAndLoad();
                showToast('✅ Reply Sent', 'Your reply has been sent to the customer', 'success');
            } else {
                showToast('❌ Failed', 'Failed to send reply', 'error');
            }
        } catch (e) { 
            showToast('❌ Error', e.message, 'error');
        }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  TABS & FILTERING
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.ticket-tab').forEach(t => t.classList.remove('active'));
        document.querySelector('[data-tab="' + tab + '"]').classList.add('active');
        resetAndLoad();
    }

    function resetAndLoad() {
        if (!isRefreshing) {
            isRefreshing = true;
            loadTickets(1).finally(() => {
                isRefreshing = false;
            });
        }
    }

    function getStatusesForTab(tab) {
        var map = {
            'active': ['new', 'open', 'in_progress', 'pending'],
            'resolved': ['resolved'],
            'closed': ['closed']
        };
        return map[tab] || [];
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  UTILITIES
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function formatDate(dateStr) {
        if (!dateStr) return "Invalid Date";
        try {
            var cleaned = dateStr.replace(" ", "T");
            if (!cleaned.includes("Z") && !cleaned.includes("+")) { cleaned += "Z"; }
            var d = new Date(cleaned);
            if (isNaN(d.getTime())) { return dateStr; }
            return d.toLocaleString(undefined, {
                year: "numeric", month: "short", day: "numeric",
                hour: "2-digit", minute: "2-digit",
                timeZone: userTimezone || "UTC"
            });
        } catch (e) { return dateStr; }
    }

    function getSourceLabel(metaObj) {
        var source = metaObj && metaObj.source;
        if (source === 'website') return '🌐 Web Form';
        if (source === 'email') return '📧 Email';
        if (source === 'newsletter') return '📧 Newsletter';
        return '📧 Email';
    }

    function getSlaDisplay(status) {
        var map = {
            'on_track': { cls: 'sla-on-track', label: '✅ On Track' },
            'at_risk': { cls: 'sla-at-risk', label: '⚠️ At Risk' },
            'critical': { cls: 'sla-critical', label: '🔴 Critical' },
            'breached': { cls: 'sla-breached', label: '❌ Breached' },
            'paused': { cls: 'sla-paused', label: '⏸️ Paused' }
        };
        return map[status] || map['on_track'];
    }
</script>
</body>
</html>
