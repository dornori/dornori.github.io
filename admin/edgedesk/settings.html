<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings – EdgeDesk</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        /* ── Settings-specific overrides ── */
        .s-page { max-width: 1200px; margin: 0 auto; }

        /* Tab strip */
        .tab-strip {
            display: flex;
            gap: 0;
            border-bottom: 2px solid var(--border);
            margin-bottom: 28px;
            overflow-x: auto;
        }
        .tab-strip button {
            padding: 12px 22px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: color .15s, border-color .15s;
        }
        .tab-strip button:hover { color: var(--text); }
        .tab-strip button.active { color: var(--accent); border-bottom-color: var(--accent); }

        /* Section panels */
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* Section card */
        .s-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .s-card-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        .s-card-head h3 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }
        .s-card-head p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 3px;
            line-height: 1.4;
        }

        /* Form fields */
        .f-row { margin-bottom: 16px; }
        .f-row label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .6px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .f-row input[type="text"],
        .f-row input[type="email"],
        .f-row input[type="number"],
        .f-row input[type="color"],
        .f-row select,
        .f-row textarea {
            width: 100%;
            padding: 9px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            transition: border-color .15s;
        }
        .f-row input:focus,
        .f-row select:focus,
        .f-row textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        .f-row textarea {
            min-height: 130px;
            resize: vertical;
            font-family: 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.55;
        }
        .f-row input[type="color"] {
            height: 38px;
            padding: 3px 6px;
            cursor: pointer;
        }
        .f-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .f-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

        /* Dynamic tag bar */
        .tag-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 6px;
            align-items: center;
        }
        .tag-bar-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--text-muted);
            margin-right: 4px;
        }
        .tag-chip {
            padding: 3px 9px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 11px;
            font-family: monospace;
            color: var(--accent);
            cursor: pointer;
            font-weight: 600;
            transition: background .12s, color .12s;
        }
        .tag-chip:hover { background: var(--accent); color: var(--text-inverse); border-color: var(--accent); }

        /* Toggle switch */
        .toggle-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .toggle-switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-track {
            position: absolute;
            inset: 0;
            background: var(--border);
            border-radius: 22px;
            cursor: pointer;
            transition: background .2s;
        }
        .toggle-track::after {
            content: '';
            position: absolute;
            left: 3px;
            top: 3px;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            transition: transform .2s;
        }
        .toggle-switch input:checked + .toggle-track { background: var(--accent); }
        .toggle-switch input:checked + .toggle-track::after { transform: translateX(18px); }
        .toggle-label { font-size: 14px; color: var(--text); font-weight: 500; }

        /* Category row */
        .cat-item {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .cat-item-head {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-input);
            cursor: pointer;
            user-select: none;
        }
        .cat-item-head:hover { background: var(--bg-hover); }
        .cat-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
        .cat-name { font-weight: 700; font-size: 14px; flex: 1; }
        .cat-desc-preview { font-size: 12px; color: var(--text-muted); flex: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cat-chevron { color: var(--text-muted); font-size: 12px; transition: transform .2s; flex-shrink: 0; }
        .cat-item.open .cat-chevron { transform: rotate(90deg); }
        .cat-body { display: none; padding: 20px 16px; border-top: 1px solid var(--border); }
        .cat-item.open .cat-body { display: block; }
        .cat-actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; }

        /* Auto-reply item */
        .ar-item {
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 14px;
            overflow: hidden;
        }
        .ar-item-head {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-input);
            cursor: pointer;
            user-select: none;
        }
        .ar-item-head:hover { background: var(--bg-hover); }
        .ar-enabled-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .ar-enabled-dot.on { background: var(--success); }
        .ar-enabled-dot.off { background: var(--border); }
        .ar-cat-name { font-weight: 700; font-size: 14px; min-width: 120px; }
        .ar-subject-preview { font-size: 12px; color: var(--text-muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ar-chevron { color: var(--text-muted); font-size: 12px; transition: transform .2s; flex-shrink: 0; }
        .ar-item.open .ar-chevron { transform: rotate(90deg); }
        .ar-body { display: none; padding: 22px 18px; border-top: 1px solid var(--border); }
        .ar-item.open .ar-body { display: block; }

        /* Outgoing email item — always expanded, no accordion */
        .oe-item {
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 14px;
            overflow: hidden;
        }
        .oe-item-head {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-input);
            border-bottom: 1px solid var(--border);
        }
        .oe-email-label { font-weight: 700; font-size: 14px; flex: 1; }
        .oe-cat-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 20px;
            background: var(--bg-hover);
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .4px;
        }
        .oe-body { padding: 20px 18px; }
        .oe-footer-status {
            font-size: 11px;
            color: var(--text-muted);
            font-style: italic;
        }
        .oe-footer-status.has-footer { color: var(--success); font-style: normal; }

        /* Email address row with language */
        .email-row {
            display: grid;
            grid-template-columns: 1fr 160px 120px auto;
            gap: 12px;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .email-row .email-addr { font-weight: 600; font-size: 14px; }
        .email-row .email-lang {
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 12px;
            background: var(--bg-input);
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Add-new row */
        .add-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            padding: 16px;
            background: var(--bg-input);
            border: 1px dashed var(--border);
            border-radius: 8px;
            margin-top: 8px;
        }
        .add-row .f-row { margin-bottom: 0; flex: 1; }
        .add-row .f-row:last-child { flex: 0 0 auto; }

        /* Buttons */
        .btn { padding: 8px 18px; border: none; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
        .btn:hover { opacity: .85; }
        .btn-accent { background: var(--accent); color: var(--text-inverse); }
        .btn-ghost { background: var(--bg-input); color: var(--text); border: 1px solid var(--border); }
        .btn-danger { background: var(--error); color: #fff; }
        .btn-sm { padding: 5px 12px; font-size: 12px; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            z-index: 9999;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity .2s, transform .2s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background: var(--bg-secondary); color: var(--success); border-left: 4px solid var(--success); box-shadow: 0 4px 20px var(--shadow); }
        .toast.error   { background: var(--bg-secondary); color: var(--error);   border-left: 4px solid var(--error);   box-shadow: 0 4px 20px var(--shadow); }
        .toast.warning { background: var(--bg-secondary); color: #92400e; border-left: 4px solid #f59e0b; box-shadow: 0 4px 20px var(--shadow); pointer-events: auto; }
        .toast.warning a { color: inherit; text-decoration: underline; }

        /* Empty state */
        .empty-state { text-align: center; padding: 32px; color: var(--text-muted); font-size: 14px; }

        /* Divider */
        .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

        @media (max-width: 640px) {
            .f-grid-2, .f-grid-3 { grid-template-columns: 1fr; }
            .add-row { flex-direction: column; }
            .email-row { grid-template-columns: 1fr; gap: 6px; }
        }
    </style>
</head>
<body>
<div class="container s-page">
    <div class="header">
        <h1>⚙️ Settings</h1>
        <div class="header-right">
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
            <a id="nav-dashboard" href="dashboard.html">🎫 Dashboard</a>
                <a id="nav-reports" href="reports.html" style="display:none;">📊 Reports</a>
                <a id="nav-newsletter" href="newsletter.html" style="display:none;">📧 Newsletter</a>
                <a id="nav-settings" href="settings.html" style="display:none;">⚙️ Settings</a>
                <a id="nav-users" href="users.html" style="display:none;">👥 Users</a>
            <div id="userDisplay"></div>
            <button onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="tab-strip" id="tabStrip"></div>
    <div id="tabContent"><div class="loading">Loading…</div></div>
</div>

<div id="toast" class="toast"></div>

<script>
// ── Get API_BASE from config ──
const API_BASE = window.EDGEDESK_CONFIG ? window.EDGEDESK_CONFIG.API_BASE : 'https://dornori-ticketing.dornori-info.workers.dev';

// ── Theme ──
function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('theme', t);
    document.querySelectorAll('.theme-toggle').forEach(b => b.textContent = t === 'dark' ? '☀️' : '🌙');
}
function toggleTheme() { setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); }
setTheme(localStorage.getItem('theme') || 'light');

// ── Auth ──
const token = localStorage.getItem('token');
const storedUser = localStorage.getItem('user');
const currentUser = storedUser ? JSON.parse(storedUser) : null;
const isAdmin = currentUser && currentUser.role === 'admin';
const hasSettingsPermission = isAdmin || (currentUser && currentUser.page_permissions && currentUser.page_permissions.settings && currentUser.page_permissions.settings.view);
if (!token || !currentUser || !hasSettingsPermission) {
    document.body.innerHTML = '<div style="padding: 40px; text-align: center;"><h1>⛔ Access Denied</h1><p>You don\'t have permission to access settings.</p><a href="dashboard.html" style="color: var(--accent);">← Back to Dashboard</a></div>';
    throw new Error('Settings access required');
}

const pagePerms = (currentUser && currentUser.page_permissions) || {};

// Refresh permissions from the server in the background: localStorage only
// reflects what was true at login, so without this an admin permission
// change wouldn't take effect until the user logs out and back in.
(async function refreshCurrentUser() {
    try {
        const res = await fetch(API_BASE + '/api/admin/me', { headers: { Authorization: 'Bearer ' + token } });
        if (!res.ok) return;
        const data = await res.json();
        if (data.success && data.user) {
            currentUser.role = data.user.role;
            currentUser.page_permissions = data.user.page_permissions || {};
            currentUser.allowed_languages = data.user.allowed_languages || [];
            currentUser.allowed_emails = data.user.allowed_emails || [];
            currentUser.allowed_categories = data.user.allowed_categories || [];
            currentUser.team_id = data.user.team_id || null;
            Object.keys(pagePerms).forEach(k => delete pagePerms[k]);
            Object.assign(pagePerms, currentUser.page_permissions);
            if (!isAdmin && !(pagePerms.settings && pagePerms.settings.view)) {
                window.location.href = 'dashboard.html';
                return;
            }
            if (typeof load === 'function') load();
        }
    } catch (e) { /* keep last-known permissions on failure */ }
})();

function hasPageAccess(page) {
    if (currentUser.role === 'admin') return true;
    const perms = pagePerms[page] || {};
    return perms.view === true;
}

function canEditSettings() {
    if (currentUser.role === 'admin') return true;
    return pagePerms.settings?.edit === true;
}

function canCreateSettings() {
    if (currentUser.role === 'admin') return true;
    return pagePerms.settings?.create === true;
}

function canDeleteSettings() {
    if (currentUser.role === 'admin') return true;
    return pagePerms.settings?.delete === true;
}

// Show all nav buttons except current page (settings)
if (hasPageAccess('reports'))    document.getElementById('nav-reports').style.display = '';
if (hasPageAccess('newsletter'))  document.getElementById('nav-newsletter').style.display = '';
if (hasPageAccess('users'))      document.getElementById('nav-users').style.display = '';

// ── API ──
async function api(path, opts = {}) {
    opts.headers = { ...(opts.headers || {}), Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
    const res = await fetch(API_BASE + path, opts);
    if (res.status === 401) { localStorage.removeItem('token'); throw new Error('Unauthorized'); }
    if (res.status === 403) { throw new Error('Permission denied'); }
    return res.json();
}

// ── Toast ──
let toastTimer;
function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.innerHTML = msg;
    el.className = 'toast show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), type === 'warning' ? 8000 : 3500);
}

// ── Shared config version cache ──
function extractLanguages(res) {
    try { return JSON.parse((res.data && res.data.languages && res.data.languages.list) || '[]'); }
    catch (e) { return []; }
}
function extractCategories(res) {
    const cats = new Set();
    Object.keys((res.data && res.data.category) || {}).forEach(k => {
        if (k.endsWith('_description') && res.data.category[k] !== '__deleted__') cats.add(k.replace('_description', ''));
    });
    return Array.from(cats);
}
async function loadAppConfig(forceFresh = false) {
    if (!forceFresh) {
        const cached = localStorage.getItem('appConfig');
        const cachedVersion = localStorage.getItem('appConfigVersion');
        if (cached && cachedVersion) {
            checkForConfigUpdate(cachedVersion);
            return JSON.parse(cached);
        }
    }
    const res = await api('/api/admin/settings');
    const config = {
        languages: extractLanguages(res),
        categories: extractCategories(res),
        version: (res.data && res.data.system && res.data.system.config_version) || Date.now().toString()
    };
    localStorage.setItem('appConfig', JSON.stringify(config));
    localStorage.setItem('appConfigVersion', config.version);
    return config;
}
async function checkForConfigUpdate(cachedVersion) {
    try {
        const res = await api('/api/admin/config-version');
        if (res.version && res.version !== cachedVersion) {
            toast("Configuration was updated by admin. Please <a href='#' onclick='logout()'>re-login</a> to see changes.", "warning");
        }
    } catch (e) {}
}

// ── State ──
let settings = [], emailAddresses = [], currentTab = 'general';

function S(cat, key, def = '') {
    const s = settings.find(s => s.category === cat && s.key === key);
    return s ? s.value : def;
}

function getCategories() {
    const cats = new Set();
    settings.forEach(s => {
        if (s.category === 'category' && s.key.endsWith('_description') && s.value !== '__deleted__') {
            cats.add(s.key.replace('_description', ''));
        }
    });
    return Array.from(cats);
}

function getLanguages() {
    const langList = S('languages', 'list', '[]');
    try {
        const parsed = JSON.parse(langList);
        return parsed;
    } catch (e) {
        return [];
    }
}

// ── Load ──
async function load() {
    try {
        const [sd, ed] = await Promise.all([api('/api/admin/settings'), api('/api/admin/email-addresses')]);
        settings = sd.settings || [];
        emailAddresses = ed.addresses || [];
        renderAll();
        switchTab(currentTab);
        loadAppConfig();
    } catch(e) {
        document.getElementById('tabContent').innerHTML = '<div class="loading">Error: ' + e.message + '</div>';
    }
}

// ── Permission helpers ──
function disableForm(elementId, disabled) {
    const el = document.getElementById(elementId);
    if (!el) return;
    if (disabled) {
        if (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT' || el.tagName === 'SELECT') {
            el.disabled = true;
        }
        el.style.opacity = '0.6';
        el.style.pointerEvents = 'none';
    } else {
        if (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT' || el.tagName === 'SELECT') {
            el.disabled = false;
        }
        el.style.opacity = '1';
        el.style.pointerEvents = 'auto';
    }
}

function disableElements(selector, disabled) {
    document.querySelectorAll(selector).forEach(el => {
        if (disabled) {
            el.disabled = true;
            el.style.opacity = '0.5';
            el.style.cursor = 'not-allowed';
            el.title = 'Permission denied';
        } else {
            el.disabled = false;
            el.style.opacity = '1';
            el.style.cursor = 'pointer';
            el.title = '';
        }
    });
}

// ── Save helper ──
async function saveSettings(updates) {
    const d = await api('/api/admin/settings', { method: 'PUT', body: JSON.stringify({ settings: updates }) });
    if (d.success) loadAppConfig(true).catch(() => {});
    return d.success;
}

function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
function esc(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

// ─────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────
const TABS = [
    { id: 'general',       icon: '⚙️',  label: 'General' },
    { id: 'sla',           icon: '⏱️',  label: 'SLA' },
    { id: 'categories',    icon: '📂',  label: 'Categories' },
    { id: 'languages',     icon: '🌐',  label: 'Languages' },
    { id: 'email_routing', icon: '📤',  label: 'Email Routing' },
    { id: 'auto_reply',    icon: '🤖',  label: 'Auto-Reply' },
    { id: 'outgoing',      icon: '✉️',  label: 'Outgoing Email' },
];

function renderAll() {
    document.getElementById('tabStrip').innerHTML = TABS.map(t =>
        `<button data-tab="${t.id}" onclick="switchTab('${t.id}')">${t.icon} ${t.label}</button>`
    ).join('');

    const html = TABS.map(t => {
        const content = buildPanel(t.id);
        const isPromise = content && typeof content.then === 'function';
        return `<div class="tab-panel" id="panel-${t.id}" data-tab-id="${t.id}">${isPromise ? '<div class="loading">Loading…</div>' : content}</div>`;
    }).join('');
    document.getElementById('tabContent').innerHTML = html;
    
    // Disable all form fields if no edit permission
    setTimeout(() => {
        const noEdit = !canEditSettings();
        const noCreate = !canCreateSettings();
        const noDelete = !canDeleteSettings();
        
        disableElements('input[type="text"], input[type="password"], textarea, select', noEdit || noCreate || noDelete);
        disableElements('button[onclick*="save"], button[onclick*="delete"]', noEdit || noCreate || noDelete);
    }, 100);
}

function switchTab(id) {
    currentTab = id;
    document.querySelectorAll('.tab-strip button').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + id));
    
    const noEdit = !canEditSettings();
    const noCreate = !canCreateSettings();
    const noDelete = !canDeleteSettings();
    const disabled = noEdit || noCreate || noDelete;
    
    if (id === 'auto_reply') {
        buildAutoReply().then(html => {
            const panel = document.getElementById('panel-' + id);
            if (panel) panel.innerHTML = html;
            if (disabled) {
                setTimeout(() => {
                    disableElements('#panel-auto_reply input, #panel-auto_reply textarea, #panel-auto_reply select', true);
                    disableElements('#panel-auto_reply button[onclick*="saveAr"], #panel-auto_reply button[onclick*="deleteAr"]', true);
                }, 50);
            }
        }).catch(e => {
            const panel = document.getElementById('panel-' + id);
            if (panel) panel.innerHTML = '<div class="error">Failed to load auto-replies</div>';
        });
    } else if (id === 'email_routing') {
        const html = buildEmailRouting();
        const panel = document.getElementById('panel-' + id);
        if (panel) panel.innerHTML = html;
        if (disabled) {
            setTimeout(() => {
                disableElements('#panel-email_routing input, #panel-email_routing select', true);
                disableElements('#panel-email_routing button', true);
            }, 50);
        }
    } else if (id === 'outgoing') {
        const html = buildOutgoing();
        const panel = document.getElementById('panel-' + id);
        if (panel) panel.innerHTML = html;
        if (disabled) {
            setTimeout(() => {
                disableElements('#panel-outgoing textarea', true);
                disableElements('#panel-outgoing button[onclick*="saveFooter"], #panel-outgoing button[onclick*="clearFooter"]', true);
            }, 50);
        }
    }
}

function buildPanel(id) {
    switch(id) {
        case 'general':       return buildGeneral();
        case 'sla':           return buildSla();
        case 'categories':    return buildCategories();
        case 'languages':     return buildLanguages();
        case 'email_routing': return buildEmailRouting();
        case 'auto_reply':    return 'Loading…';
        case 'outgoing':      return buildOutgoing();
    }
    return '';
}

function buildGeneral() {

async function saveGeneral() {
    if (!canEditSettings()) {
        alert('You do not have permission to edit settings');
        return;
    }
    const defaultLang = document.getElementById('gen_default_lang').value;
    const defaultFrom = document.getElementById('gen_default_from').value.trim();
    
    const updates = [
        { category:'general', key:'timezone', value: document.getElementById('gen_tz').value },
        { category:'general', key:'domain',   value: document.getElementById('gen_domain').value.trim() },
        { category:'general', key:'default_language', value: defaultLang },
        { category:'email',   key:'default_from', value: defaultFrom }
    ];
    
    const ok = await saveSettings(updates);
    ok ? toast('✅ Saved') : toast('❌ Failed', 'error');

    return `<div class="s-card">
        <div class="s-card-head"><div><h3>SLA Rules</h3><p>Response and resolution time targets per category, in hours</p></div></div>
        <div style="display:grid;gap:12px;">
            <div style="display:grid;grid-template-columns:160px 1fr 1fr;gap:12px;padding:0 0 8px;border-bottom:2px solid var(--border);">
                <span style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-muted);">Category</span>
                <span style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-muted);">Response (h)</span>
                <span style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-muted);">Resolution (h)</span>

                <input type="number" id="sla_${cat}_reso" value="${esc(S('sla',cat+'_resolution','72'))}" style="padding:7px 10px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);width:100%;" />

        <button class="btn btn-accent" style="margin-top:20px;" onclick="saveSla()">Save SLA rules</button>

}
async function saveSla() {
    if (!canEditSettings()) {
        alert('You do not have permission to edit settings');
        return;
    }
    const cats = getCategories();
    const updates = cats.flatMap(c => [
        { category:'sla', key: c+'_response',   value: document.getElementById('sla_'+c+'_resp').value },
        { category:'sla', key: c+'_resolution', value: document.getElementById('sla_'+c+'_reso').value }
    ]);
    const ok = await saveSettings(updates);
    ok ? toast('✅ SLA saved') : toast('❌ Failed', 'error');
    if (ok) await load();
}

        const desc  = S('category', cat+'_description', cap(cat)+' inquiries');

        return `<div class="cat-item" id="catitem-${cat}">

            <div class="cat-body">
                <div class="f-grid-2">
                    <div class="f-row">

                        <input type="text" id="cat_desc_${cat}" value="${esc(desc)}" />

        <div class="f-grid-3" style="align-items:flex-end;">
            <div class="f-row" style="margin:0;">
                <label>Slug (no spaces)</label>
                <input type="text" id="newCatName" placeholder="e.g. billing" />
            </div>
            <div class="f-row" style="margin:0;">
                <label>Description</label>
                <input type="text" id="newCatDesc" placeholder="Billing inquiries" />
            </div>
            <div class="f-row" style="margin:0;">
                <label>Colour</label>
                <input type="color" id="newCatColor" value="#4f9eff" />
            </div>
        </div>
        <button class="btn btn-accent" style="margin-top:14px;" onclick="addCat()">Add category</button>

function toggleCat(cat) {
    const el = document.getElementById('catitem-' + cat);
    if (el) el.classList.toggle('open');
}

async function saveCat(cat) {
    if (!canCreateSettings()) {
        alert('You do not have permission to create settings');
        return;
    }
    const desc  = document.getElementById('cat_desc_'+cat).value;
    const color = document.getElementById('cat_color_'+cat).value;
    const ok = await saveSettings([
        { category:'category', key: cat+'_description', value: desc },
        { category:'category', key: cat+'_color',       value: color }
    ]);
    ok ? toast('✅ Category saved') : toast('❌ Failed', 'error');
    if (ok) await load();
}

async function deleteCat(cat) {
    if (!canDeleteSettings()) {
        alert('You do not have permission to delete settings');
        return;
    }
    if (!confirm(`Delete category "${cat}"?\n\nEmail routing and auto-reply rules for this category will remain in the database but become inactive.`)) return;
    const ok = await saveSettings([{ category:'category', key: cat+'_description', value: '__deleted__' }]);
    ok ? toast('✅ Category deleted') : toast('❌ Failed', 'error');
    if (ok) await load();
}

async function addCat() {
    const name  = document.getElementById('newCatName').value.trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
    const desc  = document.getElementById('newCatDesc').value.trim();
    const color = document.getElementById('newCatColor').value;
    if (!name) { toast('Enter a slug name', 'error'); return; }
    if (getCategories().includes(name)) { toast('Category already exists', 'error'); return; }
    const ok = await saveSettings([
        { category:'category',   key: name+'_description', value: desc || cap(name)+' inquiries' },
        { category:'category',   key: name+'_color',       value: color },
        { category:'sla',        key: name+'_response',    value: '24' },
        { category:'sla',        key: name+'_resolution',  value: '72' },
        { category:'auto_reply', key: name+'_enabled',     value: '0' },
        { category:'auto_reply', key: name+'_subject',     value: `[Ticket {{ticket_id}}] Your ${name} inquiry` },
        { category:'auto_reply', key: name+'_body',        value: `<p>Thank you for your ${name} inquiry. We will respond shortly.</p>` },
    ]);
    if (ok) {
        document.getElementById('newCatName').value = '';
        document.getElementById('newCatDesc').value = '';
        toast('✅ Category added');
        await load();
    } else {
        toast('❌ Failed', 'error');
    }
}

function buildLanguages() {
    const langs = getLanguages();
    const items = langs.map((lang, idx) => `
        <div style="display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;">
            <span style="font-weight:600;font-size:13px;font-family:monospace;">${esc(lang.code)}</span>
            <span style="font-size:14px;">${esc(lang.name)}</span>
            <button class="btn btn-danger btn-sm" onclick="deleteLang(${idx})">Remove</button>
        </div>
    `).join('');

    return `<div class="s-card">
        <div class="s-card-head"><div><h3>Languages</h3><p>Manage languages for ticket filtering in the dashboard - the first language is the default for tickets that are created without their language specified - eg incoming emails.</p></div></div>
        ${items || '<div class="empty-state">No languages yet</div>'}
        
        <hr class="divider" />
        <h4 style="font-size:13px;font-weight:700;color:var(--text-muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px;">Add language</h4>
        <div class="f-grid-2" style="align-items:flex-end;">
            <div class="f-row" style="margin:0;">
                <label>Language Code</label>
                <input type="text" id="newLangCode" placeholder="e.g. en, de, fr" style="text-transform:lowercase;" />
            </div>
            <div class="f-row" style="margin:0;">
                <label>Language Name</label>
                <input type="text" id="newLangName" placeholder="e.g. English" />
            </div>
        </div>
        <button class="btn btn-accent" style="margin-top:14px;" onclick="addLang()">Add language</button>
    </div>`;
}

async function addLang() {
    const code = document.getElementById('newLangCode').value.trim().toLowerCase();
    const name = document.getElementById('newLangName').value.trim();
    if (!code || !name) { toast('Fill all fields', 'error'); return; }
    const langs = getLanguages();
    if (langs.some(l => l.code === code)) { toast('Language code already exists', 'error'); return; }
    langs.push({ code, name });
    const ok = await saveSettings([{ category:'languages', key:'list', value: JSON.stringify(langs) }]);
    if (ok) {
        document.getElementById('newLangCode').value = '';
        document.getElementById('newLangName').value = '';
        toast('✅ Language added');
        await load();
    } else {
        toast('❌ Failed', 'error');
    }
}

async function deleteLang(idx) {
    if (!canDeleteSettings()) {
        alert('You do not have permission to delete settings');
        return;
    }
    if (!confirm('Remove this language?')) return;
    const langs = getLanguages();
    langs.splice(idx, 1);
    const ok = await saveSettings([{ category:'languages', key:'list', value: JSON.stringify(langs) }]);
    ok ? toast('✅ Language removed') : toast('❌ Failed', 'error');
    if (ok) await load();
}

// ─────────────────────────────────────────────────────────────
function buildEmailRouting() {
    const cats = getCategories();
    const langs = getLanguages();
    const catOpts = cats.map(c => `<option value="${c}">${cap(c)}</option>`).join('');
    const langOpts = langs.map(l => `<option value="${l.code}">${l.code} - ${l.name}</option>`).join('');

    const rows = emailAddresses.map(addr => {
        const catOptsWithSelected = cats.map(c => 
            `<option value="${c}"${c===addr.action?' selected':''}>${cap(c)}</option>`
        ).join('');
        const langOptsWithSelected = langs.map(l => 
            `<option value="${l.code}"${l.code===addr.language?' selected':''}>${l.code} - ${l.name}</option>`
        ).join('');
        
        return `<div class="email-row">
            <span class="email-addr">${esc(addr.email)}</span>
            <select onchange="updateEmailCat(${addr.id}, this.value)" style="padding:7px 10px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);">${catOptsWithSelected}</select>
            <select onchange="updateEmailLang(${addr.id}, this.value)" style="padding:7px 10px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);">${langOptsWithSelected}</select>
            <div style="display:flex;gap:6px;">
                <button class="btn btn-ghost btn-sm" onclick="editEmailAddr(${addr.id})">Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteEmailAddr(${addr.id})">Delete</button>
            </div>
        </div>`;
    }).join('');

    return `<div class="s-card">
        <div class="s-card-head"><div><h3>Email Routing</h3><p>Map incoming email addresses to ticket categories and languages. Categories and Languages are pulled from their respective tabs.</p></div></div>

        ${emailAddresses.length ? rows : '<div class="empty-state">No email addresses yet — add one below</div>'}

        <hr class="divider" />
        <h4 style="font-size:13px;font-weight:700;color:var(--text-muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px;">Add address</h4>
        <div style="display:grid;grid-template-columns:1fr 180px 140px auto;gap:12px;align-items:flex-end;">
            <div class="f-row" style="margin:0;"><label>Email address</label><input type="email" id="newErEmail" placeholder="support@example.com" /></div>
            <div class="f-row" style="margin:0;"><label>Category</label><select id="newErCat" style="padding:9px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:7px;color:var(--text);width:100%;">${catOpts}</select></div>
            <div class="f-row" style="margin:0;"><label>Language</label><select id="newErLang" style="padding:9px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:7px;color:var(--text);width:100%;">${langOpts}</select></div>
            <button class="btn btn-accent" style="white-space:nowrap;" onclick="addEmailAddr()">Add address</button>
        </div>
    </div>`;
}

async function updateEmailCat(id, cat) {
    const addr = emailAddresses.find(a => a.id === id);
    if (!addr) return;
    const lang = addr.language || '';
    const d = await api('/api/admin/email-addresses/' + id, {
        method: 'PUT', body: JSON.stringify({ email: addr.email, label: cat, action: cat, language: lang, is_active: 1 })
    });
    d.success ? toast('✅ Routing updated') : toast('❌ Failed', 'error');
    if (d.success) { addr.action = cat; await load(); }
}

async function updateEmailLang(id, lang) {
    const addr = emailAddresses.find(a => a.id === id);
    if (!addr) return;
    const d = await api('/api/admin/email-addresses/' + id, {
        method: 'PUT', body: JSON.stringify({ email: addr.email, label: addr.action, action: addr.action, language: lang, is_active: 1 })
    });
    d.success ? toast('✅ Language updated') : toast('❌ Failed', 'error');
    if (d.success) { addr.language = lang; await load(); }
}

async function addEmailAddr() {
    const email = document.getElementById('newErEmail').value.trim();
    const cat   = document.getElementById('newErCat').value;
    const lang  = document.getElementById('newErLang').value;
    if (!email) { toast('Enter an email address', 'error'); return; }
    if (!lang) { toast('Select a language', 'error'); return; }
    const d = await api('/api/admin/email-addresses', {
        method: 'POST', body: JSON.stringify({ email, label: cat, action: cat, language: lang })
    });
    if (d.success) { document.getElementById('newErEmail').value = ''; toast('✅ Address added'); await load(); }
    else { toast('❌ ' + (d.error || 'Failed'), 'error'); }
}

async function editEmailAddr(id) {
    const addr = emailAddresses.find(a => a.id === id);
    if (!addr) return;
    const newEmail = prompt('Edit email address:', addr.email);
    if (!newEmail || newEmail === addr.email) return;
    const lang = addr.language || '';
    const d = await api('/api/admin/email-addresses/' + id, {
        method: 'PUT', body: JSON.stringify({ email: newEmail, label: addr.action, action: addr.action, language: lang, is_active: 1 })
    });
    d.success ? (toast('✅ Updated'), load()) : toast('❌ Failed', 'error');
}

async function deleteEmailAddr(id) {
    if (!canDeleteSettings()) {
        alert('You do not have permission to delete settings');
        return;
    }
    if (!confirm('Delete this email address?')) return;
    const d = await api('/api/admin/email-addresses/' + id, { method: 'DELETE' });
    d.success ? (toast('✅ Deleted'), load()) : toast('❌ Failed', 'error');
}

// ─────────────────────────────────────────────────────────────
// AUTO-REPLY - FIXED (from working v1.7)
// ─────────────────────────────────────────────────────────────
const DYN_TAGS = [
    { tag: '{{ticket_id}}',    label: 'Ticket ID' },
    { tag: '{{sender_name}}',  label: 'Sender name' },
    { tag: '{{sender_email}}', label: 'Sender email' },
    { tag: '{{category}}',     label: 'Category' },
    { tag: '{{subject}}',      label: 'Subject' },
];

function tagBar(targetId) {
    return `<div class="tag-bar">
        <span class="tag-bar-label">Insert tag:</span>
        ${DYN_TAGS.map(t => `<button type="button" class="tag-chip" onclick="insertTag('${targetId}','${t.tag}')">${t.tag}</button>`).join('')}
    </div>`;
}

async function buildAutoReply() {
    const cats = getCategories();
    const langs = getLanguages();
    let activeLang = sessionStorage.getItem('ar_active_lang') || (langs.length > 0 ? langs[0].code : 'en');

    let autoReplies = [];
    try {
        const res = await api('/api/admin/auto-reply');
        if (res.success && Array.isArray(res.data)) {
            autoReplies = res.data;
        }
    } catch (e) {
        console.error('Failed to load auto-replies:', e);
    }

    const items = cats.map(cat => {
        const ar = autoReplies.find(a => a.category === cat && a.language === activeLang) || {};
        const enabled  = ar.enabled ? 1 : 0;
        const subject  = ar.subject || `[Ticket {{ticket_id}}] Your ${cat} inquiry`;
        const body     = ar.body || '';
        const from     = ar.from || '';
        const color    = S('category', cat+'_color', '#8892b0');

        const fromOpts = `<option value="">Default</option>` +
            emailAddresses.map(a => `<option value="${esc(a.email)}"${a.email===from?' selected':''}>${esc(a.email)}</option>`).join('');

        return `<div class="ar-item" id="aritem-${cat}">
            <div class="ar-item-head" onclick="toggleAr('${cat}')">
                <span class="ar-enabled-dot ${enabled?'on':'off'}"></span>
                <span class="cat-dot" style="background:${esc(color)};width:10px;height:10px;border-radius:50%;flex-shrink:0;"></span>
                <span class="ar-cat-name">${esc(cap(cat))}</span>
                <span class="ar-subject-preview">${esc(subject)}</span>
                <span class="ar-chevron">▶</span>
            </div>
            <div class="ar-body">
                <div class="toggle-row" style="margin-bottom:20px;">
                    <label class="toggle-switch">
                        <input type="checkbox" id="ar_en_${cat}" ${enabled?'checked':''} />
                        <span class="toggle-track"></span>
                    </label>
                    <span class="toggle-label">Send auto-reply when a <strong>${cat}</strong> ticket is created</span>
                </div>

                <div class="f-row">
                    <label>Send from address</label>
                    <select id="ar_from_${cat}">${fromOpts}</select>
                </div>

                <div class="f-row">
                    <label>Subject line <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-muted);font-size:11px;">(plain text — email headers can't render HTML)</span></label>
                    ${tagBar('ar_subj_' + cat)}
                    <input type="text" id="ar_subj_${cat}" value="${esc(subject)}" placeholder="[Ticket {{ticket_id}}] Your inquiry" />
                </div>

                <div class="f-row" style="margin-top:4px;">
                    <label>Email body <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-muted);font-size:11px;">(HTML accepted)</span></label>
                    ${tagBar('ar_body_' + cat)}
                    <textarea id="ar_body_${cat}" placeholder="<p>Thank you for contacting us…</p>">${esc(body)}</textarea>
                </div>

                <div style="display:flex;gap:8px;margin-top:16px;align-items:center;">
                    <button class="btn btn-accent btn-sm" onclick="saveAr('${cat}','${activeLang}')">Save auto-reply</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteAr('${cat}','${activeLang}')">Remove</button>
                    <span id="ar_status_${cat}" style="font-size:12px;color:var(--text-muted);margin-left:4px;"></span>
                </div>
            </div>
        </div>`;
    }).join('');

    const langOpts = langs.map(l => `<option value="${esc(l.code)}"${l.code===activeLang?' selected':''}>${esc(l.name)}</option>`).join('');

    return `<div class="s-card">
        <div class="s-card-head">
            <div>
                <h3>Auto-Reply</h3>
                <p>Configure the automatic reply sent when a ticket is created. Subject and body are sent as HTML. Click a category row to expand.</p>
            </div>
        </div>
        <div class="f-row">
            <label>Language</label>
            <select id="ar_lang_select" onchange="setArLanguage(this.value)">${langOpts}</select>
        </div>
        ${items || '<div class="empty-state">No categories configured — add them in the Categories tab first</div>'}
    </div>`;
}

function toggleAr(cat) {
    const el = document.getElementById('aritem-' + cat);
    if (el) el.classList.toggle('open');
}

function insertTag(targetId, tag) {
    const el = document.getElementById(targetId);
    if (!el) return;
    const s = el.selectionStart, e = el.selectionEnd;
    el.value = el.value.slice(0, s) + tag + el.value.slice(e);
    el.selectionStart = el.selectionEnd = s + tag.length;
    el.focus();
}

async function setArLanguage(lang) {
    sessionStorage.setItem('ar_active_lang', lang);
    const panel = document.getElementById('panel-auto_reply');
    if (panel) {
        panel.innerHTML = await buildAutoReply();
    }
}

async function saveAr(cat, lang) {
    const enabled = document.getElementById('ar_en_'+cat).checked ? 1 : 0;
    const subject = document.getElementById('ar_subj_'+cat).value;
    const body    = document.getElementById('ar_body_'+cat).value;
    const from    = document.getElementById('ar_from_'+cat).value;
    
    const d = await api('/api/admin/auto-reply', {
        method: 'PUT',
        body: JSON.stringify({ category: cat, language: lang, enabled, subject, body, from })
    });
    
    if (d.success) {
        toast('✅ Auto-reply saved');
        const s = document.getElementById('ar_status_'+cat);
        if (s) { s.textContent = 'Saved ✓'; setTimeout(() => s.textContent = '', 2500); }
        const dot = document.querySelector('#aritem-'+cat+' .ar-enabled-dot');
        if (dot) { dot.className = 'ar-enabled-dot ' + (enabled?'on':'off'); }
        const preview = document.querySelector('#aritem-'+cat+' .ar-subject-preview');
        if (preview) preview.textContent = subject;
    } else {
        toast('❌ Save failed', 'error');
    }
}

async function deleteAr(cat, lang) {
    if (!confirm(`Remove auto-reply for "${cat}" in ${lang}?\nThe category itself is not deleted.`)) return;
    const d = await api('/api/admin/auto-reply', {
        method: 'DELETE',
        body: JSON.stringify({ category: cat, language: lang })
    });
    d.success ? (toast('✅ Auto-reply cleared'), load()) : toast('❌ Failed', 'error');
}

// ─────────────────────────────────────────────────────────────
// OUTGOING EMAIL
// ─────────────────────────────────────────────────────────────
function buildOutgoing() {
    if (!emailAddresses.length) {
        return `<div class="s-card">
            <div class="s-card-head"><div><h3>Outgoing Email</h3><p>Set an HTML email footer per sending address. Footers are appended to every outgoing message from that address.</p></div></div>
            <div class="empty-state">No email addresses configured — add them in the Email Routing tab first.</div>
        </div>`;
    }

    const items = emailAddresses.map(addr => {
        const safeKey   = addr.email.replace(/[^a-z0-9]/gi, '_');
        const footerKey = 'footer_' + safeKey;
        const footer    = S('email', footerKey, '');
        const hasFooter = footer.length > 0;

        return `<div class="oe-item">
            <div class="oe-item-head">
                <span style="width:8px;height:8px;border-radius:50%;background:${hasFooter?'var(--success)':'var(--border)'};flex-shrink:0;"></span>
                <span class="oe-email-label">${esc(addr.email)}</span>
                <span class="oe-cat-badge">${esc(addr.action || addr.label || '—')}</span>
                <span class="oe-footer-status ${hasFooter?'has-footer':''}">${hasFooter ? 'Custom footer set' : 'No footer'}</span>
            </div>
            <div class="oe-body">
                <div class="f-row">
                    <label>Footer HTML <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-muted);font-size:11px;">(appended to every outgoing email from this address)</span></label>
                    <textarea id="oe_footer_${safeKey}" rows="7" placeholder="<p>Best regards,<br/>The EdgeDesk Team</p>\n\n<p style='font-size:11px;color:#888;'>You're receiving this because you contacted us at ${esc(addr.email)}</p>">${esc(footer)}</textarea>
                </div>
                <div style="display:flex;gap:8px;margin-top:4px;align-items:center;">
                    <button class="btn btn-accent btn-sm" onclick="saveFooter('${esc(addr.email)}','${safeKey}')">Save footer</button>
                    ${hasFooter ? `<button class="btn btn-ghost btn-sm" onclick="clearFooter('${esc(addr.email)}','${safeKey}')">Clear footer</button>` : ''}
                    <span id="oe_status_${safeKey}" style="font-size:12px;color:var(--text-muted);margin-left:4px;"></span>
                </div>
            </div>
        </div>`;
    }).join('');

    return `<div class="s-card">
        <div class="s-card-head">
            <div>
                <h3>Outgoing Email</h3>
                <p>Set a per-address HTML footer. The footer is appended to every email sent from that address. Addresses are managed in Email Routing.</p>
            </div>
        </div>
        ${items}
    </div>`;
}

async function saveFooter(email, safeKey) {
    const body = document.getElementById('oe_footer_' + safeKey).value;
    const ok = await saveSettings([{ category:'email', key:'footer_'+safeKey, value: body }]);
    if (ok) {
        toast('✅ Footer saved for ' + email);
        const s = document.getElementById('oe_status_' + safeKey);
        if (s) { s.textContent = 'Saved ✓'; setTimeout(() => s.textContent = '', 2500); }
        const existing = settings.find(s => s.category==='email' && s.key==='footer_'+safeKey);
        if (existing) existing.value = body; else settings.push({ category:'email', key:'footer_'+safeKey, value: body });
        const statusEl = document.querySelector('#oe_footer_' + safeKey)?.closest('.oe-item')?.querySelector('.oe-footer-status');
        if (statusEl) { statusEl.textContent = body ? 'Custom footer set' : 'No footer'; statusEl.className = 'oe-footer-status ' + (body ? 'has-footer' : ''); }
    } else {
        toast('❌ Save failed', 'error');
    }
}

async function clearFooter(email, safeKey) {
    if (!confirm('Clear footer for ' + email + '?')) return;
    document.getElementById('oe_footer_' + safeKey).value = '';
    await saveFooter(email, safeKey);
    await load();
}

load();

function renderUserBadge() {
    const u = currentUser;
    if (!u) return;
    const initials = (u.name || u.email || '?').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
    const meta = [u.role, u.team_id].filter(Boolean).join(' · ');
    const el = document.getElementById('userDisplay');
    if (el) el.innerHTML = `<div class="user-badge"><div class="user-badge-avatar">${initials}</div><div class="user-badge-info"><span class="user-badge-name">${u.name || u.email}</span><span class="user-badge-meta">${meta}</span></div></div>`;
}
renderUserBadge();

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'dashboard.html';
}
