<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings - Dornori Ticketing</title>
    <link rel="stylesheet" href="style.css" />
    <script src="edgedeskconfig.js"></script>
    <script src="shared.js"></script>
    <style>
        .settings-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .settings-section { background: var(--bg-secondary); border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); }
        .settings-section h2 { margin-top: 0; color: var(--text-primary); font-size: 18px; margin-bottom: 20px; }
        .sla-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .sla-card { background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; padding: 15px; }
        .sla-card h3 { margin: 0 0 15px 0; font-size: 14px; font-weight: 600; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; font-weight: 500; }
        .form-group input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; background: var(--bg-input); color: var(--text); }
        .form-group input:focus { outline: none; border-color: var(--accent); background: var(--bg-secondary); }
        .form-help { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
        .btn-save { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .btn-save:hover { opacity: 0.9; }
        .alert { padding: 12px 15px; border-radius: 6px; margin-bottom: 20px; font-size: 13px; }
        .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .loading { color: var(--text-muted); font-size: 13px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { margin: 0; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 13px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="container">
    <div id="login" style="display:none;">
        <h1>🔐 Login Required</h1>
        <p>Please log in via the main dashboard.</p>
        <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
    </div>

    <div id="settings" style="display:none;">
        <div class="header">
            <h1>⚙️ Settings</h1>
            <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
        </div>

        <div class="settings-container">
            <div id="alertBox"></div>

            <div class="settings-section">
                <h2>🎯 SLA Configuration</h2>
                <p style="font-size:13px;color:var(--text-muted);margin-bottom:20px;">
                    Configure SLA timeframes (in hours) and grace periods (in hours) for each category after resolution/closure.
                </p>
                <div id="slaSettings" class="sla-grid">
                    <div class="loading">Loading SLA settings...</div>
                </div>
                <button class="btn-save" onclick="saveSlaSettings()" style="margin-top:20px;">💾 Save All Settings</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ─── PAGE ACCESS CHECK ──────────────────────────────────────
    (function() {
        if (!checkPageAccess('settings')) return;
    })();

    const API_BASE = window.EDGEDESK_CONFIG ? window.EDGEDESK_CONFIG.API_BASE : 'https://dornori-ticketing.dornori-info.workers.dev';
    let token = null;
    let currentUser = null;
    let allCategories = [];

    window.addEventListener('load', async function() {
        const savedToken = localStorage.getItem('token');
        const savedUser = localStorage.getItem('user');

        if (!savedToken || !savedUser) {
            document.getElementById('login').style.display = 'block';
            return;
        }

        token = savedToken;
        currentUser = JSON.parse(savedUser);

        if (!currentUser || !['admin', 'manager'].includes(currentUser.role)) {
            document.getElementById('alertBox').innerHTML = '<div class="alert alert-error">❌ Permission Denied: Only admins and managers can access settings</div>';
            return;
        }

        document.getElementById('settings').style.display = 'block';
        await loadSlaSettings();
    });

    async function loadSlaSettings() {
        try {
            const res = await fetch(API_BASE + '/api/admin/settings', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.status === 401) { window.location.href = 'dashboard.html'; return; }
            const data = await res.json();
            
            const settings = data.settings || [];
            const categories = new Set();
            
            settings.forEach(s => {
                if (s.category === 'sla' && s.key.includes('_response')) {
                    const cat = s.key.replace('_response', '');
                    categories.add(cat);
                }
            });

            allCategories = Array.from(categories).sort();
            if (allCategories.length === 0) allCategories = ['general', 'technical', 'billing'];

            renderSlaForms(settings);
        } catch (e) {
            showAlert('Error loading settings: ' + e.message, 'error');
        }
    }

    function renderSlaForms(settings) {
        const container = document.getElementById('slaSettings');
        let html = '';

        allCategories.forEach(cat => {
            const respKey = cat + '_response';
            const resolKey = cat + '_resolution';
            const resolvedGraceKey = cat + '_resolved_grace';
            const closedGraceKey = cat + '_closed_grace';

            const respValue = settings.find(s => s.category === 'sla' && s.key === respKey)?.value || '24';
            const resolValue = settings.find(s => s.category === 'sla' && s.key === resolKey)?.value || '72';
            const resolvedGraceValue = settings.find(s => s.category === 'sla' && s.key === resolvedGraceKey)?.value || '0';
            const closedGraceValue = settings.find(s => s.category === 'sla' && s.key === closedGraceKey)?.value || '0';

            const catLabel = cat.charAt(0).toUpperCase() + cat.slice(1);
            
            html += `
                <div class="sla-card">
                    <h3>${catLabel}</h3>
                    
                    <div class="form-group">
                        <label>Response Time (hours)</label>
                        <input type="number" min="0" id="sla_${cat}_response" value="${respValue}" />
                        <div class="form-help">Time to respond to new ticket</div>
                    </div>
                    
                    <div class="form-group">
                        <label>Resolution Time (hours)</label>
                        <input type="number" min="0" id="sla_${cat}_resolution" value="${resolValue}" />
                        <div class="form-help">Time to resolve ticket</div>
                    </div>
                    
                    <div class="form-group">
                        <label>Grace Period for Resolved (hours)</label>
                        <input type="number" min="0" id="sla_${cat}_resolved_grace" value="${resolvedGraceValue}" />
                        <div class="form-help">Grace period after resolution (0 = no grace)</div>
                    </div>
                    
                    <div class="form-group">
                        <label>Grace Period for Closed (hours)</label>
                        <input type="number" min="0" id="sla_${cat}_closed_grace" value="${closedGraceValue}" />
                        <div class="form-help">Grace period after closure (0 = no grace)</div>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    async function saveSlaSettings() {
        const settings = [];

        allCategories.forEach(cat => {
            const respValue = document.getElementById(`sla_${cat}_response`)?.value || '24';
            const resolValue = document.getElementById(`sla_${cat}_resolution`)?.value || '72';
            const resolvedGraceValue = document.getElementById(`sla_${cat}_resolved_grace`)?.value || '0';
            const closedGraceValue = document.getElementById(`sla_${cat}_closed_grace`)?.value || '0';

            settings.push({ category: 'sla', key: cat + '_response', value: respValue });
            settings.push({ category: 'sla', key: cat + '_resolution', value: resolValue });
            settings.push({ category: 'sla', key: cat + '_resolved_grace', value: resolvedGraceValue });
            settings.push({ category: 'sla', key: cat + '_closed_grace', value: closedGraceValue });
        });

        try {
            const res = await fetch(API_BASE + '/api/admin/settings', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ settings })
            });
            if (res.status === 401) { window.location.href = 'dashboard.html'; return; }
            const data = await res.json();
            if (data.success) {
                showAlert('✅ Settings saved successfully', 'success');
                showToast('✅ Settings saved successfully', 'success');
            } else {
                showAlert('Error: ' + (data.error || 'Unknown error'), 'error');
            }
        } catch (e) {
            showAlert('Error saving settings: ' + e.message, 'error');
        }
    }

    function showAlert(message, type) {
        const box = document.getElementById('alertBox');
        box.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        if (type === 'success') setTimeout(() => { box.innerHTML = ''; }, 5000);
    }
</script>
</body>
</html>
