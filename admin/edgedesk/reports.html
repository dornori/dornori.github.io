<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports – Dornori</title>
    <link rel="stylesheet" href="style.css" />
    <script src="edgedeskconfig.js"></script>
</head>
<body>
<div class="container reports-container">
    <div class="header">
        <h1>📊 Reports</h1>
        <div class="header-right">
                <div class="nav-links">
                    <a id="nav-dashboard" href="dashboard.html">🎫 <span>Dashboard</span></a>
                    <a id="nav-reports" href="reports.html" style="display:none;">📊 <span>Reports</span></a>
                    <a id="nav-newsletter" href="newsletter.html">📧 <span>Newsletter</span></a>
                    <a id="nav-settings" href="settings.html">⚙️ <span>Settings</span></a>
                    <a id="nav-users" href="users.html">👥 <span>Users</span></a>
                </div>
                <div class="nav-actions">
                    <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
                    <div id="userDisplay"></div>
                    <button class="btn-logout" onclick="logout()">Logout</button>
                </div>
            </div>
    </div>

    <div id="permDenied" class="card perm-denied" style="display:none;">
        <h2>⛔ Permission Denied</h2>
        <p>You don't have permission to view reports.</p>
        <a href="dashboard.html" style="color: var(--accent);">← Back to Dashboard</a>
    </div>

    <div id="reportContent" style="display:none;"><div class="loading">Loading reports...</div></div>
</div>

<script>
    const API_BASE = window.EDGEDESK_CONFIG ? window.EDGEDESK_CONFIG.API_BASE : 'https://dornori-ticketing.dornori-info.workers.dev';

    let token = null;
    let currentUser = null;

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  PERMISSION SERVICE
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const PermissionService = {
        can(action, subject = 'reports') {
            if (!currentUser) return false;
            if (currentUser.role === 'admin') return true;
            
            const pagePerms = currentUser.page_permissions || {};
            const perms = pagePerms[subject] || {};
            return perms[action] === true;
        },

        hasPageAccess(page) {
            if (!currentUser) return false;
            if (currentUser.role === 'admin') return true;
            
            const pagePerms = currentUser.page_permissions || {};
            const perms = pagePerms[page] || {};
            return perms.view === true;
        }
    };

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  SECURITY: HTML ESCAPING
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  TOAST NOTIFICATIONS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function showToast(title, message, type = 'info') {
        const toast = document.createElement('div');
        toast.className = 'notification-toast';
        const colors = {
            info: 'var(--accent)',
            success: '#22c55e',
            error: '#ef4444',
            warning: '#f59e0b'
        };
        toast.style.borderLeftColor = colors[type] || colors.info;
        toast.innerHTML = `
            <button class="close-toast" onclick="this.parentElement.remove()">×</button>
            <h4>${title}</h4>
            <p>${message}</p>
        `;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 5000);
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  THEME TOGGLE
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        document.querySelectorAll('.theme-toggle').forEach(t => t.textContent = theme === 'dark' ? '☀️' : '🌙');
    }
    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        setTheme(current === 'light' ? 'dark' : 'light');
    }
    setTheme(localStorage.getItem('theme') || 'light');

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  AUTH CHECK & INIT
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function initPage() {
        token = localStorage.getItem('token');
        const storedUser = localStorage.getItem('user');
        currentUser = storedUser ? JSON.parse(storedUser) : null;

        if (!token || !currentUser) {
            window.location.href = 'dashboard.html';
            return;
        }

        await refreshCurrentUser();

        if (!PermissionService.can('view', 'reports')) {
            document.getElementById('permDenied').style.display = 'block';
            document.getElementById('reportContent').style.display = 'none';
            return;
        }

        document.getElementById('permDenied').style.display = 'none';
        document.getElementById('reportContent').style.display = 'block';
        
        updateNavigation();
        renderUserBadge();
        loadReports();
    }

    // Refresh permissions from the server: localStorage only reflects what
    // was true at login, so without this an admin permission change
    // wouldn't take effect until the user logs out and back in.
    async function refreshCurrentUser() {
        try {
            const res = await fetch(API_BASE + '/api/admin/me', { headers: { Authorization: 'Bearer ' + token } });
            if (!res.ok) return;
            const data = await res.json();
            if (data.success && data.user) {
                currentUser = {
                    email: data.user.email,
                    name: data.user.name,
                    role: data.user.role,
                    page_permissions: data.user.page_permissions || {},
                    allowed_languages: data.user.allowed_languages || [],
                    allowed_emails: data.user.allowed_emails || [],
                    allowed_categories: data.user.allowed_categories || [],
                    team_id: data.user.team_id || null
                };
                localStorage.setItem('user', JSON.stringify(currentUser));
            }
        } catch (e) { /* keep last-known permissions on failure */ }
    }

    function updateNavigation() {
        const navItems = {
            'nav-dashboard': 'dashboard',
            'nav-reports': 'reports',
            'nav-newsletter': 'newsletter',
            'nav-settings': 'settings',
            'nav-users': 'users'
        };

        for (const [id, page] of Object.entries(navItems)) {
            const el = document.getElementById(id);
            if (!el) continue;
            
            if (page === 'dashboard') {
                el.style.display = '';
            } else if (page === 'reports') {
                el.style.display = 'none'; // Hide current page
            } else {
                const allowed = PermissionService.hasPageAccess(page);
                el.classList.toggle('nav-disabled', !allowed);
                if (!allowed) el.addEventListener('click', e => e.preventDefault());
            }
        }
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = 'dashboard.html';
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  LOAD & RENDER
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function loadReports() {
        var content = document.getElementById("reportContent");
        try {
            var res = await fetch(API_BASE + "/api/admin/reports", {
                headers: { "Authorization": "Bearer " + token }
            });
            if (res.status === 401 || res.status === 403) {
                logout();
                return;
            }
            var data = await res.json();
            if (data.success) {
                renderReports(data.data);
            } else {
                content.innerHTML = '<div class="error">Error loading reports: ' + (data.error || 'Unknown error') + '</div>';
            }
        } catch (e) {
            content.innerHTML = '<div class="error">Error: ' + e.message + '</div>';
        }
    }

    function renderReports(data) {
        var total = 0;
        for (var key in data.status) { total += data.status[key]; }

        var html = '<div class="stats-grid">';
        html += '<div class="stat-card"><div class="number">' + total + '</div><div class="label">Total Tickets</div></div>';
        html += '<div class="stat-card"><div class="number">' + data.sla.on_track + '</div><div class="label">On Track</div><div class="sub">SLA</div></div>';
        html += '<div class="stat-card"><div class="number">' + data.sla.at_risk + '</div><div class="label">At Risk</div><div class="sub">SLA</div></div>';
        html += '<div class="stat-card"><div class="number">' + data.sla.breached + '</div><div class="label">Breached</div><div class="sub">SLA</div></div>';
        html += '</div>';

        var statusColors = { new: "#5aa9ff", open: "#5ae05a", in_progress: "#ffb347", pending: "#ff6b6b", resolved: "#4ae0e0", closed: "#8892b0" };
        var pieData = [];
        for (var key in data.status) {
            if (data.status[key] > 0) pieData.push({ label: key, value: data.status[key], color: statusColors[key] || "#888" });
        }
        var totalPie = pieData.reduce(function(s, d) { return s + d.value; }, 0);
        var conicParts = "", cum = 0;
        for (var i = 0; i < pieData.length; i++) {
            var d = pieData[i];
            var percent = d.value / totalPie * 100;
            conicParts += d.color + " " + cum + "% " + (cum + percent) + "%";
            if (i < pieData.length - 1) conicParts += ", ";
            cum += percent;
        }
        var pieHtml = '<div class="pie-container"><div class="pie-svg" style="background:conic-gradient(' + conicParts + ')"></div><div class="pie-legend">';
        for (var i = 0; i < pieData.length; i++) {
            pieHtml += '<div class="item"><span class="color-box" style="background:' + pieData[i].color + '"></span>' + pieData[i].label + ' (' + pieData[i].value + ')</div>';
        }
        pieHtml += '</div></div>';

        var dailyData = data.daily, maxDaily = 0;
        for (var i = 0; i < dailyData.length; i++) { if (dailyData[i].count > maxDaily) maxDaily = dailyData[i].count; }
        var barHtml = '<div class="bar-chart">';
        for (var i = 0; i < dailyData.length; i++) {
            var day = dailyData[i];
            var heightPercent = maxDaily > 0 ? (day.count / maxDaily * 100) : 0;
            barHtml += '<div class="bar" style="height:' + Math.max(2, heightPercent) + '%;"><span class="value">' + day.count + '</span><span class="day-label">' + day.day.slice(5) + '</span></div>';
        }
        barHtml += '</div>';

        var catHtml = '<table><tr><th>Category</th><th>Count</th></tr>';
        for (var key in data.categories) { catHtml += '<tr><td>' + escapeHtml(key) + '</td><td>' + escapeHtml(String(data.categories[key])) + '</td></tr>'; }
        catHtml += '</table>';

        var senderHtml = '<table><tr><th>Email</th><th>Tickets</th></tr>';
        for (var i = 0; i < data.top_senders.length; i++) {
            senderHtml += '<tr><td>' + escapeHtml(data.top_senders[i].sender_email) + '</td><td>' + escapeHtml(String(data.top_senders[i].count)) + '</td></tr>';
        }
        senderHtml += '</table>';

        html += '<div class="report-row"><div class="report-box"><h3>📊 Status Breakdown</h3>' + pieHtml + '</div><div class="report-box"><h3>📈 Daily Volume (last 30 days)</h3>' + barHtml + '</div></div>';
        html += '<div class="report-row"><div class="report-box"><h3>📂 Categories</h3>' + catHtml + '</div><div class="report-box"><h3>🏆 Top Senders</h3>' + senderHtml + '</div></div>';
        document.getElementById("reportContent").innerHTML = html;
    }

    function renderUserBadge() {
        const u = currentUser;
        if (!u) return;
        const initials = (u.name || u.email || '?').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
        const meta = [u.role, u.team_id].filter(Boolean).join(' · ');
        const el = document.getElementById('userDisplay');
        if (el) el.innerHTML = `<div class="user-badge"><div class="user-badge-avatar">${initials}</div><div class="user-badge-info"><span class="user-badge-name">${u.name || u.email}</span><span class="user-badge-meta">${meta}</span></div></div>`;
    }

    // Initialize on page load
    initPage();
</script>
</body>
</html>
