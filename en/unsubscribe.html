<!-- unsubscribe.html v1.0 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unsubscribe – Dornori Newsletter</title>
<style>
    :root {
        --bg: #f0f4f8;
        --card: #ffffff;
        --border: #cbd5e0;
        --text: #1a202c;
        --text-muted: #4a5568;
        --accent: #0a8f5c;
        --accent-hover: #087a4e;
        --error: #ef4444;
        --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 36px 32px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 4px 24px rgba(0,0,0,.08);
        text-align: center;
    }
    .card h1 { font-size: 22px; color: var(--accent); margin-bottom: 6px; }
    .card p.sub { font-size: 14px; color: var(--text-muted); margin-bottom: 22px; line-height: 1.5; }
    .field { text-align: left; margin-bottom: 14px; }
    .field label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); margin-bottom: 6px; }
    .field input {
        width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px;
        font-size: 14px; color: var(--text); background: #fff;
    }
    .field input:focus { outline: none; border-color: var(--accent); }
    button.submit {
        width: 100%; padding: 12px; margin-top: 8px; background: var(--error); color: #fff;
        border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; transition: opacity .15s;
    }
    button.submit:hover { opacity: .88; }
    button.submit:disabled { opacity: .6; cursor: not-allowed; }
    .msg { margin-top: 16px; font-size: 13px; padding: 10px 14px; border-radius: 8px; display: none; }
    .msg.show { display: block; }
    .msg.success { background: #e6fffa; color: #276749; }
    .msg.error { background: #fff5f5; color: #c53030; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 22px 0; }
    .or-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin: 4px 0 18px; }
</style>
</head>
<body>
<div class="card">
    <h1>📧 Dornori Newsletter</h1>

    <div id="tokenSection" style="display:none;">
        <p class="sub">Click below to confirm you'd like to stop receiving newsletter emails.</p>
        <button type="button" class="submit" id="tokenBtn">Unsubscribe</button>
        <hr class="divider" />
        <div class="or-label">Wrong link, or want to use your email instead?</div>
    </div>

    <p class="sub" id="manualIntro">Enter your email and we'll remove you from the list.</p>
    <form id="emailForm">
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <button type="submit" class="submit" id="emailBtn">Unsubscribe</button>
    </form>

    <div id="msg" class="msg"></div>
</div>

<script>
const API_BASE = 'https://dornori-ticketing.dornori-info.workers.dev';

var params = new URLSearchParams(window.location.search);
var token = params.get('token');
var msg = document.getElementById('msg');

function showMsg(text, ok) {
    msg.textContent = text;
    msg.className = 'msg show ' + (ok ? 'success' : 'error');
}

if (token) {
    document.getElementById('tokenSection').style.display = 'block';
    document.getElementById('manualIntro').style.display = 'none';

    document.getElementById('tokenBtn').addEventListener('click', async function () {
        var btn = this;
        btn.disabled = true;
        btn.textContent = 'Unsubscribing…';
        try {
            var res = await fetch(API_BASE + '/api/unsubscribe/' + encodeURIComponent(token));
            var text = await res.text();
            showMsg(res.ok ? '✅ You have been unsubscribed.' : '❌ ' + text.replace(/^[^\w]*/, ''), res.ok);
        } catch (err) {
            showMsg('❌ Network error: ' + err.message, false);
        } finally {
            btn.disabled = false;
            btn.textContent = 'Unsubscribe';
        }
    });
}

document.getElementById('emailForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('emailBtn');
    var email = document.getElementById('email').value.trim();
    if (!email) return;

    btn.disabled = true;
    btn.textContent = 'Unsubscribing…';

    try {
        var res = await fetch(API_BASE + '/api/unsubscribe-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        });
        var data = await res.json();
        if (res.ok && data.success) {
            showMsg('✅ You have been unsubscribed.', true);
            document.getElementById('emailForm').reset();
        } else {
            showMsg('❌ ' + (data.message || data.error || 'Could not unsubscribe.'), false);
        }
    } catch (err) {
        showMsg('❌ Network error: ' + err.message, false);
    } finally {
        btn.disabled = false;
        btn.textContent = 'Unsubscribe';
    }
});
</script>
</body>
</html>
